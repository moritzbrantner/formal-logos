# Prima via certificates (#1751, slice 1). Certifies the inconsistent premise sets
# found by the 2026-11-18 cluster assessments of the prima via route to GOD_4
# exists (lane A: docs/notes/prima-via-strength-consumers.md, attempt a82b06b6;
# lane B: docs/notes/causal-dependence-support-investigation.md, attempt 9d71e28d),
# the strength step 402cf70f -> 98efaa9e, bypass B1 (the per se regress premise
# from well-founded causal predecessors) and the converse selection that rebinds
# well-founded causal predecessors to the per se regress premise. Analyst
# formulations, attribution deferred. Every proof is constructive and axiom-free.
# No premise is established; no incompatibility selects a member for rejection.
# Note: docs/notes/prima-via-certificates.md.

[batch]
vocab = "TruthCore.Causality.PrimaViaCertificates"
results = "TruthCore.Results.Causality.PrimaViaCertificates"
