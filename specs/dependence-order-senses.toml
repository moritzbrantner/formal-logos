comparator_theorems = ["inclusionSupportControls"]
strong_version_needed = {"8a22ae75-4198-5a32-ae52-bad2848a50a5" = "Reading B needs RelevantTo c x esse r' for the respect in which c is caused; the third premise gives only 'caused in some respect', so B does not suffice with these premises. A B-variant would need the stronger premise that the cause of every existential link is efficiently caused in a respect relevant to its causing x's being.", "8b2561cd-3743-536d-a110-3352fdb0c6b9" = "The strong ordering premise needs the given existential link to have distinct endpoints. Distinct incoming coverage can supply a different cause without changing the given link."}
premises = ["STMT-SECOND-EFFICIENT-CAUSES-CAUSE-ONLY-AS-CAUSED", "STMT-NOTHING-IS-EFFICIENT-CAUSE-OF-ITSELF", "The cause of every SERIES_OF_CAUSES_4 link is itself efficiently caused in some respect"]
conclusion = "Every SERIES_OF_CAUSES_4 link is a SERIES_OF_CAUSES_3 link"
sense_bridges = [
  { term = "SERIES_OF_CAUSES", from = "SERIES_OF_CAUSES_3", to = "SERIES_OF_CAUSES_4", statement_id = "Every SERIES_OF_CAUSES_4 link is a SERIES_OF_CAUSES_3 link", role = "conclusion" },
]
axioms = []
rule = "Discharge distinctness by no self-causation, then apply the per se ordering premise"
meaning = "Non-transcription conditional derivation, a support option for the sense bridge. If an efficient cause other than its effect that is itself efficiently caused causes only as caused (8a22ae75, the secunda via's per se ordering premise on its strong reading A), nothing is the efficient cause of itself (8b2561cd), and the cause of every SERIES_OF_CAUSES_4 link is itself efficiently caused here and now in some respect (the new bridge, which closes the mode gap between AsCaused, caused in an unspecified mode, and DEF 4a101a4c's efficiently caused middle cause), then every SERIES_OF_CAUSES_4 link is a SERIES_OF_CAUSES_3 link. 8a22ae75 is a strong premise: on reading A any efficient cause caused in any respect is a middle cause; the weaker relevant-respect reading is not used. inclusionSupportControls give, for each input, a Bool interpretation in which the other two hold and the conclusion fails (a two-cycle of efficient causing with no per se link; an efficient self-loop; one existential link whose cause nothing causes), and a nonvacuous one with an existential link."

[[argument]]
id = "Between actual concreta what is PRIOR_4 grounds, via the dependee-grounds bridge"
theorem = "priorInBeingGroundOfDependence"
comparator_theorems = ["priorityBridgeControls"]
premises = ["c4bb0481-60aa-4461-baee-f490a5fc554e", "a8298fbd-f3c5-480d-95e9-8316889c327f"]
conclusion = "Between actual CONCRETE_6 individuals at w, what is PRIOR_4 to the other grounds it"
senses = {PRIOR = "PRIOR_4"}
axioms = []
rule = "Irreflexivity of PRIOR_4 by definition, then dependence into grounding"
meaning = "Non-transcription conditional derivation, a support option for the PRIOR_4 bridge. If what is PRIOR_4 to x is something x depends on for its being and which does not so depend on x (c4bb0481), and an actual concretum's distinct actual dependee grounds it (a8298fbd), then between actual concreta at w what is PRIOR_4 to the other grounds it. Step: PRIOR_4 is irreflexive by definition, so the prior thing is distinct; c4bb0481 gives the dependence; a8298fbd gives the grounding. The bridge therefore shares the dependencies of c4bb0481 (with 000e1f65, 8ab3d114 and excluded middle behind it) and of a8298fbd, and inherits the 8ab3d114 failure case recorded on c4bb0481. Only c4bb0481's dependence conjunct (x depends on y, the side resting on 8ab3d114 and excluded middle) is used, not its nonmutual conjunct (the side resting on 000e1f65). priorityBridgeControls give, for each input, a Bool interpretation in which the other holds and the conclusion fails, and a nonvacuous one."
