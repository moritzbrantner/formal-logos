[batch]
vocab = "TruthCore.Latin.Aquinas.DeEnte.ActualIdentityExerciseLifting"
results = "TruthCore.Results.Aquinas.DeEnte.ActualIdentityExerciseLifting"

[[statement]]
id = "The eligible exercise relation has no nonempty finite directed cycle"
lean = "TruthCore.Causality.TemporalActualization.EventAcyclic"
paraphrase = "On the fixed eligible exercise type E, the interpreted relation C has no nonempty finite directed walk from any exercise back to itself. It can still have an infinite predecessor chain. No clock or temporal direction condition is asserted."
definitions = ["4ffdfea6-0a5a-513c-a710-050648c260bf"]
disambiguations = ["b4da30a9-86f7-57cc-a0c9-17b5dd216ccd"]

[[statement]]
id = "Every actual esse-supplier edge lifts backwards from every eligible recipient exercise"
lean = "BackwardActualEsseExerciseLifting"
paraphrase = "Analyst formulation, attribution deferred. On one q.3 a.4 profile and eligible exercise interpretation, for every ActualEsseCause edge c → x and every eligible exercise f borne by x, some eligible exercise e borne by c satisfies C e f."
definitions = ["cc5eed1d-8e75-473a-9714-f2c04bd75d0f"]

[[statement]]
id = "Every actual identity bearer has a finite nonempty eligible exercise fibre"
lean = "ActualIdentityExerciseFibresFiniteNonempty"
paraphrase = "Analyst formulation, attribution deferred. On the fixed profile and fixed eligible exercise-to-bearer map, each bearer in act as to esse whose represented esse equals its represented essence has finitely many eligible exercises and at least one. The restriction applies only to such bearers."
definitions = ["b14674c2-b20b-42ea-b5dd-9f9d6ebc304e"]

[[statement]]
id = "Projected identity returns without lifting or with an infinite fibre"
lean = "ExerciseLiftingControls"
paraphrase = "Two mathematical controls on the same two-actual-bearer q.3 a.4 profile with reciprocal actual esse supply and one identity bearer. The three exercise tokens A₀→B₁→A₂ have acyclic edges, an exact existence-based projection, finite nonempty identity fibres and fail universal backward lifting. An alternating chain of exercises, with n+1 supplying n, has acyclic edges and the same exact projection, lifts every actual esse-supplier edge from every eligible recipient exercise and has a nonempty infinite fibre at the identity bearer. The bearer relation has a nonempty finite return through that identity."
definitions = [
  "8163859b-95b3-4dd2-8a69-541bd332f32f",
  "183b48d2-1753-583d-aef9-4199cff86231",
  "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72",
  "4ffdfea6-0a5a-513c-a710-050648c260bf",
  "cc5eed1d-8e75-473a-9714-f2c04bd75d0f",
  "b14674c2-b20b-42ea-b5dd-9f9d6ebc304e",
]
disambiguations = ["b4da30a9-86f7-57cc-a0c9-17b5dd216ccd"]

[[argument]]
id = "Acyclic exercises and finite identity fibres exclude a return by backward lifting"
theorem = "actualIdentityAncestryAcyclicOfExerciseLifting"
strong_version_needed = { "9c717c08-4046-42d8-ae8b-763ef6b1b394" = "Finiteness supplies a minimal exercise in the inhabited eligible fibre under strict exercise reachability. The inhabited-fibre sibling alone only gives an exercise and does not give a minimal one." }
comparator_theorems = ["liftActualEssePath"]
premises = [
  "The eligible exercise relation has no nonempty finite directed cycle",
  "Every actual esse-supplier edge lifts backwards from every eligible recipient exercise",
  "Every actual identity bearer has a finite nonempty eligible exercise fibre",
]
conclusion = "41c858ee-07ee-41db-9693-b5fef6154efe"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Lift a putative return backwards from a minimal exercise in the corresponding identity fibre"
meaning = "Fix one q.3 a.4 profile, eligible exercise type, bearer map and exercise relation. Backward lifting composes over a nonempty finite actual esse-supplier path. In an inhabited finite identity fibre, acyclic exercise reachability is a strict transitive relation and has a minimal element. A bearer return lifts backwards from that element to a strict predecessor in the same fibre. Intermediate distinct-esse bearers require no finite fibre. The theorem uses no clock, global exercise well-foundedness, or premise that the bearer relation is exactly the existence-based projection."
[argument.senses]
EVENT_CAUSATION_ENTITY_FEEDBACK_SIMULTANEITY = "EVENT_CAUSATION_ENTITY_FEEDBACK_SIMULTANEITY_3"

[[argument]]
id = "Finite feedback and an unbounded chain test exercise lifting"
theorem = "exerciseLiftingControls"
premises = []
conclusion = "Projected identity returns without lifting or with an infinite fibre"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Check each exercise model against the same reciprocal actual esse-supply profile"
meaning = "Reuse the established acyclic three-token feedback and acyclic successor-chain examples. In three-token feedback the actual edge B → A cannot lift at A₀, despite the projected pair B₁ → A₂. In the alternating chain the successor exercise supplies every target and is borne by the other bearer. The even indices give an infinite fibre over the actual identity bearer. Both models project exactly to the reciprocal actual esse-supply relation whose two-edge return goes through that same identity. This certifies separations between the stated assumptions under their formal interpretations."
[argument.senses]
EVENT_CAUSATION_ENTITY_FEEDBACK_SIMULTANEITY = "EVENT_CAUSATION_ENTITY_FEEDBACK_SIMULTANEITY_3"
