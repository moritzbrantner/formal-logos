[[argument]]
id = "Possible finite-duration beginning from metrically finite populated pasts"
theorem = "possiblyBeginsFiniteDurationOfMetricallyFinite"
premises = ["4365c3c5-d39b-405c-97a9-a4f7e43c628f", "Possibly, some contingent thing is present at some moment"]
conclusion = "Possibly, time before each populated moment is finite (BEGINS_2, supplied clock; CLOCK_1 intended)"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Take the accessible populated history; the metric conclusion bounds every populated moment's past there"
meaning = "Non-transcription conditional support option for B1 in sense BEGINS_2, connecting the metric Grim Reaper to Arrival B. The possibility premise supplies an accessible history v and a moment at which a contingent concrete individual is present in v. Metrically finite populated pasts (4365c3c5, derived from the open spaced Reaper premises by MetricGrimReaper.populatedPastsMetricallyFiniteOfPatchwork) bound the past of every populated moment of every accessible history, in particular of v, so v is a BEGINS_2 history: the time before each of its populated moments is of finite duration (a constraint on time, not on when contingent reality began). Any preorder of moments and any real clock; the intended clock is CLOCK_1. The conclusion is NOT a first moment: in MetricBeginningArrival control 2 it holds with no begun populated moment. The possibility premise alone does not give it (control 1). Both premises are OPEN. Nothing is attributed to Koons or Pruss. No premise is established."

[[argument]]
id = "A possible first-moment beginning is a possible finite-duration beginning"
theorem = "possiblyFiniteDurationOfFirstMoment"
premises = ["Possibly, the time before every populated moment has a first moment (BEGINS_1)"]
conclusion = "Possibly, time before each populated moment is finite (BEGINS_2, supplied clock; CLOCK_1 intended)"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_bridges = [{term = "BEGINS", from = "BEGINS_1", to = "BEGINS_2", statement_id = "Possibly, time before each populated moment is finite (BEGINS_2, supplied clock; CLOCK_1 intended)", role = "conclusion"}]
rule = "In linear time the first moment's clock reading bounds the past below (MetricGrimReaper.metricallyFiniteOfBegun)"
meaning = "Strength order between the two senses of B1 (linear time, any real clock): a possible populated history in which the time before every populated moment has a first moment is one in which that time is of finite duration, because in linear time a past with a first moment has finite duration. The converse fails: MetricBeginningArrival control 2 (positive real times) satisfies B1 in sense BEGINS_2 and not in sense BEGINS_1. This is the only passage between the senses; it runs from BEGINS_1 to BEGINS_2. No premise is established."

[[argument]]
id = "Stage-one conclusion from B1 and B2 in sense BEGINS_2"
theorem = "necessaryConcreteOfFiniteDurationBeginning"
premises = ["Any two successors of the selected world are mutually accessible", "STMT-ACTUAL-MODAL-REFLEXIVITY", "Possibly, time before each populated moment is finite (BEGINS_2, supplied clock; CLOCK_1 intended)", "If BEGINS_2 is possible, possibly with a being outside the contingents (supplied clock and cause)"]
conclusion = "STMT-NECESSARY-CONCRETE-AT"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_bridges = [{term = "NECESSARY", from = "NECESSARY_11", to = "NECESSARY_2", statement_id = "STMT-NECESSARY-CONCRETE-AT", role = "conclusion"}]
transcription = "instantiation"
rule = "Instantiate ActualEuclidean.externalNecessaryConcrete at the Scenario whose beginning predicate is BEGINS_2"
meaning = "Instantiation of the verified Arrival B (ActualEuclidean.externalNecessaryConcrete, Euclidean access at the selected world only) at the Scenario built from the history with beginning predicate BEGINS_2; the Scenario's concrete individual necessary at w is the conclusion's, with the profile's grounding relation an arbitrary parameter. A BEGINS_2 history with a contingent concrete individual present satisfies the Scenario's beginning predicate; the opportunity premise gives an accessible history with an existing concrete individual outside the contingent totality (standing in the supplied, unconstrained totality-cause relation, which does no logical work), necessary there by ExternalCandidateNecessity, and carried to w by Euclidean access and reflexivity at w. It puts Arrival B in a definite sense on the route to STMT-NECESSARY-CONCRETE-AT, with B1 in that sense derivable from the metric Grim Reaper. B2 in sense BEGINS_2 does the decisive work: with B1 it already gives the possibility of a necessary concrete individual (possiblyNecessaryOfFiniteDurationOpportunity), and the Reaper premises with B1 do not reach the conclusion without it (control 2). All four premises are OPEN; no premise truth, uniqueness, causal role at w or divine attribute is established."

[[argument]]
id = "Possibly a necessary being, from B1 and B2 in sense BEGINS_2"
theorem = "possiblyNecessaryOfFiniteDurationOpportunity"
premises = ["Possibly, time before each populated moment is finite (BEGINS_2, supplied clock; CLOCK_1 intended)", "If BEGINS_2 is possible, possibly with a being outside the contingents (supplied clock and cause)"]
conclusion = "d2d7cf61-efd0-4bc0-93f6-2232402e8627"
axioms = ["propext", "Classical.choice", "Quot.sound"]
transcription = "instantiation"
rule = "Apply causal opportunity to the possible beginning; the external candidate is necessary in its history (LocalFramePossibleExternalCause.necessaryOfExternalCandidate)"
meaning = "Discloses what B1 and B2 in sense BEGINS_2 already carry, with no frame condition: causal opportunity applied to the possible beginning yields an accessible history v with an existing concrete individual distinct from every contingent concrete individual of v; under rigid identity and classical accessibility it is absent from no world accessible from v (ExternalCandidateNecessity), so possibly a necessary concrete individual exists (d2d7cf61). A rival who denies that a necessary concrete individual is possible therefore rejects B2 in this sense (given B1) outright; the arrival does not discriminate against that rival, as noted for the parameter-sense B2 and for A3 prime a with A3 prime b. Both premises are OPEN. No premise is established."

[[argument]]
id = "Finite-duration Arrival B controls checked"
theorem = "controls"
premises = []
conclusion = "Sense, independence and nonvacuity controls for Arrival B in the finite-duration sense"
sense_mixing_control = true
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit interpretations with integer and positive real times and identity clocks, checked with the metric lemmas and the external-candidate theorem"
meaning = "Control 1: the possibility premise without metrically finite populated pasts does not give B1 in sense BEGINS_2. Control 2: on an open-below finite populated history (the order and metric shape of FLRW cosmic time) B1 holds in sense BEGINS_2 but not BEGINS_1, so the senses differ and the strength order is strict; there Euclidean access and reflexivity at the selected world hold, B2 in sense BEGINS_2 fails for the empty totality-cause relation and no concrete individual is necessary, so B1 with the frame premises does not give the conclusion without B2 (and, by MetricGrimReaper control 2, the spaced Reaper premises hold there for every register frame). Control 3: the full premise bundle of the finite-duration arrival is jointly satisfiable on an open-below finite history, with the conclusion. Model claims concern these interpretations only."

