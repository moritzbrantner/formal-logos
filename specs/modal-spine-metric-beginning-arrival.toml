[[statement]]
id = "2a4d99d8-cb0c-429a-89e9-2a3b02f0526e"
label = "Possibly a memberwise concurrent giver of contingent being without assumed externality"
lean = "NonexternalConcurrentGivingOpportunity"
paraphrase = "OPEN analyst premise: if a BEGINS_2 populated history is possible, an accessible BEGINS_2 history contains an existing concrete c actually giving the being of each of its contingent concrete members at each moment of presence, with a nonvacuous exercise. The source is NOT stipulated external to the inventory or modally necessary. The commitment to a possibly necessary concretum is not thereby removed: the universal giving clause ranges over the source itself whenever it is contingent and present at some moment, so under no-self-giving 0e473dc4 and temporal presence d3184c66 this premise is equivalent to the external B2 e4a3b917 (nonexternalIffExternalOpportunity; the converse needs neither). This memberwise universal-giving interpretation, with GivesAt on its strict esse-giving reading, is stronger than a cause of the totality taken holistically."
definitions = ["d0757d5d-5f68-4e2e-9bd8-4ed8f57dc5ee", "c0d65b45-33bb-47a2-b16b-48a493a762cb", "028c1066-481d-4eb4-a96e-01ad62f85a2c", "158301bc-9585-4145-be60-34f08c9f922c"]
disambiguations = ["88a8fba7-f1a1-4340-8a7f-41dd39bbbe7d"]

[[statement]]
id = "0e473dc4-77c5-4d5d-899f-93e29907b198"
label = "No direct self-causation in strict concurrent giving of being"
lean = "NoSelfGivingOnAccessible"
paraphrase = "OPEN primitive strict being-causation principle: in all histories accessible from the selected world, a bearer never directly gives its own being to itself via the shared CausalityFrame.GivesAt relation. No claim that a different relation, physical feedback, or self-maintenance is prohibited."
definitions = ["9e1d45f4-7cee-44b5-a911-803c95b3fa07", "c0d65b45-33bb-47a2-b16b-48a493a762cb", "158301bc-9585-4145-be60-34f08c9f922c"]

[[statement]]
id = "d3184c66-0392-4b0a-bbb7-3ad9a805d629"
label = "Every accessible contingent concrete existent occurs at some time in its history"
lean = "ContingentConcretaTemporallyPresent"
paraphrase = "OPEN bridge between world-relative existence and temporal presence: every contingent concrete individual existing in an accessible history has at least one moment at which history.IsAt holds. It does not require presence at now or a first moment. It permits timeless necessary concreta and EXCLUDES contingent atemporal concreta: no contingent concrete individual existing in an accessible history is never temporally present there. That exclusion is the work the premise does in result 9e5124a2 (control unmanifestSourceSeparatesTemporal)."
