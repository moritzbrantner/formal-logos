[[statement]]
id = "Possibly, some contingent thing is present at some moment"
lean = "PossiblyPopulated"
paraphrase = "OPEN analyst possibility premise, attribution deferred: some history accessible from the selected world has a moment at which some contingent concrete individual is present. No beginning, duration, emptiness or cause is mentioned. It is implied, among others, by actual contingent presence under actual reflexivity and by the possibility premises A3 and A3 prime b; those implications are not registered here. 'Concrete' is the supplied Concrete parameter; the Lean type does not enforce the esse reading."
definitions = ["978d416c-650f-4845-a839-47ce82822bac", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "Possibly, time before each populated moment is finite (BEGINS_2, supplied clock; CLOCK_1 intended)"
lean = "PossiblyBeginsFiniteDuration"
paraphrase = "OPEN analyst premise B1 in sense BEGINS_2, attribution deferred: some history accessible from the selected world has a moment at which a contingent concrete individual is present, and in that history the time before every moment at which a contingent concrete individual is present is of finite duration on the supplied clock (the readings of all moments at or before it, populated or not, are bounded below). It constrains time, not when contingent reality began: a history empty for infinitely long and then populated fails it, although contingent reality began a finite time ago. It does NOT say there is a first moment: a populated history whose time is open below and of finite duration, as in standard FLRW cosmology, satisfies it. It says nothing about an empty moment or a cause. Duration is read on the supplied clock: the Lean type allows any order-preserving real coordinate (CLOCK_2), and with a bounded clock the premise reduces to possible population; the intended reading is the physically privileged duration (CLOCK_1). 'Concrete' is the supplied Concrete parameter."
definitions = ["1972f626-2de1-4d89-b1d0-46645eabe884", "7c05f92b-907d-4c9b-b219-fc4054c9912b", "375676b0-a295-4a17-a9e4-3db23319d517", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "Possibly, the time before every populated moment has a first moment (BEGINS_1)"
lean = "PossiblyBeginsFirstMoment"
paraphrase = "OPEN analyst premise B1 in sense BEGINS_1, attribution deferred: some history accessible from the selected world has a moment at which a contingent concrete individual is present, and in that history the time before every moment at which a contingent concrete individual is present has a first moment (some moment at or before it has no earlier moment). It constrains time, not when contingent reality began: integer time empty before 0 and populated from 0 on fails it, and non-negative real time empty at 0 and populated after it satisfies it with no first populated moment. The first moment need not be populated; nothing is said about what is present at it or about a cause. 'Concrete' is the supplied Concrete parameter."
definitions = ["816c7ad5-354c-4b80-88f7-1b5ba3e5f446", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "If BEGINS_2 is possible, possibly with a being outside the contingents (supplied clock and cause)"
lean = "FiniteDurationCausalOpportunity"
paraphrase = "OPEN analyst premise B2 in sense BEGINS_2, attribution deferred: if some history accessible from the selected world is a BEGINS_2 history (the time before every populated moment is of finite duration on the supplied clock) with a contingent concrete individual existing there, then some accessible history is a BEGINS_2 history with a contingent concrete individual and an existing concrete individual, numerically distinct from every contingent concrete individual there, that stands in the supplied totality-cause relation there. That relation is an unconstrained parameter, not Ontic.Causes between individuals: nothing in the type makes it causal, and the premise for any relation implies it for the relation that always holds (trivialCauseOpportunity), which is all the arrival uses. So its content, given B1 in the same sense, is that possibly a BEGINS_2 history contains an existing concrete individual outside the contingent totality; under rigid identity and classical accessibility that individual is necessary in its history (ExternalCandidateNecessity), so the premise contains the possibility of a necessary concrete individual, close to stipulating the target's possibility. Nothing requires that individual to be earlier than anything or present at any moment. Duration is read on the supplied clock, CLOCK_1 intended. 'Concrete' is the supplied Concrete parameter."
definitions = ["77254d4d-c318-40a3-b2a1-5c922632f011", "1972f626-2de1-4d89-b1d0-46645eabe884", "cc57aee5-58b7-531d-bcd6-60105efe5c79", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "375676b0-a295-4a17-a9e4-3db23319d517", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE"]

[[statement]]
id = "Sense, independence and nonvacuity controls for Arrival B in the finite-duration sense"
lean = "Control.Certificate"
paraphrase = "Closed mathematical controls, every individual counted concrete. (1) In the beginningless integer history GrimReaperPatchwork.Control.pivot with the identity clock, contingent concrete things are possibly present and no accessible history is a BEGINS_2 history. (2) In MetricGrimReaper.Control.openBelow (positive real times, identity clock; every individual exists and is present at every moment of world true, nothing exists at world false): Euclidean access and reflexivity at world true hold; B1 holds in sense BEGINS_2 and fails in sense BEGINS_1; B2 in sense BEGINS_2 fails for the empty totality-cause relation; and for every grounding relation no concrete individual is necessary at either world. (3) In openBelowSource (the same with one more individual existing at both worlds and present at no moment, the totality cause at world true): B1 and B2 in sense BEGINS_2, Euclidean access and reflexivity at world true hold, and for every grounding relation a concrete individual is necessary at world true. These are statements about these interpretations only."
definitions = ["978d416c-650f-4845-a839-47ce82822bac", "816c7ad5-354c-4b80-88f7-1b5ba3e5f446", "1972f626-2de1-4d89-b1d0-46645eabe884", "77254d4d-c318-40a3-b2a1-5c922632f011", "DEF-KANT-MODAL-CONTINGENCY"]

[[statement]]
id = "e4a3b917-7c61-49e3-a8fa-dc02155bbf80"
label = "If BEGINS_2 is possible, possibly with an actual external concurrent giver of contingent being"
lean = "ConcurrentFiniteDurationCausalOpportunity"
paraphrase = "OPEN analyst premise, attribution deferred, in the memberwise concurrent-esse sense of causation: if a BEGINS_2 populated history is accessible from the selected world, then an accessible BEGINS_2 populated history has an actually existing concrete individual c outside the contingent concrete inventory such that the shared CausalityFrame.GivesAt relation holds from c to every contingent concrete member at every moment of its presence, with at least one actual exercise. Unlike the existing B2's unconstrained totality-cause marker 256b5bab, this source exercises an explicit causal primitive within its possible world. GivesAt is taken on its strict esse-giving reading (definition 158301bc); the universal clause is CAUSE_OF_BEING_2 restricted to temporally present contingent concreta (disambiguation 88a8fba7). This is stronger than holistic totality causation and still includes the possibility of a necessary external bearer. It does not establish giving of being in the actual world, require a first moment, or infer physical realizability from modal syntax."
definitions = ["c0d65b45-33bb-47a2-b16b-48a493a762cb", "028c1066-481d-4eb4-a96e-01ad62f85a2c", "77254d4d-c318-40a3-b2a1-5c922632f011", "97f37f5c-7f82-5077-9bb9-6cfc8673631d", "158301bc-9585-4145-be60-34f08c9f922c"]
disambiguations = ["88a8fba7-f1a1-4340-8a7f-41dd39bbbe7d"]

[[statement]]
id = "34b957cd-73e6-4a10-8fa1-958a4679e346"
label = "A necessary concrete source at w gives being in an accessible history"
lean = "NecessaryConcreteWithPossibleConcurrentGivingAt"
paraphrase = "A stronger analyst interpretation of the necessary-concrete conclusion: in the selected world w there is one actual concrete individual c existing there and in every accessible world, and in some history v accessible from w the SAME c actually gives being, by the shared CausalityFrame.GivesAt primitive, to every contingent concrete member at each moment of its presence with at least one exercise. Necessary existence at w does not imply actual giving at w; nor does giving imply uniquely being God or the ultimate ground. Reuses the BEGINS_2 causal opportunity premises without replacing the weaker root node."
definitions = ["a6a2ca46-5f70-4db0-8359-9ae32b0eb583", "c0d65b45-33bb-47a2-b16b-48a493a762cb", "028c1066-481d-4eb4-a96e-01ad62f85a2c", "1b8baf77-84fa-5513-a138-7fa14840dd87", "e1ff44df-ed97-5990-8424-1abd720f23ea", "158301bc-9585-4145-be60-34f08c9f922c"]
