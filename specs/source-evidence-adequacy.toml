[[statement]]
id = "Truthful same-source assertions reach records through explicit production and transport"
lean = "SourceGuarantee"
paraphrase = "For every shared History, channel, intentions, history-indexed individuated Attitudes and Semantics, fixed source g, admitted class, observation map, positive-record selection and content domain: if g has the existing GOD_4 and classical-attribute classifications, its assertions are true at each admitted history, selected plans genuinely assert the same content, all its selected causal tokens effectively encode plans in the domain, every positive observation is received from a token caused by that same existing source, and RECORD_TRANSPORT_2 preserves true content, then all selected admitted records have true decoded content. This is a conditional channel assembly. Source truth at one actual history alone is not the uniformly quantified premise; no actual channel, source classification or epistemic identification is supplied."
definitions = ["91414c1b-813a-4b1d-bab5-715394ccd0bc", "dd7b91ea-5284-4558-bac5-7a0759843b0c", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "b31ee595-dc6e-47a4-88a9-1910a0092199", "88f9f6e8-997b-5f7d-afa1-c501954c3807", "9fcefb90-0cc3-4c0a-b964-cbf3585bc9c9", "fa09d1dc-e38e-42ec-ac95-c510e8a87716", "16daa03a-e1d0-4e07-89ad-3ac67db8c66c"]

[[argument]]
id = "Source veracity with causal coverage realization and transport guarantees decoded truth"
theorem = "sourceGuarantee"
premises = []
conclusion = "Truthful same-source assertions reach records through explicit production and transport"
axioms = []
transcription = "assembly"
rule = "Follow the same source-token witness through planned assertion encoding receipt and decoding"
meaning = "Conditional assembly of the existing ContentAssertionTruth target with the explicitly separated application conditions. The plan's individuated content is true by the SAME source's genuine assertion, and truth-preserving transport carries it to the observed decoded content. This supplies no independent warrant for trusting any source or channel. The informative dependency tests are the separate populated omission controls and the weaker transport comparison. No old proposition is declared true or actual."

[[statement]]
id = "Actual target-copying production and exact transport guarantee exact-value records"
lean = "CopyGuarantee"
paraphrase = "For any shared History, channel, source, admitted class, observation map, positive-record selection, independently supplied target value and message domain: if every source-caused token encodes that target, admitted target values lie in the domain, RECORD_TRANSPORT_1 recovers domain messages and selected records actually come from that same existing source, each selected decoded record equals its target. No intention, assent, assertion or God classification is a premise. No absence of mind, actual historical access or epistemic warrant follows from the schema."
definitions = ["91414c1b-813a-4b1d-bab5-715394ccd0bc", "dd7b91ea-5284-4558-bac5-7a0759843b0c", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "4abacd6f-e9f3-4790-b4d9-8e8368c95fdd", "e37c56c6-ac07-40d9-93df-6688593784e9"]

[[argument]]
