meaning = "RECORD_TRANSPORT_1 implies RECORD_TRANSPORT_2 on the SAME channel and domain. The former is the sole Prop premise; allowed histories and content semantics are parameters. This is a strength comparison, not a defense of either transport condition or historical reliability. The retagging control witnesses failure of the converse."
strong_version_needed = {"Exact decoded-content recovery RECORD_TRANSPORT_1 on the selected domain" = "The strong condition is the subject of this strength comparison; the main assertion-to-record assembly uses only the weaker truth-preserving condition."}
