# #2145 Lane 2 (Investigation 3): permitted range versus actual selection under one
# determination standard, the three omission scopes, the complete-decision fork, and
# the scope of 0050b6ed. Analyst formulations, attribution deferred.
# See docs/notes/optimal-creation-choice.md §§59-63.

[batch]
vocab = "TruthCore.Causality.SelectionScope"
results = "TruthCore.Results.Causality.SelectionScope"

[[statement]]
id = "Choice-cell determination: invariant levels explain only the range; selection is contingent"
lean = "SelectionRangeLaws"
definitions = ["5a818c39-1ba6-4cce-adf6-246d1d49fd1e", "9e9af2c4-5938-4204-859b-fcf78d485e20"]
paraphrase = "Analyst formulation on any local STIT frame with an outcome map, where each agent is one explanatory level of a source and explaining 'the actual outcome rather than y' is Cstit of 'outcome is not y' (the actual cell excludes y). (1) A level explains the contrast exactly when y is outside its actual cell range. (2) For any candidate set T0 containing the realized range, T0 minus the cell range is the disjoint union of T0 minus the realized range and the realized range minus the cell range (the #1953 decomposition). (3) A level with a single cell explains a contrast exactly when y is not realized by any history of the scope. (4) Such a level selects the actual outcome exactly when the outcome is not contingent in the scope. (5) Selection holds exactly when every rival outcome is excluded. (6) A level that selects a contingent actual outcome deliberatively sees to its own actual cell (Dstit), and no single-cell level sees to that cell. (7) Two levels with the same actual cell explain the same contrasts. Determination is one contrastive standard, not a theory of explanation; nothing about rationality, chance or goodness is typed."

[[statement]]
id = "Four-account table: manifestation selects without contingency; ranges; contingent exercises"
lean = "FourAccountTable"
definitions = ["5a818c39-1ba6-4cce-adf6-246d1d49fd1e", "9e9af2c4-5938-4204-859b-fcf78d485e20"]
paraphrase = "Analyst formulation on one finite carrier: four candidate outcomes (total omission none, D-realizing creations c and d, unfit creation z), actual outcome c, two explanatory levels of one source (nature: one cell; exercise: cells following the outcome). Necessary manifestation (scope c only): its nature excludes none, z and d and selects c, and c is not contingent. Invariant D-range source (scope c, d; the matched encoding of an impersonal propensity, of intrinsic generative finality, or of a standing will without a further exercise datum): its nature excludes none and z but not d, does not select, and c is contingent. Invariant permissive source (scope none, c, d): its nature excludes z but not none. Exercise account (scope c, d; the matched encoding of a rational adoption, of a propensity's actualization and of a generative exercise): its exercise level selects c, c is contingent, the exercise level deliberatively sees to its own cell, the nature level does not see to that cell, and the nature level does not exclude d. Permissive exercise (scope none, c, d): the exercise level excludes none, the nature level does not, and the exercise level deliberatively sees to its own cell. These are finite structural surrogates; they type no intellect, apprehension, chance measure or goodness."

[[statement]]
id = "Three omission scopes of giving are strictly ordered; necessary production keeps only the weaker two"
lean = "OmissionScopeTable"
definitions = ["6f842f97-5de9-4fbc-8b1b-ac50a49a738e", "3c8f25cf-97ae-4d0f-bd4e-c46d3eba8ec4", "a7985f66-16b1-4f0f-bb7f-4988d2377790", "62dfa893-b633-4513-9790-8f9a0a3087e0"]
paraphrase = "Analyst formulation on the shared causality frame. For every frame, world w and being g: total refraining (at some accessible world where g exists it gives nothing) implies withholding the whole actual roster (at some accessible world where g exists it gives none of the beings it gives at w, replacements allowed), which implies withholding each actual recipient individually (possibly at different worlds); a source that gives something at every accessible world where it exists never totally refrains; a fixed giver existing at w that gives something there withholds no recipient individually. Strictness controls: Van Cleve's frame with a giver withholds each recipient but not the whole roster and is necessarily productive; the replacement frame (g gives c at false and d at true) withholds the whole actual roster, does not totally refrain, is necessarily productive and satisfies #1897's ActualAbsenceByWithholding; the theist surrogate totally refrains. The registered STIT decision-frame controls pointwiseNotJoint and tiedNoEmptyChoice are included: each single recipient can be ensured absent while no cell omits all creation. Finite surrogates only."

[[statement]]
id = "Complete-decision fork: if a creation surpasses omission, an undominated policy never omits"
lean = "CompleteDecisionFork"
definitions = ["e81a6f5d-4d2f-4647-b3e0-300e2707340d"]
paraphrase = "Analyst formulation of #1953's complete-decision fork with Mathlib's Maximal on a partial order of complete decisions (feasible set: omission o inserted into creation decisions C). (1) o is undominated exactly when no creation is strictly above it. (2) A creation is undominated among all decisions exactly when it is undominated among creations and not strictly below o. (3) In a finite C with a unique undominated creation m, m is strictly above every other creation. (4) If every creation is strictly below some creation and some creation is above o, no decision is undominated. (5) A policy choosing an undominated decision at every world of a scope, when some creation is above o, never chooses o there. (6) Control on sets of Bool ordered by inclusion: two incomparable creations both above the empty decision; a policy choosing one at each world chooses only undominated decisions, never the empty one, and avoids each creation at some world. The order, feasibility and the choosing policy are explicit parameters; nothing about goodness, personal or impersonal sources is typed."

[[statement]]
id = "Every GOD_4 exists at w and has power for there being no contingent concrete being"
lean = "GodsHoldTotalAbsencePower"
definitions = ["88f9f6e8-997b-5f7d-afa1-c501954c3807", "bf7eddca-8291-4744-8470-379babcd7781", "1b8baf77-84fa-5513-a138-7fa14840dd87", "97f37f5c-7f82-5077-9bb9-6cfc8673631d"]
disambiguations = ["623ddbf6-9683-5361-bae4-e348a00ec680", "35fa7162-6cb3-52e1-ac5b-66afc318c74f"]
paraphrase = "OPEN (analyst formulation, unattributed): every GOD_4 exists at w and has at w a power (PowerFor) for there being no contingent concrete being (NoContingentConcreteIn): the total-refraining sibling of 0050b6ed at the level of contingent concreta. Motivation, navigation only: on classical theism God could have refrained from creating (ST I q.19 a.3). It does not exclude necessary concreta and says nothing about which creatures exist otherwise."

[[statement]]
id = "At w, a power for p is a power for any q holding at every accessible p-world"
lean = "PowerForMonotoneAt"
definitions = ["578e81cd-d0fb-4921-9a02-7e250d5310cb", "bf7eddca-8291-4744-8470-379babcd7781"]
paraphrase = "OPEN bridge (analyst formulation, unattributed): at w, for every being y and propositions p and q, if q holds at every world accessible from w at which p holds, then a PowerFor of y at w for p is a PowerFor of y at w for q. Reading: an exercise issuing in p obtaining issues in q obtaining. Cost: any power is then a power for whatever holds at every accessible world."

[[statement]]
id = "Joint-absence power: weaker than total refraining, compatible with necessary production"
lean = "ActualAbsencePowerScopeControls"
definitions = ["578e81cd-d0fb-4921-9a02-7e250d5310cb", "a7985f66-16b1-4f0f-bb7f-4988d2377790", "bf7eddca-8291-4744-8470-379babcd7781", "88f9f6e8-997b-5f7d-afa1-c501954c3807"]
paraphrase = "Analyst formulation, finite controls with GOD_4 read as the holder g and the possibility reading of PowerFor (y has at w a power for p when p holds at an accessible world where y exists). (1) On a three-world frame (no creature, c, d) the total-refraining sibling, Euclidean access, monotone powers and 0050b6ed's proposition all hold. (2) On the replacement frame (g gives c at false and d at true) 0050b6ed's proposition, Euclidean access and monotone powers hold, the total-refraining sibling fails, g gives something at every accessible world and #1897's ActualAbsenceByWithholding holds. (3) On the non-Euclidean frame a -> b, a -> c, b -> b the total-refraining sibling and monotone powers hold and 0050b6ed's proposition fails. (4) On the three-world frame with a non-monotone, maximally specific power the total-refraining sibling and Euclidean access hold and 0050b6ed's proposition fails. Each model witnesses only its formal interpretation; the possibility reading has no causal content and the maximally specific power is an encoding artifact."

[[argument]]
id = "Choice-cell determination laws, from the definitions"
theorem = "selectionRangeLaws"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Choice-cell determination: invariant levels explain only the range; selection is contingent"
rule = "Unfold Cstit on the cell relation; a single cell is the whole scope; a selecting cell omits a rival history"
meaning = "Law 1 is the definition of Cstit read as cell-range exclusion. Law 2 is set algebra, using that the cell range lies in the realized range. Law 3: with one cell, Cstit of 'not y' quantifies over every history. Law 4: with one cell, selection says every history has the actual outcome. Law 5 uses excluded middle on the outcome of a cell member. Law 6: a history with another outcome lies outside the selecting cell, so the cell proposition is not necessary, and a single-cell level's cell contains that history. Law 7 transports Cstit along equal cells. Not a transcription: the definitions do not contain the laws."
description = "A placed diagnostic for 608a262d: an invariant explanans (the kind an existential PSR reason token can be) explains the realized range of outcomes and no contrast within it; explaining the actual selection of a contingent outcome requires an explanans level whose own cell is contingent and is not seen to by any invariant level. The standard is label-free (law 7): it sees cell partitions, not whether a level is called an adoption, an actualization or an exercise. Establishes no premise; it is one contrastive standard (determination), not a theory of explanation."

[[argument]]
id = "Matched four-account table under determination, by computation"
theorem = "fourAccountTable"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Four-account table: manifestation selects without contingency; ranges; contingent exercises"
rule = "Apply the projection boundary at the nature level and relocation at the exercise level of each finite frame"
meaning = "Each account is one accountFrame over the four outcomes. The nature level is invariant, so by law 3 it explains exactly the outcomes outside the account's scope; by law 4 it selects only in the one-outcome scope. The exercise level's cell is the actual outcome, so it selects; with a second outcome in scope, law 6 gives Dstit of its cell and the nature level's failure to see to it."
description = "A placed diagnostic for 608a262d. Under one determination standard and matched reach and recipient good: necessary manifestation selects only by making c non-contingent; an invariant D-directed source (impersonal propensity, generative finality, or standing will alone) explains 'rather than nothing' and 'rather than the unfit z' but never 'rather than d'; a permissive invariant source does not even explain 'rather than nothing'; every account that selects a contingent c does so through a contingent exercise level that its invariant nature does not see to. Rational adoption, propensity actualization and generative exercise share that encoding, so the standard certifies parity between them: what separates them is the classification and the operative content of the exercise, which this standard does not test. Establishes no premise."

[[argument]]
id = "Three omission scopes of giving, by derivation and finite controls"
theorem = "omissionScopeTable"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Three omission scopes of giving are strictly ordered; necessary production keeps only the weaker two"
rule = "Weaken the witness world; refute total refraining at the productive witness; compute the finite frames; reuse the STIT controls"
meaning = "A total-refraining world withholds every actual recipient; a roster-withholding world withholds each. A necessarily productive giver gives something at the refraining witness. A fixed giver gives the same at the withholding world. The Van Cleve, replacement and theist frames are evaluated case by case; pointwiseNotJoint and tiedNoEmptyChoice are the existing STITControls theorems."
description = "A placed diagnostic for 0050b6ed. It certifies the §56 omission table that was hand-checked only: individual omission, whole-actual-roster withholding with replacement, and total refraining are distinct and strictly ordered modal profiles of a source's giving; a necessarily productive source (necessarily operative purpose, categorically directed generative nature, or a maximizer for whom a creation beats omission) can satisfy the first two but not the third, and a necessary manifestation satisfies none. The replacement frame satisfies #1897's ActualAbsenceByWithholding while giving something at every world. Finite surrogates only; no intellect, goodness or simplicity is typed."

[[argument]]
id = "Complete-decision fork, by Mathlib order theory"
theorem = "completeDecisionFork"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Complete-decision fork: if a creation surpasses omission, an undominated policy never omits"
rule = "maximal_iff_forall_gt on insert o C; Set.Finite.exists_le_maximal for uniqueness; a finite set-inclusion control"
meaning = "Omission's maximality fails exactly at a strictly better creation. A creation's maximality in insert o C splits into maximality in C and not lying below o. In a finite C every creation lies below a maximal one, which uniqueness makes m. An improvable C with a creation above o leaves no maximal decision. The policy clause is clause 1 at each world. The control evaluates singletons of Bool."
description = "A placed diagnostic for 0050b6ed. It certifies #1953's complete-decision fork in Lean with Mathlib's Maximal rather than IsGreatest: an account that necessarily chooses an undominated complete decision, when some creation strictly surpasses omission, never totally refrains (it is necessarily productive in the sense of the omission table), while each particular creation can still be omitted; with a strictly improvable creation set it has no admissible decision. The theorem is neutral between personal and impersonal choosers: a maximizing will and an optimizing nature are bound alike. Establishes no premise."

[[argument]]
id = "GOD_4 joint-absence power from total refraining, Euclidean access, monotone powers"
theorem = "actualAbsencePowerOfTotal"
axioms = []
premises = ["Every GOD_4 exists at w and has power for there being no contingent concrete being", "62b4a40a-919e-5da4-998c-131c386b7361", "At w, a power for p is a power for any q holding at every accessible p-world"]
conclusion = "0050b6ed-3c7d-4d6a-b97a-417837d76184"
rule = "At an accessible world with no contingent concretum, each concretum contingent at w is absent (Euclidean access); transfer the power along that entailment"
meaning = "Let g be GOD_4: it exists at w and has a power for no contingent concretum. At an accessible v with no contingent concretum, a concretum x contingent at w and present at v would be contingent at v, because the world u from w where x is absent is accessible from v (Euclidean). So the actual contingents are jointly absent at every accessible total-absence world, and monotonicity transfers g's power. Constructive and zero-axiom."
description = "A new conditional support option for 0050b6ed (consumed by 834ddcfa and bc4d81f6 on the GOD_4 HAS_WILL_1 routes). It makes explicit what the recorded total-refraining warrant (ST I q.19 a.3, navigation) needs to reach the typed joint-absence premise: Euclidean access (62b4a40a) and the monotone-power bridge. The controls (scope-controls result) show that both bridges are needed and that 0050b6ed is strictly weaker than its total-refraining sibling and compatible with a source that gives something at every world. Not a strengthens registration: the passage needs these two further premises. Establishes no premise."

[[argument]]
id = "Joint-absence power scope controls, by finite models"
theorem = "actualAbsencePowerScopeControls"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Joint-absence power: weaker than total refraining, compatible with necessary production"
rule = "Evaluate the three-world, replacement and non-Euclidean frames under the possibility reading and a maximally specific power"
meaning = "Nonvacuity applies actualAbsencePowerOfTotal on the three-world frame. In the replacement frame the actual contingent c is absent at true while d is contingent there, so total absence fails at both worlds. In the non-Euclidean frame the only accessible total-absence world b keeps g and c (necessary relative to b), and the only world lacking them, c, lacks g. In the three-world frame the maximally specific power holds for total absence (true only at none) but not for actual absence (true at some true too)."
description = "A placed diagnostic for 0050b6ed. Decides its scope: the premise as typed needs only the replacement scope (a world where the actual contingents are all absent, others allowed), is strictly weaker than total refraining, and holds of a source that gives something at every accessible world. The total-refraining warrant reaches it only through Euclidean access and monotone powers, each shown needed. Consequence: 0050b6ed does not by itself distinguish an optional creator from a necessarily productive (maximizing or categorically purposive, personal or impersonal) source. Encoding disclosures: the possibility reading has no causal content; the non-Euclidean holder is contingent at a; the maximally specific power is an artifact."

