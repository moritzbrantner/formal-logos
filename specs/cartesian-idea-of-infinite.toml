[[statement]]
id = "The meditator bears an occurring idea that represents INFINITE_3"
lean = "MeditatorHasIdeaOfInfinite"
paraphrase = "P1 of the idea-of-the-infinite argument, analyst formulation (navigation: Descartes, Meditation III; attribution deferred): some occurring episode e is borne by the meditator and represents the infinite, i.e. presents the perfection of infinite substance (INFINITE_3) as its content. First-person and existential: about one idea of the designated meditator. Representing the infinite is not being in act in it. Open."
definitions = ["c0cbef1c-060a-54d4-bb49-8d59da40caf3", "ce8ccc1a-4f9a-5904-a10c-548778d79b66", "89b53040-ee5c-425b-aa77-388ddbb42dba", "ef3ee5ec-1d44-4bd7-93f9-376c1cf6f6b3", "f356048e-c066-4e25-9dcc-4b6911c2e0b7"]
disambiguations = ["587c53cf-c2a8-51f6-b8c1-013e67756dc6"]

[[statement]]
id = "The objective reality of every occurring idea has a cause"
lean = "ObjectiveRealityIsCaused"
paraphrase = "P2 of the idea-of-the-infinite argument, analyst formulation (navigation: Descartes, Meditation III; attribution deferred): for every occurring episode e and perfection r, if e represents r then some being c is a cause of e's representing r (ObjCause, the cause of an idea's objective reality, not of the idea's being). Nothing is said of uniqueness or totality of that cause. Open."
definitions = ["c0cbef1c-060a-54d4-bb49-8d59da40caf3", "89b53040-ee5c-425b-aa77-388ddbb42dba", "d8e82792-9d80-4a6f-8181-b2fccc3f06af", "00bd3c0c-010a-559c-a2a0-b4fbf49cbaf1"]
disambiguations = []

[[statement]]
id = "Objective adequacy: whatever causes an idea's representing r has r, IN_ACT_4"
lean = "ObjectiveAdequacy"
paraphrase = "P3 of the idea-of-the-infinite argument, analyst formulation of objective adequacy (navigation: Descartes, Meditation III and the Second Replies axiom on objective reality; attribution deferred): whatever is a cause of an idea e's representing a perfection r is itself in act in r, formally or eminently (IN_ACT_4, mode of possession left open). A separate premise, not an instance of the formal containment clause (634a80b8): the separation control 'Formal containment does not give objective adequacy' exhibits a finite frame where formal containment and q.4 a.2 preexistence hold and the only cause of an idea of the infinite is in act in the respect of representing the infinite (certified there: in act in it exactly when bearing an occurring idea of the infinite) but not in the infinite. P3 quantifies over every cause of the objective reality, partial causes included: it is stronger than the 'efficient and total cause' wording, and with P4 it entails that the meditator is not even a partial cause of its own idea's representing INFINITE_3. Unformalized siblings: a total-cause version (whatever is the total cause of an idea's representing r is in act in r; the argument would then need P2 to supply a total cause) and a degree-of-reality reading (the cause has at least as much formal reality as the idea has objective reality, cf. 87f41688). The strong version is used because P2 as stated supplies only some cause, not a total one, and the degree reading needs a calibration between objective and formal degrees that is not on file. Open."
definitions = ["d8e82792-9d80-4a6f-8181-b2fccc3f06af", "5cbd5a0a-9055-4b69-af39-bd0bff1279fd", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168", "00bd3c0c-010a-559c-a2a0-b4fbf49cbaf1"]
disambiguations = ["dba7b1de-f3a0-57af-9af9-b2a4da3136fa"]

[[statement]]
id = "The meditator is not IN_ACT_4 in INFINITE_3, formally or eminently"
lean = "MeditatorLacksInfinite"
paraphrase = "P4 of the idea-of-the-infinite argument, analyst formulation (navigation: Descartes, Meditation III, the meditator who doubts and desires is not perfect; attribution deferred): the meditator is not in act in the perfection of infinite substance (INFINITE_3), neither formally nor eminently (IN_ACT_4). About the meditator only, not about every thinker. Open."
definitions = ["5cbd5a0a-9055-4b69-af39-bd0bff1279fd", "ef3ee5ec-1d44-4bd7-93f9-376c1cf6f6b3", "f356048e-c066-4e25-9dcc-4b6911c2e0b7"]
