[[argument]]
id = "Something other than the meditator is IN_ACT_4 in INFINITE_3, from the idea of it"
theorem = "meditationThree"
comparator_theorems = ["meditationThreePremisesSatisfiable"]
premises = ["The meditator bears an occurring idea that represents INFINITE_3", "The objective reality of every occurring idea has a cause", "Objective adequacy: whatever causes an idea's representing r has r, IN_ACT_4", "The meditator is not IN_ACT_4 in INFINITE_3, formally or eminently"]
conclusion = "Something other than the meditator is IN_ACT_4 in INFINITE_3 and causes the meditator's idea of it"
axioms = []
rule = "Existential instantiation, universal instantiation, and distinctness by a property one side lacks"
meaning = "The idea-of-the-infinite argument over one grades frame and one idea frame (analyst reconstruction; navigation: Descartes, Meditation III). P1 gives an occurring idea e of the infinite borne by the meditator. P2 gives a cause c of e's representing the infinite. Objective adequacy puts c in act in the infinite (IN_ACT_4, formally or eminently). The meditator is not in act in the infinite (P4), so c is not the meditator. The comparator also checks a finite interpretation on which all four premises hold together. All premises stay open. Objective adequacy is a separate premise, not an instance of formal containment (see the separation control). The conclusion says nothing of maximality, uniqueness or GOD_4."

[[argument]]
id = "Finite frame: formal containment and q.4 a.2 preexistence without objective adequacy"
theorem = "objectiveAdequacySeparationControl"
premises = []
conclusion = "Formal containment does not give objective adequacy on a finite frame"
axioms = []
rule = "Finite case analysis on Unit and Option Bool"
meaning = "Rejected-reading certificate: objective adequacy is not an instance of the formal containment clause. On one finite frame the meditator is the only being and causes (CAUSE_2) its own being in act in every respect, so respect-wise containment in every cause and q.4 a.2 preexistence hold; the meditator is in act in being and bears an occurring idea of the infinite, is the only possible cause of that idea's objective reality, and is in act in the respect some false, which the statement certifies to be had exactly by bearers of an occurring idea of the infinite; it is not in act in the infinite itself. P1, P2 and P4 hold, objective adequacy fails and nothing is in act in the infinite. This is the formal locus of the objection that an idea of the infinite needs only a cause able to represent the infinite: the formal clause, as encoded, does not exclude it. A finite interpretation only."

[[argument]]
id = "Something maximal in being causes all being, from the cause of the idea of INFINITE_3"
theorem = "maximeEnsOfIdeaOfInfinite"
premises = ["Something other than the meditator is IN_ACT_4 in INFINITE_3 and causes the meditator's idea of it", "Whatever is IN_ACT_4 in INFINITE_3 is maximal in being", "da09703b-0b1e-5dca-9dd7-6c0c8d1610d7"]
conclusion = "0881e859-c4c3-53ff-9bec-b61294e12d51"
axioms = []
rule = "Existential instantiation and two universal instantiations at the same witness"
meaning = "Bridge from the idea-of-the-infinite argument to the quarta via's conclusion STMT-MAXIME-ENS-CAUSES-BEING-OF-ALL, over one grades frame. The cause c of the meditator's idea of the infinite is in act in the infinite (INFINITE_3). The open bridge 'whatever is in act in the infinite is maximal in being' makes c maximal in being (MAXIME_ENS_1), and the genus principle at being (da09703b) makes c a cause of being (CAUSE_2) of every other being that has being. So something maximal in being causes being in every other being. This replaces the quarta via's grades, approach-to-a-maximum and truth-to-being premises by the idea-of-the-infinite premises and one open maximality bridge (1a289b83). Only the infinite-to-maximality bridge connects the two families; it is not a definitional equality. Two cause relations occur and are not identified: ObjCause in the first premise (a cause of an idea's representing a respect, a relation of a being to an episode and a respect, with Lean type B → Episode → R → Prop) and CAUSE_2 in the genus principle and the conclusion (a cause of a being's being in act in a respect, type B → B → R → Prop). They are distinct relations of distinct types, so no step can pass between them; the proof uses only the existential witness and its being in act in INFINITE_3. Every premise stays open."

