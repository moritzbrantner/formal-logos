[[argument]]
id = "POTENCY_1 or a distinct CAUSE_2 for contingents, from power grounding"
theorem = "potencyOrEsseCauseFromPowerGrounding"
premises = ["Every CONTINGENCY_1 being at w is corruptible simply or under some power over its esse", "A power over a thing's esse works on its potency not to be or is a CAUSE_2 of its esse", "STMT-NOTHING-CAUSES-ITS-OWN-BEING", "Whatever is corruptible simply is in POTENCY_1 in some respect"]
conclusion = "Every being contingent at w is in POTENCY_1 or has a distinct CAUSE_2 of its esse"
rule = "Case analysis on the power-grounding disjunction; distinctness by no self-esse-cause"
meaning = "Answers #1870's remaining gap 1 conditionally. A contingent being is corruptible simply, hence in POTENCY_1 in some respect, or under some power over its esse; correlation makes it corruptible or makes the power's holder a CAUSE_2 of its esse, distinct by no-self-esse-cause. This corresponds to the q.9 a.2 two-channel reading of B2 or B4 as follows: with no power of anything over its own esse and corruptible-has-POTENCY_1, PGP gives #1870 bridge (i), contingency gives MUTABLE_3 (controls, law 6); correlation gives #1870 bridge (ii) only for beings incorruptible simply (controls, law 5), and the unrestricted bridge (ii) fails for corruption by another (controls, corruptor)."
description = "Support for the existing B2 or B4 from PGP, correlation, the existing no-self-esse-cause statement and a corruptible-has-POTENCY_1 bridge. Not a transcription. Establishes no premise. It shares PGP and correlation with the C2 argument; it is an alternative bundle for the same modal crux, not independent corroboration."

