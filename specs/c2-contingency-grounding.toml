[[statement]]
id = "703d8c9c-838d-4050-bed4-082fedc2b9ef"
label = "C2 difference: a CONTINGENCY_1 being with a distinct esse CAUSE_2 is receptive or has a PRIOR_1 one"
lean = "ContingentEsseCauseIsPriorOrReceptive"
paraphrase = "Difference statement of C2 over C2-minus (#1598), OPEN, not asserted: every candidate contingent at w that has some other being causing its esse (CAUSE_2 at esse, tenseless) is existentially receptive or has some other being that causes its esse and is SIMPLY_PRIOR_1 to it. B3 implies it (immediate: B3 adds priority to any distinct esse-cause); no strictness relative to B3 is certified."
definitions = ["DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL", "f9f58df7-d3be-4d66-b1f1-204d7049c450", "DEF-RECEPTIVE-POTENCY", "DEF-ESSE-RECEIVED-IN", "DEF-ESSE", "DEF-CAUSE-OF-PERFECTION", "DEF-SIMPLE-PRIORITY"]
disambiguations = ["DISAMB-KANT-CONTINGENCY", "DISAMB-RECEPTIVE-POTENCY", "DISAMB-ESSE-RECEPTION", "DISAMB-CAUSE", "DISAMB-PRIORITY-SIMPLE-OR-IN-TIME"]

[[statement]]
id = "C2 holds exactly when its weak form and its difference hold"
lean = "C2OverWeakExact"
paraphrase = "For every frame, reading world, esse map, reception relation, receptive-potency relation and matter-form predicate: C2 holds if and only if C2-minus holds and every contingent being with a distinct esse CAUSE_2 is existentially receptive or has a SIMPLY_PRIOR_1 one. A premise-free comparison; it asserts none of the three statements."
definitions = ["DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL", "f9f58df7-d3be-4d66-b1f1-204d7049c450", "DEF-RECEPTIVE-POTENCY", "DEF-ESSE-RECEIVED-IN", "DEF-ESSE", "DEF-CAUSE-OF-PERFECTION", "DEF-SIMPLE-PRIORITY"]
disambiguations = ["DISAMB-KANT-CONTINGENCY", "DISAMB-RECEPTIVE-POTENCY", "DISAMB-ESSE-RECEPTION", "DISAMB-CAUSE", "DISAMB-PRIORITY-SIMPLE-OR-IN-TIME"]

[[statement]]
id = "The unprioritized frame satisfies C2's weak form and not C2"
lean = "Model.UnprioritizedSeparates"
paraphrase = "In the finite unprioritized frame (a necessary being causes the esse of a contingent, unreceived, simple first mover without being simply prior to it; nothing received, no matter-form composition), C2-minus holds and C2 fails. A structural surrogate, not a metaphysical possibility claim."
definitions = ["DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL", "f9f58df7-d3be-4d66-b1f1-204d7049c450", "DEF-ESSE", "DEF-CAUSE-OF-PERFECTION", "DEF-SIMPLE-PRIORITY"]
disambiguations = ["DISAMB-KANT-CONTINGENCY", "DISAMB-CAUSE", "DISAMB-PRIORITY-SIMPLE-OR-IN-TIME"]

