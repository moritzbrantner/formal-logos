premises = ["Every CONTINGENCY_1 being at w is existentially receptive or has a distinct CAUSE_2 of its esse", "ee74c678-0a06-47d3-9c76-27ff798e9a01"]
conclusion = "Every CONTINGENCY_1 being at w is existentially receptive or has a PRIOR_1 distinct esse CAUSE_2"
