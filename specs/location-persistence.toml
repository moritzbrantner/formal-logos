[batch]
vocab = "TruthCore.Explanation.LocationPersistence"
results = "TruthCore.Results.Explanation.LocationPersistence"

[[statement]]
id = "An anchored stationary location preserves location and dated presence"
lean = "AnchoredLocation"
definitions = ["6e811e85-b983-5988-b20a-f4f3ee83c50e", "6788dada-f316-5cc3-8376-e64c512b1a0e"]
paraphrase = "For any designated bearer in one temporal history, assume that every reported location entails the bearer's presence on that date, that its location trace is stationary at every adjacent pair, and that it has a reported place at one supplied date. Then at every date that same place is reported and the bearer is present. This analyst control concerns dated presence only and assumes no giving relation."

[[argument]]
id = "Stationarity transports a location anchor and its presence presupposition"
theorem = "anchoredLocation"
comparator_theorems = ["samePresenceDifferentLocation"]
premises = []
conclusion = "An anchored stationary location preserves location and dated presence"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Transport the location anchor by stationarity and project presence by soundness"
meaning = "Reuse constant_of_stationary to derive equality of every reported location with the anchor. Soundness then gives the presence of the same bearer at the same date. The shared premise about location reports applies only to a supplied trace, and is not a premise of existential inertia or a source of actuality without a location anchor."
description = "The anchored result transports a reported place under stationarity and projects the same bearer's presence through soundness. Its certified companion witnesses two sound traces for one everlasting bearer, with distinct Boolean places p and q. Both traces report p at date 0, the stationary trace reports p at date 1, and the other trace reports q at date 1. Both dates have positive location reports in each trace."

[[statement]]
id = "Same everlasting presence and reported start admit different reported destinations"
lean = "ReportedLocationContrast"
definitions = ["4b4e5631-b2c6-5c76-ac4a-2615eb87e17d", "6788dada-f316-5cc3-8376-e64c512b1a0e"]
paraphrase = "There are two sound traces of one everlasting bearer and two distinct Boolean places p and q. Both traces report p at date 0. One trace is stationary and reports p at date 1. The other reports q at date 1. Every named endpoint has a positive report."

[[statement]]
id = "External things reading on the actuality of a distinct bearer"
lean = "TruthCore.Explanation.InertialActuality.OtherBearerActualityOpen"
definitions = ["DEF-TEMPORAL-HISTORY-NOW-SLICE","8c20c988-31fd-4b59-acf2-db230a6ea32e"]
paraphrase = "Analyst control, attribution deferred. Two integer-time histories of one frame share the cessation law and no inducers. A bearer x has the same presence at each date and the same earlier-date reason for presence at date 1 in both histories, while a distinct bearer y is present at some date in one and at none in the other. Even the global law and the x-only reason fail to entail y's actuality."

[[statement]]
id = "External things reading on externally conditioned persistence"
lean = "TruthCore.Explanation.InertialActuality.ExternalProtectionCompatible"
definitions = ["DEF-TEMPORAL-HISTORY-NOW-SLICE","8c20c988-31fd-4b59-acf2-db230a6ea32e","DEF-ESSE-RECEIVED-IN","158301bc-9585-4145-be60-34f08c9f922c"]
disambiguations = ["DISAMB-ESSE-RECEPTION"]
paraphrase = "Analyst control, attribution deferred. The same receiver is present at 0 in two integer-time histories satisfying the cessation law. At 1 the protector is present and there is no inducer against the receiver in one history. In the other the protector is absent and a loss inducer occurs at 1. The receiver survives to 1 only in the protected history. Neither history supplies a strict giver at 1. The surviving received bearer has an inertial reason at 1, falsifying the productive bridge in this model."
