conclusion = "Closed actual esse collections contain an uncaused bearer"
axioms = []
rule = "Restrict well-foundedness to actual bearers and import closedRootedOfWF"
meaning = "Sole-premise strength comparison in the exact actual esse-cause dictionary. Unrestricted well-foundedness implies CCR; the rooted infinite control witnesses strictness. This supplies no independent warrant for either premise."

