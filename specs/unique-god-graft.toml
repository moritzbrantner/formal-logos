meaning = "Certified difference (#1598): forward, G4 gives the attribute premise and dropping the attributes gives a unique GOD_4; backward, the unique GOD_4 has the classical attributes by the attribute premise. Premise-free and constructive; it asserts none of the statements compared."
description = "Certified difference of the strength order 20a2b6a3 to d5ac1620: the strong version adds exactly that some GOD_4 is the only GOD_4. Premise-free; establishes no premise."

