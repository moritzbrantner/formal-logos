rule = "Explicit finite models"
meaning = "Premise-free: a one-God signature satisfies both the unique-God premise and the attribute conclusion; a two-God signature with one classical God satisfies 'some God has the attributes' while the attribute conclusion and the unique-God premise fail; a two-God signature where both are classical satisfies the attribute conclusion while the unique-God premise fails (the strictness separator of the registered strength order, non-vacuous). Model-witnessed separations only; no premise is established."
