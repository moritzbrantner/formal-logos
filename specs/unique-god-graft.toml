# #1926 orphan graft slice 1: the stage 1-2 same-witness endpoints conclude
# UniqueClassicalGodExists (20a2b6a3) but nothing consumed it. G4 derives the
# root arguments' attribute premise GodHasClassicalAttributes (d5ac1620) from it
# by a uniqueness transfer; G5 gives nonvacuity and the omission of uniqueness.
# Before this, 20a2b6a3's inherited definition links (28 removed) made any new
# argument from it an unbridged sense mixing. Analyst formulations,
# attribution deferred. Note: docs/notes/orphan-graft-map.md.

[batch]
vocab = "TruthCore.Case.Catholicism.UniqueGodGraft"
results = "TruthCore.Results.Case.Catholicism.UniqueGodGraft"

[[statement]]
id = "Unique God graft controls"
label = "One classical GOD_4; two GOD_4 with one classical; two classical GOD_4"
lean = "Model.Controls"
paraphrase = "Premise-free finite models (structural surrogates on the case signature, whose other fields are empty placeholders, not historical or religious assertions). Nonvacuity: on a signature where exactly one being is God and has the classical attributes, both UniqueClassicalGodExists and GodHasClassicalAttributes hold. Omission of uniqueness: on a signature where both beings satisfy IsGod and only one has the classical attributes, some God has them, yet not every God does and the unique-God premise fails. Strictness: on a signature where both beings satisfy IsGod and both have the classical attributes, every God has them, yet the unique-God premise fails."
definitions = ["b1415b6b-19b0-5a0e-aa0c-0ab32f350141", "88f9f6e8-997b-5f7d-afa1-c501954c3807", "d980bbd2-1a96-564c-bc0d-4065d7786715", "c8f9c2fb-8c17-5fc8-b558-4a6fad659296"]
disambiguations = ["205a39c3-915d-5fe4-8076-a9ff91329e08"]

[[argument]]
id = "Classical attributes of every God, from the unique classical God"
label = "Every GOD_4 has the classical attributes, from the unique classical GOD_4"
theorem = "godHasClassicalAttributesFromUniqueGod"
axioms = []
weakening = true
premises = ["20a2b6a3-83e7-5ea0-be63-9dbc03c302b3"]
conclusion = "d5ac1620-1de5-5cd8-862e-cfdfd6d8b8a5"
rule = "Any God is the unique God, who has the classical attributes"
meaning = "UniqueClassicalGodExists sigma gives one g that is God, is the only being satisfying sigma.IsGod (IsTheOneGod), and has the skeleton's classical attributes. Let x satisfy sigma.IsGod; by IsTheOneGod, x is g, so x has the classical attributes. Constructive."
description = "Argument G4, graft slice 1 of docs/notes/orphan-graft-map.md: the stage 1-2 same-witness endpoints that conclude 20a2b6a3 (StagesOneTwo d1753206, Q11 witness c08dc0d0, identity witness d69362f4, StagesOneTwoQ11 ce2c09ce, StagesOneTwoIdentity f8094d16, quarta via classical witness 5cb4b73f) now feed the root arguments' attribute premise d5ac1620. Not a transcription: no premise's consequent is the conclusion; the universal is obtained by rewriting through the uniqueness conjunct, which G5's omission model shows to be needed. A one-premise weakening (registered strengthens 20a2b6a3 to d5ac1620): it drops existence and uniqueness. Support cycle: the existing assembly 398f4323 (classical-god-assembly) concludes 20a2b6a3 from 8626f8a5, 33b18ae7 and d5ac1620, so d5ac1620 <- 20a2b6a3 <- d5ac1620 is a cycle. It is grounded through the six non-transcription routes to 20a2b6a3 that do not use d5ac1620; the assembly's own connection through this cycle is nominal and adds no warrant. Shared dependencies: those routes share the stage-1 premises (prima via and quarta via bundles) of the existing root routes, so this adds support options, not independent corroboration. Establishes no premise. Made possible by pruning 20a2b6a3's 28 inherited definition links to its Lean vocabulary (reviewed in docs/notes/classical-attributes-all-migration.json and naming-first-mover-migration.json)."

[[argument]]
