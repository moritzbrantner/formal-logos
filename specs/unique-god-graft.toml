[[statement]]
id = "Unique God graft controls"
label = "One classical GOD_4; two GOD_4 with one classical; two classical GOD_4"
lean = "Model.Controls"
paraphrase = "Premise-free finite models on the case signature, whose other fields are empty and assert nothing historical or religious. Nonvacuity: where exactly one thing is GOD_4 and has the classical attributes, both UniqueClassicalGodExists and GodHasClassicalAttributes hold. Omission of uniqueness: where two things are GOD_4 and only one has the classical attributes, some GOD_4 has them, yet not every GOD_4 does and the unique-GOD_4 premise fails. Strictness: where two things are GOD_4 and both have the classical attributes, every GOD_4 has them, yet the unique-GOD_4 premise fails."
definitions = ["b1415b6b-19b0-5a0e-aa0c-0ab32f350141", "88f9f6e8-997b-5f7d-afa1-c501954c3807", "d980bbd2-1a96-564c-bc0d-4065d7786715", "c8f9c2fb-8c17-5fc8-b558-4a6fad659296"]
disambiguations = ["205a39c3-915d-5fe4-8076-a9ff91329e08"]

[[argument]]
id = "Classical attributes of every God, from the unique classical God"
label = "Every GOD_4 has the classical attributes, from the unique classical GOD_4"
theorem = "godHasClassicalAttributesFromUniqueGod"
axioms = []
weakening = true
premises = ["20a2b6a3-83e7-5ea0-be63-9dbc03c302b3"]
conclusion = "d5ac1620-1de5-5cd8-862e-cfdfd6d8b8a5"
rule = "Any GOD_4 is the unique GOD_4, who has the classical attributes"
meaning = "UniqueClassicalGodExists gives one g that is GOD_4, is the only thing satisfying the signature's IsGod (IsTheOneGod), and has the skeleton's classical attributes. Let x be GOD_4; by IsTheOneGod, x is g, so x has the classical attributes. Constructive."
description = "Argument G4, slice 1 of the map in docs/notes/orphan-graft-map.md: the stage 1-2 same-witness arguments that conclude 20a2b6a3 now feed the root arguments' attribute premise d5ac1620. Not a transcription: no premise's consequent is the conclusion; the conclusion is derived from the uniqueness conjunct, which G5's omission model shows to be needed. A one-premise weakening (registered strengthens 20a2b6a3 to d5ac1620, with the certified difference 'some GOD_4 is the only GOD_4'). Support cycle: the existing assembly 398f4323 concludes 20a2b6a3 from 8626f8a5, 33b18ae7 and d5ac1620, so d5ac1620 to 20a2b6a3 to d5ac1620 is a cycle; it is grounded through the routes to 20a2b6a3 that do not use d5ac1620, and the assembly's own connection through this cycle adds no warrant. Those routes share the stage-1 premises of the existing root routes, so this adds support options, not independent support. Establishes no premise. Made possible by reducing 20a2b6a3's definition links to its Lean vocabulary (reviewed in docs/notes/classical-attributes-all-migration.json and naming-first-mover-migration.json)."

