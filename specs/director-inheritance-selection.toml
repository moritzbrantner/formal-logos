paraphrase = "OPEN analyst policy: for each direction of a natural body x to end e, if the director has a distinct actual mover in some respect, at least one distinct actual mover preserves direction of this SAME x to this SAME e. It need not be every mover, or the initially supplied mover/respect, and no cognition is inferred."

