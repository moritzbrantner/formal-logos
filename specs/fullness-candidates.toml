results = "TruthCore.Results.Causality.FullnessCandidates"

[[statement]]
id = "Coverage fullness is strict exactly with a missing pure perfection"
label = "Complete inclusive coverage exceeds a recipient exactly when it misses a pure perfection"
lean = "ContentAudit"
paraphrase = "Closed conditional test of an independently specified coverage order. In one existing inclusive formal-or-virtual ActFrame with a supplied Pure classification, if c covers every pure perfection, every x has content included in c's. With explicit excluded middle, strict set inclusion is equivalent to some pure perfection not inclusively possessed by x; equality is equivalent to complete recipient coverage. It asserts no actual complete source, limited recipient, missing perfection, intensity comparison or MoreIn calibration. It tests the strictness/application burden of a candidate for fd2c8710 and9eaa3b6e, not a metaphysical defeat or a new definition of esse fullness."
definitions = ["4715f744-b8ef-4a82-8cc4-1516a13c5507", "115f23e3-2a19-5dcb-bc7f-96408004f110", "65e38ffa-5a1c-55d0-935c-6538d843b780"]

[[argument]]
id = "Test strictness and ties in independently supplied inclusive perfection coverage"
theorem = "contentAudit"
premises = []
conclusion = "Coverage fullness is strict exactly with a missing pure perfection"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Complete coverage gives inclusion; proper inclusion requires an independently supplied missing member"
meaning = "The candidate degree is the pure-perfection coverage set from the same inclusive ActFrame; it does not consult limitation or the desired source order. Completeness of c is an explicit internal hypothesis, not inferred from source naming or represented identity. Strict inclusion needs a pure perfection x lacks even inclusively; an equally complete x ties c. Explicit excluded middle extracts a witness from proper inclusion. This neither supplies an actual missing witness nor proves a limited bearer incomplete. Binary repertoire coverage can omit intensity and so is not automatically a faithful esse-fullness measure. The same accepted root route still needs the fd2c8710/9eaa3b6e calibration; no root premise is discharged."

[[statement]]
id = "Common source strictly exceeds actual others in esse effect coverage"
label = "Common esse ancestry and composition give strict actual effect coverage"
lean = "FootprintAudit"
paraphrase = "Closed conditional test of actual esse-effect coverage. For any same q3 Profile, existing common esse ancestry plus actual cause composition supplies one actual n with represented esse-essence identity whose actual distinct esse effects strictly include those of every other actual bearer. The source's no-incoming-actual-cause clause excludes n from others' effects; n itself causes each other bearer. This establishes actual esse-causal coverage; a productive reading still requires the retained mode/application bridge. It establishes no more-esse comparison, capacity, necessity, present conservation, divine identity or metaphysical possibility of a natural rival."
definitions = ["a3630d9f-c477-48dc-aada-77fccd4eba25", "8163859b-95b3-4dd2-8a69-541bd332f32f", "211a6432-8b8f-53ed-85e3-75173bb15b24", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72", "183b48d2-1753-583d-aef9-4199cff86231"]

[[argument]]
id = "0db2354d-88b6-4cc7-8c49-2564722c984a"
label = "Test strict actual esse-causal coverage of the same source"
theorem = "footprintAudit"
premises = []
conclusion = "Common source strictly exceeds actual others in esse effect coverage"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Reuse causeOfChain; the common source covers every actual target, while no other actual bearer causes that source"
meaning = "The exact existing common ancestor and composition are internal hypotheses. Reuse causeOfChain for the same n's actual esse causality. Every actual effect of x is other than n, since n has no incoming actual cause, hence is also an effect of n. The actual x is an effect of n and cannot be its own distinct effect, giving proper inclusion. No comparison of esse degrees occurs. This supplies a positive actual-CIn coverage consequence that a fundamental natural source satisfying the same restrictions also shares. It cannot be transported to fd2c8710 or MoreIn without a warranted interpretation bridge; actual-CIn coverage is not capacity or substantive eminent possession, and a productive application is not supplied by the type. The named root application remains SourceScopedAscent8176a284 to da09703b to c98328f1 GodExists; no new route from this test to that conclusion is asserted."
