[batch]
vocab = "TruthCore.Causality.IntellectualAppetite"
results = "TruthCore.Results.Causality.IntellectualAppetite"

[[statement]]
id = "Every intellectual GOD_4 apprehends a good under an actualizing intelligible form"
lean = "GodIntellectApprehendsGood"
paraphrase = "Open analyst premise. For each GOD_4 bearer with HAS_INTELLECT_1, some intelligible form actualizes that same bearer and presents something to that bearer as good. Appraisal may concern the bearer's own good."
definitions = ["DEF-GOD-OF-CLASSICAL-THEISM", "DEF-HAS-INTELLECT", "DEF-APPETITIVE-OBJECT-ASPECT", "fb2759f7-aecb-4921-9f82-61de72a45245"]

[[statement]]
id = "GOD_4 has an inclination following an actualizing form under which it apprehends a good"
lean = "AppraisedFormInclines"
paraphrase = "Open analyst premise. For each GOD_4, whenever an intelligible form actualizes that bearer and it apprehends something as good under that form, it has an orientation following that form. The direction of explanation here is from the form to the orientation. No act of pursuit or production is asserted."
definitions = ["DEF-GOD-OF-CLASSICAL-THEISM", "DEF-APPETITIVE-OBJECT-ASPECT", "fb2759f7-aecb-4921-9f82-61de72a45245"]

[[statement]]
id = "Inclination following an intelligible form presenting a good counts as HAS_WILL_1"
lean = "AppraisedInclinationIsWill"
paraphrase = "Open analyst premise. If a GOD_4 bearer apprehends something as good under an intelligible form and has an inclination following that same form, it HAS_WILL_1. The recognition is substantive: the inclination must be toward the good under the apprehended aspect. The proposition uses the primitive possession predicate and does not posit a separate passive faculty or an actual episode."
definitions = ["DEF-GOD-OF-CLASSICAL-THEISM", "DEF-HAS-WILL", "DEF-APPETITIVE-OBJECT-ASPECT", "fb2759f7-aecb-4921-9f82-61de72a45245"]

[[argument]]
id = "GOD_4 HAS_WILL_1 through an inclination following an apprehended good"
theorem = "godHasWillFromAppraisedForm"
premises = ["STMT-GOD-HAS-INTELLECT", "Every intellectual GOD_4 apprehends a good under an actualizing intelligible form", "GOD_4 has an inclination following an actualizing form under which it apprehends a good", "Inclination following an intelligible form presenting a good counts as HAS_WILL_1"]
conclusion = "STMT-GOD-HAS-WILL"
axioms = []
rule = "Choose one actualizing intelligible form presenting good and use it in both inclination steps"
meaning = "For each GOD_4, use its intellect to obtain an actualizing intelligible form under which it apprehends a good. The restricted inclination law supplies an orientation following that very form in that same bearer. The guarded recognition premise gives HAS_WILL_1 for that bearer. The conclusion is possession of will. Any act, rational giving or possible withholding requires further hypotheses."
