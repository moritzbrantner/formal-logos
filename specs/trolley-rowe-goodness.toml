[[argument]]
id = "Rowe's permission constraint, from WHOLLY_GOOD_1 and the outcome bridge"
label = "Rowe's permission constraint, from WHOLLY_GOOD_1 and the outcome bridge"
theorem = "outcomeSenseYieldsPermissionConstraint"
premises = ["Rowe's WhollyGood satisfies the outcome-minimizing standard (WHOLLY_GOOD_1)", "Unblocked preventable events would be strictly better prevented"]
conclusion = "STMT-ROWE-PERMISSION-CONSTRAINT"
rule = "Contraposition through the outcome bridge"
meaning = "If a wholly good omniscient being permitted an occurring preventable intense suffering with no blocking cost, the outcome bridge makes preventing strictly better, which WHOLLY_GOOD_1 excludes. A support option for Rowe's premise (2) conditional on both open premises; omniscience and intensity are not used."
axioms = ["propext", "Classical.choice", "Quot.sound"]

[[argument]]
id = "Constraint-qualified permission, from WHOLLY_GOOD_2 and the outcome bridge"
label = "Constraint-qualified permission, from WHOLLY_GOOD_2 and the outcome bridge"
theorem = "constraintSenseYieldsQualifiedConstraint"
premises = ["Rowe's WhollyGood satisfies the constraint-respecting rescue standard (WHOLLY_GOOD_2)", "Unblocked preventable events would be strictly better prevented"]
conclusion = "Constraint-qualified permission condition (WHOLLY_GOOD_2)"
rule = "Case analysis and contraposition through the outcome bridge"
meaning = "Either preventing is not strictly better, whence (by the bridge) a blocking cost exists, or every way of preventing is constraint-blocked. Doing/allowing and double effect add a blocker to Rowe's list; they do not remove the rescue duty."
axioms = ["propext", "Classical.choice", "Quot.sound"]

