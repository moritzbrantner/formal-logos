[[argument]]
id = "De ente source and underived candidate are one being under unique actual roothood"
theorem = "deEnteSourceIsUnderived"
premises = ["ce7edf53-afbb-4bca-84d6-b0e36b861148", "0bdcf366-29c7-5d45-b603-5c929dcad976", "7ab0ddcb-cf48-5457-bee7-b6ea9c13b6b1"]
conclusion = "The De ente first source is the same being as a necessary CONCRETE_6 underived candidate at w"
axioms = []
rule = "Instantiate the underived candidate's all-world no-ground clause at w to make it an actual root, then identify both actual roots by unique actual roothood"
meaning = "Analyst witness-identity composition, attribution deferred. On ONE carrier, grounding profile m and world w: the De ente source n is an actual concrete root at w (ce7edf53). The underived candidate u has no selected ground from an existing concrete candidate at any world, in particular none at w, so u is an actual root at w. UniqueActualRootAt m w (7ab0ddcb) identifies both with its unique root, so u = n and the two bodies hold of one being. All-world underivedness and necessity come from the underived premise; they are NOT derived from De ente roothood at w. The proof uses neither Ontic.Causes nor any identification of the q3 causal relation with m.grounds; the De ente bridges that make n an actual root are inputs of ce7edf53's own producer. No existence, necessity or divine attribute of any being follows unconditionally. See docs/notes/de-ente-esse-source-1628.md#same-witness-identities-for-1731-2026-11-18."

[[argument]]
id = "De ente source and GOD_4 classical root are one being by selected-root uniqueness"
theorem = "deEnteSourceIsClassicalGodRoot"
premises = ["ce7edf53-afbb-4bca-84d6-b0e36b861148", "da3facd6-008e-5e76-92fa-677350c2dfdb"]
conclusion = "The De ente first source is the same being as the GOD_4 classical root at w"
axioms = []
rule = "Apply the classical root's own PerfectRootAt uniqueness clause to the De ente actual root"
strong_version_needed = { "da3facd6-008e-5e76-92fa-677350c2dfdb" = "The weak versions (GOD_4 exists, unique classical God exists) are existential projections that forget the witness and its PerfectRootAt clause. The identity uses exactly that clause (every actual root of m at w equals the witness) and the conclusion retains the witness's full body, so no weak version suffices." }
meaning = "Analyst witness-identity composition, attribution deferred. On ONE carrier sigma.Being, grounding profile m, world w and q3 profile p: the De ente source n is an actual concrete root at w (ce7edf53). The classical God root g (da3facd6) satisfies PerfectRootAt, which itself contains 'every actual root of m at w equals g'. Hence n = g and both bodies hold of one being. De ente root EXISTENCE suffices; no separate root-uniqueness package (multiplication, grades or pure indiscernibility) is an input, because the classical endpoint already carries selected-root uniqueness and that carried commitment is retained, not removed. The bare GodExists projection loses this identity; this conclusion retains it. Neither endpoint's inputs (the De ente actuality/ground bridges; the 22-input classical-root bundle) are proved. GOD_4 is the nominal case predicate, not historical or Christian identification. See docs/notes/de-ente-esse-source-1628.md#same-witness-identities-for-1731-2026-11-18."

