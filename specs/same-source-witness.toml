meaning = "Analyst horizontal support option for the existing positive-root endpoint, attribution deferred. Retains the supplied perfect root, excluded middle, nine further structural inputs and the will principle of PerfectRootIntellectFromGovernor.derive and replaces its MaximeEnsGovernsNature input by the witness-local Fifth Way bundle 65c409cc and first-mover/maximum identity 46326b43, on ONE HasIntellect dictionary (Intelligent read as HAS_INTELLECT_1) and the q3 profile's respect carrier for motion. The local bundle gives an intellectual unmoved director that moves the selected body, hence a first unmoved mover f; the existing godHasIntellect consumer, instantiated with the esse-maximum predicate in its GOD_4 slot (so its naming converse holds by definition and no GOD_4 premise enters), gives intellect to every esse maximum. The supplied perfect root n is such a maximum, so HasIntellect n. The existing governor derivation then gives the SAME positive-root tuple; its global clause 'every natural body is directed' is instantiated with an empty natural-body predicate, which shows that derivation uses only an intelligent maximum. No global governor, universal immateriality-to-intellect bridge, GOD_4 naming converse (4c79298d) or God-existence conclusion is used. CAUSE_1 (moving, in the local bundle) and CAUSE_2 (causing a perfection at esse, in the root/genus inputs) stay distinct parameters Moves and p.CausesIn: no moving edge is converted into an esse-cause edge. The only passage from the motion order to the esse order is the declared bridge 46326b43, which identifies a first unmoved mover with an esse maximum. The identity premise keeps its substantial causal and agent-application provenance (producers 790f1b54, 87b6f981) and is shared with other Ways; this is not independent corroboration of them. The application that the local director's direction is intellectual cognition, not sensory response or selection/feedback, remains the open semantic burden. See docs/notes/teleology-first-mover.md#same-witness-intellect-routes-and-the-will-consumer-1731-2026-11-18."
