[[argument]]
id = "Population by specialization to the selected world's existence extension"
theorem = "population"
premises = ["43253cd8-62be-4528-85e4-54806bd3fac0"]
conclusion = "43f09b83-776d-57b8-a5b3-b84715e48fc2"
rule = "Definitional specialization"
transcription = "instantiation"
comparator_theorems = ["assertionWitness"]
meaning = "Instantiation transcription. Use SomeExistent with ExistsIn fixed to m.ontic.ExistsAt w. Both sides say that this extension has a member. In the occurrence argument that member is the selected episode's own representative. The companion theorem retains the asserting agent, claim, realizing episode and representative together under the three existing assertion, realization and world-indexed representation inputs. A reading about the actual denial requires those inputs to hold of the performance here."

[[argument]]
id = "090a6b68-0f89-4298-9008-5475ef74e900"
label = "CONCRETE_6 population of the same world under its in-re esse contract"
theorem = "concretePopulation"
premises = ["43f09b83-776d-57b8-a5b3-b84715e48fc2", "0436de86-6579-53f2-9ff5-2111ba44ebae"]
conclusion = "56f68b40-9737-59a0-8cac-5610980a1547"
rule = "Classify and retain the existing witness"
transcription = "assembly"
comparator_theorems = ["denialControl"]
meaning = "Assembly transcription in the adopted esse reading. Select the inhabitant x and retain its actual existence while applying the one-way local existence-in-act contract to x. This supplies the concrete population premise for a grounding profile with the same ontic data and HasEsseInRe classification. It adds no independent defense of the contract. The companion interpretation realizes the very denial of concrete population, has an existing representative here and an empty other world, and fails the contract at that representative."
