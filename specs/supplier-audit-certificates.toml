[batch]
vocab = "TruthCore.Causality.SupplierAuditCertificates"
results = "TruthCore.Results.Causality.SupplierAuditCertificates"
definitions = ["5b19527d-9418-441e-820c-3c659ba7cb12", "3e9fb252-3f0b-4ed4-a683-7c36d255c357"]

[[statement]]
id = "A specified supplierless ancestor exists exactly when a finite audit can certify that bearer"
lean = "PositiveCertificateCriterion"
paraphrase = "On a fixed bearer type, take every supplier relation agreeing with the complete incoming lists of the audited recipients as an alternative. A specified bearer is actually supplierless and reaches the target by a finite path exactly when some audit of finitely many recipients certifies those two facts about that very bearer in every alternative. The target can itself be the supplierless bearer by the zero-edge path."
definitions = ["5b19527d-9418-441e-820c-3c659ba7cb12", "3e9fb252-3f0b-4ed4-a683-7c36d255c357", "c15c1634-6d70-4ecb-8b5b-5592df955223", "05a2afda-c654-5f6b-a0f7-796c5dc1be2e"]

[[statement]]
id = "A finite audit can exclude every supplierless ancestor exactly for a finite rootless actual cone"
lean = "NegativeCertificateCriterion"
paraphrase = "On a fixed bearer type, take every supplier relation agreeing with the complete incoming lists of the audited recipients as an alternative. An audit of finitely many recipients can rule out a supplierless ancestor of the target throughout those alternatives exactly when the actual full predecessor cone is finite and every member has an incoming supplier. The cone includes the target and is computed separately in each alternative."
definitions = ["5b19527d-9418-441e-820c-3c659ba7cb12", "3e9fb252-3f0b-4ed4-a683-7c36d255c357", "574b2dd0-fb49-4f37-82af-be77c94fcf2b", "05a2afda-c654-5f6b-a0f7-796c5dc1be2e"]

[[argument]]
id = "Characterize finite certificates for a specified supplierless ancestor"
theorem = "positiveCertificate"
comparator_theorems = ["positiveCertificateAt"]
premises = []
conclusion = "A specified supplierless ancestor exists exactly when a finite audit can certify that bearer"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Audit the specified root and the recipients along one finite actual path, and use the actual relation for factivity"
meaning = "For a given audit the test is exact: the audit must cover the specified root, its list must be empty, and some actual path to the target must have all edge recipients audited. Necessity follows by deleting all unrecorded edges to test the path and by adding a self-edge to the specified bearer if its list was unaudited. This concerns ideal certificates on a fixed graph of suppliers."

[[argument]]
id = "Characterize finite certificates excluding all supplierless ancestors"
theorem = "negativeCertificate"
comparator_theorems = ["negativeCertificateAt", "acyclicConeCannotHaveNegativeCertificate"]
premises = []
conclusion = "A finite audit can exclude every supplierless ancestor exactly for a finite rootless actual cone"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Delete the incoming list of an unaudited ancestor and preserve its path, and transfer each supplier list when the actual cone is fully covered"
meaning = "A given audit excludes all supplierless ancestors exactly when it covers the actual cone and that cone has no supplierless member. Deleting incoming edges at an unaudited ancestor preserves a path from it by discarding any prefix that returns to it. Full coverage of a finite cone supplies the converse certificate. An acyclic actual cone therefore admits no finite negative certificate. The deletion alternatives are part of the unrestricted information model."
