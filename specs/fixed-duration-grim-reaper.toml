[[statement]]
id = "Adjacent Reaper pieces along every supplied-duration populated descent"
lean = "DurationPiecesPossible"
paraphrase = "OPEN analyst premise, attribution deferred. DurationPiecesPossible R h Concrete k d w requires that, for every v accessible from w and every descending c with DurationSlots k d c and populated first moment, each adjacent pair of the existing four-interface PieceAt predicates is realized in some world accessible from v. It retains the same h, R, clock and moment-code interpretation. Registers do not imply concrete station existence. All four PieceAt interfaces, including admissibility, concern actual outputs in each witness world. A supplied positive d is fixed, not arbitrarily small; no arbitrary-speed devices or countable concrete realization is asserted."
definitions = ["DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-KANT-MODAL-CONTINGENCY", "008cb21a-256c-5a90-822c-acd4591d699a", "375676b0-a295-4a17-a9e4-3db23319d517", "419d2bf5-8cea-47a4-bf64-3058a1f2489b", "5f177d3f-c661-49d2-8082-941a46d8b41b", "452b5aa5-0bbe-43a5-b2db-cd32982cd6bf"]

[[statement]]
id = "Reaper patchwork along every supplied-duration populated descent"
lean = "DurationPatchwork"
paraphrase = "OPEN analyst premise, attribution deferred. DurationPatchwork R h Concrete k d w requires that each descending c in v accessible from w, with slots at least the supplied positive d and populated first moment, has all its PieceAt predicates realized in one world accessible from v if all adjacent pairs are co-possible. It supplies no local feasibility, concrete devices, host geometry or actual interface warrant. All four PieceAt interfaces, including admissibility, concern actual outputs in each witness world. A supplied positive d is fixed, not arbitrarily small; no arbitrary-speed devices or countable concrete realization is asserted."
definitions = ["DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-KANT-MODAL-CONTINGENCY", "008cb21a-256c-5a90-822c-acd4591d699a", "375676b0-a295-4a17-a9e4-3db23319d517", "419d2bf5-8cea-47a4-bf64-3058a1f2489b", "5f177d3f-c661-49d2-8082-941a46d8b41b", "e7efdb71-4992-46df-a5a2-ffb4fad6686e"]

[[statement]]
id = "One locally feasible supplied-duration descent per infinite populated past"
lean = "DurationDescentPossible"
paraphrase = "OPEN analyst premise, attribution deferred. DurationDescentPossible R h Concrete k d w requires that every metrically infinite populated past at t in v accessible from w admits some descending c starting exactly at t, with every slot at least the supplied positive d, and co-possible adjacent PieceAt predicates. It is existential in c per v and t, not local coverage of every descent. The infinite-past antecedent restricts the application question; this is an explicit sequence and register witness requirement, not an opaque finiteness flag. All four PieceAt interfaces, including admissibility, concern actual outputs in each witness world. A supplied positive d is fixed, not arbitrarily small; no arbitrary-speed devices or countable concrete realization is asserted."
definitions = ["DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-KANT-MODAL-CONTINGENCY", "008cb21a-256c-5a90-822c-acd4591d699a", "375676b0-a295-4a17-a9e4-3db23319d517", "419d2bf5-8cea-47a4-bf64-3058a1f2489b", "5f177d3f-c661-49d2-8082-941a46d8b41b", "a9f95430-3df4-4073-881e-87cc77ac93a1"]

[[statement]]
id = "7d1b132f-e82c-486e-85c9-1217bfdf642c"
label = "One selected actual finite-prefix station network per infinite populated fixed-duration past"
lean = "SelectedFiniteStationCompatibility"
paraphrase = "OPEN analyst premise: in every accessible history with a contingent concrete individual at a moment whose past is unbounded below on the supplied clock, there is some anchored descent with all slots at least one fixed positive duration d, a fixed Nat-indexed family of concrete bearers, and a distinct accessible world realizing every finite prefix's actual station existence/presence, directed Ontic.Causes relation and full four-rule PieceAt signal protocol. The bearer and Ontic.Causes conjuncts are conjoined with the moment-indexed register protocol, not bound to it, so the edge is not modelled signal transmission. The local witness may depend on the prefix length. Actual local causation is stronger than individual intrinsic-power possibility and cannot be read off from CPNPP without a power-to-exercise bridge. No countable joint realization is claimed."
definitions = ["1cafe011-a462-479a-9cfe-471fe7a9b530", "dc0aa760-8cbe-414f-9bd0-9cc67ead87c9", "b6f8b044-a489-4462-b379-25908923c19e", "5f177d3f-c661-49d2-8082-941a46d8b41b", "419d2bf5-8cea-47a4-bf64-3058a1f2489b", "6e811e85-b983-5988-b20a-f4f3ee83c50e", "97f37f5c-7f82-5077-9bb9-6cfc8673631d", "008cb21a-256c-5a90-822c-acd4591d699a", "375676b0-a295-4a17-a9e4-3db23319d517", "7c05f92b-907d-4c9b-b219-fc4054c9912b"]
