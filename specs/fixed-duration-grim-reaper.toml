[[argument]]
id = "713dd892-a72c-4ffc-84c2-0d9d539a5c39"
label = "Finite pasts from causal station prefixes and countable recombination"
theorem = "metricallyFiniteOfCountableStationRecombination"
strong_version_needed = { "7d1b132f-e82c-486e-85c9-1217bfdf642c" = "The countable premise 9cb8c0ee is triggered only by finite-prefix station compatibility with a fixed station map; the weaker fab16501 supplies only co-possible adjacent register pieces and no station family, so it does not meet that antecedent." }
premises =["7d1b132f-e82c-486e-85c9-1217bfdf642c", "9cb8c0ee-b3fa-4440-98e2-903f77c4c1e8"]
conclusion = "4365c3c5-d39b-405c-97a9-a4f7e43c628f"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "On a metrically infinite populated past select one causally compatible station family, apply countable same-history recombination, and invoke the existing Reaper impossibility."
meaning = "A substantive conditional support option: an alleged infinite populated past supplies one fixed-duration station family with arbitrarily long finite prefixes of actual, concrete, causally related operations, and OPEN countable recombination permits one accessible world realizing all operations. The existing GrimReaperPatchwork.arrangementImpossible then rules this world out, yielding the original metric finiteness conclusion. Neither finite feasibility nor global recombination is established; no first moment, per-se grounding or necessary concrete being follows without the existing separate consumers. Companion dependency checks: the countable premise holds exactly when no qualifying descent has finite-prefix-compatible operations (countableStationRecombinationIff), is implied by the conclusion 4365c3c5 (countableStationRecombinationOfMetricallyFinite), so that given 7d1b132f it is equivalent to that conclusion, and is implied by fixed-duration patchwork 313105b4 (countableStationRecombinationOfDurationPatchwork). Relative to the fab16501 + 313105b4 route, this route uses a stronger local premise and a weaker gluing premise (implication order only, no strictness claimed); the bearer and Ontic.Causes conjuncts are idle in the proof."
comparator_theorems = ["countableStationRecombinationIff", "countableStationRecombinationOfMetricallyFinite", "countableStationRecombinationOfDurationPatchwork"]
definitions = ["008cb21a-256c-5a90-822c-acd4591d699a", "375676b0-a295-4a17-a9e4-3db23319d517", "419d2bf5-8cea-47a4-bf64-3058a1f2489b", "1cafe011-a462-479a-9cfe-471fe7a9b530", "dc0aa760-8cbe-414f-9bd0-9cc67ead87c9", "b6f8b044-a489-4462-b379-25908923c19e", "5f177d3f-c661-49d2-8082-941a46d8b41b", "4085bd2b-d5d7-46a2-8388-d15ae19696ae", "3b803aa6-c863-4edf-9d10-59ede70c8140", "7c05f92b-907d-4c9b-b219-fc4054c9912b", "97f37f5c-7f82-5077-9bb9-6cfc8673631d", "6e811e85-b983-5988-b20a-f4f3ee83c50e"]

