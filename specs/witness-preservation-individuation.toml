[[statement]]
id = "EFFECT_INDIVIDUATION_1 tracks the actual provenance in the replacement profile"
lean = "OriginIndividuation"
definitions = ["a36adbd0-b558-4efc-bd73-4479ddcf1698"]
disambiguations = ["1cb16a7f-9c11-4cf0-96f8-c2ffb2307df7"]
paraphrase = "OPEN interpretation. For a supplied role output, the effect is present exactly where the candidate for the given role carries the actual producer's provenance tag. Applied to replacementOutput, this yields the listed inventory: the candidate has this provenance at actual, there is no candidate at near, and the candidate at far has backup provenance."

[[statement]]
id = "EFFECT_INDIVIDUATION_2 tracks role occupancy in the replacement profile"
lean = "RoleIndividuation"
definitions = ["e7cffaa0-bccd-49ee-b1cf-0e730e418151"]
disambiguations = ["1cb16a7f-9c11-4cf0-96f8-c2ffb2307df7"]
paraphrase = "OPEN interpretation. For a supplied role output, the effect is present exactly where the given role has an output. Applied to replacementOutput, it counts the actual and backup candidates as the effect across worlds and has no output at near."

[[statement]]
id = "Closest absence preserves accessible contrast witnesses in the replacement profile"
lean = "ReplacementPreservation"
definitions = ["c7d19067-3df4-48ef-b0a6-bf20cb4ba43c"]
paraphrase = "For the supplied effect presence predicate in the three-world replacement profile, the closest-absence selector preserves accessible effect-present source-absence witnesses at actual. For each pair of the two tracked individuals, if an accessible world has the first present and the second absent, some accessible contrast for that pair is selected."

[[argument]]
id = "EFFECT_INDIVIDUATION_1 yields witness preservation in the replacement profile"
theorem = "origin_preserves"
premises = ["EFFECT_INDIVIDUATION_1 tracks the actual provenance in the replacement profile"]
conclusion = "Closest absence preserves accessible contrast witnesses in the replacement profile"
senses = { EFFECT_INDIVIDUATION = "EFFECT_INDIVIDUATION_1" }
rule = "Exhaust accessible contrast witnesses under the exact provenance criterion"
meaning = "Only actual has an output with actual provenance, and both tracked individuals exist there. This exhausts accessible contrast witnesses for every pair, so the closest-absence selector preserves the required witnesses vacuously. The typed consumer origin_case_exclusion uses this result with selected absence soundness and accessible realization in the same control."
