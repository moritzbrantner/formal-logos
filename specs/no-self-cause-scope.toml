[[argument]]
id = "Distinct efficient incoming coverage from no CAUSE_4 self-origin"
theorem = "distinctOfNoOrigin"
strong_version_needed = {"STMT-EXCLUDED-MIDDLE" = "The frozen argument uses the existing excluded-middle interface to decide c = x for a witnessed edge E c x r. It only needs that local equality disjunction; the existing classical-attributes restriction does not supply it for an arbitrary cause and effect in this frame."}
premises = ["Each efficient self-edge has a distinct incoming cause or a CAUSE_4 self-origin", "STMT-NOTHING-ORIGINATES-ITSELF", "STMT-EXCLUDED-MIDDLE"]
conclusion = "Every efficient effect has a distinct EFFICIENT_CAUSING_2 cause"
rule = "Split identity of the selected witness and eliminate the self-origin disjunct"
meaning = "A distinct incoming edge already witnesses the consequent. If the selected witness is diagonal, the explicit bridge gives either another incoming cause or a CAUSE_4 diagonal. The origin exclusion removes the latter; the proof leaves the original efficient self-edge intact."

[[argument]]
id = "Second Way from distinct efficient incoming witnesses"
theorem = "firstEfficientOfDistinct"
strong_version_needed = {"8a22ae75-4198-5a32-ae52-bad2848a50a5" = "Descent knows only that the distinct antecedent is efficiently caused in some respect. The weaker sibling 446e3f2a also needs evidence that this incoming respect is relevant to its outgoing activity. The frozen premises give no such relevance witness."}
premises = ["STMT-ORDER-OF-EFFICIENT-CAUSES-FOUND", "Every efficient effect has a distinct EFFICIENT_CAUSING_2 cause", "STMT-SECOND-EFFICIENT-CAUSES-CAUSE-ONLY-AS-CAUSED", "STMT-NO-INFINITE-PER-SE-EFFICIENT-CAUSE-SERIES"]
conclusion = "STMT-FIRST-EFFICIENT-CAUSE-CANNOT-BE-LACKING"
rule = "Well-founded descent on effects using a distinct incoming witness at each step"
meaning = "Given an effect, choose a distinct incoming cause. If it has no incoming cause of any kind in the same efficient relation it is first. Otherwise the per se premise makes it a predecessor that is also an effect. Well-foundedness contradicts the absence of any first cause, using the observed effect to begin. The endpoint is double-negated."

