premises = ["STMT-NOTHING-IS-EFFICIENT-CAUSE-OF-ITSELF"]
conclusion = "Every efficient effect has a distinct EFFICIENT_CAUSING_2 cause"
weakening = true
transcription = "assembly"
strong_version_needed = {"STMT-NOTHING-IS-EFFICIENT-CAUSE-OF-ITSELF" = "This argument registers the strength comparison; the new descent consumes the weaker incoming coverage."}
rule = "Keep an arbitrary incoming witness after excluding its diagonal"
meaning = "A witness for the antecedent is itself distinct under the global ban, so it can be retained with its same respect."

