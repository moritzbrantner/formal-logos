[[argument]]
id = "Composite cause of being from the restricted temporal self-uniter ban"
theorem = "compositionOfNoSelfUniter"
sense_bridges = [{term = "UNITING_CAUSE_VERSUS_EFFICIENT_CAUSE", from = "UNITING_CAUSE_VERSUS_EFFICIENT_CAUSE_1", to = "UNITING_CAUSE_VERSUS_EFFICIENT_CAUSE_4", statement_id = "STMT-UNITING-CAUSE-EFFICIENT-AT-SOME-TIME"}, {term = "UNITING_CAUSE_VERSUS_EFFICIENT_CAUSE", from = "UNITING_CAUSE_VERSUS_EFFICIENT_CAUSE_1", to = "UNITING_CAUSE_VERSUS_EFFICIENT_CAUSE_3", statement_id = "fbee7f15-f54b-5a67-9773-3c09ca7015f4"}]
premises = ["6b80cfe4-82e1-53d3-9c7c-6564e52a25de", "58445bd6-264b-53cf-8951-d052022f8e47", "STMT-UNITING-CAUSE-EFFICIENT-AT-SOME-TIME", "fbee7f15-f54b-5a67-9773-3c09ca7015f4", "No admitted efficient self-edge occurs on a self-uniting tuple"]
conclusion = "STMT-COMPOSITE-HAS-A-UNITING-CAUSE"
