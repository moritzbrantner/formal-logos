[[statement]]
id = "Every efficient effect has a distinct EFFICIENT_CAUSING_2 cause"
lean = "EffectsHaveDistinctCauses"
paraphrase = "OPEN analyst premise. At the selected time, if a bearer is efficiently caused in some respect, it has at least one numerically distinct efficient cause in some respect. The two respects may differ. This is an incoming-witness requirement."
definitions = ["DEF-EFFICIENT-CAUSING"]

[[statement]]
id = "Each efficient self-edge has a distinct incoming cause or a CAUSE_4 self-origin"
lean = "SelfEfficientHasAlternativeOrOrigin"
paraphrase = "OPEN analyst bridge. At the selected time, if a bearer efficiently causes itself in a respect, then either it is efficiently caused by a distinct bearer in some respect, or it is the originating cause of itself. The two alternatives need not be exclusive."
definitions = ["DEF-EFFICIENT-CAUSING", "05dc1385-d245-5137-bf8b-dbdb1d3d9a7a"]
disambiguations = ["DISAMB-CAUSE"]

[[statement]]
id = "No admitted efficient self-edge occurs on a self-uniting tuple"
lean = "NoTemporalSelfUniter"
paraphrase = "OPEN analyst premise on the temporal composer frame. For every tuple in which the uniter is identical to the united bearer, that bearer does not efficiently cause itself in any respect at any admitted time."
definitions = ["DEF-COMPOSER-TEMPORAL-PROFILE"]
disambiguations = ["DISAMB-UNITING-CAUSE"]

[[statement]]
id = "05ef524c-8e43-4155-adc7-5bb5ada27b8b"
lean = "Control.Boundaries"
label = "Finite controls for scoped causal diagonals"
definitions = ["DEF-MOTION-AS-REDUCTION", "DEF-EFFICIENT-CAUSING", "DEF-PER-SE-EFFICIENT-CAUSE-LINK"]
disambiguations = ["DISAMB-CAUSE", "DISAMB-UNITING-CAUSE"]
paraphrase = "Three fixed structural controls. The motion interpretation satisfies InternalMotion for the whole in displacement. PatientLift supplies an actual distinct mover and AggregateLift supplies a whole-level diagonal. On the stipulated Boolean interpretation the binary origin shares a bearer pair with the distinct efficient edge. The efficient edges differ in respect, and the diagonal efficient edge shares its respect with the self-directed perfection. These coexist with distinct incoming coverage and a first efficient cause with the per se and regress premises, while both broad efficient-self bridges fail on the stipulated efficient relation. An actual temporal uniting tuple has past distinct activity, and a past diagonal outside that tuple falsifies the all-time ban while the restricted ban and selected-time exclusion hold. These are comparisons of supplied interpretations."

[[argument]]
id = "A selected actual mover supplies another MOTION_1 mover"
theorem = "anotherMoverOfActualMover"
premises = ["STMT-NOTHING-REDUCED-TO-ACT-EXCEPT-BY-A-BEING-IN-ACT", "STMT-WHAT-IS-BEING-MOVED-TO-R-IS-NOT-YET-R"]
conclusion = "STMT-WHATEVER-IS-MOVED-IS-MOVED-BY-ANOTHER"
rule = "Extract the actual mover and rule out its identity with the patient"
meaning = "The patient lacks the completed actuality in the specified respect. The selected mover has it. Identity of the bearers would contradict this under the same act predicate. Neither whole actuality from part actuality nor universal exclusion of diagonal motion is used."

