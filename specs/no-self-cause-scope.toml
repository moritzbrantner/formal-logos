meaning = "Two distinct components give a uniter. If it is the composite, temporal composer coverage gives precisely the diagonal excluded on its tuple. The same distinct uniter then causes the composite's esse by the separate uniting-to-esse premise."

[[argument]]
id = "Finite boundaries of the self-cause exclusions"
theorem = "boundaries"
premises = []
conclusion = "05ef524c-8e43-4155-adc7-5bb5ada27b8b"
rule = "Construct finite populated relation interpretations and discharge each stated clause"
meaning = "A proper motor supplies an actual patient-lift edge while an aggregate lift supplies a whole diagonal and the patient lacks completed act. In the Boolean control the two efficient edges carry different respect indices. The distinct efficient edge and the binary origin edge have the same ordered bearer pair by stipulation. The second efficient edge is a self-diagonal and also has a stipulated perfection edge at that respect. The motion relation is empty. The same efficient roster satisfies the new full Second Way bundle with the distinct original cause first. The temporal control puts both activities in the past and selects only the distinct uniter."
