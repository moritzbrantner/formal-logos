[[statement]]
id = "5539cab9-0dac-4a1c-8f44-ca21820a5596"
label = "Identity, realizer factorization and symmetry limits on intrinsic plurality"
lean = "IdentityAndRankingLaws"
definitions = ["d6912ecb-aed2-411a-913e-0dab9106d910", "1998c3ed-fae1-4a32-a68d-1518c456d1ea", "75d4dd78-c070-4961-8130-6b0d248863c3"]
paraphrase = "Three universal conditional laws. A constitutively simple bearer with all mode realizers real has a subsingleton mode carrier IF its realizer map is injective. An irreflexive ranking of those modes is empty IF it factors through that realizer alone. An asymmetric ranking cannot rank an exchanged pair IF the selected description preserves the exchange and ranking respects all description-preserving permutations. Neither injectivity, factorization nor explanatory completeness is inferred from common grounding. The same laws apply to formal modes and contents of one intellectual act."

[[statement]]
id = "f8888507-2a95-421a-8abb-b21e83e075cd"
label = "Matched one-act and formal-mode controls with explicit differentiation"
lean = "Control.IntrinsicPluralityControls"
definitions = ["d6912ecb-aed2-411a-913e-0dab9106d910", "45d04b45-4396-4f95-87ad-a8e762bce91a", "07f3fb85-6036-4e42-8eb8-a18db846719f", "3ece6dfe-c033-4546-b7d4-94ef48a235df", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "158301bc-9585-4145-be60-34f08c9f922c", "1998c3ed-fae1-4a32-a68d-1518c456d1ea", "75d4dd78-c070-4961-8130-6b0d248863c3", "abd8cfa4-1887-47d5-86cc-e0f6092e4ded", "071b24f0-ef72-4012-8c7d-ab3be3335961", "b28d7e04-694b-442b-a42b-65f39190956f", "fae7bbb8-931c-4a95-9f44-1d59921d1c83", "c917dda9-f382-48fa-8cc1-a0b9e609c164", "38b92bb6-33ae-5817-85c6-b5a1afa63bd1", "b71adcba-9430-4c3b-a87e-60471247d2dd", "52352824-6be9-53c6-83d4-82fed9a08cbb"]
paraphrase = "Finite controls reuse AxiarchicFoundation and PossibiliaContent. A necessary actual source has one real constituent, non-real unproduced modes, a good-general favouring, one generic operation, and an actual contingent effect in the SAME CausalityFrame. The appInner assignment apprehends all modes in the one operation and meets the existing root criterion and recognition bridge; appNone apprehends none and fails both. Common-source, common-act and uniform-apprehension descriptions preserve c/d exchange; the explicit primitive value table breaks it. The noninjective realizer maps and failed bare-description factorization are checked. These are initial structural assignments; appNone alone is not mind-independence, rigidity is not proved modal necessity, and the separate restored-grounding model adds positive semantic constraints."

[[statement]]
id = "1599a9c2-1d0a-4429-ba0e-a67e6f0725ab"
label = "Source-based personal and impersonal modes with productive relevance"
lean = "PositiveControl.Certificate"
definitions = ["e894ad07-da74-412f-b679-068ec08530b3", "fe4b7da0-cbd6-5d1f-b589-953f9def12b7", "aab6fdee-e29d-58d1-b7d7-baee6d81f73e", "d6912ecb-aed2-411a-913e-0dab9106d910", "07f3fb85-6036-4e42-8eb8-a18db846719f", "158301bc-9585-4145-be60-34f08c9f922c", "75d4dd78-c070-4961-8130-6b0d248863c3", "1998c3ed-fae1-4a32-a68d-1518c456d1ea", "fe123142-31a9-49b5-840b-716bd6a0a98f", "aa0323d7-985c-40d3-b377-8fd00eacaebf", "abd8cfa4-1887-47d5-86cc-e0f6092e4ded", "071b24f0-ef72-4012-8c7d-ab3be3335961", "b28d7e04-694b-442b-a42b-65f39190956f", "fae7bbb8-931c-4a95-9f44-1d59921d1c83", "c917dda9-f382-48fa-8cc1-a0b9e609c164", "38b92bb6-33ae-5817-85c6-b5a1afa63bd1", "b71adcba-9430-4c3b-a87e-60471247d2dd", "45d04b45-4396-4f95-87ad-a8e762bce91a", "52352824-6be9-53c6-83d4-82fed9a08cbb"]
paraphrase = "On the SAME necessary actual source, at-most-one real constituent, non-real modes and contingent-effect frame as the initial controls, both readings have positive source-nature-to-mode/ranking paths, a sound necessitating maker of the nature fact, coherent factive explanation, and rank-sensitive actual giving. Modes and rank persist in the effect-absent world. Explanation is nonnecessitating; the primitive contingent exercise condition remains unexplained. The personal row has one cognitive exercise apprehending every mode and contributing to its explanation; the impersonal row apprehends nothing and has no cognitive paths into its modes/rank in this explicitly represented sole-cognition fragment. Flattening values removes giving but does not remove the retained effect-existence field. The certificate proves these stated structural commitments, not full mind-independence, non-composition, the intrinsic table's relevance, objective goodness, or either account's metaphysical possibility. The nature/mode truth equalities reduce definitionally for any supplied table; the absence of cognition-to-mode/rank paths follows from false cognition plus factivity. The added formal content is the selected positive source-nature graph and rank-sensitive giving, not an independent derivation of profile determination or mind-independence."

