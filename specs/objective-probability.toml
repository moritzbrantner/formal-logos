# ---------------------------------------------------------------- statements

[[statement]]
id = "Determination of a probability law by symmetry, stationarity and mixture"
lean = "LawDeterminationControls"
paraphrase = "Premise-free mathematical controls. (1) For every finite nonempty type and every set G of permutations acting with one orbit, exactly one PMF is G-invariant, and each of its masses is the reciprocal of the number of outcomes. (2) On Bool x Bool the set {identity, flip of the second coordinate} does not act with one orbit; for every positive p, q with p+q=1 the law with mass p/2 on each point of the first orbit and q/2 on each point of the other is invariant with full support, different p give different laws, and two such full-support invariant laws differ. (3) For every kernel K on Bool, with real switching masses a = K(true)(false) and b = K(false)(true), a PMF is stationary (one PMF.bind step returns it) exactly when its real mass x at true satisfies x(a+b) = b; if a+b > 0 exactly one PMF is stationary, and if a+b = 0 every PMF is. The balance equation is stated in K's own masses, so the stationary mass b/(a+b) is fixed only once the kernel, itself a quantitative law, is given. The identity kernel has two distinct stationary laws; the reset kernel's only stationary law is the point mass at true; the flip kernel has exactly one stationary law, yet no iterate of the point mass at true under it is stationary, and the point mass returns after two steps while one step moves it. (4) A PMF.bind mixture of components each invariant under G is invariant under G; for binary components with different masses at true the mixture is injective in its upper law; with one constant component every upper law gives the same mixture; with components having mass 3/4 and 1/4 at true, the mixture's real mass at true is 1/4 + t/2, where t is the upper law's real mass at true. No topology on PMF is used, so no convergence claim beyond (3) is made. Mathematics only: no claim that any physical or metaphysical source has such a symmetry, kernel or mixture."
definitions = ["0a465487-4d9a-4b41-80d7-687e71ff9b31", "a69282f2-e1ac-4ee6-a792-973cafd91e13", "25b5137e-db99-4974-a2d2-59dd0195e82c"]

[[statement]]
id = "b07f01e7-28c3-4b49-8ea1-c993e39873a1"
label = "Law fork under the contingent-fact PSR, applied alike to laws and adoptions"
lean = "LawSelectionFork"
paraphrase = "Premise-free consequences of the PSRStrength arena definitions. (1) For every arena, world a, fact f and selected value sel (a law, or any other content) such that f holds at a world exactly when sel there equals sel at a: if the contingent-fact PSR holds at a, then either sel is the same at every world accessible from a, or it differs at some accessible world and f has an admitted reason at a. (2) If sel is the same at every accessible world, f is not contingent at a. (3) If an operating law and a selector's adopted law coincide at every world, with facts tracking each, the contingent-fact PSR holds at a and the law differs at some accessible world, then both the law fact and the adoption fact have admitted reasons at a. (4) In a two-context model with the same finite record and the same credence the physical laws differ (3/4 and 1/4 at true), and neither gives the record zero independent-trial likelihood; the actual-law fact is contingent; with no admitted reason the contingent-fact PSR fails at the actual context, and with the everywhere-true base fact admitted as its reason the PSR holds there but that reason does not fix the law. A fact-PSR application, not the existence-PSR bridge 608a262d. It does not establish the contingent-fact PSR, that any actual law is contingent or necessary, or that an admitted reason is an intentional exercise."
definitions = ["d84f1b39-397f-4b80-b3b6-4201e37d3100", "c9574404-a0e5-4a88-a24f-60b87e41d226", "32ab2937-0d02-452d-86cf-0113c6d50ed7", "7ec53aa6-58ba-4a82-b55d-ad53435f03cb", "0a36cead-b4fc-4248-a9f2-884edf61d89f", "fe4b7da0-cbd6-5d1f-b589-953f9def12b7", "6d3a3ecb-f92f-42da-b6bb-4ea99e3ea48d"]
disambiguations = ["bb604f7b-9e16-4168-b433-be76bd3995a9"]
[statement.connection_plan]
target_statement_id = "66aecdd7-ea4e-55c6-9377-10db08893854"
missing_bridge = "Two joint premises: (a) the root's law or content fact is contingent, which puts it on the fork's second branch (for content, the existing open premise fbd0a6d3: every actual root withholds its giving of each grounded actual concretum at some accessible world); AND (b) at the actual root the only admissible reason for such a contingent fact is an intentional exercise of a rational power of that root. (a) alone yields only an admitted reason, which need not fix the law or be intentional (clause 4)."
blocker = "No recorded premise supplies (b). The fork is symmetric: an adopted law is a contingent fact needing its own admitted reason (clause 3), and a necessary law and a necessary adoption alike escape the contingent-fact PSR (clause 2), so (b) cannot be read off the fork."

[[statement]]
id = "A law's support does not settle realization, and adopting a law does not settle its sample"
label = "Support does not settle realization; adopting a law does not settle its sample"
lean = "RealizationSampleControls"
paraphrase = "Premise-free finite models. (1) For every full-support PMF on the two world labels, the support of its image law on effects is exactly the set of outputs of the act both in #462's varying output profile (a necessary source whose sole act yields effect some w at world w) and in the emptied profile, which has the same frame, existence table, source, act and output table but no causal edges. Only the varying profile realizes its outputs causally (RealizedOutputs). (2) In a one-agent STIT frame over histories (adopted, sample) whose choice cells are fixed by the adoption coordinate, the agent deliberatively sees to the adoption at the history (true, true): adoption holds throughout its cell and is not historically necessary. The sample there is true, but the agent sees to neither the sample nor its contrary. (3) In every STIT frame, if an agent deliberatively sees to some proposition at a history and the same choice cell contains a history where an effect fails, the agent does not see to the effect at that history. The STIT vocabulary has no plan or governing relation. The emptied profile is a structural independence control, not a countermodel to an actual intrinsically productive disposition; nothing is established about any actual source, plan or law."
definitions = ["b08fddc6-584e-4e39-897d-7758b92e0e95", "e36a3cf1-be2c-51a0-bb55-f388c115e11d", "d3b970fa-abdd-553e-baa9-0a337fa24c26", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "c54f0922-eb5c-4abd-9bde-6586e4127424"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "Law determination controls checked"
theorem = "lawDeterminationControls"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Determination of a probability law by symmetry, stationarity and mixture"
rule = "Orbit constancy and normalization; real balance equation for a binary kernel; PMF.bind algebra"
meaning = "Premise-free. Invariance under a one-orbit permutation set makes the law constant, so normalization fixes it as uniform; explicit orbit laws give a continuum of invariant laws for two orbits; the binary stationarity equation is the real form of one bind step, from which uniqueness for positive switching, existence by an explicit law, and stationarity of every law for zero switching follow; the flip kernel moves each point mass to the other; mixtures preserve pointwise invariance, are injective when binary components differ, collapse by bind_const when they coincide, and for the 3/4 and 1/4 components give 1/4 + t/2."
description = "What a structure fixes about a probability law. One symmetry orbit fixes a unique law, but only the uniform one; a non-uniform law needs quantitative input. Positive binary switching fixes a unique stationary law, but only relative to the kernel's own masses: the kernel is itself a quantitative law, so stationarity relocates the law question to the kernel rather than answering it. Two orbits, zero switching or an idle upper mixture leave the law open. Uniqueness is not convergence (the flip kernel's point-mass orbit never reaches its unique stationary law). Generalizes #2144's exchange-symmetry control. Mathematics only: no claim that a source has such a structure, and no defeat of either the impersonal or the personal account. Not a transcription; establishes no premise."

[[argument]]
id = "9b1d7b14-6e3d-44c4-bd0a-7131cd9a01e1"
label = "Law fork under the contingent-fact PSR, applied alike to laws and adoptions"
theorem = "lawSelectionFork"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "b07f01e7-28c3-4b49-8ea1-c993e39873a1"
rule = "Case split on accessible constancy of the selected value; contingency from the tracking biconditional; explicit two-context arena"
meaning = "Premise-free. If the tracked value differs at an accessible world, the tracking fact holds at a and fails there, so it is contingent and the contingent-fact PSR supplies an admitted reason; if it is constant, the fact holds at every accessible world and is not contingent. When the operating law is the adopted law, the same variation makes both tracking facts contingent. The matched model computes the masses 3/4 and 1/4, the positive likelihood of every record, the PSR failure without a reason, and an admitted base reason holding at the rival context."
description = "The contingent-fact PSR asks for a reason for a law's obtaining exactly when the law varies across accessible worlds, and asks the same of a selector's adoption of that law: the demand is symmetric between impersonal law and personal selection. A law or adoption that is constant across accessible worlds escapes it. An admitted reason need not fix the law. A fact-PSR application, not the existence-PSR bridge 608a262d. Establishes no premise, no contingency of any actual law and no identification of reasons with intentional exercise; connection plan to 66aecdd7. Not a transcription."

[[argument]]
id = "Realization and sample controls checked"
label = "Support does not settle realization; adopting a law does not settle its sample, checked"
theorem = "realizationSampleControls"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_mixing_control = true
premises = []
conclusion = "A law's support does not settle realization, and adopting a law does not settle its sample"
rule = "PMF.support_map on full-support laws; RealizedOutputs by inspection of the two profiles; STIT cells by the adoption coordinate"
meaning = "Premise-free. The image of a full-support law under some has support {some false, some true}, the output set of both profiles; the varying profile's outputs are its causal edges, the emptied profile has none. In the STIT frame the adoption coordinate is constant on the cell of (true, true) and false at another history, while the cell contains (true, false), so neither the sample nor its contrary holds throughout the cell; generally, a cell-mate where the effect fails refutes seeing to the effect."
description = "Matching a law's support to an act's outputs does not establish causal realization, and seeing to the adoption of a law in a STIT cell does not see to its particular sample: rationally choosing a law is not necessarily choosing its sample. The emptied profile is a structural independence control, not a countermodel to an actual intrinsically productive disposition. Establishes no premise and nothing about any actual source or plan. Not a transcription."

