[[argument]]
id = "bafcaebf-ac00-4cf9-bff3-bbda81809a4c"
label = "Product sampling laws on one plenitude roster leave the report probability unidentified"
theorem = "observationalUnderdetermination"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "2db2a6c0-6815-470c-a77f-6a548a2285aa"
rule = "Evaluate Bernoulli-geometric product measures and apply the identifiability criterion"
meaning = "The roster Bool x Nat repeats each type through an injection from Nat. For interior p the product of a Bernoulli(p) report law and a geometric(1/2) index law is a probability with positive point masses and true-fiber mass p. The scope data do not depend on p, so rates 1/100 and 99/100 share them but differ in that mass, and the scope data do not identify it."

[[argument]]
id = "372c1552-cde0-4315-a9a3-6f63058383e9"
label = "Rate-weighted nested cutoffs of one roster give constant arbitrary frequencies"
theorem = "cutoffUnderdetermination"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "b945e56e-b327-4737-9ba2-62e2e721e9e0"
rule = "Count the two finite type slices at each stage"
meaning = "For positive a and b the stage-n set is the union of initial segments of lengths a(n+1) and b(n+1) in the two type fibers. The stages are nested, the instance with index k appears by stage k, and the true-type frequency is a/(a+b) at every stage, so its limit is a/(a+b)."

[[argument]]
id = "7cb07c61-1c9c-4212-b2ee-b257e660fb7c"
label = "Observer-cell reweighting of a sampling row reaches every interior likelihood"
theorem = "observerWeightUnderdetermination"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "dea28154-e726-46e6-ad33-67a1bf384afe"
rule = "Solve the weighted likelihood equation for positive weights"
meaning = "Unit weights give the existing likelihood. With positive evidence and other-observer masses, the weights p/w0 and (1-p)/w1 give weighted likelihood p for each interior rational p."

[[argument]]
id = "78f10e01-dca5-4a77-b4ce-dc1a88fbaca9"
label = "Pushforward of the product control gives every interior mass on countable carriers"
theorem = "arbitraryInteriorMass"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "c3f76aea-ee54-471c-8a37-ef53eab821d6"
rule = "Push the Bernoulli-geometric product forward along a fiber-preserving surjection"
meaning = "Surjections from Nat onto the nonempty event and onto its nonempty complement give a surjection from Bool x Nat sending the true fiber into the event and the false fiber into its complement. The pushforward of the product control at interior p is a probability with positive mass at every point and event mass p."
