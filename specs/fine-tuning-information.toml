[[statement]]
id = "Observer-conditioned binary report information criterion"
lean = "ObserverInformationCriterion"
paraphrase = "For a supplied prior giving both models positive mass, the binary report has zero mutual information about the model label exactly when both three-cell sampling rows give the same observer-conditioned fine-evidence likelihood."

