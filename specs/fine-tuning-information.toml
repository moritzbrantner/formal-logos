# Plenitude controls (#2143) and the shared interior-mass lemma reused by #2142.
# Analyst mathematics, attribution deferred. None of these statements is a
# premise of a root inference; each records its plan toward GOD_4.

[[statement]]
id = "2db2a6c0-6815-470c-a77f-6a548a2285aa"
label = "Fixed infinite plenitude roster leaves the residual report probability unidentified"
lean = "Plenitude.ObservationalUnderdetermination"
paraphrase = "On one fixed roster Bool x Nat in which each report type has infinitely many instances, every strictly interior report probability is realized by a normalized product measure giving positive mass to every instance. The supplied possibility profiles, roster and type map are the same for all these measures, so no function of those data returns the probability; that conjunct holds because the data are constant. The data omit the instance-index order, which a natural-density rival would use."
definitions = ["3a22aef4-1160-41b3-b0d7-f2883f439d4e", "b1e17aae-ec07-4319-b63f-e0de329f91b2", "bdcb1887-b80e-46b8-af78-7899b452b245", "fcc6b495-dadb-4c98-9dc9-910ac47bedd9", "41d1ffc6-c326-4422-a5ff-03336ff964ec"]
disambiguations = ["4d54ff26-0a45-4dc8-a1eb-6a447b87d3ad"]

[statement.connection_plan]
target_statement_id = "8626f8a5-9531-5da7-9ebd-f901e74b1129"
missing_bridge = "A warranted physical generator, measure and observer-selection rule that fixes the residual observational likelihood used in the fine-tuning comparison, then an independently warranted designer inference (unbuilt) and identification of the inferred witness with GOD_4."
blocker = "The control shows only that bare plenitude with infinite repetition does not fix the likelihood; no physical measure, observer rule, designer likelihood, designer inference or actual designer is derived."

[[statement]]
id = "b945e56e-b327-4737-9ba2-62e2e721e9e0"
label = "Nested exhaustive type cutoffs give every rational frequency strictly between zero and one"
lean = "Plenitude.CutoffUnderdetermination"
paraphrase = "For positive naturals a and b, the stages retaining the first a(n+1) true-type and b(n+1) false-type instances of the roster Bool x Nat form an exhaustion, and the relative frequency of the true type is a/(a+b) at every stage and in the limit. These values are exactly the rationals strictly between zero and one."
definitions = ["189cfe30-cb3f-43c8-be97-f212d8773a74", "cb975bcc-de7f-4d49-9738-1b988400b6dd", "0f153481-5415-4940-9a22-e91fe5a80005", "5c03a3af-49c0-4fc1-916a-59f38e39352c"]
disambiguations = ["4d54ff26-0a45-4dc8-a1eb-6a447b87d3ad"]

[statement.connection_plan]
target_statement_id = "8626f8a5-9531-5da7-9ebd-f901e74b1129"
missing_bridge = "A physically warranted cutoff or regularization that fixes the residual observational likelihood used in the fine-tuning comparison, then an independently warranted designer inference (unbuilt) and identification of the inferred witness with GOD_4."
blocker = "The control shows only that nested exhaustive enumerations of one infinite roster do not fix a frequency; it neither selects nor refutes any physical cutoff measure."

