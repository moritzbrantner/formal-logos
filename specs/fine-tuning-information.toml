[[statement]]
id = "Observer-conditioned binary report information criterion"
lean = "ObserverInformationCriterion"
paraphrase = "For a supplied prior giving both models positive mass, the binary report has zero mutual information about the model label exactly when both three-cell sampling rows give the same observer-conditioned fine-evidence likelihood."

[[statement]]
id = "Screened and separating fine-evidence reports at unequal model weights"
lean = "ScreeningControls"
paraphrase = "At model weights one third for design and two thirds for the natural rival, the screened pair always reports fine evidence and has zero model-report information. The existing calibrated design and natural pair has positive model-report information at that same prior."

[[statement]]
id = "Binary fine-evidence report has zero Brier gain exactly at zero information"
lean = "AccuracyAgreement"
paraphrase = "With both models and both reports having positive predictive mass and coherent binary update equations, expected Brier gain vanishes exactly when the fine-evidence report has zero mutual information about the model label."

