[[argument]]
id = "Observer-conditioned likelihood equality determines binary report independence"
theorem = "observerInformation"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Observer-conditioned binary report information criterion"
rule = "KL equality and supported kernel rows determine binary independence"
meaning = "For the supplied observer-conditioned comparison prior with two positive masses, KL vanishes precisely when both Bernoulli report laws coincide. Equality of their fine-report masses is necessary and sufficient for that equality."

[[argument]]
id = "Screened and calibrated sampling rows test binary report discrimination"
theorem = "screeningControls"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Screened and separating fine-evidence reports at unequal model weights"
rule = "Evaluate the report laws and compare their likelihoods at one interior prior"
meaning = "The two screened sampling rows give the same certain fine report even at unequal model weights. The calibrated sampling pair gives distinct report likelihoods and positive mutual information at the same comparison prior."

[[argument]]
id = "Bayesian Brier and fine-report Shannon zero conditions agree"
theorem = "accuracyAgreement"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = ["907aafab-960d-4290-bd08-b955f1f10f4c", "Observer-conditioned binary report information criterion"]
conclusion = "Binary fine-evidence report has zero Brier gain exactly at zero information"
rule = "Identify both zero conditions through the conditional likelihoods"
meaning = "With the encoded joint-probability equations and interior predictive and prior probabilities, Brier gain and Shannon information have the same zero condition. The metrics remain distinct."

