meaning = "Premise-free: fourteen laws (chance senses at an invariant set-up, VG's symmetry and strength, DNP excluding CHANCE_3, the flip, one power with will, set-up collapse at an invariant source and the holder's non-necessitation (part A), VG as set-up necessitation, DNP as the exact denial of CHANCE_3, the dichotomy at a simple source, the chance core, set-up necessitation as fixed giving at an invariant source) and finite models (theist nonvacuity, the chance rival, the intellectual chancer, chance-core deletions, omissions of arguments A-D, DNP strictness, VG and chance-sense models). Model-witnessed separations only; no premise is established and no reality claim is made."
description = "Premise-free laws and models for the will-versus-chance batch. Sense-mixing control: they relate the three CHANCE senses, NECESSITATE_2 and NECESSITATE_3, MODAL_CONTINGENCY_1 and NECESSARY_2 without a bridge premise. Establishes no premise."

