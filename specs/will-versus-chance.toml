# ---------------------------------------------------------------- arguments

[[argument]]
id = "Every giving by a one-power intellectual being exercises a rational power, from will following intellect"
label = "Every giving by a one-power HAS_INTELLECT_1 being is by a rational power"
theorem = "oneIntellectualPowerGivesWilledGiving"
axioms = []
premises = ["090be689-b77f-51a1-9d5d-caf339169e4b", "Whatever HAS_WILL_1 has a rational power", "Whenever a being gives another being, the giving exercises a power of the giver"]
conclusion = "Every giving by a one-power being with HAS_INTELLECT_1 exercises a rational power of it"
rule = "Will from intellect, a rational power from will, identify it with the exercised power by one power"
meaning = "An intellectual y has will (will follows intellect), hence some rational power q; each giving of y exercises some power p of y; with one power, p = q, so the giving exercises a rational power. Constructive."
description = "The intellect route to willed giving (argument A), a route found here that discriminates choice from chance without restating the chance rival's denial: at a source with one power, intellect with these bridges suffices to make every giving willed, so the chance rival must deny the source's intellect (controls, law 13). The converse is not proved: Rational has no content, so nothing shows that a source without intellect is not willed, and other warrants for will at the source that are independent of DNP_inv (e.g. the Fifth Way and governor routes, given the holder-root identification) would discriminate equally (law 6); argument D is not one, since its will comes from DNP_inv. Not a transcription. Establishes no premise; nothing about God or about which worlds y gives in. Omission models: without will following intellect, without will as a rational power, without giving as exercise."

[[argument]]
id = "The withholding holder is a willed two-way giver, from its intellect and one power"
label = "The withholding holder is a willed two-way giver, by its HAS_INTELLECT_1 and one power"
theorem = "actualAbsenceHolderGivesByWill"
axioms = []
sense_bridges = [{term = "POWER_FOR_VERSUS_ACTIVE_POWER", from = "POWER_FOR_VERSUS_ACTIVE_POWER_1", to = "POWER_FOR_VERSUS_ACTIVE_POWER_2", statement_id = "Whatever has power for the actual contingents' joint absence has one power", role = "premise"}]
premises = ["b8a2a9e1-0dda-48bc-a646-d4cb229ca62c", "c76b6e2c-1ca0-47fd-a9d0-2c2faa3d1174", "Whatever has power for the actual contingents' joint absence has an invariant set-up", "Whatever has power for the actual contingents' joint absence HAS_INTELLECT_1", "Whatever has power for the actual contingents' joint absence has one power", "Every giving by a one-power being with HAS_INTELLECT_1 exercises a rational power of it"]
conclusion = "Some holder of power for the actual contingents' joint absence gives by will"
rule = "Take the withholding holder and a P5 witness; its giving is by a rational power; its set-up is the same at the withholding world"
meaning = "Withholding gives a holder y at w that gives each concrete being contingent at w being at w and none at an accessible world v where y exists; P5 supplies one, x. The holder has intellect and one power, so by argument A's conclusion its giving of x at w exercises a rational power; its invariant set-up makes v a world with the same set-up. So y is a willed two-way giver at w. Constructive."
description = "Argument B: #1897's withholding holder gives by will, not by chance, given its intellect and one power, with no Theta 5 principle. Not a transcription. Establishes no premise. Its omission models show what each premise carries: without the holder's intellect the chance rival (same frame, set-up and giving, non-rational power) satisfies every other premise; without one power, the intellectual chancer. It does not say that the holder is GOD_4 or unique, nor that the choice is contrastively explained. Connection plan: the holder's intellect premise needs the holder-root identification (#1897 note, gap 2); a consumer on the root route is the q.19 a.4 creation-by-will node a94c5dfc, which needs a bridge from exercising a rational power in giving to its Wills relation (not built)."

[[argument]]
id = "Every invariant two-way giver HAS_WILL_1, by the restricted Theta 5 principle"
theorem = "thetaFiveBridgeGivesWill"
axioms = []
premises = ["At a source with an invariant set-up, a power exercised in a withheld giving is rational", "Whenever a being gives another being, the giving exercises a power of the giver", "Whatever has a rational power HAS_WILL_1"]
conclusion = "Every two-way giver at w with an invariant set-up HAS_WILL_1"
rule = "The withheld giving exercises some power; DNP_inv makes it rational; a rational power is will"
meaning = "A two-way giver y with an invariant set-up gives x being at w by some power p (giving exercises a power of the giver) and does not give it at an accessible v where it exists; DNP_inv makes p rational, and a being with a rational power has will. Constructive."
description = "Argument C, the Theta 5 bridge with the weakest Theta 5 version that suffices (DNP_inv, restricted to invariant sources). Not a transcription. Establishes no premise. With excluded middle DNP_inv is exactly the denial of CHANCE_3 at invariant sources (controls, law 11), so this route discriminates will from chance only as far as DNP_inv is independently warranted; its omission model is the chance rival."

[[argument]]
id = "GOD_4 HAS_WILL_1, by the restricted Theta 5 principle at the holder of the joint-absence power"
label = "GOD_4 HAS_WILL_1, by the restricted Theta 5 principle at the joint-absence power"
theorem = "godHasWillByThetaFive"
axioms = []
premises = ["Every GOD_4 exists at w and has power for the actual contingents' joint absence", "906f5c39-2a63-4dc2-955d-a00cfd8a976b", "9f7b1778-84c9-40cf-a1b6-a91a960b0590", "3ef41442-431a-4bed-83bd-4458ed623f5f", "c76b6e2c-1ca0-47fd-a9d0-2c2faa3d1174", "Whatever has power for the actual contingents' joint absence has an invariant set-up", "Every two-way giver at w with an invariant set-up HAS_WILL_1"]
conclusion = "66aecdd7-ea4e-55c6-9377-10db08893854"
rule = "Each GOD_4 holds the power; P2-prime, P5, the creator reading and factive giving make it a two-way giver; its set-up is invariant; apply argument C's conclusion"
meaning = "Each GOD_4 g exists at w and holds the power for the joint absence of the actual contingent concreta; P2-prime puts g at an accessible world v where they are all absent; P5 gives one, x; by the creator reading g gives x being at w, and by factive giving not at v. So g is a two-way giver at w; its set-up is invariant (holder premise); argument C's conclusion gives it will. Constructive."
description = "Argument D: a horizontal, intellect-free support option for STMT-GOD-HAS-WILL through #1897's creator premises and the restricted Theta 5 principle. Not a transcription: no premise mentions will except argument C's conclusion, which is conditional on a two-way profile the proof derives. Establishes no premise. Its crux is DNP_inv, consumed through argument C: the chance rival model satisfies every other premise of C and D. Shared dependencies with #1897's withholding route: P2-prime, P5, the creator reading and factive giving."

[[argument]]
id = "The restricted Theta 5 principle, from the strong one"
theorem = "sameSetupVariationIsRationalWeakens"
axioms = []
weakening = true
premises = ["A power exercised in a giving withheld under the same set-up is rational"]
conclusion = "At a source with an invariant set-up, a power exercised in a withheld giving is rational"
rule = "An invariant set-up is the same set-up at the withholding world"
meaning = "DNP-prime applies to every being at w with the same set-up at the withholding world; an invariant set-up gives that same set-up, so DNP-prime gives DNP_inv. Constructive."
description = "Backs the strength order DNP-prime strengthens DNP_inv. Establishes no premise. Strictness: controls, three-world model (a chancy being whose set-up varies elsewhere satisfies DNP_inv and violates DNP-prime)."

[[argument]]
id = "Will and CHANCE_3 controls checked"
theorem = "willVersusChanceControls"
axioms = ["propext", "Classical.choice", "Quot.sound"]
