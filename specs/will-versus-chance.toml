# #1926 phase 3: the impersonal-source rival at the stage-two will step
# (STMT-GOD-HAS-WILL). Part A: a necessitating impersonal source is excluded
# by results already verified elsewhere (#555 rigid_core, #1897 laws 3-4,
# PSRStrength); here only restated in the will step's set-up sense and
# connected to #1897's withholding holder (controls, laws 8-10). Part B: will
# versus chance at a source with an invariant set-up. An agency overlay on the
# shared CausalityFrame; three senses of chance; the Theta 5 principle for
# non-rational powers in a strong (DNP-prime) and a weak, invariant-source
# (DNP_inv) version; the intellect-and-one-power route that discriminates
# without restating the rival's denial. Analyst formulations, attribution
# deferred. Read for this slice (2026-11-24), navigation only, no claim
# record: ST I q.19 a.4 (materialized witness of passage 74e86e1a).
# Note: docs/notes/will-versus-chance.md.

[batch]
vocab = "TruthCore.Causality.WillVersusChance"
results = "TruthCore.Results.Causality.WillVersusChance"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Whenever a being gives another being, the giving exercises a power of the giver"
lean = "GivingExercisesOwnPower"
paraphrase = "OPEN (analyst formulation, unattributed): whenever, in a world v, y gives x being (GivesTo), there is an active power p of y (PowerOf) such that y's giving x being in v is an exercise of p (Exercises). Giving is an operation of the giver from one of its own principles. Omitting it lets a model give being while exercising nothing (an encoding artifact, controls)."
definitions = ["582f44c3-7778-4806-b385-e1eff852ac5e", "62dfa893-b633-4513-9790-8f9a0a3087e0"]

[[statement]]
id = "Whatever HAS_WILL_1 has a rational power"
lean = "WillIsRationalPower"
paraphrase = "OPEN bridge (analyst formulation): whatever has will (HAS_WILL_1, the inclination of an intellectual nature toward the good apprehended) has some active power of the rational class (Rational). It reads having that inclination as having a power of that class; HAS_WILL_1 and Rational are independent primitives, and without this bridge a being can have will and no rational power (controls)."
definitions = ["7c64b499-6dba-5e03-bdf3-5acea95d8836", "b8061228-9131-40f2-83bd-cb7d719bd0a0", "582f44c3-7778-4806-b385-e1eff852ac5e"]
disambiguations = ["941efd70-d56f-53f9-b5f9-8acd36711a54"]

[[statement]]
id = "Whatever has a rational power HAS_WILL_1"
lean = "RationalPowerIsWill"
paraphrase = "OPEN bridge (analyst formulation): whatever has an active power of the rational class (Rational) has will (HAS_WILL_1). The converse of the previous bridge; near-definitional under the HAS_WILL_1 definition, since a rational power is an inclination following intellectual apprehension of the good."
definitions = ["7c64b499-6dba-5e03-bdf3-5acea95d8836", "b8061228-9131-40f2-83bd-cb7d719bd0a0", "582f44c3-7778-4806-b385-e1eff852ac5e"]
disambiguations = ["941efd70-d56f-53f9-b5f9-8acd36711a54"]

[[statement]]
id = "A power exercised in a giving withheld under the same set-up is rational"
label = "A power exercised in a giving withheld under the same set-up is rational (strong version)"
lean = "SameSetupVariationIsRational"
paraphrase = "OPEN (DNP-prime, analyst formulation; STRONG version): for every being y at w, if y gives x being at w by its power p and, at an accessible world where y exists with the same set-up, does not give x being, then p is rational. Met. Theta 5's rule that a non-rational potency, agent and patient meeting, must act, applied to every being (navigation). With excluded middle it is exactly the denial of CHANCE_3 (an indeterministic non-rational propensity) at w (controls, law 11). Its universal scope is challenged by indeterministic physical propensities on stochastic readings of quantum mechanics (note, section 5); the weak version below suffices for the will route."
definitions = ["b8061228-9131-40f2-83bd-cb7d719bd0a0", "69d8aef9-b0d4-461d-9a48-ef0bb4fbd56f", "582f44c3-7778-4806-b385-e1eff852ac5e", "62dfa893-b633-4513-9790-8f9a0a3087e0", "a2840d96-8bdc-4e6a-a9a3-376a9505ec7c"]
disambiguations = ["c18f084e-bb0a-4edd-84d6-fdd1bb2ede87"]

[[statement]]
id = "At a source with an invariant set-up, a power exercised in a withheld giving is rational"
lean = "InvariantSetupVariationIsRational"
paraphrase = "OPEN (DNP_inv, analyst formulation; WEAK version of DNP-prime): for every being y at w whose set-up is invariant at w (the same intrinsic states and external conditions at every accessible world where it exists: the surrogate of a simple, patientless source), if y gives x being at w by its power p and does not give x being at an accessible world where it exists, then p is rational. With excluded middle it is exactly the denial of CHANCE_3 at beings with an invariant set-up (controls, law 11): it restates the chance rival's denial at such sources and adds no discriminating information against that rival beyond its own warrant (note, section 5). Physical propensities are not counterexamples to it on the assumption that their bearers' set-ups differ at some accessible world."
definitions = ["b8061228-9131-40f2-83bd-cb7d719bd0a0", "b4bb7bb4-4e2d-437d-825e-79a029340e77", "582f44c3-7778-4806-b385-e1eff852ac5e", "62dfa893-b633-4513-9790-8f9a0a3087e0", "a2840d96-8bdc-4e6a-a9a3-376a9505ec7c"]
disambiguations = ["c18f084e-bb0a-4edd-84d6-fdd1bb2ede87"]

[[statement]]
id = "Whatever has power for the actual contingents' joint absence has an invariant set-up"
lean = "ActualAbsenceHoldersSetupInvariant"
paraphrase = "OPEN (analyst formulation): whatever has at w a power for the joint absence of the concrete beings contingent at w has an invariant set-up at w: no intrinsic state of it and no external condition of its giving differs at an accessible world where it exists. The simplicity-and-patientlessness reading of #1897's holder; not derived from its necessity (a necessary holder with world-varying intrinsic states is a model of its failure)."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "b4bb7bb4-4e2d-437d-825e-79a029340e77", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["e5417243-d6f3-4776-9694-40d85bb34ff4", "DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Whatever has power for the actual contingents' joint absence HAS_INTELLECT_1"
lean = "ActualAbsenceHoldersHaveIntellect"
paraphrase = "OPEN bridge (analyst formulation): whatever has at w a power for the joint absence of the concrete beings contingent at w has intellect (HAS_INTELLECT_1). It is the point at which the chance rival must disagree, given one power and the will bridges (controls, law 13). Its connection plan: the existing intellect routes conclude HAS_INTELLECT_1 of GOD_4 or of the selected perfect root; carrying that to the holder needs the identification of the holder with that root (#1897 note, gap 2)."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "88bc0655-9dd0-5879-ba1b-3fca9f86c1f4", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["e5417243-d6f3-4776-9694-40d85bb34ff4", "DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Whatever has power for the actual contingents' joint absence has one power"
lean = "ActualAbsenceHoldersOnePower"
paraphrase = "OPEN (analyst formulation): whatever has at w a power for the joint absence of the concrete beings contingent at w has one power: all its active powers are one (the power-level aspect of simplicity; ST I q.19 a.4 ad 4, navigation). The one-power clause concerns active powers (PowerOf), not the PowerFor that picks out the holder; the two are unbridged primitives (disambiguation POWER_FOR_VERSUS_ACTIVE_POWER). Not implied by an invariant set-up: a necessary being with a rational and a non-rational power is a model of its failure."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "fdeb7757-10db-4fa7-91a4-6c15ee5100d2", "582f44c3-7778-4806-b385-e1eff852ac5e", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["e5417243-d6f3-4776-9694-40d85bb34ff4", "DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Every GOD_4 exists at w and has power for the actual contingents' joint absence"
lean = "GodsHoldActualAbsencePower"
paraphrase = "OPEN bridge (analyst formulation, unattributed): every GOD_4 exists at w and has at w a power (PowerFor) for the joint absence of the concrete beings contingent at w. The directional identification that brings #1897's holder premises to GOD_4: not uniqueness and not that every holder is GOD_4. Motivation, navigation only: on classical theism God could have refrained from creating (ST I q.19 a.3)."
definitions = ["88f9f6e8-997b-5f7d-afa1-c501954c3807", "bf7eddca-8291-4744-8470-379babcd7781", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Every giving by a one-power being with HAS_INTELLECT_1 exercises a rational power of it"
lean = "OnePowerIntellectualGivingWilled"
paraphrase = "For every being y with intellect (HAS_INTELLECT_1) and one power, and every world v and being x: if y gives x being in v, then that giving is the exercise of a rational power of y. Nothing about which worlds y gives in, or about God."
definitions = ["88bc0655-9dd0-5879-ba1b-3fca9f86c1f4", "fdeb7757-10db-4fa7-91a4-6c15ee5100d2", "b8061228-9131-40f2-83bd-cb7d719bd0a0", "582f44c3-7778-4806-b385-e1eff852ac5e", "62dfa893-b633-4513-9790-8f9a0a3087e0"]

[[statement]]
id = "Some holder of power for the actual contingents' joint absence gives by will"
label = "Some holder of power for the actual contingents' joint absence is a willed two-way giver"
lean = "ActualAbsenceHolderGivesByWill"
paraphrase = "Some being has at w a power for the joint absence of the concrete beings contingent at w and is, at w, a willed two-way giver: it exists at w, gives some being x being at w by a rational power of it, and at an accessible world where it exists with the same set-up does not give x being. It is not a CHANCE_3 giver given one power (controls, law 12). 'Willed' is the exercise-level sense WILL_CAPACITY_VERSUS_WILLED_GIVING_2, unbridged to HAS_WILL_1 and to the Wills relation of a94c5dfc. It does not say that the choice is contrastively explained, nor that the holder is GOD_4 or unique."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "de24ce2e-84e4-48d8-9cac-5f66ad532015", "b8061228-9131-40f2-83bd-cb7d719bd0a0", "69d8aef9-b0d4-461d-9a48-ef0bb4fbd56f", "582f44c3-7778-4806-b385-e1eff852ac5e", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["e5417243-d6f3-4776-9694-40d85bb34ff4", "c18f084e-bb0a-4edd-84d6-fdd1bb2ede87", "8b3d47bc-7fee-4936-99ad-6561aedc657a", "DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Every two-way giver at w with an invariant set-up HAS_WILL_1"
lean = "InvariantSetupTwoWayGiversWill"
paraphrase = "For every being y: if y's set-up is invariant at w and y is a two-way giver at w (it gives some x being at w and does not give x being at an accessible world where it exists; TwoWayGiverAt), then y has will (HAS_WILL_1, the capacity). Nothing about the will's exercise or about God."
definitions = ["7c64b499-6dba-5e03-bdf3-5acea95d8836", "b4bb7bb4-4e2d-437d-825e-79a029340e77", "e006ddeb-2c88-4835-8558-2f360cc5a3eb"]
