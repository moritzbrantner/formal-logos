vocab = "TruthCore.Modal.ActualistContingencyRoute"
results = "TruthCore.Results.Modal.ActualistContingencyRoute"

[[statement]]
id = "f084efde-c461-49d4-9f7d-902abc81b5f9"
label = "The route validates VARYING_DOMAINS_RIGID_IDENTITY_AND_NECESSITY_4 transfer at every world"
lean = "RouteForwardTransfer"
paraphrase = "Rival domain policy on the route's Ontic profile, analyst formulation, attribution deferred: a necessitist commitment (the guarded converse-Barcan pattern), which contingentists reject. For every world u and total world-indexed predicate P, if every existing candidate at each world accessible from u satisfies P there, then each candidate existing at u satisfies P at every world accessible from u. Both guards use the same rigid candidate roster and the supplied world-relative existence field. On this profile it is equivalent to increasing domains, and it strictly strengthens concrete necessitarianism (411e5817) at every world."
definitions = ["DEF-BOX-ALL-TO-ALL-BOX", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-DOMAIN-PERSISTENCE-AND-NECESSITY"]

[[statement]]
id = "9cdae436-0192-4ad7-b56a-4937e22c8c12"
label = "Not every world of the route validates VARYING_DOMAINS_RIGID_IDENTITY_AND_NECESSITY_4 transfer"
lean = "NoRouteForwardTransfer"
paraphrase = "Not every world/predicate instance of the supplied Ontic profile satisfies the forward transfer from a box of existence-guarded universal quantification to an existence-guarded universal quantification of a box; at least one instance fails (classically; the Lean type is the bare negation of the universally quantified policy). It does not say that the transfer fails at every world or for every predicate."
definitions = ["DEF-BOX-ALL-TO-ALL-BOX", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-DOMAIN-PERSISTENCE-AND-NECESSITY"]

[[statement]]
id = "ec397a1a-da39-46e1-92c7-89678a7f3870"
label = "VARYING_DOMAINS_RIGID_IDENTITY_AND_NECESSITY_4 transfer exceeds concrete NECESSARY_2: models"
lean = "Control.Strictness"
paraphrase = "Closed controls over two universally accessible Bool worlds and Bool beings, with presence x = true or w = false. (1) abstractDrop: only being true is concrete; every actual concrete being is NECESSARY_2 at every world, while the forward transfer fails: in the countermodel, the instance at world false fails, because the non-concrete being false is present at world false and absent at world true (the Lean type certifies only that not every instance holds); and no actual concrete being is CONTINGENT_1 at any world, so the contingency node fails everywhere although the transfer fails. (2) concreteDrop: every being is concrete; every actual concrete being is NECESSARY_2 at world true, while the forward transfer fails: in the countermodel, the instance at world false fails (the Lean type certifies only that not every instance holds). So the transfer is strictly stronger than concrete necessitarianism, both in constraining non-concrete candidates and in constraining worlds other than the selected one, and its failure does not give the contingency node. Statements about these interpretations only."
definitions = ["DEF-BOX-ALL-TO-ALL-BOX", "DEF-KANT-ONTOLOGICAL-MODEL", "38b92bb6-33ae-5817-85c6-b5a1afa63bd1", "97f37f5c-7f82-5077-9bb9-6cfc8673631d", "1b8baf77-84fa-5513-a138-7fa14840dd87"]
disambiguations = ["DISAMB-DOMAIN-PERSISTENCE-AND-NECESSITY", "35fa7162-6cb3-52e1-ac5b-66afc318c74f", "83264cf5-01fe-52fc-9a00-eeb024f6496e"]

