# Lane F application of the actualist domain library to the contingency node.
# The forward guarded transfer (VARYING_DOMAINS_RIGID_IDENTITY_AND_NECESSITY_4,
# the converse-Barcan pattern) is a necessitist rival of the node, which
# contingentists reject. It strictly strengthens the recorded rival concrete
# necessitarianism (411e5817) at every world; its refutation composes the
# existing refutation e1d0d14b with that strength order.
