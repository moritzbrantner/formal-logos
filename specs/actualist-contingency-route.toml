# Lane F application of the actualist domain library to the contingency node.
[batch]
vocab = "TruthCore.Modal.ActualistContingencyRoute"
results = "TruthCore.Results.Modal.ActualistContingencyRoute"

[[statement]]
id = "The route admits forward guarded universal transfer at every world"
lean = "RouteForwardTransfer"
paraphrase = "Rival domain policy on the route's Ontic profile. For every world u and total world-indexed predicate P, if every existing candidate at each world accessible from u satisfies P there, then each candidate existing at u satisfies P at every world accessible from u. Both guards use the same rigid candidate roster and the supplied world-relative existence field."
definitions = ["DEF-BOX-ALL-TO-ALL-BOX", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-DOMAIN-PERSISTENCE-AND-NECESSITY"]

[[statement]]
id = "The route does not admit global forward guarded universal transfer"
lean = "NoRouteForwardTransfer"
paraphrase = "The forward transfer from a box of existence-guarded universal quantification to an existence-guarded universal quantification of a box fails on the supplied Ontic profile. This is the negation of the policy over all worlds and all total world-indexed predicates."
definitions = ["DEF-BOX-ALL-TO-ALL-BOX", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-DOMAIN-PERSISTENCE-AND-NECESSITY"]

[[argument]]
id = "cad42854-dea2-46e5-80d4-a6d89b216a6e"
label = "Actualist forward transfer fails on the contingency route"
theorem = "forwardTransferFails"
premises = ["STMT-SOME-ACTUAL-CONTINGENT"]
conclusion = "The route does not admit global forward guarded universal transfer"
axioms = []
rule = "Actualist domain correspondence and elimination of the contingent witness"
meaning = "The contingency premise gives one existing concrete bearer at the selected world and its absence at an accessible world. Apply boxAllToAllBox_iff to the same Ontic to obtain increasing domains from the proposed transfer. Apply increasing_excludes_contingency to that bearer at the selected world. The only open premise is the route's existing contingency node."
description = "Apply the actualist-domain correspondence and incompatibility laws on the route's own Ontic profile. One actual contingent bearer suffices to refute the global forward transfer policy. The refutation is conditional on the route's contingency premise."

[[relation]]
id = "Global forward guarded universal transfer rivals the contingency node"
subject_kind = "statement"
subject_id = "The route admits forward guarded universal transfer at every world"
predicate = "alternative_to"
object_kind = "statement"
object_id = "STMT-SOME-ACTUAL-CONTINGENT"
note = "This competing actualist policy requires membership to persist along every edge of this Ontic profile. The contingency node supplies an existing concrete bearer absent across one such edge. The policy is stronger than concrete-only persistence at the selected world."

[[relation]]
id = "The contingent bearer conditionally refutes global forward guarded universal transfer"
subject_kind = "argument"
