[batch]
vocab = "TruthCore.Causality.StrictGroundRepresentation"
results = "TruthCore.Results.Causality.StrictGroundRepresentation"

[[statement]]
id = "Fixed labels admit a consistent strict-ground map exactly when their projected steps are acyclic"
lean = "FixedLabelCriterion"
definitions = ["DEF-DEPENDS-FOR-BEING", "DEF-FINE-PLG-STRICT-PARTIAL-GROUND", "DEF-FINE-PLG-DERIVABILITY"]
disambiguations = ["23dd6f32-b456-4963-adb3-7befbf0dc4fb"]
paraphrase = "For each relation D and fixed labelling into a populated atom type, some consistent PLG theory realizes all reversed distinct dependence steps exactly when no nonempty finite path of projected steps returns to its label. The theory can be chosen after the labelling and D."

[[statement]]
id = "Identity labels recover exactly finite dependence paths as strict grounds in the edge theory"
lean = "IdentityRepresentation"
definitions = ["DEF-DEPENDS-FOR-BEING", "DEF-FINE-PLG-STRICT-PARTIAL-GROUND", "DEF-FINE-PLG-DERIVABILITY"]
disambiguations = ["23dd6f32-b456-4963-adb3-7befbf0dc4fb"]
paraphrase = "On any inhabited bearer type, distinct-step acyclicity of D is equivalent to the conjunction of consistency of the theory generated by its reversed edges and exact agreement of that theory's derivable strict partial grounds with reversed nonempty finite D paths of distinct steps. Labels are the bearers themselves."

[[statement]]
id = "Two disjoint dependence steps can project to an inconsistent pair of grounds"
lean = "Control.LabelCycle"
definitions = ["DEF-DEPENDS-FOR-BEING", "DEF-FINE-PLG-STRICT-PARTIAL-GROUND", "DEF-FINE-PLG-DERIVABILITY"]
disambiguations = ["23dd6f32-b456-4963-adb3-7befbf0dc4fb"]
paraphrase = "In the fixed four-bearer, two-label interpretation, the dependence relation is acyclic and every nonempty path has differently labelled endpoints. The two projected steps have opposite directions, so no consistent PLG theory realizes the map on this labelling."

[[statement]]
id = "Each per se cause supplies the distinct dependence step in the selected respect"
lean = "PerSeDependenceLinks"
definitions = ["DEF-DEPENDS-FOR-BEING", "4a101a4c-12de-53c8-80c6-de7a523ea9d9"]
paraphrase = "OPEN alignment premise. Every link from supplier y to effect x of the selected per se efficient-cause relation has distinct endpoints and satisfies D(x,y). Using it for existential supply requires the selected D to track dependence for being in that very respect."

[[statement]]
id = "Only finitely many selected fact labels occur in the per se ancestry of each effect"
lean = "FiniteAncestralLabels"
definitions = ["4a101a4c-12de-53c8-80c6-de7a523ea9d9"]
paraphrase = "OPEN local finiteness premise about the supplied labelling. For every effect, the image under that labelling of itself and all bearers reaching it by finitely many per se cause steps is finite. The set can differ by effect. A single label can cover infinitely many bearers."

[[argument]]
id = "Classify exactly the fixed labels admitting the distinct-dependence PLG map"
theorem = "fixedLabelCriterion"
premises = []
conclusion = "Fixed labels admit a consistent strict-ground map exactly when their projected steps are acyclic"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_bridges = [{term = "DEPENDENCE_FOR_BEING_VERSUS_STRICT_GROUND", from = "DEPENDENCE_FOR_BEING_VERSUS_STRICT_GROUND_1", to = "DEPENDENCE_FOR_BEING_VERSUS_STRICT_GROUND_2", statement_id = "Fixed labels admit a consistent strict-ground map exactly when their projected steps are acyclic", role = "conclusion"}]
rule = "Rank each label by its predecessors and apply soundness for the rank reading of PLG"
meaning = "A projected cycle gives strict self-grounding in any theory realizing the map. Conversely, in an acyclic projection each generating step strictly enlarges the set of weakly reachable predecessors. Rank soundness excludes self-grounding, so the edge theory itself witnesses consistency. The consequence concerns selectable theories over the supplied labels."

[[argument]]
id = "Recover the exact strict path relation of an acyclic dependence presentation"
theorem = "identityRepresentation"
premises = []
conclusion = "Identity labels recover exactly finite dependence paths as strict grounds in the edge theory"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_bridges = [{term = "DEPENDENCE_FOR_BEING_VERSUS_STRICT_GROUND", from = "DEPENDENCE_FOR_BEING_VERSUS_STRICT_GROUND_1", to = "DEPENDENCE_FOR_BEING_VERSUS_STRICT_GROUND_2", statement_id = "Identity labels recover exactly finite dependence paths as strict grounds in the edge theory", role = "conclusion"}]
rule = "Apply predecessor-set ranks to identity labels and strict PLG transitivity to every nonempty path"
meaning = "Proper inclusion of the predecessor sets at a and b puts a among the predecessors of b and excludes equality. Thus every derivable strict partial ground in the generated theory reflects a nonempty reversed dependence path. The earlier acyclicity theorem supplies the reverse implication."

[[argument]]
id = "Test the strict-ground interpretation after identifying labels across two disjoint pairs"
theorem = "labelCycle"
premises = []
conclusion = "Two disjoint dependence steps can project to an inconsistent pair of grounds"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_mixing_control = true
rule = "Compute both projected steps and apply the supplied-label cycle criterion"
meaning = "The four bearers have only two disjoint dependence edges. Their fixed labels preserve different endpoints on each dependence path while combining the edges into a two-cycle at the label level."

[[argument]]
id = "Derive nonmutual dependence from the exclusion of finite distinct-step cycles"
theorem = "nonmutualOfAcyclic"
premises = ["702dc502-b64f-4d5c-b73d-331ea2e554b0"]
conclusion = "0f49d71e-09e6-5a9c-b7e7-e0e9b8fe769c"
definitions = ["DEF-DEPENDS-FOR-BEING"]
axioms = []
rule = "Compose opposite dependence steps between distinct beings into a two-cycle"
meaning = "Apply acyclicity to the two-step path. This conditional support for P2 uses D itself and requires neither PLG atoms nor a restriction on the diagonal."

[[argument]]
id = "Derive the Second Way regress premise using finite ancestral labels"
theorem = "foundedFromAncestralLabels"
premises = ["fea5942a-b50c-4299-a5fe-80a5c2b8c0a9", "42756c07-03cd-4b54-8ed6-ed6c1a5132aa", "Each per se cause supplies the distinct dependence step in the selected respect", "Only finitely many selected fact labels occur in the per se ancestry of each effect"]
conclusion = "97f5850f-62bc-5e43-a0c1-dd1033d08fc9"
disambiguations = ["23dd6f32-b456-4963-adb3-7befbf0dc4fb", "81c233d4-01b4-528c-8bbd-7da228443ffe"]
sense_bridges = [{term = "DEPENDENCE_FOR_BEING_VERSUS_STRICT_GROUND", from = "DEPENDENCE_FOR_BEING_VERSUS_STRICT_GROUND_1", to = "DEPENDENCE_FOR_BEING_VERSUS_STRICT_GROUND_2", statement_id = "42756c07-03cd-4b54-8ed6-ed6c1a5132aa", role = "premise"}]
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Induct on derivable strict ground restricted to the finite label image over the chosen effect"
meaning = "Each per se predecessor remains in the same ancestral cone and moves strictly down among its labels by alignment and the selected consistent theory. Strict ground on this finite label set is transitive and irreflexive, hence well-founded. Induction yields accessibility of the effect for the original cause relation. The premises concern the same labels throughout."
