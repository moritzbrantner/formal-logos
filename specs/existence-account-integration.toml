conclusion = "Same actual concrete reality-profile bearer is necessarily underived"
strong_version_needed = { "2a9378b4-3dad-591b-a88e-1907a79f1fa5" = "Kept only because the frozen theorem of this argument states it as a hypothesis; the weaker sibling 500c6e18-a6c7-4144-ab6b-b4851a664792 suffices for this conclusion. That sibling replaces lifting by the two registered weak versions, no contingent ground of the necessary (96d25c42) and no novel necessary support (bd983df2), together and without actual reflexivity: the identification of the necessary supporter with the actual exemplar supplies its actual existence. Neither weak version suffices alone given the sibling's other inputs (omission certificate 78bf1f68); the contingent-source and non-actual-edge models show strictness of each registered pair only. Scope of weaker: lifting implies each bridge (205b94d3, 8b104085), but given the other five inputs the two bundles are interderivable (vacuously: any edge into a necessary target is contradictory there), and no certificate shows the conjunction strictly weaker than lifting on its own; the gain is in how well-supported each premise is, not in total bundle strength. The other five hypotheses stay explicit. This establishes neither bridge nor any other premise." }
rule = "Rigid profile identity and well-founded support excludes a self predecessor"
meaning = "Preserve the actual profile exemplar through accessible-world existence. A putative supporter lifts to an actual necessary predecessor; the separately OPEN Kant necessity-to-most-real premise and numerical uniqueness identify it with that same exemplar, contradicting well-founded actual support. No excluded middle or reflexive frame axiom is needed. Support is the supplied relation, not automatically efficient cause or adequate explanation. Rejection of Kant identification withdraws this particular same-witness route, not every cosmological argument. See docs/notes/conceptual-existence-boundary.md."

