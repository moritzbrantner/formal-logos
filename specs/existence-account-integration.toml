conclusion = "b19ffd92-01bd-5c0b-9643-e7407137ea5e"
rule = "Numerical identity substitution preserving the actual concrete witness"
meaning = "Conditional cross-family adapter: at each accessible world choose its existing profile exemplar and use candidate-wide uniqueness of the SAME rigid profile to identify it with the actual concrete exemplar. This derives de re existence rather than exchanging quantifiers without a bridge. The actual, de dicto and uniqueness commitments remain OPEN; no ontological possibility, efficient causation or GOD_4 is supplied. See docs/notes/conceptual-existence-boundary.md."

[[argument]]
