axioms = []
rule = "Composition of the registered deiFiliusRootUnified without its LORD_2 sense bridge, on primitives whose lord field is LORD_2, then the restricted willing premise and the LORD_3 sense bridge at the same witness"
meaning = "The registered unified Dei Filius root composition (deiFiliusRootUnified) is applied with every input except 'Whatever is LORD_2 is LORD_1', on the primitives that agree with the given ones except that their lord field is LORD_2; that bridge then holds trivially and nothing about the given lord primitive is used. Its root n is the same witness: n is GOD_4, has will and is LORD_2, so n causes the being of every other being in act as to being. For each such other being that has intellect, the restricted willing premise gives a good of its own that n wills to it. So n is LORD_3, and the LORD_3 sense bridge gives n LORD_1. Every other conjunct is carried over. The senses are not identified: each passage is one listed sense-bridge premise. Joint satisfiability of this whole premise bundle is witnessed by the root model of this batch (on the unified route's root model, with a permissive willing relation). LORD_1 is dominion over everything else; the route makes no claim about a jurisdiction to impose moral obligations. Conditional consequence only; no premise is established."

[[argument]]
id = "Controls for the typed LORD_3 reading, checked"
theorem = "controls"
premises = []
conclusion = "Controls for the typed LORD_3 reading and the intellectual-recipient premise"
axioms = []
sense_mixing_control = true
rule = "Explicit two-being interpretations, checked by unfolding"
meaning = "Nonvacuity: the restricted willing premise and the LORD_3 bridge hold and a being is LORD_3 and LORD_1. Strictness: the LORD_3 bridge holds where the LORD_2 bridge fails (a cause and governor of all that wills no good to an existing intellectual creature is not LORD_1); the restricted willing premise holds, with the coextension and the strong (exclusive) ordered-love variant 1dd68893, where the #1732 willing result's conclusion and CausalExistenceWilling fail. Necessity in these models: without willing, a cause and governor of all is not LORD_3. Sense mixing fails without the sense bridge: a being can be LORD_3 and not LORD_1. Model-witnessed facts about these interpretations only; they show where each premise is needed, not that any premise is false."

[[argument]]
id = "Joint-satisfiability model of the LORD_3 Dei Filius root route, checked"
theorem = "rootModel"
premises = []
conclusion = "Joint-satisfiability model of the LORD_3 Dei Filius root route"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Reuse of the checked unified root model; the LORD_3 bridge from its LORD_2 bridge by the strength order; the restricted willing premise on the all-true act dictionary"
meaning = "Given excluded middle, the unified route's root model satisfies its whole bundle and its root has every Dei Filius attribute (DeiFiliusUnifiedRoute controls, which permit the three Mathlib axioms). Its bundle contains 'Whatever is LORD_2 is LORD_1', which entails 'Whatever is LORD_3 is LORD_1'; with a permissive willing relation and its all-true goodness dictionary the restricted willing premise holds; recipient is an intellectual being other than the root. So the LORD_3 route's bundle is jointly satisfiable in this interpretation. Model-witnessed facts only; the permissive willing relation does not discriminate recipient-directed willing."

