# #1733 (integration group 8): the moral-authority investigation's divine
# endpoint. LORD_3 types one ground the natural-law reply gives for authority
# against the bare-creator objection: the cause and governor of all also wills
# some good of their own to every other intellectual being. The LORD_3 sense
# bridge is strictly weaker than the registered LORD_2 bridge; its restricted
# willing premise follows from the #1732 result DivineWillsGoodForAllExisting
# (c691e3d0) and from CausalExistenceWilling (a94c5dfc) with the q.5 a.1
# coextension; both supports go through a94c5dfc. The premise itself is
# consistent with the strong (exclusive) ordered-love variant 1dd68893;
# a94c5dfc is not (the weak, ad-3-faithful reading is compatible with it).
# The unified Dei Filius root is re-derived through it. Analyst formulations,
# attribution deferred. Dominion (LORD_1) is not directed moral jurisdiction;
# that transition stays unbuilt (docs/notes/natural-goodness-function-and-authority.md).

[batch]
vocab = "TruthCore.Causality.DeiFiliusBenevolentLord"
results = "TruthCore.Results.Causality.DeiFiliusBenevolentLord"

# ---------------------------------------------------------------- statements

[[statement]]
id = "GOD_4 wills some GOOD_4 to every distinct intellectual being whose esse it causes"
lean = "IntellectualRecipientExistenceWilling"
paraphrase = "Open application bridge, analyst formulation, unattributed. For every GOD_4 g with will (HAS_WILL_1) and every x distinct from g, in act as to being and having intellect (HAS_INTELLECT_1), whose being g causes: there is a respect r in which x is good and g wills that good to x (recipient-directed willing, CREATURE_WILLING_1). The respect is existential. It says nothing about non-intellectual effects, about the divine self-case, about every good of x, about the degree or mode of willing, or that an act of willing efficiently causes x. It follows from 'Every GOD_4 wills some GOOD_4 to every being in act in esse' (c691e3d0) as sole premise, and from CausalExistenceWilling (a94c5dfc) with the q.5 a.1 coextension (00e962ae), without the self-case premise. Both verified supports go through a94c5dfc: c691e3d0's only derivation (argument 12865cf3) uses it. The premise itself is consistent with the strong (exclusive) ordered-love variant 1dd68893, an unattributed analyst strengthening of ad 3 (with rational read as having intellect), on a non-rational effect where CausalExistenceWilling fails (Control.Controls part 5); but a94c5dfc is incompatible with 1dd68893 on distinct non-rational caused effects, so if that strong variant holds and non-rational creatures exist, this premise has no verified derivation and stands only as a direct assumption. The conflict with a94c5dfc holds for that strong variant only; the weak, ad-3-faithful reading 7f6a2e91 (ordered willing without the exclusion of recipient-directed willing) is compatible with a94c5dfc (checked witness 5d93ac09), so neither verified derivation of this premise is excluded under it. The natural-diffusion / foreseen-collateral alternative recorded for a94c5dfc still applies to intellectual effects: this restriction removes the non-rational conflict only."
definitions = ["88f9f6e8-997b-5f7d-afa1-c501954c3807", "7c64b499-6dba-5e03-bdf3-5acea95d8836", "DEF-HAS-INTELLECT", "4c8f0e6b-7ef6-5be5-851c-cdf4f0301546", "08b826db-2d9c-48e5-b69c-d4ac54088518"]
disambiguations = ["dd7ff973-0e54-4c93-b9c5-b002cac2b256", "DISAMB-IN-ACT", "DISAMB-INTELLECT-AND-SENSE-COGNITION"]

[[statement]]
id = "Whatever is LORD_3 is LORD_1"
lean = "BenevolentCauseAndGovernorOfAllIsLord"
paraphrase = "Open sense bridge, analyst formulation, unattributed. Whatever causes the being of every other being in act as to being, governs every such being and wills some good of its own to every other intellectual being in act as to being (LORD_3) has dominion over everything else (LORD_1, the primitive Primitives.IsLord: authority to dispose of what is subject to it). It carries what LORD_3 leaves untyped: the passage from causal, directive and benevolent volitional relations to authority. Motivation, not attribution: the natural-law reply to the objection that creation or power alone gives no rightful authority, which ties authority to care for the good of those governed. Strictly weaker than 'Whatever is LORD_2 is LORD_1' (eb6611a5; its antecedent adds the willing conjunct; Control.Controls part 2: a cause and governor of all that wills no good to an existing intellectual creature satisfies this bridge vacuously and falsifies the LORD_2 bridge). It does not say that governance is directed to the good willed, that the being is just or wise beyond having intellect, or that dominion includes a jurisdiction to impose moral obligations on rational creatures."
definitions = ["9dcfcb4e-bf60-4322-b687-440df1f2ad29", "59350e3b-1b76-45cd-b9fd-548f3f4658b5", "08b826db-2d9c-48e5-b69c-d4ac54088518"]
disambiguations = ["aa1de96a-e0d2-4739-a34f-9b98f1034a34", "DISAMB-IN-ACT", "dd7ff973-0e54-4c93-b9c5-b002cac2b256"]

[[statement]]
id = "Controls for the typed LORD_3 reading and the intellectual-recipient premise"
lean = "Control.Controls"
paraphrase = "Closed controls on two two-being interpretations (Bool; true is GOD_4, causes the being of and governs false). With false intellectual: (1) nonvacuity: with willing and true LORD_1, the restricted willing premise and 'Whatever is LORD_3 is LORD_1' hold and true is LORD_3 and LORD_1; (2) strictness: with no willing and nothing LORD_1, 'Whatever is LORD_3 is LORD_1' holds and 'Whatever is LORD_2 is LORD_1' fails; (3) sense mixing: with willing and nothing LORD_1, true is LORD_3 and not LORD_1; (4) necessity of willing: with no willing, true is LORD_2 and not LORD_3. With only true intellectual and no willing: (5) the restricted willing premise, the q.5 a.1 coextension and the strong (exclusive) ordered-love variant 1dd68893, an unattributed analyst strengthening of ad 3 (rational read as having intellect), hold, while 'Every GOD_4 wills some GOOD_4 to every being in act in esse' and CausalExistenceWilling fail. Statements about these interpretations only."
definitions = ["9dcfcb4e-bf60-4322-b687-440df1f2ad29", "c8e458bd-3b8a-4e10-8e2d-43d1c1912c63", "59350e3b-1b76-45cd-b9fd-548f3f4658b5", "08b826db-2d9c-48e5-b69c-d4ac54088518", "1ca75ad2-e6f6-492a-9fcc-19eebfc8d3aa"]
disambiguations = ["aa1de96a-e0d2-4739-a34f-9b98f1034a34", "dd7ff973-0e54-4c93-b9c5-b002cac2b256"]

[[statement]]
id = "Joint-satisfiability model of the LORD_3 Dei Filius root route"
lean = "Control.RootModel"
paraphrase = "On the unified Dei Filius route's root model (four roles; source the selected root, recipient a second intellectual being), given excluded middle: the unified root bundle holds, the restricted willing premise and 'Whatever is LORD_3 is LORD_1' hold with a permissive willing relation, recipient is an intellectual being other than source, and the selected root has every Dei Filius attribute. Hence every premise of the LORD_3 root route holds together in this interpretation. The willing relation is permissive, so the model does not discriminate recipient-directed from other willing. A statement about this interpretation only."
definitions = ["9dcfcb4e-bf60-4322-b687-440df1f2ad29", "08b826db-2d9c-48e5-b69c-d4ac54088518"]
disambiguations = ["aa1de96a-e0d2-4739-a34f-9b98f1034a34"]

