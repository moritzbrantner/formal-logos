# #1887, B6 crux: does "existence never belongs to an essence" apply when a
# being's essence is identical with its act of being (esse = essence)?
# Senses of "existence belongs to an essence" (EXISTENCE_IN_ESSENCE: conceptual
# containment, essential truth, act identity, essence membership, consequential
# essential truth); the factorization of the unconditional bridge 565ccd6c into
# the act-fact link and exercise in the nature; the Kant-adequacy route to the
# "possibly absent" verdict; laws and models. Analyst formulations, attribution
# deferred; texts read are listed in docs/notes/existence-in-essence-identity.md.

[batch]
vocab = "TruthCore.Ontology.ExistenceInEssence"
results = "TruthCore.Results.Ontology.ExistenceInEssence"

[[statement]]
id = "A being's act of being is exercised at exactly the points where it exists"
lean = "EsseExercisedWhereExists"
paraphrase = "OPEN (the act-fact link), analyst formulation: for every point v and being x, x's represented esse is in act at v (its act of being is exercised there, WORLD_RELATIVE_EXISTENCE_METAPHYSICAL_ESSE_NECESSITY_6) if and only if x exists at v (the world-relative existence fact, _1). The explicit passage from esse as act to existence as fact; ST I q.3 a.4 ad 2 (read) distinguishes 'to be' as the act of essence from 'to be' as the composition of a proposition. Satisfiable with each essentialist bundle, with distinct esse principles for distinct beings (controls, models kantAquinas and conditionalIdentity); no substantive objection to it is identified among views that accept an act of being. The quantifier view of existence, which recognizes no act of being beyond instantiation, either leaves the left side empty (then the link is false wherever x exists) or deflates 'exercised' to 'exists' (then the link holds trivially and exercise in the nature collapses into 565ccd6c)."
definitions = ["25d4df96-f18b-4477-a7ce-11fa8c17cd83", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-ESSE"]
disambiguations = ["DISAMB-EXISTENCE-ESSE-SUPPORT"]

[[statement]]
id = "Whatever has represented esse equal to its essence has the exercise of its esse in its nature"
lean = "IdentityPutsExerciseInNature"
paraphrase = "OPEN (exercise in the nature), analyst formulation: for every being x whose represented esse equals its represented essence (EXISTENCE_IN_ESSENCE_3, act identity, ESSENCE_3 maps), it lies in the nature of x (ESSENCE_5) that x's act of being is exercised, unconditionally: the proposition true exactly at the points where that act is exercised. Given the act-fact link it is equivalent to the unconditional bridge 565ccd6c (the factorization argument and controls, law 15): the factorization restates the bridge at the level of the act, separating out the act-fact link; it does not narrow its content. Act identity alone does not give it (controls, conditionalIdentity: identity with only the conditional exercise in the nature, and the being contingent). Existence-conditional essences, the act-fact link and it are jointly inconsistent with an identity being whose absence is representable (controls, law 6); the law does not say which to reject."
definitions = ["25d4df96-f18b-4477-a7ce-11fa8c17cd83", "b2e22524-357f-47b5-814f-0a0e59f0d612", "7cf63236-9c12-41bc-bf20-6fbce7a121db", "183b48d2-1753-583d-aef9-4199cff86231", "DEF-ESSE"]
disambiguations = ["DISAMB-ESSENCE", "f704b7ca-b455-4da7-a757-b0564fe76b3b", "DISAMB-EXISTENCE-ESSE-SUPPORT"]

[[statement]]
id = "No determination contained in a being's concept entails that being's existence"
lean = "ExistenceNotConceptual"
paraphrase = "OPEN (Kant's thesis, conceptual form; analyst formulation, attribution deferred): for the supplied concept relation (a value of its own type, ConceptRelation), every being x and every determination phi contained in the concept of x, phi does not entail x's existence over the represented points: some represented point satisfies phi and lacks x. Stronger than 'existence is not a real predicate': it also excludes any content that entails existence, such as an unconditional 'x is omnipotent' true only where x exists. It excludes conceptual containment of existence (EXISTENCE_IN_ESSENCE_1) for every being (controls, law 1). It concerns concepts, not natures: it says nothing about essential truths unless the concept is adequate to the nature, and it yields only a representable absence; a represented-to-accessible bridge is needed for an accessible one, and identifying the represented space with real possibility suffices (controls, laws 2-5). Navigation: Kant, Critique of Pure Reason, Transcendental Dialectic, Book II, ch. III, sect. IV ('Whatever be the content of our conception of an object, it is necessary to go beyond it, if we wish to predicate existence of the object', read in the Meiklejohn translation)."
definitions = ["16c40fbe-8a86-464a-a868-384103e11304", "90353211-7e2e-47cb-bbab-3e0bef36d077", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["f704b7ca-b455-4da7-a757-b0564fe76b3b"]

[[statement]]
id = "Whatever lies in a being's nature is contained in the supplied concept of it"
lean = "ConceptAdequateToEssence"
paraphrase = "OPEN (concept adequacy), analyst formulation: for every being x and world-proposition phi, if it lies in the nature of x that phi (ESSENCE_5), then phi is a determination contained in the supplied concept of x. True by construction of a concept adequate to the nature; false of a concept formed only from a being's effects whenever its nature has content those effects do not give (controls, kantAquinas). The bridge by which Kant's conceptual thesis reaches essential truth (controls, laws 2-3)."
definitions = ["16c40fbe-8a86-464a-a868-384103e11304", "7cf63236-9c12-41bc-bf20-6fbce7a121db"]
disambiguations = ["f704b7ca-b455-4da7-a757-b0564fe76b3b"]

[[statement]]
id = "Existence in essence at an esse-essence identity: laws and models"
lean = "Model.Controls"
paraphrase = "Premise-free laws and finite models (structural surrogates, not metaphysical possibility). Laws: (1) Kant's conceptual thesis excludes conceptual containment of existence; (2) with concept adequacy it excludes, for every being, any essential truth entailing its existence; (3) with adequacy and the unconditional bridge 565ccd6c it excludes every esse-essence identity; (4) with the identity-to-concept bridge it excludes every esse-essence identity; (5) it yields only representable absence; identifying the represented space with real possibility (access from w to every point) is one sufficient bridge, under which a being existing at w with a nonempty concept is contingent (kantAquinas shows some bridge is needed; weaker ones also suffice); (6) existence-conditional essences, the act-fact link and exercise in the nature are jointly inconsistent with an identity being whose absence is representable (which member to reject is not settled); (7) under the act-fact link, for every identity being x, the world-proposition 'if x exists, x's essence principle is exercised' is true at every point (the essence relation does not occur: nothing is said about what lies in a nature); (8) constitutive essential existence implies the consequential form; (9) essence grounds necessity: a nature entailing existence gives necessity; (10) a contingent being's nature entails no existence; (11) within the essentialist framework (excluded middle, essence grounds necessity, the essentialist account of possibility, no other nature requiring x) an actual x's nature entails its existence if and only if x is necessary; (12) serious-actualist essences (every essential truth an unconditional predication) with essence grounds necessity and a nonempty nature give necessity; (13) conditional conceptual necessity (the analyst form of Kant's triangle paragraph: a concept yields only 'if x is posited, ...') with concept adequacy gives existence-conditional essences; (14) conditional conceptual necessity gives Kant's thesis at every being whose absence is representable; (15) under the act-fact link the unconditional bridge 565ccd6c gives exercise in the nature (the converse of the factorization); (16) existence-conditional essences give, for the concept adequate to the nature, conditional conceptual necessity and concept adequacy (the converse of law 13): such a concept exists exactly when the nature is existence-conditional. Models, with distinct esse principles for distinct beings: kantAquinas (a necessary foundational identity being and a second being caused by it in its esse, with distinct esse and essence, and contingent; the act-fact link, exercise in the nature, the unconditional bridge and constitutive essential existence hold; for a concept formed from the first being's effects (only the coexistence conditional 'if the second exists, the first exists', not the frame's causation) Kant's thesis and conditional conceptual necessity hold and neither adequacy nor the identity-to-concept bridge holds; its absence is representable but not really possible; for the concept adequate to its nature adequacy and the identity-to-concept bridge hold and Kant's thesis and conditional conceptual necessity fail), conditionalIdentity (a contingent foundational identity being with the act-fact link, only conditional exercise in its nature, existence-conditional essences, the essentialist account, Kant's thesis, conditional conceptual necessity and adequacy for the concept adequate to its nature), four omission models of the Kant-adequacy argument and two of the factorization of 565ccd6c."
definitions = ["16c40fbe-8a86-464a-a868-384103e11304", "25d4df96-f18b-4477-a7ce-11fa8c17cd83", "90353211-7e2e-47cb-bbab-3e0bef36d077", "1fda7b2c-4411-4ffd-8fa2-78e30b6aedef", "b2e22524-357f-47b5-814f-0a0e59f0d612", "316780ef-70da-498f-8893-317cb35ca80b", "7cf63236-9c12-41bc-bf20-6fbce7a121db", "54bdb2f0-aa66-489f-ae06-174dd668d424", "7fcf846e-d0ef-400e-89c0-7c82b94edde7", "183b48d2-1753-583d-aef9-4199cff86231", "DEF-ESSE", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-KANT-MODAL-NECESSITY", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["f704b7ca-b455-4da7-a757-b0564fe76b3b", "DISAMB-ESSENCE", "DISAMB-EXISTENCE-ESSE-SUPPORT", "DISAMB-KANT-CONTINGENCY"]

[[argument]]
id = "Esse = essence puts existence in the nature, from exercise in it and the act-fact link"
theorem = "exerciseInNatureGivesEssentialExistence"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = ["A being's act of being is exercised at exactly the points where it exists", "Whatever has represented esse equal to its essence has the exercise of its esse in its nature"]
conclusion = "565ccd6c-0036-4613-8595-f6f03d273a0d"
sense_bridges = [{term = "ESSENCE", from = "ESSENCE_3", to = "ESSENCE_5", statement_id = "Whatever has represented esse equal to its essence has the exercise of its esse in its nature"}, {term = "WORLD_RELATIVE_EXISTENCE_METAPHYSICAL_ESSE_NECESSITY", from = "WORLD_RELATIVE_EXISTENCE_METAPHYSICAL_ESSE_NECESSITY_6", to = "WORLD_RELATIVE_EXISTENCE_METAPHYSICAL_ESSE_NECESSITY_1", statement_id = "A being's act of being is exercised at exactly the points where it exists"}]
rule = "Rewrite the essential exercise proposition by the act-fact link"
meaning = "For a being x with represented esse equal to its essence, exercise in the nature puts into x's nature the proposition that x's act of being is exercised; the act-fact link makes that proposition true at exactly the points where x exists, so (by extensionality of world-propositions) it is the proposition that x exists. So x's existence lies in its nature: the unconditional bridge. The passage from esse as act (_6) to existence as fact (_1) is the explicit act-fact premise; the passage from the q.3 a.4 essence (ESSENCE_3) to the Finean essential truth (ESSENCE_5) is the explicit exercise-in-the-nature premise."
description = "Factorization of the unconditional bridge 565ccd6c (the ESSENCE_3 to ESSENCE_5 bridge of the essentialist B6 route) into the act-fact link and exercise in the nature. The link is satisfiable with each essentialist bundle (controls, models kantAquinas and conditionalIdentity, with distinct esse principles), and no substantive objection to it is identified among views that accept an act of being. Given the link, exercise in the nature is equivalent to 565ccd6c (controls, law 15): the factorization restates the bridge at the level of the act and separates out the link; it does not narrow the bridge's content. Existence-conditional essences, the link and exercise in the nature are jointly inconsistent at a representably absent identity being (controls, law 6). Not a transcription: neither premise mentions existence in a nature. Uses propositional and function extensionality. Each premise is needed (controls, factorization omissions 1-2). Establishes no premise."

[[argument]]
id = "Foundational beings are contingent at w, from Kant's thesis and concept adequacy"
theorem = "kantAdequacyFoundationalContingent"
premises = ["No determination contained in a being's concept entails that being's existence", "Whatever lies in a being's nature is contained in the supplied concept of it", "9d8a8d2e-23ff-4b74-8a06-6cd9abd7ccb8", "38200db5-a320-41c1-8eb6-ea4a6409ceb9"]
conclusion = "fe8c3a1d-8bbd-4e3e-be46-170e75bb73db"
rule = "No essential exclusion, then the essentialist account of possibility"
meaning = "For a foundational f, no essential truth entails its existence: one of f's own would be contained in the concept by adequacy, and Kant's thesis says no determination in a concept entails its object's existence; no other being's does (unrequired by others). The essentialist account then makes f absent at some accessible world. Esse = essence plays no role. Constructive."
description = "A second support bundle for the 'possibly absent' verdict, beside the existence-conditional one (872a3832): Kant's conceptual thesis extended, by concept adequacy, to a concept adequate to the nature replaces existence-conditional essences and the representability premise. Not a transcription: no premise mentions contingency. Establishes no premise. Each premise is needed (controls, Kant-adequacy omissions 1-4); nonvacuous (controls, conditionalIdentity). The two concept premises must hold of one concept relation: adequacy fails for a concept formed only from a being's effects (controls, kantAquinas), so the argument needs Kant's thesis to govern a concept adequate to the nature, which is the disputed extension at an esse-essence identity (docs/notes/existence-in-essence-identity.md)."

