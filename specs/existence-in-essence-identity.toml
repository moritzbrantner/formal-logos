description = "Premise-free laws and models for the #1887 existence-in-essence slice. Sense-mixing control: the laws relate EXISTENCE_IN_ESSENCE_1, _2, _3 and _5, ESSENCE_3 and ESSENCE_5, and WORLD_RELATIVE_EXISTENCE_METAPHYSICAL_ESSE_NECESSITY_1 and _6 without a bridge premise. Law 5 uses classical reasoning. Establishes no premise."
