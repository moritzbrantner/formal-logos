[[statement]]
id = "Perfection of GOD_4 in the single represented actuality field"
lean = "PerfectInFrame"
paraphrase = "For every named God g and each x and represented respect r, if x is actual in r then g is actual in the very same r, using one grades-frame field at both occurrences. Its formal or eminent interpretation requires independent warrant."
definitions = ["5f851204-5991-5e16-87f1-e8b3ed729708", "5cbd5a0a-9055-4b69-af39-bd0bff1279fd", "88f9f6e8-997b-5f7d-afa1-c501954c3807"]

[[argument]]
id = "Perfection of GOD_4 from its gift of esse to each other carrier"
theorem = "perfectFromGodCause"
premises = ["86d02b69-87eb-5594-9958-ccaa5fe6b685", "64498e7e-7f10-54a0-9ec0-c65e6076de1f", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410"]
conclusion = "Perfection of GOD_4 in the single represented actuality field"
rule = "Distinguish the bearer itself from its distinct effects"
meaning = "Self-identity transports actuality directly. For every other x actual at r the carrier-wide converse gives the esse edge and the preexistence rule gives actuality in the same r at g."

[[argument]]
id = "Supreme goodness of GOD_4 from its gift of esse to each other carrier"
theorem = "goodFromGodCause"
premises = ["86d02b69-87eb-5594-9958-ccaa5fe6b685", "4c79298d-ee09-5e99-9ced-1be92c19b4cc", "00e962ae-f109-55f7-a7fd-f107ce0dea6b", "f8ba2429-b4f1-5712-a4d3-798213963d34"]
conclusion = "e0dae79f-c042-5a08-a148-725d0468df91"
rule = "Use actuality at esse and transfer along the giver’s own edge"
meaning = "Only the actuality conjunct of maximality supplies the bearer’s goodness at esse. Every other represented actuality is caused under the explicit transfer rule."

[[argument]]
id = "Unity of GOD_4 from convergence on the actual universal source"
theorem = "oneFromSource"
premises = ["0881e859-c4c3-53ff-9bec-b61294e12d51", "4c79298d-ee09-5e99-9ced-1be92c19b4cc", "d5a94eb1-72d2-53e0-9a52-9787b5b61a8d", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410"]
conclusion = "33b18ae7-4578-54bc-a2b5-edce99b21fc2"
rule = "Identify both named candidates with the same actual source"
meaning = "If a God were distinct from the universal source, it would receive esse and be outranked, contradicting its own maximality. Every God equals the same source."

[[argument]]
id = "Perfection of GOD_4 at the actual universal source"
theorem = "perfectFromSource"
premises = ["0881e859-c4c3-53ff-9bec-b61294e12d51", "4c79298d-ee09-5e99-9ced-1be92c19b4cc", "d5a94eb1-72d2-53e0-9a52-9787b5b61a8d", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410", "7067553d-cad9-5d79-b6b2-912e35051530", "64498e7e-7f10-54a0-9ec0-c65e6076de1f"]
conclusion = "Perfection of GOD_4 in the single represented actuality field"
rule = "Transfer actualities from the distinct actual recipients of the identified source"
meaning = "Actuality in a respect entails actuality at esse by the explicit premise. Convergence fixes the same God as the universal source, and effect-perfection preexistence supplies its represented actuality."

[[argument]]
id = "Supreme goodness of GOD_4 at the actual universal source"
theorem = "goodFromSource"
premises = ["0881e859-c4c3-53ff-9bec-b61294e12d51", "4c79298d-ee09-5e99-9ced-1be92c19b4cc", "d5a94eb1-72d2-53e0-9a52-9787b5b61a8d", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410", "7067553d-cad9-5d79-b6b2-912e35051530", "00e962ae-f109-55f7-a7fd-f107ce0dea6b", "b26c10a0-983d-5a88-aa03-cc601bc1ddc6"]
conclusion = "e0dae79f-c042-5a08-a148-725d0468df91"
rule = "Transfer perfections in just the universal-source distinct-effect case"
meaning = "Convergence identifies the bearer. Its esse actuality gives goodness; universality over actual recipients and actuality-to-being supply the distinct causal edges required by the restricted transfer rule."

[[argument]]
id = "Classical attribute field from nine attributes of every named GOD_4"
theorem = "fromNine"
transcription = "assembly"
premises = ["818a73cc-249d-5f9b-9c34-aee1f2cbf333", "9f4e5f17-e808-5c58-9eac-faacbb5c3a56", "Perfection of GOD_4 in the single represented actuality field", "e0dae79f-c042-5a08-a148-725d0468df91", "33b18ae7-4578-54bc-a2b5-edce99b21fc2", "b0132989-4810-58d9-8aa3-1c9c7a0dfa28", "fb3802a8-d04c-5486-95a5-b7ab57857396", "5bec93b3-9950-5e46-b243-cf5a4658b929", "29818edd-9f5a-5414-baa2-9a7d0c8abf18", "66aecdd7-ea4e-55c6-9377-10db08893854"]
conclusion = "d5ac1620-1de5-5cd8-862e-cfdfd6d8b8a5"
rule = "Instantiate the nine attribute conditionals on a single bearer"
meaning = "For each g satisfying the signature’s IsGod, apply all nine attribute premises to g itself and the supplied sufficiency implication to that conjunction."

[[argument]]
id = "All nine classical attributes of GOD_4 via the actual maximal source"
theorem = "fromSource"
strong_version_needed = { "d7741cdc-881b-5bda-85ce-d70223162f78" = "The proof uses the second conjunct (And.right): a being whose esse differs from its essence is composite (in GodIsInfinite.godIsInfinite), to exclude a distinct esse in a being known not to be composite. The weak version MatterFormIsComposite (6a9199b7) is only the matter–form conjunct." }
