conclusion = "d5ac1620-1de5-5cd8-862e-cfdfd6d8b8a5"
rule = "Compose the identified source, six remaining derivations and same-bearer naming"
meaning = "The actual source supplies unity, perfection and goodness. The remaining six use the retained stage-two readings on the same signature and independent potency relation. Every bearer satisfying IsGod receives the primitive attribute field under the one-way nine-attribute sufficiency premise."

[[statement]]
id = "Finite source and attribute substitution controls"
lean = "Control.Checks"
paraphrase = "One named source satisfies the full forward naming antecedent in the inhabited two-being assignment. Finite scope separators and single nonlogical omissions test the two strong attribute inferences and the actual-recipient actuality-to-being step."

[[argument]]
id = "Finite source and attribute substitutions checked"
theorem = "controls"
premises = []
conclusion = "Finite source and attribute substitution controls"
rule = "Evaluate the finite dictionaries with constructive Boolean quantification"
meaning = "The checked conjunction records nonvacuous naming, both directions separating general genus causation and carrier-wide God causation, and failures under the specified omissions. The empty relation makes several causal antecedents vacuous in the explicit omission models."

