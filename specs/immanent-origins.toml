[batch]
vocab = "TruthCore.Case.Catholicism.ImmanentOrigins"
results = "TruthCore.Results.Case.Catholicism.ImmanentOrigins"
definitions = ["a02b41fb-2bf3-4109-898c-b2aca8aaeaec"]

[[statement]]
id = "Two immanent orders with designated expression and love terms"
lean = "TwoModes"
paraphrase = "The designated source expresses its Word-role and inclines toward the designated Love-role in the role-order vocabulary. The interpretation assigns distinct kinds of personal origin to expression and inclination. No personal realization or personal distinction follows from these data alone."

[[statement]]
id = "Personal realization of each designated immanent role"
lean = "Subsistence"
paraphrase = "OPEN personal-subsistence bridge. Each selected role, source, Word and Love, personally subsists in a bearer of the same numerical divine act of being. This permits coincident bearers. A role's being present in someone's act of thought or volition does not suffice."

[[statement]]
id = "Immanent orders lift to personally opposed origins"
lean = "PersonalOrder"
paraphrase = "OPEN bridge. Every expression and inclination edge between personally realized roles transports to the corresponding personal generation or spiration edge of their realizers. Every personal origin is irreflexive at bearers of the selected divine act of being. Self-knowledge and self-love are not instances of that prohibition."

[[statement]]
id = "An additional ground distinguishes personal Word and Love reception"
lean = "Separation"
paraphrase = "OPEN disjunction. Either the Word-role is active in the inclination toward the Love-role (personal origin follows only with the separate lifting bridge), or the same personal bearer cannot receive both origin modes from divine bearers. Together with lifting, the first condition adds Word participation to the inclusive claim of origin from the Father. The second needs an independent account of constitutive modes."

[[statement]]
id = "Three distinguished personal origin candidates in one divine act of being"
lean = "AtLeast"
paraphrase = "Three pairwise distinct persons subsist as the designated source, Word and Love in the same act-of-being token. The source generates the Word and spirates the Love in distinct origin modes. Other persons in that same act are still allowed. All identifications with divine reality and Creed referents remain open."

[[statement]]
id = "Inventory of unoriginated and receptive personal origins"
lean = "Inventory"
paraphrase = "OPEN upper-bound conditions. Every source-role realizer is personally underived. Every person in this act of being is underived or receives the generation or spiration mode from a bearer of the act. There is at most one underived bearer and at most one recipient in each of those modes. Underived ranges over all modes of origin from same-act bearers."

[[statement]]
id = "Exactly three distinguished personal origin candidates in one divine act of being"
lean = "Exactly"
paraphrase = "A source, Word and Love satisfy the same opposed personal origin pattern as the three-candidate claim, and every person with that very act-of-being token is one of these three. The exact roster is relative to the profile. The whole Creed articles remain separate propositions."

[[statement]]
id = "Finite interpretations of immanent role realization and personal origin inventory"
lean = "Controls"
paraphrase = "One bearer supports correct grounded self-content and willing its own good with thin love, but only the source role subsists personally. Two bearers support both opposed origin modes and personal role realization with coincident Word and Love. Two three-bearer profiles witness the full conditions, using Word participation or incompatible passive receptions. A fourth bearer can be generated by the Word while the rest of the inventory holds. These finite interpretations test the stated interfaces."

[[statement]]
id = "Injective act-of-being assignment collapses personal origin candidates"
lean = "TokenCollapse"
paraphrase = "In any profile where equality of act-of-being tokens entails equality of personal bearers, the three-candidate claim fails. This rules out a specific reading of numerical identity and leaves the metaphysics of subsistent relations open."

[[argument]]
id = "Derive three personal candidates from subsistent opposed immanent origins"
theorem = "threeCandidates"
premises = ["Two immanent orders with designated expression and love terms", "Personal realization of each designated immanent role", "Immanent orders lift to personally opposed origins", "An additional ground distinguishes personal Word and Love reception"]
conclusion = "Three distinguished personal origin candidates in one divine act of being"
axioms = []
rule = "Instantiate the personal realizers and exclude pairwise identity by irreflexivity or incompatibility of incoming modes"
meaning = "The opposed source and each receiver are distinct. The receivers differ either because the Word is an active origin of Love or because one person cannot receive both selected modes. All premises use the same concrete Profile, roles and numerical act. No unconditioned inference from knowing and willing or historical identification follows."

[[argument]]
id = "Exhaust the divine personal candidates by classifications of origin"
theorem = "exhaustPersons"
premises = ["Three distinguished personal origin candidates in one divine act of being", "Inventory of unoriginated and receptive personal origins"]
conclusion = "Exactly three distinguished personal origin candidates in one divine act of being"
axioms = []
rule = "Classify an arbitrary same-act bearer and identify it by underived or incoming-mode uniqueness"
meaning = "The root, generated Word and spirated Love supply representatives of all three classes. The explicit uniqueness principles exclude another recipient, including an iterated personal procession of an existing kind."

[[argument]]
id = "Restrict the exhaustive personal roster to its three origin candidates"
theorem = "restrictExact"
premises = ["Exactly three distinguished personal origin candidates in one divine act of being"]
conclusion = "Three distinguished personal origin candidates in one divine act of being"
axioms = []
weakening = true
transcription = "single_application"
rule = "Forget the exhaustiveness clause"
meaning = "Strength comparison only. The iterated-origin control witnesses failure of the converse."

[[relation]]
id = "Exhaustive roster strengthens three personal origin candidates"
subject_kind = "statement"
subject_id = "Exactly three distinguished personal origin candidates in one divine act of being"
predicate = "strengthens"
object_kind = "statement"
object_id = "Three distinguished personal origin candidates in one divine act of being"
verification_result_id = "Restrict the exhaustive personal roster to its three origin candidates"
note = "The same triad remains when its exhaustiveness condition is dropped."

[[argument]]
id = "Interpret the personal origin bridges on one through four bearers"
theorem = "controls"
premises = []
conclusion = "Finite interpretations of immanent role realization and personal origin inventory"
axioms = []
rule = "Exhibit finite realizations and use the candidate witnesses or their distinctness for the cardinality controls"
meaning = "The single-bearer control populates the inherited intrinsic self-knowledge predicate and recipient-good interpretation of actual self-love on the same act-of-being witness. The two-, three- and four-bearer fixtures test the subsequent personal origins alone. A model is evidence of formal compatibility or insufficiency at the stated interpretation. It confers no metaphysical actuality or attribution."

[[argument]]
id = "Absolute identification by act of being rules out the candidate triad"
theorem = "collapse"
premises = []
conclusion = "Injective act-of-being assignment collapses personal origin candidates"
axioms = []
rule = "Use transitivity of token equality, injectivity, and the distinction of source from Word"
meaning = "Three bearers cannot each be numerically the same selected act if that identification is injective across persons. Equality of a common token under a non-injective map models the selected predication and still requires metaphysical interpretation."
