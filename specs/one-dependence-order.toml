# One dependence order (#1926 phase 3). Can the stage-one well-foundedness
# premises over different relations (actual causes of being, simple priority,
# per se efficient causes, ascent in being, actual grounding) be derived from one
# well-foundedness principle over a shared relation, through explicit open
# inclusion bridges? Analyst formulations, attribution deferred. Every proof is
# constructive and axiom-free. Nothing identifies the relations by definition
# (#1626, #1926 rigor contract 5); each passage is an existing or new OPEN
# premise. Note: docs/notes/one-dependence-order.md.

[batch]
vocab = "TruthCore.Causality.OneDependenceOrder"
results = "TruthCore.Results.Causality.OneDependenceOrder"
definitions = []
disambiguations = []

# ---------------------------------------------------------------- statements

[[statement]]
id = "Every per se ordered efficient-cause link is a PER_SE_5 actual CAUSE_2 of being"
lean = "PerSeEfficientCausesArePerSeEsseCauses"
paraphrase = "OPEN analyst bridge, attribution deferred: whenever c causes x as a caused cause (CausesAsCaused, the per se link of the secunda via's series of efficient causes, DEF 4a101a4c), c is a per se actual cause of the being of x in the q.3 a.4 profile (PerSeActualEsseCause, PER_SE_5, DEF 4bca086d): c is other than x, both are in act as to being, c causes the esse of x (CausesIn c x esse, CAUSE_2, mode unspecified, tenseless), and it does so as caused (the primitive per se link AsCaused c x). It reads the secunda via's per se series as a series of per se causes of being, the existential reading of the second way. It is not stated for accidentally ordered causes. Substantive objection on a respect-free reading of CausesAsCaused: Aquinas's own per se example in ST I q.46 a.2 ad 7 (the stone moved by the stick, moved by the hand) is a per se ordered series of causes of motion, and the hand is not a cause of the stick's being, since the stick continues to be when the hand lets go; the bridge then fails at that link. It is defensible only where the per se links are themselves causes of being."
definitions = ["4a101a4c-12de-53c8-80c6-de7a523ea9d9", "211a6432-8b8f-53ed-85e3-75173bb15b24", "4bca086d-1fa5-4b0d-bf2b-a22f3f0ac740"]
disambiguations = ["81c233d4-01b4-528c-8bbd-7da228443ffe", "00e0d443-eb39-56a3-9179-9c8852ca4a2b", "57f80020-fa6f-5b69-be58-b4cf95b7226f"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "No infinite actual esse-cause regress, from grounding well-founded on actual concreta"
theorem = "esseRegressOfActualGroundingWF"
comparator_theorems = ["esseRegressControls", "ascentLimit"]
strong_version_needed = {"82cfaf26-fc86-54ab-8328-9a7b2bdbbe21" = "The conclusion is full well-foundedness of a relation on the whole carrier, so the premise must exclude every infinite descending grounding chain among actual concreta. The weak versions do not: ConeWellFounded (1b1e3f09) constrains only the ancestor cone of one selected individual, ActualGroundingAsymmetric (39f7c63d) excludes only two-cycles, and closed-collection rootedness (aca3baa1) admits an infinite descending chain whose members also descend from a root (RootedInfiniteControl of ClosedEsseSource)."}
premises = ["82cfaf26-fc86-54ab-8328-9a7b2bdbbe21", "cb1cdea9-eb6c-578c-8008-84e0d4107fd3", "546975ef-0614-5c0a-8f49-fab2cd2a2533", "2d9807a5-ebff-45fd-972f-e241f18713d4"]
conclusion = "fd12ad3d-6729-4fa0-bb87-0121260df684"
sense_bridges = [
  { term = "NECESSARY", from = "NECESSARY_11", to = "NECESSARY_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21" },
  { term = "NONNECESSARY_VERSUS_CONTINGENT_ROOT", from = "NONNECESSARY_VERSUS_CONTINGENT_ROOT_1", to = "NONNECESSARY_VERSUS_CONTINGENT_ROOT_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21" },
  { term = "WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT", from = "WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT_1", to = "WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21" },
  { term = "WELL_FOUNDEDNESS_OF_THE_SELECTED_RELATION", from = "WELL_FOUNDEDNESS_OF_THE_SELECTED_RELATION_1", to = "WELL_FOUNDEDNESS_OF_THE_SELECTED_RELATION_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21" },
]
axioms = []
rule = "Transfer well-foundedness along a predecessor inclusion (wellFounded_of_predecessorInclusion)"
meaning = "Non-transcription conditional derivation, one profile m, one reading world w and one q.3 a.4 profile p over the same carrier of beings. If the selected grounding relation is well-founded among actual concreta at w (82cfaf26), a distinct cause of the esse of an actual concretum is an actual concrete ground of it at w (cb1cdea9), whatever is in act of esse exists at w (546975ef) and whatever has esse in re is concrete in the profile (2d9807a5), then the relation 'c, in act and other than x, causes the esse of x, which is in act' (ActualEsseCause) is well-founded (fd12ad3d). Step: for an actual cause c of x, x is in act, so by the two calibrations x is an actual concretum; by the esse-cause bridge c is then concrete, exists at w and grounds x; so every actual-cause predecessor is a grounding predecessor among actual concreta, and well-foundedness transfers (the successor need not be an actual concretum). No new premise: the read-only survey's claim that one further inclusion bridge suffices is corrected; besides the esse-cause bridge cb1cdea9 the derivation needs the two actuality calibrations, which no other De ente premise supplies. Through the existing strength order 80f81d44 it also gives the per se regress ea251340. The closed controls esseRegressControls give, for each of the four inputs, a one-world Bool interpretation in which the other three hold and the regress fails, and a nonvacuous interpretation with an actual cause of being; ascentLimit (attached here) is a Nat interpretation in which actual grounding, the esse regress, well-founded priority and every recorded inclusion between esse causing, priority, grounding and the more-in-esse grade hold while the quarta via's no-infinite-ascent premise fails, even among actual concreta. These are facts about the stated interpretations only. The conclusion inherits whatever warrant AGWF and the three bridges have; it is a support option alongside fd12ad3d's direct and per se options, not a defence of any input."

[[argument]]
id = "Grounding well-founded on actual concreta, from the esse regress and ground-cause bridge"
theorem = "actualGroundingWFOfEsseRegress"
comparator_theorems = ["converseControls"]
strong_version_needed = {"fd12ad3d-6729-4fa0-bb87-0121260df684" = "The ground-to-cause bridge 98efaa9e maps a grounding edge to an actual cause of being, not to a per se one, so the per se regress ea251340 says nothing about those edges; closed actual esse collections rooted (20babef7) admits an infinite descending chain of causes whose members also descend from an uncaused bearer. Full well-foundedness of grounding needs the unrestricted regress."}
premises = ["fd12ad3d-6729-4fa0-bb87-0121260df684", "98efaa9e-1c91-4e52-8c0d-faf03d4f8372", "0436de86-6579-53f2-9ff5-2111ba44ebae"]
conclusion = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21"
sense_bridges = [
  { term = "NECESSARY", from = "NECESSARY_11", to = "NECESSARY_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21", role = "conclusion" },
  { term = "NONNECESSARY_VERSUS_CONTINGENT_ROOT", from = "NONNECESSARY_VERSUS_CONTINGENT_ROOT_1", to = "NONNECESSARY_VERSUS_CONTINGENT_ROOT_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21", role = "conclusion" },
  { term = "WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT", from = "WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT_1", to = "WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21", role = "conclusion" },
  { term = "WELL_FOUNDEDNESS_OF_THE_SELECTED_RELATION", from = "WELL_FOUNDEDNESS_OF_THE_SELECTED_RELATION_1", to = "WELL_FOUNDEDNESS_OF_THE_SELECTED_RELATION_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21", role = "conclusion" },
]
axioms = []
rule = "Well-foundedness along a subrelation of the inverse image (Subrelation.wf, InvImage.wf)"
meaning = "Converse inclusion, non-transcription conditional derivation on one m, w and p. If there is no infinite regress of actual causes of being (fd12ad3d), an actual concrete ground of an actual concretum at w is distinct from it and a cause of its esse (98efaa9e) and whatever exists at w is in act of esse (0436de86), then grounding among actual concreta at w is well-founded (82cfaf26). Step: a grounding edge between actual concreta is, by 98efaa9e and 0436de86, an ActualEsseCause edge between the same beings. Diagnostic purpose: with esseRegressOfActualGroundingWF, under all five bridges (cb1cdea9, 546975ef, 2d9807a5 forward; 98efaa9e, 0436de86 backward) AGWF and fd12ad3d are interderivable, so on that package they are one assumption presented over two relations, and supporting one does not add independent evidence for the other. Without the backward bridge they come apart: the last conjunct of converseControls is a Bool interpretation in which the forward bridges, the esse regress, irreflexive priority, its bridge and well-founded priority all hold while grounding among actual concreta is a two-cycle. The other conjuncts give, for each of the three inputs, an interpretation in which the other two hold and AGWF fails, and a nonvacuous interpretation. Facts about these interpretations only. This argument closes a support cycle with esseRegressOfActualGroundingWF; the cycle adds no warrant by itself."

[[argument]]
id = "Simple priority is well-founded, from grounding well-founded on actual concreta"
theorem = "simplePriorityWFOfActualGroundingWF"
comparator_theorems = ["priorityControls"]
strong_version_needed = {"82cfaf26-fc86-54ab-8328-9a7b2bdbbe21" = "The conclusion is full well-foundedness of a relation on the whole carrier, so the premise must exclude every infinite descending grounding chain among actual concreta. The weak versions do not: ConeWellFounded (1b1e3f09) constrains only the ancestor cone of one selected individual, ActualGroundingAsymmetric (39f7c63d) excludes only two-cycles, and closed-collection rootedness (aca3baa1) admits an infinite descending chain whose members also descend from a root (RootedInfiniteControl of ClosedEsseSource)."}
premises = ["82cfaf26-fc86-54ab-8328-9a7b2bdbbe21", "86efed1a-f353-5b5d-9431-df7fc643ace1", "32d77f18-a9c2-5486-b51c-a24f32863af4"]
conclusion = "d85de8e1-2f7f-5b2f-ba1e-112a0799994c"
sense_bridges = [
  { term = "NECESSARY", from = "NECESSARY_11", to = "NECESSARY_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21" },
  { term = "NONNECESSARY_VERSUS_CONTINGENT_ROOT", from = "NONNECESSARY_VERSUS_CONTINGENT_ROOT_1", to = "NONNECESSARY_VERSUS_CONTINGENT_ROOT_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21" },
  { term = "WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT", from = "WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT_1", to = "WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21" },
  { term = "WELL_FOUNDEDNESS_OF_THE_SELECTED_RELATION", from = "WELL_FOUNDEDNESS_OF_THE_SELECTED_RELATION_1", to = "WELL_FOUNDEDNESS_OF_THE_SELECTED_RELATION_2", statement_id = "82cfaf26-fc86-54ab-8328-9a7b2bdbbe21" },
]
axioms = []
rule = "Transfer well-foundedness along a predecessor inclusion (wellFounded_of_predecessorInclusion)"
meaning = "Non-transcription conditional derivation on one m and w, for the shared frame's simple-priority field F.PriorSimply (SIMPLY_PRIOR_1). If grounding among actual concreta at w is well-founded (82cfaf26), whatever is simply prior to something other than itself is an actual concrete ground of it at w (86efed1a) and nothing is prior to itself (32d77f18), then simple priority is well-founded on the whole carrier (d85de8e1). Step: what is prior to x is other than x by irreflexivity, hence an actual concretum grounding x; well-foundedness transfers. The priority well-foundedness premise thus becomes a consequence of the grounding one, but only on the reading of PriorSimply on which 86efed1a is plausible, priority in being (what x depends on for its being). On that reading, the existing chain from d85de8e1 to the secunda via premise 97f5850f (e229bb2c, 438866fa) still needs the all-respects premise e078f07b (every efficient cause in any respect is simply prior), against which lane B keeps the hand/stick counterexample (causal-dependence-support-investigation.md, row 1); so this argument does not by itself carry well-founded grounding to the secunda via. The closed controls priorityControls give, for each input, a Bool interpretation in which the other two hold and priority is not well-founded (the irreflexivity omission is a self-loop, which the distinct-relata bridge does not see), and a nonvacuous interpretation."

[[argument]]
id = "No infinite per se efficient-cause series, via PER_SE_5 actual causes of being"
theorem = "perSeEfficientSeriesOfPerSeEsseRegress"
comparator_theorems = ["secundaControls"]
premises = ["ea251340-c89e-4535-a00f-6323cd8403a5", "Every per se ordered efficient-cause link is a PER_SE_5 actual CAUSE_2 of being"]
conclusion = "97f5850f-62bc-5e43-a0c1-dd1033d08fc9"
axioms = []
rule = "Accessibility along a subrelation (Subrelation.accessible)"
meaning = "Non-transcription conditional derivation on one q.3 a.4 profile p, one PER_SE_5 link AsCaused and one secunda via per se link CausesAsCaused. If there is no infinite chain of per se actual causes of being (ea251340, the weakest regress version that suffices) and every per se ordered efficient-cause link is a per se actual cause of being (the new OPEN bridge), then no per se ordered series of efficient causes goes on to infinity (97f5850f). With esseRegressOfActualGroundingWF and the existing strength order 80f81d44 (fd12ad3d to ea251340) it carries well-founded actual grounding to the secunda via's regress premise through esse causing, an alternative to the priority chain e229bb2c. It names the exact missing inclusion: the secunda via joins the one dependence order only if its per se links are per se causes of being. On a respect-free reading of CausesAsCaused the bridge meets ad 7's own per se example (hand, stick, stone: causes of motion, not of being), the same mechanism as the kept counterexample to e078f07b (causal-dependence-support-investigation.md, section (e), row 1); the bridge is defensible only on the existential reading of the second way. The closed controls secundaControls give, for each input, a Bool interpretation in which the other holds and the per se series has a two-cycle, and a nonvacuous interpretation."
