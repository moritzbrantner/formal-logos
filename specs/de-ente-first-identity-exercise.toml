[batch]
vocab = "TruthCore.Latin.Aquinas.DeEnte.FirstIdentityExercise"
results = "TruthCore.Results.Aquinas.DeEnte.FirstIdentityExercise"

[[statement]]
id = "Each actual identity bearer has an exercise with no prior exercise of that same bearer"
lean = "ActualIdentityHasMinimalExercise"
paraphrase = "On the fixed q3a4 profile and exercise interpretation, each actual bearer r whose represented esse is its essence has an eligible exercise f with bearer f = r. No eligible exercise borne by r has a nonempty path in the exercise relation C to f, including f itself. The claim concerns paths with arbitrary intermediate bearers. Other bearers may have exercises earlier than f, and r may have infinitely many exercises or more than one such minimal exercise."
definitions = ["b14674c2-b20b-42ea-b5dd-9f9d6ebc304e", "4ffdfea6-0a5a-513c-a710-050648c260bf"]

[[argument]]
id = "One minimal exercise excludes an identity return under backward lifting"
theorem = "noReturnOfMinimalExercise"
comparator_theorems = ["minimalExerciseOfNoReturn", "minimalWithInfiniteFibreAndOtherCycle", "liftingOnlyAtIdentityAllowsReturn"]
premises = ["4bd2d25b-27c6-4cfe-9b5f-bfa11511c176", "Each actual identity bearer has an exercise with no prior exercise of that same bearer"]
conclusion = "41c858ee-07ee-41db-9693-b5fef6154efe"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Lift a proposed bearer loop backwards from the selected exercise into a same-bearer predecessor"
meaning = "Every selected exercise of each recipient has an eligible predecessor exercise for each actual esse supplier. Apply this through the whole proposed loop into the chosen exercise of the actual identity bearer. The earlier exercise then has that same bearer. Conversely, if the fibre is inhabited and every C edge projects to an actual esse-supplier edge, the absence of an identity return excludes a same-bearer predecessor for every exercise of that bearer. The checked model uses the earlier rooted reciprocal dependents. Every bearer has infinitely many indexed exercises, and the two dependents have a cyclic pair of exercises. The common first giver still has a minimal exercise. A second control grants the minimal-exercise premise and backward lifting at every actual identity recipient; a failed lift at an intermediate bearer allows the return. An operational ordering of events warrants an application to esse only if the productive links are identified on this same interpretation."
