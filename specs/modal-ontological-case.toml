subject_kind = "result"
subject_id = "Modal ontological case controls"
predicate = "tests"
object_kind = "statement"
object_id = "Concrete GOD_4 presence is rigid from the standpoint"
note = "Omission model swapped: each world has its own concrete GOD_4, so the boxed conditional, possibility and both frame conditions hold, rigidity fails and neither conclusion holds. Strictness model fixedPlusVisitor: the GOD_4 conclusion holds while rigidity fails, so the conclusion does not entail the bridge."

[[relation]]
id = "Modal ontological controls test the whole argument"
subject_kind = "result"
subject_id = "Modal ontological case controls"
predicate = "tests"
object_kind = "argument"
object_id = "Modal ontological argument on the case profile gives a necessary concretum"
note = "Nonvacuity model fixedOne satisfies every registered premise of the argument (EuclideanAt, ActualReflexive, the boxed conditional, possibility and rigidity; there are no logical premises) and its conclusion. Population: two candidates, one existing at both worlds, the other nowhere."
