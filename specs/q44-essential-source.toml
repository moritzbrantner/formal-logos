[[argument]]
id = "b8b21fb3-997d-4aa0-a675-6a0870d77e1f"
label = "Relevant essential sources are selected through De ente identity uniqueness"
theorem = "sourcesSelected"
premises = ["Relevant own-being sources respect the essence-esse identity dictionary", "a576300f-4b01-45ae-902c-cfe3d0fbf2de", "Selected p is actual with its represented esse identical to its essence"]
conclusion = "All relevant actual own-being causes are the selected p"
axioms = []
rule = "Universal instantiation, equality elimination and existential construction"
meaning = "For each distinct actual own-being cause of a participant, the dictionary supplies represented identity. The existing at-most-one statement identifies it with the selected actual identity witness. No participation coverage or source supply is required for this restricted selection conclusion, which is vacuous if there are no relevant sources. Each selection input is tested by a nonempty finite control. No source premise is established."

[[argument]]
id = "60447a77-72b9-42f0-ba39-9cb3e317b99c"
label = "Others are CREATURE_1 from q44 selected essential sources"
theorem = "othersAreCreatures"
premises = ["11e24b50-06bc-5e2e-b9b6-a4e4dc421237", "Each participant has a distinct actual own-being cause of esse", "All relevant actual own-being causes are the selected p"]
conclusion = "612078bf-5a68-5542-8b7b-f862f816ece0"
axioms = []
rule = "Universal instantiation, equality elimination and existential construction"
meaning = "For each x other than the selected p, participation coverage gives Participated x. Its distinct actual own-being cause c is selected as p, so p causes x. Consequently p causes every other actual being, and each other x is CREATURE_1 with that same p as the universal cause. Creature is instantiated at IsCreatureOfUniversalCause, not CREATURE_2. The own-being source law and numerical source selection are explicit premises; no Fourth-Way universal-cause principle, GOD_4 identification, q3 local-to-common-source shortcut, efficiency, conservation or modal conclusion is used."
senses = { CREATURE = "CREATURE_1" }

