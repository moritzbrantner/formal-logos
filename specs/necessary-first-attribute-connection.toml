strong_version_needed = { "cb1cdea9-eb6c-578c-8008-84e0d4107fd3" = "The premise is applied to a cause whose actual concreteness is not otherwise available: a maximum in esse (maximumEqualsRoot, actualRootMaximum), the uniting or external cause of a supposed composite or distinct-esse root, or an arbitrary given cause or prior. The proof relies on the premise's output that this cause is concrete and exists at w (ActualConcreteGround c x), either to contradict rootness or as part of the conclusion. The weak version ActualEsseCauseIsActualGround (b17a8954) assumes ActualConcrete c and yields only grounds w c x.", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410" = "EM is applied in maximumEqualsRoot to y = g (a maximum and the root g) before g is shown to be GOD_4: hGod is derived afterwards from hOnlyMaximum. LocalLogic (ca432e24) decides identity only with an established GOD_4 candidate." }
premises = ["593d7307-c8e1-5863-9776-a26cfe09d20c", "017befa2-6ac0-52d2-b49c-d1d10507c2cf", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410", "da09703b-0b1e-5dca-9dd7-6c0c8d1610d7", "0436de86-6579-53f2-9ff5-2111ba44ebae", "cb1cdea9-eb6c-578c-8008-84e0d4107fd3", "1ec205ed-b2a6-5384-bb5f-2565a9d325bf", "33b18ae7-4578-54bc-a2b5-edce99b21fc2", "75a37a91-732d-510c-9abc-b37c988c5c63", "0659227c-0979-579c-910b-03a1967f49c5", "818a73cc-249d-5f9b-9c34-aee1f2cbf333"]
