# #1926 phase 2, slice 2a: the root-supply interface. The interface is the
# existing statement "an actual concrete root exists at the selected world"
# (dc397705, RootPositiveIntellectWill.ActualRootExistsAt): a root of the
# profile's one selected relation grounds w among actual concreta. Variants
# stated without population or excluded middle cannot entail it; they entail,
# constructively, its population-conditional double-negated form, whole-roster
# nontrapping (5c898d24), which 41 arguments consume. Registered: root
# existence, well-founded actual grounding and the all-subsets borrowing cut
# strengthen whole-roster nontrapping (the first with a certified difference);
# the source-backed supply premise is equivalent to root existence. The
# classical GOD_4 root of the quarta via is proved once from the interface
# (deriveFromActualRoot, a Comparator-checked theorem; its corpus argument is
# blocked by the base route's legacy POTENCY sense mixing).
# Grounding, causing and priority stay distinct relations; nothing identifies
# them. Analyst formulations, attribution deferred. Attempt: "Root-supply
# interface: variants into whole-roster nontrapping and one derivation from root
# existence".

