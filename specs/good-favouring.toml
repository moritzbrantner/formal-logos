# #2145 Lane 2b (Investigations 2 and 3): a content-fixed favouring standard that a
# bare re-description fails, three readings of "produced because of its goodness",
# and one matched table of chance, proxy, D-directed nature, determined will,
# good-general nature and rational exercise. Analyst formulations, attribution deferred.
# See docs/notes/optimal-creation-choice.md §§65-69.

[batch]
vocab = "TruthCore.Causality.GoodFavouring"
results = "TruthCore.Results.Causality.GoodFavouring"

[[statement]]
id = "Content-fixed favouring: a re-description is not an outcome-independent selector"
disambiguations = ["59b60fe6-1bfe-512f-a90c-17416218bba4"]
lean = "FavouringStandardLaws"
definitions = ["aaaad7b2-fd1c-49ad-ac0b-666763ef96df", "5a818c39-1ba6-4cce-adf6-246d1d49fd1e", "9e9af2c4-5938-4204-859b-fcf78d485e20"]
paraphrase = "Analyst formulation on any local STIT frame with an outcome map, where an explanatory level supplies a content at each history and each content has a favouring relation on outcomes; the level explains 'the actual outcome rather than y' when its actual content favours the actual outcome over y (the cell-carrier analogue of net favouring, SELECTING_AN_OUTCOME_1, not one of its senses and not bridged to it). (1) If the content is the same at every compared history and its favouring relations are asymmetric (net favouring; a content with pro tanto reasons in both directions is outside this law), then with a contingent outcome it does not favour each history's outcome over every other realized outcome at every history. (2) The outcome itself, as content favouring itself over everything else, does that at every history, has asymmetric favouring, and with a contingent outcome is not the same at every history. (3) A content constant on the cells of a single-cell (invariant) level is the same at every history. (4) A content that favours only what a standard G ranks higher does not select the actual outcome when another realized outcome is not ranked below it by G. (5) With an asymmetric G under which every realized outcome is bettered by a realized outcome, no such content selects. Law 1 excludes every outcome-independent asymmetric content equally, so it does not discriminate among accounts; at the actual history alone, the re-description is excluded by the admission condition (outcome independence), not by law 1. Nothing about rationality, chance or goodness beyond the named relations is typed."

[[statement]]
id = "09edfa92-b685-4547-ade1-9389077b637f"
label = "Controlled dependence: fixed profiles depend on nothing; plan standards ignore apprehension"
disambiguations = ["8430c7dc-2972-4f47-87a9-ce4676533cdf"]
lean = "GoodDependenceLaws"
definitions = ["45541b02-ec42-4bae-9d45-4c67d2902004", "9d8bad2a-91f9-45f7-a181-b9c39a55cdcb", "a84afabf-d6e6-424d-a792-2fa874c466a5"]
paraphrase = "Analyst formulation over any type of variation scenarios S and outcomes X, with a profile giving a source's favouring in each scenario and scenario-indexed features. A profile depends on feature g under control ctrl at s for x over y when g ranks x over y at s, the profile favours x over y at s, and some scenario agreeing with s on ctrl has neither g nor the profile ranking x over y (difference-making; a profile favouring what g does not rank higher does not depend on g). (1) A profile that factors through ctrl (equal ctrl, equal profile) depends on nothing under ctrl. (2) A profile that is the same in every scenario depends on nothing under any control. (3) A profile coinciding with f in every scenario depends on g under ctrl exactly when g and f rank x over y at s and some scenario agreeing on ctrl has neither g nor f ranking x over y. (4) If g factors through ctrl, no profile depends on g under ctrl. (5) A fixed profile coinciding with f everywhere makes f the same in every scenario. (6) Two profiles coinciding with the same f have the same dependence verdicts (definitional). (7) For a practical-specification Plan and outcome descriptions, the induced plan standard (x meets plan k's requirements and y does not) is unchanged when the plan's ApprehendsAsGood and SpecifiesGiving fields are replaced, and so are the dependence verdicts on it. (8) On any local STIT frame, two favouring assignments that agree on the actual content give the same content-fixed favouring verdicts (explained contrasts and selection), so profiles that coincide in the content scenario are indistinguishable by that standard (definitional). No apprehension, intellect or chance is typed."

[[statement]]
id = "e1d13faf-e671-43e8-85d8-011125a24501"
label = "Good-favouring table: good-bounded profiles leave ties open; only good-trackers depend on goodness"
disambiguations = ["8430c7dc-2972-4f47-87a9-ce4676533cdf", "59b60fe6-1bfe-512f-a90c-17416218bba4", "0bbbf98c-605a-49fa-a5c9-855cd2a6c1c5"]
lean = "GoodFavouringTable"
definitions = ["aaaad7b2-fd1c-49ad-ac0b-666763ef96df", "45541b02-ec42-4bae-9d45-4c67d2902004", "bcb40191-d34f-4958-9ac8-f6a7192c8191", "da7e9520-18d1-4514-8490-186e7b29a56d", "f35499f9-5905-4eb9-bc10-f40bfadc0b31", "188efb7f-0b64-4a54-a462-f053a5cd84e6"]
paraphrase = "Analyst formulation on one finite carrier: the four outcomes of the selection-scope model (total omission, D-realizing c and d, unfit z), its exercise frame with histories c and d and actual outcome c, and four scenarios (actual: c and d realize D and are tied; reversal: same physical provisions, D realized by c and z; valueless: D-realization as actual, nothing better than anything; cBetter: D-realization as actual and c better than d). Profiles: chance (no favouring), proxy (favours the physical provision type of c and d), D-nature and determined will (both defined as favouring D-realization), good-general nature and rational exercise (both defined as favouring what is better), and two controls, perverse (favours z over c in actual) and bias (D-realization plus c over d in actual). Which account each profile represents is an interpretive assignment; rows 2, 3 and the shared verdicts of each pair in row 7 hold by construction, since the standard reads only the profile in the content scenario. (1) Realization of D in the actual scenario is Fit. (2) With the actual scenario as content, proxy, D-nature, determined will, good-general and rational each explain c rather than z and c rather than omission, none explains c rather than d, none selects c; chance explains no contrast. (3) With cBetter as content, good-general and rational favour c over every other realized outcome; D-nature and proxy do not favour c over d. (4) The outcome re-description selects at every history and is not outcome-independent, and no outcome-independent content with asymmetric favouring selects at every history. (5) For c rather than z at actual, D-nature, good-general and rational depend on D-realization (BECAUSE_OF_GOODNESS_1, witness reversal); the proxy favours c over z without that dependence; chance lacks it. (6) For c rather than z at actual, good-general and rational depend on betterness with D-realization fixed (BECAUSE_OF_GOODNESS_2, witness valueless); D-nature favours c over z and c is better, yet D-nature, determined will, proxy and chance lack that dependence. (7) Good-general equals rational and D-nature equals determined will as functions. (8) Controls: perverse favours z over c while c is better and does not depend on goodness for z over c; bias selects c in actual (it is not good-bounded) and does not depend on goodness for c over d. (9) For c over z at actual: D-nature has ORIGINAL_FINALITY_1 and lacks ORIGINAL_FINALITY_2; good-general has ORIGINAL_FINALITY_2; proxy lacks ORIGINAL_FINALITY_1. The valueless scenario varies goodness at fixed D-realization and is counterpossible if goodness facts are necessary. Finite structural surrogates; no intellect, apprehension, chance measure or simplicity is typed."

[[argument]]
id = "Content-fixed favouring laws, from the definitions"
theorem = "favouringStandardLaws"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Content-fixed favouring: a re-description is not an outcome-independent selector"
rule = "Pick a history with another outcome; selection at both histories with one asymmetric content is contradictory"
meaning = "Law 1: the actual history h and a history k with another outcome are both in the realized range; selection at h gives favouring of out h over out k, at k favouring of out k over out h, by the same content, contradicting asymmetry. Law 2 checks the re-description directly; a contingent outcome makes its content differ between two histories. Law 3: one cell relates every two histories. Law 4: selection would favour the actual outcome over the tied rival, which good-boundedness turns into a G-ranking. Law 5: the bettering outcome is distinct by asymmetry, and selection over it gives the reverse G-ranking."
description = "A placed diagnostic for 608a262d. It supplies a contrastive standard on which the explanans is individuated independently of the outcome partition: the re-description of the outcome that meets the determination standard (SelectionScope law 8) is outcome-dependent and so is not admitted; law 1 adds that no admitted content with asymmetric (net) favouring selects whatever outcome occurs (the #742 incompatible core on choice cells), which every account fails alike. Good-bounded favouring explains no contrast between outcomes that the standard ties and selects nothing when every outcome is bettered, whoever the source; a content that is not good-bounded (a bias) can select. Establishes no premise."

[[argument]]
id = "Controlled dependence laws, from the definitions"
theorem = "goodDependenceLaws"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "09edfa92-b685-4547-ade1-9389077b637f"
rule = "A profile equal at the witness scenario cannot both favour and not favour; transport equalities along the control"
meaning = "Laws 1 and 2: the witness scenario agrees on the control (or the profile is fixed), so the profile favours x over y there too. Law 3 rewrites the profile by the tracked feature. Law 4: the witness scenario agrees on the control, so g's verdict there equals its positive verdict at s. Law 5 rewrites both sides by tracking. Law 6 rewrites both profiles. Law 7: Meets reads only Requirement, so the plan standard is unchanged by definitional unfolding. Law 8: the favouring verdicts read only the favouring of the actual content."
description = "A placed diagnostic for 4be0f774. The premise asks for a plan that is apprehended as good and actually governs each rational giving; its recorded blocker (attempts c3f27519, 83bd8a2c) asks what distinguishes governing from describing the effect. Controlled dependence supplies one candidate criterion: a source's favouring depends on a plan's or a good's standard only if that standard ranks the favoured outcome higher, the profile is not fixed and it does not factor through the controlled feature; under the interpretation that a merely foreseen plan is matched by a fixed profile, the foreseen profile never depends on it. The same laws show the limits: the plan standard ignores ApprehendsAsGood and SpecifiesGiving, so dependence on it supplies neither apprehension nor the primitive governing relation (reading SpecifiesGiving as dependence is an open bridge); if goodness is fixed by the controlled feature no profile depends on it, personal or impersonal; and profiles agreeing in the content scenario are indistinguishable by the content-fixed favouring standard. Establishes no premise."

[[argument]]
id = "Matched good-favouring table, by computation"
theorem = "goodFavouringTable"
sense_mixing_control = true
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "e1d13faf-e671-43e8-85d8-011125a24501"
rule = "Evaluate each profile at each scenario; apply the non-triviality, fixity and factoring laws"
meaning = "Rows 2 and 3 unfold the profiles at the actual and cBetter contents on the exercise frame's histories c and d. Row 4 applies the re-description and non-triviality laws to the contingent outcome c. Row 5 uses the reversal scenario as witness for the D-tracking profiles; the proxy is fixed. Row 6 uses the valueless scenario, which has the actual D-realization, as witness for the good-tracking profiles; the D-nature and determined will factor through D-realization and the proxy is fixed. Row 8: betterness does not rank z over c, nor c over d, at actual. Row 9 combines rows 5 and 6 with the betterness of c over z."
description = "A placed diagnostic for 4be0f774. By construction, at the actual standard the proxy, D-nature, determined will, good-general nature and rational exercise explain the same contrasts (c rather than z or omission) and none explains c rather than the tied d; chance explains nothing; a bias that is not good-bounded selects c. The assignment of profiles to accounts is interpretive: rational exercise is assigned the good-tracking profile and the determined will the D-tracking one, and whether rational favouring tracks goodness through apprehension under counterpossible variation is the open content-generality question. Reversal separates the proxy from D-tracking; goodness variation at fixed D-realization separates D-tracking from good-tracking. The D-nature favours the better c over z with ORIGINAL_FINALITY_1 and without BECAUSE_OF_GOODNESS_2 or ORIGINAL_FINALITY_2. Controls show that perverse and biased favouring do not count as dependence on goodness. Establishes no premise."

