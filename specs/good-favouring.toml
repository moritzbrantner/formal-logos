# #2145 Lane 2b (Investigations 2 and 3): a content-fixed favouring standard that a
# bare re-description fails, three readings of "produced because of its goodness",
# and one matched table of chance, proxy, D-directed nature, determined will,
# good-general nature and rational exercise. Analyst formulations, attribution deferred.
# See docs/notes/optimal-creation-choice.md §§65-69.

[batch]
vocab = "TruthCore.Causality.GoodFavouring"
results = "TruthCore.Results.Causality.GoodFavouring"

[[statement]]
id = "Content-fixed favouring: a re-description is not an outcome-independent selector"
disambiguations = ["59b60fe6-1bfe-512f-a90c-17416218bba4"]
lean = "FavouringStandardLaws"
definitions = ["aaaad7b2-fd1c-49ad-ac0b-666763ef96df", "5a818c39-1ba6-4cce-adf6-246d1d49fd1e", "9e9af2c4-5938-4204-859b-fcf78d485e20"]
paraphrase = "Analyst formulation on any local STIT frame with an outcome map, where an explanatory level supplies a content at each history and each content has a favouring relation on outcomes; the level explains 'the actual outcome rather than y' when its actual content favours the actual outcome over y (pro tanto; the cell-carrier analogue of SELECTING_AN_OUTCOME_1, not one of its senses and not bridged to it). (1) If the content is the same at every compared history and its favouring relations are asymmetric, then with a contingent outcome it does not favour each history's outcome over every other realized outcome at every history. (2) The outcome itself, as content favouring itself over everything else, does that at every history, has asymmetric favouring, and with a contingent outcome is not the same at every history. (3) A content constant on the cells of a single-cell (invariant) level is the same at every history. (4) A content that favours only what a standard G ranks higher does not select the actual outcome when another realized outcome is not ranked below it by G. (5) With an asymmetric G under which every realized outcome is bettered by a realized outcome, no such content selects. Nothing about rationality, chance or goodness beyond the named relations is typed."

[[statement]]
id = "09edfa92-b685-4547-ade1-9389077b637f"
label = "Controlled dependence: fixed profiles depend on nothing; plan standards ignore apprehension"
disambiguations = ["8430c7dc-2972-4f47-87a9-ce4676533cdf"]
lean = "GoodDependenceLaws"
definitions = ["45541b02-ec42-4bae-9d45-4c67d2902004", "9d8bad2a-91f9-45f7-a181-b9c39a55cdcb", "a84afabf-d6e6-424d-a792-2fa874c466a5"]
paraphrase = "Analyst formulation over any type of variation scenarios S and outcomes X, with a profile giving a source's favouring in each scenario and scenario-indexed features. A profile depends on feature g under control ctrl at s for x over y when it favours x over y at s and some scenario agreeing with s on ctrl has neither g nor the profile ranking x over y. (1) A profile that factors through ctrl (equal ctrl, equal profile) depends on nothing under ctrl. (2) A profile that is the same in every scenario depends on nothing under any control. (3) A profile coinciding with f in every scenario depends on g under ctrl exactly when f ranks x over y at s and some scenario agreeing on ctrl has neither g nor f ranking x over y. (4) If g factors through ctrl, a profile depends on g only where g does not rank x over y at s, so no profile coinciding with g at s depends on g. (5) A fixed profile coinciding with f everywhere makes f the same in every scenario. (6) Two profiles coinciding with the same f have the same dependence verdicts (definitional). (7) For a practical-specification Plan and outcome descriptions, the induced plan standard (x meets plan k's requirements and y does not) is unchanged when the plan's ApprehendsAsGood and SpecifiesGiving fields are replaced, and so are the dependence verdicts on it. No apprehension, intellect or chance is typed."

[[statement]]
id = "Good-favouring table: tied D-realizers unexplained; only good-general profiles depend on goodness"
disambiguations = ["8430c7dc-2972-4f47-87a9-ce4676533cdf", "59b60fe6-1bfe-512f-a90c-17416218bba4"]
lean = "GoodFavouringTable"
definitions = ["aaaad7b2-fd1c-49ad-ac0b-666763ef96df", "45541b02-ec42-4bae-9d45-4c67d2902004", "bcb40191-d34f-4958-9ac8-f6a7192c8191", "da7e9520-18d1-4514-8490-186e7b29a56d"]
paraphrase = "Analyst formulation on one finite carrier: the four outcomes of the selection-scope model (total omission, D-realizing c and d, unfit z), its exercise frame with histories c and d and actual outcome c, and four scenarios (actual: c and d realize D and are tied; reversal: same physical provisions, D realized by c and z; valueless: D-realization as actual, nothing better than anything; cBetter: D-realization as actual and c better than d). Six profiles: chance (no favouring), proxy (favours the physical provision type of c and d), D-nature and determined will (both favour D-realization), good-general nature and rational exercise (both favour what is better). (1) Realization of D in the actual scenario is Fit. (2) With the actual scenario as content, proxy, D-nature, determined will, good-general and rational each explain c rather than z and c rather than omission, none explains c rather than d, none selects c; chance explains no contrast. (3) With cBetter as content, good-general and rational select c; D-nature and proxy do not explain c rather than d. (4) The outcome re-description selects at every history and is not outcome-independent, and no outcome-independent content with asymmetric favouring selects at every history. (5) For d rather than z at actual, D-nature, good-general and rational depend on D-realization (BECAUSE_OF_GOODNESS_1); the proxy favours d over z without that dependence; chance lacks it. (6) For c rather than z at actual, good-general and rational depend on betterness with D-realization fixed (BECAUSE_OF_GOODNESS_2); D-nature favours c over z and c is better, yet D-nature, determined will, proxy and chance lack that dependence. (7) Good-general equals rational and D-nature equals determined will as functions. Which account each profile represents is an interpretive assignment; the valueless and cBetter scenarios vary goodness at fixed D-realization and are counterpossible if goodness facts are necessary. Finite structural surrogates; no intellect, apprehension, chance measure or simplicity is typed."

[[argument]]
id = "Content-fixed favouring laws, from the definitions"
theorem = "favouringStandardLaws"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Content-fixed favouring: a re-description is not an outcome-independent selector"
rule = "Pick a history with another outcome; selection at both histories with one asymmetric content is contradictory"
meaning = "Law 1: the actual history h and a history k with another outcome are both in the realized range; selection at h gives favouring of out h over out k, at k favouring of out k over out h, by the same content, contradicting asymmetry. Law 2 checks the re-description directly; a contingent outcome makes its content differ between two histories. Law 3: one cell relates every two histories. Law 4: selection would favour the actual outcome over the tied rival, which good-boundedness turns into a G-ranking. Law 5: the bettering outcome is distinct by asymmetry, and selection over it gives the reverse G-ranking."
description = "A placed diagnostic for 608a262d. It supplies the discriminating contrastive standard that SelectionScope's determination laws left open: the explanans is individuated independently of the outcome partition, and it is not met trivially, because an outcome-independent asymmetric content cannot select whatever outcome occurs (the #742 incompatible core on choice cells), while the re-description that meets the determination standard (law 8) does so only by being outcome-dependent. Good-bounded favouring explains no contrast between outcomes that the standard ties and selects nothing when every outcome is bettered, whoever the source. Establishes no premise."

[[argument]]
id = "Controlled dependence laws, from the definitions"
theorem = "goodDependenceLaws"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "09edfa92-b685-4547-ade1-9389077b637f"
rule = "A profile equal at the witness scenario cannot both favour and not favour; transport equalities along the control"
meaning = "Laws 1 and 2: the witness scenario agrees on the control (or the profile is fixed), so the profile favours x over y there too. Law 3 rewrites the profile by the tracked feature. Law 4: the witness scenario agrees on the control, so g's verdict is the same as at s, which must therefore be negative; an aligned profile's favouring at s gives a positive verdict. Law 5 rewrites both sides by tracking. Law 6 rewrites both profiles. Law 7: Meets reads only Requirement, so the plan standard is unchanged by definitional unfolding."
description = "A placed diagnostic for 4be0f774. The premise asks for a plan that is apprehended as good and actually governs each rational giving; its recorded blocker (attempts c3f27519, 83bd8a2c) asks what distinguishes governing from describing the effect. Controlled dependence supplies one testable criterion: a source's favouring depends on a plan's or a good's standard only if it is not fixed and does not factor through the controlled feature, so a fixed profile that agrees with an apprehended plan (the foreseen control) never depends on it. The same laws show the limit: the plan standard ignores ApprehendsAsGood and SpecifiesGiving, so dependence on it supplies neither apprehension nor the primitive governing relation, and if goodness is fixed by the controlled feature no aligned profile depends on it, personal or impersonal. Establishes no premise."

[[argument]]
id = "Matched good-favouring table, by computation"
theorem = "goodFavouringTable"
sense_mixing_control = true
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Good-favouring table: tied D-realizers unexplained; only good-general profiles depend on goodness"
rule = "Evaluate each profile at each scenario; apply the non-triviality, fixity and factoring laws"
meaning = "Rows 2 and 3 unfold the profiles at the actual and cBetter contents on the exercise frame's histories c and d. Row 4 applies the re-description and non-triviality laws to the contingent outcome c. Row 5 uses the reversal scenario as witness for the D-tracking profiles; the proxy is fixed. Row 6 uses the valueless scenario, which has the actual D-realization, as witness for the good-tracking profiles; the D-nature and determined will factor through D-realization and the proxy is fixed."
description = "A placed diagnostic for 4be0f774. Under the content-fixed favouring standard, at the actual standard, a physical proxy, a D-directed nature, a determined will, a good-general nature and rational exercise explain the same contrasts (c rather than z or omission) and none explains c rather than the tied d: parity, with chance explaining nothing. Recipient-relative reversal separates the proxy from D-tracking; goodness variation at fixed D-realization separates D-tracking from good-tracking, and that line runs through both personal and impersonal interpretations (determined will with the D-nature, rational exercise with the good-general nature). The D-nature favours the beneficial c over z without that dependence: a beneficial arrangement not produced because of its goodness in reading 2. No row separates rational exercise from the good-general nature: as profiles they are the same function. Establishes no premise."

