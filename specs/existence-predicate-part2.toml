# Existence as a predicate (#1784, #397), part 2: an encoding/exemplification
# reconstruction in the style of Zalta, Kant's thesis that existence is not a real
# predicate, and Descartes' Meditation V argument. Analyst formulations;
# attribution deferred (author names are navigation, not verified source claims).
# Part 1 is specs/existence-predicate.toml.

[batch]
vocab = "TruthCore.Ontology.EncodingAndRealPredicates"
results = "TruthCore.Results.Ontology.EncodingAndRealPredicates"

[[statement]]
id = "Comprehension gives encoded EXISTENCE_7, not exemplified EXISTENCE_6, and fixes how naming reads God"
lean = "EncodingControl"
paraphrase = "Checked facts about a non-modal encoding/exemplification object theory in the style of Zalta (analyst reconstruction, attribution deferred). (a) In every frame with object comprehension (for every set of properties exactly one abstract object, one not exemplifying E!, encodes exactly those properties), for any properties g and o some object encodes g, o and E! (EXISTENCE_7) and does not exemplify E! (EXISTENCE_6). (b) In every frame where ordinary objects encode nothing, if the form of the naming premise holds with 'in act at esse' read as exemplifying E! and 'God' read as encoding g, then no object is the unique maximum in being that causes all in the genus: the exemplified reading of being excludes the encoded reading of God. (c) Some frame has comprehension, ordinary objects encoding nothing and an object exemplifying E!, and properties g ('god') and o ('omnibenevolent') such that some object encodes g, o and E!, no object exemplifies both E! and g, no being (object exemplifying E!) exemplifies g, and, with 'in act at esse' read as encoding E! and 'God' as encoding g, the form of the naming premise holds, some object is the unique maximum in being causing all in the genus, and some object encodes g. The model witnesses only this formal interpretation."
definitions = ["77f81696-1dde-467b-9a12-9ec6919db4ea", "fd3ec6b3-2e89-44da-9937-6eb9287fcc12", "243ac306-054f-4df2-965a-76cdc2164c36"]
disambiguations = ["DISAMB-RUSSELL-EXISTENCE"]

[[statement]]
id = "cdc7a58f-0c17-41d9-8d9d-18b6ad5c6cc6"
label = "Some reality feature is EXISTENCE_8 at the selected world (extensional real-predicate surrogate)"
lean = "ExistenceIsRealPredicate"
paraphrase = "Open premise, analyst formulation (Descartes' 'existence is a perfection' in Meditation V is navigation, attribution deferred): EXISTENCE_8 holds at the selected world, i.e. some feature of the reality profile is had by exactly the candidates that exist there. This is (an extensional surrogate of 'existence is a real predicate', satisfiable by accidental coextension): it does not say that any concept contains existence, and a feature that merely happens to be had by exactly the existing candidates makes it true."
definitions = ["0857c20c-d609-4b3e-a685-b07ed52ead88", "b3c45d92-dee0-5a1a-9849-9924d3a1699d", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-RUSSELL-EXISTENCE"]

[[statement]]
id = "905d7522-652f-44c9-9a0d-34e30e404270"
label = "Strengthened Kantian thesis: no reality feature is EXISTENCE_8 at the selected world"
lean = "ExistenceNotRealPredicate"
paraphrase = "Rival, an analyst strengthening of Kant's thesis that being is not a real predicate (A598/B626, navigation; attribution deferred): no feature of the reality profile is had by exactly the candidates that exist at the selected world. It is the exact Lean negation of the EXISTENCE_8 premise, so it also denies accidental coextension, which Kant's intensional thesis (existence is no determination contained in a concept) does not deny. On Kant's positive account existence is the positing of a thing with its determinations, the instantiation sense EXISTENCE_1."
definitions = ["0857c20c-d609-4b3e-a685-b07ed52ead88", "b3c45d92-dee0-5a1a-9849-9924d3a1699d", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-RUSSELL-EXISTENCE"]

[[statement]]
id = "b5271348-2594-4087-ae35-c4e21f7d1e9c"
label = "EXISTENCE_8 suffices for most-real-to-actual; a Kantian identification model"
lean = "RealPredicateControl"
paraphrase = "Checked facts, analyst formulation. (a) EXISTENCE_8 suffices: for every ontic model, reality profile and world, if some profile feature is coextensive with existence at that world, every most-real candidate exists there. (b) Some model of the strengthened Kantian thesis (no feature is coextensive with existence at the world), together with the reported identification premise 'every necessary being is most real' and the strong uniqueness of most-real candidates, has a most-real candidate and no existing most-real candidate, and no necessary being; so those premises do not yield existence. EXISTENCE_8 is not shown necessary for the step: with two candidates of which only the existing one has the single feature, a most-real candidate exists without EXISTENCE_8."
definitions = ["0857c20c-d609-4b3e-a685-b07ed52ead88", "b3c45d92-dee0-5a1a-9849-9924d3a1699d", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-RUSSELL-EXISTENCE"]

[[statement]]
id = "Meditation V first premise: some candidate is supremely perfect and is GOD_4"
lean = "SupremelyPerfectGodCandidate"
paraphrase = "Open premise, analyst formulation of Descartes' Meditation V (attribution deferred): some candidate in the constant domain of candidates has every positive reality of the profile (is supremely perfect) and is God. Candidates need not exist; the premise says what the idea of God represents, not that it is instantiated by a being."
