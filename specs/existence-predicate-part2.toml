[[argument]]
id = "Encoding control, checked"
theorem = "encodingControl"
premises = []
conclusion = "Comprehension gives encoded EXISTENCE_7, not exemplified EXISTENCE_6, and fixes how naming reads God"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_mixing_control = true
rule = "General witness from comprehension; ordinary objects encode nothing against the naming premise; one explicit model, checked by unfolding"
meaning = "Premise-free control. (a) Takes the abstract object comprehended from {g, o, E!}. (b) The naming premise with being read as exemplifying E! and God as encoding g gives that the unique maximum encodes g, while it exemplifies E! and so, being ordinary, encodes nothing. (c) The model has one ordinary object exemplifying only E! and one abstract object per set of the properties E!, god and benevolent, exemplifying nothing; the object encoding {god, benevolent, E!} is the unique maximum when being is read as encoding E! and 'more in being' ranks it first. Finding: the route's existential import sits in the maximum-existence premise (in act at esse) with the carrier; read as exemplifying E!, it excludes the encoded reading of God; read as encoding E!, it delivers a god that does not exemplify existence. Encoding blocks the definitional argument; it does not mean that object theory blocks ontological arguments: an Anselmian argument is valid inside object theory with a greatness premise (Oppenheimer and Zalta 1991, navigation), the encoding analogue of Meditation V's premise. A model of one formal interpretation, not evidence that abstract object theory is true."

[[argument]]
id = "Real-predicate control, checked"
theorem = "realPredicateControl"
premises = []
conclusion = "b5271348-2594-4087-ae35-c4e21f7d1e9c"
axioms = []
rule = "Instantiation of the existence feature; one explicit one-candidate model, checked by unfolding"
meaning = "Premise-free and zero-axiom. (a) EXISTENCE_8 suffices: a most-real candidate has every feature, including one coextensive with existence at the world, so it exists there. (b) One candidate, one feature had by it, universal access, nothing existing: no feature is coextensive with existence, the identification premise holds vacuously (nothing is necessary), uniqueness holds, the candidate is most real, and nothing most real exists; so the identification and uniqueness premises do not yield existence. EXISTENCE_8 is sufficient, not shown necessary. Targets, under the substantive-objection standard: Kant's real-predicate thesis targets the warrant of the real-predicate premise of the ontological argument; it does not touch the existence premises of the a posteriori routes. Separately, the root route through argument 500c6e18 uses NecessaryIsMostReal (2107b9df) and MostRealUnique (84ae3700), which Kant's ontological-dependence objection targets: that objection to the warrant of 2107b9df applies there and stays open, and it is substantive only if that warrant is that the most-real concept suffices for necessary existence. That route takes its existing witness from 86badf93, not from the conversion that KANT-CONVERSION-NEEDS-EXISTENCE isolates. Kant's scope objection to the causal premises is a separate matter (docs/kant-cosmological-inference.md)."

[[argument]]
id = "GOD_4 exists, from Meditation V (supremely perfect candidate and EXISTENCE_8)"
theorem = "meditationFive"
premises = ["Meditation V first premise: some candidate is supremely perfect and is GOD_4", "cdc7a58f-0c17-41d9-8d9d-18b6ad5c6cc6"]
conclusion = "STMT-GOD-EXISTS"
axioms = []
rule = "The supremely perfect candidate has the existence feature, which is coextensive with existence at the world"
sense_bridges = [{ term = "GOD_IN_THE_COMPARISON", from = "GOD_IN_THE_COMPARISON_2", to = "GOD_IN_THE_COMPARISON_3", statement_id = "Meditation V first premise: some candidate is supremely perfect and is GOD_4" }]
meaning = "Analyst formulation of Descartes' Meditation V, attribution deferred: if some candidate is supremely perfect and God, and existence at the selected world is a real predicate of the profile, then some being existing at that world is God. The bound conclusion is GodExists over the candidates existing at the world. Valid and not a transcription: the proof passes through the coextension of the existence feature. The first premise is the explicit bridge between the most-real sense (GOD_IN_THE_COMPARISON_2) and the classical GOD_4 (GOD_IN_THE_COMPARISON_3): it says some most-real candidate is God, it does not identify the two predicates. Sibling of the definitional argument of part 1. Its second premise is EXISTENCE_8, an extensional surrogate of 'existence is a real predicate' whose warrant Kant's thesis targets (the strengthened rival is recorded), which the nuclear (EXISTENCE_5) and encoding (EXISTENCE_7) reconstructions replace by a characterizing existence that does not give membership among the beings, and which, like the definitional P2, must not be made true by choice of profile alone. Establishes neither premise."

