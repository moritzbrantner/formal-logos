# Present-tense receipt of esse and the correlativity of receiving and giving.
# The named next test of the sustaining-versus-existential-inertia comparison
# (attempt 21883b61; docs/notes/sustaining-vs-existential-inertia.md, section 5):
# does a present-tense reading of reception, with a principle that receiving
# and giving go together, derive weak concurrent actualization 40a97664, and
# does it carry warrant independent of 40a97664? Analyst formulations,
# attribution deferred.

[batch]
vocab = "TruthCore.Causality.PresentReceipt"
results = "TruthCore.Results.Causality.PresentReceipt"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Whatever has received esse is receiving it at every moment at which it is present"
lean = "ReceptionIsPresent"
paraphrase = "OPEN analyst premise, attribution deferred (present-tense reading of reception): in every history of the model, whatever has its esse received in a principle z (EsseReceivedIn x z, DEF-ESSE-RECEIVED-IN, tenseless) is, at every moment t at which it is present, receiving its esse in z at t (Receipt.ReceivesAt v z x t, the primitive present-tense receipt of definition 506ea036): 'x has esse as received, at each t'. Stated over the primitive, which is open between the senses of disambiguation 71d3bdb7; on RECEIVES_ESSE_AT_2 (standing composition) it holds by definition, on RECEIVES_ESSE_AT_1 (passion) it is equivalent to weak concurrent actualization 40a97664. It names no giver; with correlativity it gives 40a97664. Entails the onset reading (registered strength order); strictly stronger (Control part 1: receipt at the first moment only). An existential inertialist who accepts correlativity must deny it, by result 7c62adb5 and the rejection of 40a97664; Control part 1 exhibits that position."
definitions = ["DEF-ESSE-RECEIVED-IN", "506ea036-c6bf-4e2d-aee3-7b25bfcdfea6", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-ESSE"]
disambiguations = ["DISAMB-ESSE-RECEPTION", "71d3bdb7-92cc-4023-b0ca-1739914628e4"]

[[statement]]
id = "Whatever has received esse is receiving it at a first moment of its presence"
lean = "ReceptionAtOnset"
paraphrase = "OPEN analyst premise, attribution deferred (onset reading of reception): in every history of the model, whatever has its esse received in a principle z (DEF-ESSE-RECEIVED-IN) is receiving its esse in z (Receipt.ReceivesAt, definition 506ea036) at a first moment of its presence (BeginsAt: present then and at no strictly earlier moment): 'x received esse at onset'. Silent on later moments and on things with no first moment of presence. It is the part of the past-tense reading that the sustaining side grants (it follows from the present-tense reading) and an inertialist can grant (Control part 1): the past-tense reading proper is this premise together with denying receipt at later moments, which is not a statement here. Entailed by the present-tense reading (registered strength order). With correlativity it gives only that received onset is given (fa3e228b), which the inertialist grants."
definitions = ["DEF-ESSE-RECEIVED-IN", "506ea036-c6bf-4e2d-aee3-7b25bfcdfea6", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-ESSE"]
disambiguations = ["DISAMB-ESSE-RECEPTION", "71d3bdb7-92cc-4023-b0ca-1739914628e4"]

[[statement]]
id = "Whatever is receiving its esse at a moment is given being then by something"
lean = "ReceivingIsCorrelativeWithGiving"
paraphrase = "OPEN analyst premise, attribution deferred (correlativity of receiving and giving): in every history of the model, if a principle z is receiving the esse of x at moment t (Receipt.ReceivesAt v z x t, the primitive of definition 506ea036), then something gives x being at t (GivesAt v g x t for some g, definition 158301bc, STRICT esse-giving reading). The giver need not be distinct from x, unique, or a tenseless cause of x's being. Stated over the primitive, which is open between the senses of disambiguation 71d3bdb7: on RECEIVES_ESSE_AT_1 (passion) it holds by definition; on RECEIVES_ESSE_AT_2 (standing composition) it is equivalent to weak concurrent actualization 40a97664. An existential inertialist who accepts the present-tense reading must deny it, by result 7c62adb5 and the rejection of 40a97664; Control part 2 exhibits that position with standing receipt."
definitions = ["506ea036-c6bf-4e2d-aee3-7b25bfcdfea6", "158301bc-9585-4145-be60-34f08c9f922c", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-ESSE"]
disambiguations = ["71d3bdb7-92cc-4023-b0ca-1739914628e4"]

[[statement]]
id = "On RECEIVES_ESSE_AT_1 receiving entails giving and present receipt is concurrent actualization"
lean = "PassionReadingIsTheCrux"
paraphrase = "Closed definitional result, attribution deferred: for every history, giving relation and reception predicate, when present-tense receipt is read as passion (passionReceipt, RECEIVES_ESSE_AT_1: z receives x's esse at t iff x's esse is received in z and something gives x being at t; a bare conjunction, nothing ties the giving to z), correlativity of receiving and giving holds, and the present-tense reading of reception is equivalent to weak concurrent actualization 40a97664. So on this sense the present-tense reading is 40a97664 restated, not a further premise; it adds no warrant beyond whatever warrant 40a97664 has."
definitions = ["ac8dbcaa-09d9-4f9e-9d19-995b38642f82", "DEF-ESSE-RECEIVED-IN", "158301bc-9585-4145-be60-34f08c9f922c", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-ESSE"]
disambiguations = ["71d3bdb7-92cc-4023-b0ca-1739914628e4", "DISAMB-ESSE-RECEPTION"]

[[statement]]
id = "On RECEIVES_ESSE_AT_2 present receipt holds and correlativity is concurrent actualization"
lean = "StandingReadingIsTheCrux"
paraphrase = "Closed definitional result, attribution deferred: for every history, giving relation and reception predicate, when present-tense receipt is read as standing composition (standingReceipt, RECEIVES_ESSE_AT_2: z receives x's esse at t iff x's esse is received in z and x is present at t), the present-tense reading of reception holds, and correlativity of receiving and giving is equivalent to weak concurrent actualization 40a97664. So on this sense the present-tense reading costs nothing and correlativity is 40a97664 restated."
definitions = ["181bb18f-72a4-4cb1-b5c0-9a70f5af2bb5", "DEF-ESSE-RECEIVED-IN", "158301bc-9585-4145-be60-34f08c9f922c", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-ESSE"]
disambiguations = ["71d3bdb7-92cc-4023-b0ca-1739914628e4", "DISAMB-ESSE-RECEPTION"]

[[statement]]
id = "Present-receipt controls: past-tense and standing receipt under inertia, nonvacuity"
lean = "Control.Certificate"
paraphrase = "Closed controls on interpretations with one world, natural-number times and two individuals, false alone with received esse; statements about these interpretations only. (1) Inertia (true gives false being at time 1 only; false persists from time 1), receipt at time 1 only: the onset reading and correlativity hold; the present-tense reading and 40a97664 fail; received onset is given. (2) Inertia, standing receipt (RECEIVES_ESSE_AT_2): the present-tense and onset readings hold; correlativity and 40a97664 fail. (3) Sustaining (true gives false being from time 1 on), no receipt: 40a97664 and correlativity hold; the present-tense and onset readings fail, so for a fixed receipt interpretation 40a97664 does not entail the present-tense reading (the unconstrained primitive is not definitionally 40a97664; with the interpretation quantified existentially the pair is equivalent to 40a97664, result someReceiptCarriesTheCrux). (4) Inertia with no giving and no receipt: correlativity holds; the onset reading and received onset fail. (5) Inertia with no giving, standing receipt: the onset reading holds; correlativity and received onset fail. (6) Sustaining, standing receipt: the present-tense reading, the onset reading, correlativity and 40a97664 all hold."
definitions = ["506ea036-c6bf-4e2d-aee3-7b25bfcdfea6", "181bb18f-72a4-4cb1-b5c0-9a70f5af2bb5", "DEF-ESSE-RECEIVED-IN", "158301bc-9585-4145-be60-34f08c9f922c", "DEF-TEMPORAL-HISTORY-NOW-SLICE"]
disambiguations = ["71d3bdb7-92cc-4023-b0ca-1739914628e4", "DISAMB-ESSE-RECEPTION"]

[[statement]]
id = "Some receipt gives present-tense reception and correlativity iff concurrent actualization"
lean = "SomeReceiptCarriesTheCrux"
paraphrase = "Closed result, attribution deferred: for every history, giving relation and reception predicate, there is a receipt interpretation (a value of the primitive present-tense receipt, definition 506ea036) satisfying both the present-tense reading of reception and correlativity of receiving and giving iff weak concurrent actualization 40a97664 holds. Forward by the derivation from the two premises; backward by the standing-composition sense (RECEIVES_ESSE_AT_2), on which the present-tense reading holds and correlativity is 40a97664. So the pair, with its receipt interpretation left open, says exactly what 40a97664 says; it can carry further content only through a fixed reading of receipt."
definitions = ["506ea036-c6bf-4e2d-aee3-7b25bfcdfea6", "DEF-ESSE-RECEIVED-IN", "158301bc-9585-4145-be60-34f08c9f922c", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-ESSE"]
disambiguations = ["71d3bdb7-92cc-4023-b0ca-1739914628e4", "DISAMB-ESSE-RECEPTION"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "Concurrent actualization from present-tense receipt and correlativity"
theorem = "concurrentOfPresentReceipt"
premises = ["Whatever has received esse is receiving it at every moment at which it is present", "Whatever is receiving its esse at a moment is given being then by something"]
conclusion = "40a97664-e481-42d7-8458-78374a61aa26"
transcription = "single_application"
axioms = []
rule = "The present-tense reading supplies receipt at each moment of presence; correlativity supplies a giver at that moment"
meaning = "Transcription (single application, invariant 16): the last step applies correlativity, whose consequent is the conclusion's matrix. Let x have its esse received in z and be present at t in history v; by the present-tense reading z is receiving x's esse at t; by correlativity something gives x being at t. That is weak concurrent actualization 40a97664. Its point is to locate the crux, not to support it: each premise is needed in a checked interpretation (Control part 1, past-tense receipt under inertia, where correlativity holds; part 2, standing receipt under inertia, where the present-tense reading holds), and both hold with 40a97664 in part 6. For a fixed receipt interpretation the pair is strictly stronger than 40a97664 (part 3); with the interpretation quantified existentially it is equivalent to 40a97664 (someReceiptCarriesTheCrux). On each defined sense one premise is 40a97664 restated (passionReadingIsTheCrux, standingReadingIsTheCrux), so the derivation supplies no warrant for 40a97664 beyond that of 40a97664 itself unless a reading of receipt with content beyond reception plus presence gives correlativity warrant independent of 40a97664. All premises stay OPEN. No premise is established."

[[argument]]
id = "Received onset is given, from onset receipt and correlativity"
theorem = "onsetOfOnsetReceipt"
premises = ["Whatever has received esse is receiving it at a first moment of its presence", "Whatever is receiving its esse at a moment is given being then by something"]
conclusion = "fa3e228b-7ed7-4441-aa36-4b120792b148"
transcription = "single_application"
axioms = []
rule = "The onset reading supplies receipt at the first moment; correlativity supplies a giver then"
meaning = "Transcription (single application, invariant 16): the last step applies correlativity. With the onset reading in place of the present-tense reading, correlativity yields only that a received-esse thing is given being at a first moment of its presence (fa3e228b), which the existential inertialist grants (Control part 1). Each premise is needed in a checked interpretation (part 4, no receipt; part 5, standing receipt with no giving). It shows that correlativity is compatible with existential inertia: the difference between the two conclusions is exactly the difference between the present-tense and the onset reading. All premises stay OPEN. No premise is established."

[[argument]]
id = "Present-tense reception entails onset reception"
theorem = "onsetOfPresentReceipt"
premises = ["Whatever has received esse is receiving it at every moment at which it is present"]
conclusion = "Whatever has received esse is receiving it at a first moment of its presence"
axioms = []
rule = "A first moment of presence is a moment of presence"
meaning = "Strength order registration: the present-tense reading of reception entails the onset reading, since a first moment of presence (BeginsAt) is a moment at which the thing is present. A single application of the premise (invariant 16), registered for the strength order, not as progress; it establishes neither. Strict: Control part 1 (receipt at the first moment only)."

[[argument]]
id = "On RECEIVES_ESSE_AT_1 present receipt is concurrent actualization, checked"
theorem = "passionReadingIsTheCrux"
premises = []
conclusion = "On RECEIVES_ESSE_AT_1 receiving entails giving and present receipt is concurrent actualization"
axioms = []
senses = {RECEIVES_ESSE_AT = "RECEIVES_ESSE_AT_1"}
rule = "Unfold passionReceipt: receipt includes a giver at the moment; the present-tense reading then says a giver exists at every moment of presence"
meaning = "Closed result with no premises, quantified over every history, giving relation and reception predicate. On the passion sense, correlativity is the second conjunct of the definition, and the present-tense reading of reception, after its first conjunct (the reception hypothesis itself), says that at every moment at which a received-esse thing is present something gives it being: weak concurrent actualization 40a97664, in both directions. It shows that on this sense the present-tense reading is 40a97664 under another name. It establishes nothing about reality."

[[argument]]
id = "On RECEIVES_ESSE_AT_2 correlativity is concurrent actualization, checked"
theorem = "standingReadingIsTheCrux"
premises = []
conclusion = "On RECEIVES_ESSE_AT_2 present receipt holds and correlativity is concurrent actualization"
axioms = []
senses = {RECEIVES_ESSE_AT = "RECEIVES_ESSE_AT_2"}
rule = "Unfold standingReceipt: receipt is reception plus presence, so the present-tense reading is immediate and correlativity becomes 40a97664 with its arguments reordered"
meaning = "Closed result with no premises, quantified over every history, giving relation and reception predicate. On the standing-composition sense the present-tense reading of reception holds by definition, and correlativity (whatever is receiving at t is given being at t) says that whatever has received esse and is present at t is given being at t: weak concurrent actualization 40a97664, in both directions. It shows that on this sense correlativity is 40a97664 under another name. It establishes nothing about reality."

[[argument]]
id = "Some receipt with correlativity is concurrent actualization, checked"
theorem = "someReceiptCarriesTheCrux"
premises = []
conclusion = "Some receipt gives present-tense reception and correlativity iff concurrent actualization"
axioms = []
rule = "Forward: compose the present-tense reading with correlativity; backward: take the standing-composition receipt"
meaning = "Closed result with no premises, quantified over every history, giving relation and reception predicate. If some receipt interpretation satisfies the present-tense reading and correlativity, then weak concurrent actualization 40a97664 holds (the derivation 7c62adb5). Conversely, if 40a97664 holds, the standing-composition receipt (RECEIVES_ESSE_AT_2) satisfies the present-tense reading by definition and correlativity by standingReadingIsTheCrux. So the present-receipt pair adds nothing to 40a97664 unless the receipt relation is fixed by a reading that carries further content; the separation in Control part 3 holds only for a fixed interpretation. It establishes nothing about reality."

[[argument]]
id = "Present-receipt controls checked"
theorem = "controls"
premises = []
conclusion = "Present-receipt controls: past-tense and standing receipt under inertia, nonvacuity"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit one-world interpretations over natural-number times with two individuals, checked by case analysis and linear arithmetic"
meaning = "The inertial history with past-tense receipt satisfies the onset reading and correlativity and falsifies the present-tense reading and 40a97664; with standing receipt it satisfies the present-tense and onset readings and falsifies correlativity and 40a97664; the sustaining history with no receipt satisfies 40a97664 and falsifies the present-tense reading; each premise of the onset derivation is needed in one interpretation; all premises and 40a97664 hold together in one interpretation. A finite countermodel shows a premise is needed in that interpretation, not that it is false. Model claims concern these interpretations only."

