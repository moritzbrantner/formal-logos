[[argument]]
id = "Brute-existence parity map checked"
theorem = "parityMap"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_mixing_control = true
premises = []
conclusion = "Brute-existence parity: symmetric demand, comparison of explanations, stances bound"
rule = "General laws and explicit finite stances and pictures"
meaning = "Premise-free laws: the #756 fork for the ontic demand, the failure of necessitating demands for contingent facts with only necessary reasons, and the reused #746 core that well-founded factive reasons always leave a truth unexplained, which binds both sides. Then a scene of seven pictures (many brute contingents, one brute initial state, an unreasoned and a self-explained necessary physical base, an unreasoned and a self-explained God, a contingent self-explained God), an observation inquiry and seven stances: the exact unexplained existents of each picture under bare and necessitating reasons; that evidence for an existent is no reason why it exists; which stances the parity argument binds (on either side, a stance whose ground of rejection is the reason status) and which it does not (evidential, symmetric, idleness); a deletion witness for each member of the parity bundle; the theist under the same tests; and the same-witness rival in the brute first-mover frame. No stance is attributed to anyone, and no picture is claimed metaphysically possible."
