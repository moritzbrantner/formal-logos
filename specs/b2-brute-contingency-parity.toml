[[relation]]
id = "Brute contingency is an alternative to B2"
subject_kind = "statement"
subject_id = "Some being contingent at w has no distinct CAUSE_2 of its esse and no reason for its existence"
predicate = "alternative_to"
object_kind = "statement"
object_id = "Every being contingent at w has a distinct CAUSE_2 of its esse"
note = "Target: B2, at its own scope (same frame, same world, CAUSE_2 at esse). Mechanism: a contingent being whose existence has no cause of its esse and no reason, so B2 has a counterinstance. Positive replacement account: a contingent foundation (initial state or foundational being) whose existence is a brute fact. Strongest positive support for the mechanism: (a) the #755 collapse core, under which a contingent-fact PSR with necessitating, factive, distributing reasons and an aggregate of all contingent truths leaves no contingency; it binds the necessitating PSR, not the bare-reason coverage used for B2 here, which needs no aggregate and no necessitation; (b) the sourced Kleinschmidt rival (#312), that justified preference for explanations need not presuppose coverage, which removes one epistemic defense of coverage and does not show that any existent has no reason. The brute first-mover model shows only that the rival is consistent with every other premise of the five necessity routes, a fact about one formal interpretation, not evidence against B2. Its price, derived from its own commitments: it must deny the local existence PSR for contingents at w (and with it the contingent-fact PSR at w), reject at least one member of each support bundle for B2 (existence PSR with BX1 and BX2; concreteness, grounding closure and the ground-to-cause bridge; B6, existence-to-act and the q.3 a.4 reading), take the brute horn of the stopping-point fork, and under EvidenceBridge it cannot use the foundation's existence as evidence for anything. A stance that requires a reason why God exists on the reason-status feature and is uniform in it cannot hold this rival (parity argument); the same demand binds the theist, so the live question is comparative. At matching scope, the rival's strongest form is one brute initial state or one unreasoned necessary physical base (one unexplained existent, as an unreasoned God); it ties the self-explained God only by giving its base a self-reason ('existence by its own nature'), which then counts under contingent irreflexivity only for a noncontingent base, and the arena does not separate a self-explained necessary physical base from a self-explained God (parity map). The theist's advantage over the one-unexplained-terminus rivals is real only if existence by its own nature is a reason, which rests on B6 (BX1 for the essence-esse own-nature model is exactly B6). Revision conditions: an independent argument that some contingent existent has no reason, or a defeat of the existence PSR for contingents that does not equally defeat its use in inquiry. See docs/notes/psr-self-application-756.md, 'Brute contingency and parity'."

