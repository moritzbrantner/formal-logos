note = "Target: B2, at its own scope (same frame, same world, CAUSE_2 at esse). Mechanism: a contingent being whose existence has no cause of its esse and no reason, so B2 has a counterinstance. Positive replacement account: a contingent foundation (initial state or foundational being) whose existence is a brute fact. Strongest positive support for the mechanism: (a) the #755 collapse core, under which a contingent-fact PSR with necessitating, factive, distributing reasons and an aggregate of all contingent truths leaves no contingency; it binds the necessitating PSR, not the bare-reason coverage used for B2 here, which needs no aggregate and no necessitation; (b) the sourced Kleinschmidt rival (#312), that justified preference for explanations need not presuppose coverage, which removes one epistemic defense of coverage and does not show that any existent has no reason. No recorded independent justification for the rival reaches B2's scope. The brute first-mover model shows only that the rival is consistent with every other premise of the five necessity routes, a fact about one formal interpretation, not evidence against B2. Entailed denials (their weight is only the warrant of the denied premises, all open): it denies the local existence PSR for contingents at w (and with it the contingent-fact PSR at w), rejects at least one member of each support bundle for B2 (existence PSR with BX1 and BX2; concreteness, grounding closure and the ground-to-cause bridge; B6, existence-to-act and the q.3 a.4 reading), and takes the brute horn of the stopping-point fork. Conditional cost: if EvidenceBridge held (it follows from the contingent-fact PSR the rival denies, and is not one of the rival's commitments), the foundation's existence could not be used as evidence. A stance that requires a reason why God exists on the reason-status feature and is uniform in it cannot hold this rival (parity argument). The relation concerns the brute contingent foundation only; the comparison 