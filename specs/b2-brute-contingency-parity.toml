[[statement]]
id = "The stance requires a reason why the target fact obtains"
lean = "RequiresWhyFor"
paraphrase = "P1 of the parity argument, analyst formulation, attribution deferred: the stance requires, as a condition of accepting the target fact (in the naturalist instance, that God exists; in the theist instance, that a contingent being exists), a reason why it obtains (ONTIC, the #755 explains), so that, meeting its demand, it rejects the target posited with no reason. It is not the epistemic demand for a reason to accept the target. No person or author is said to hold it."
definitions = ["d0f8d6b9-8086-4bf7-95e1-46bb74d76398", "DEF-PSR-STRENGTH-REASON"]
disambiguations = ["DISAMB-REASON-EPISTEMIC-ONTIC"]

[[statement]]
id = "The target fact and the stance's accepted fact agree on the feature"
lean = "ShareFeature"
paraphrase = "P2 of the parity argument, analyst formulation, attribution deferred: the target fact and the fact the stance accepts (in the naturalist instance, that God exists and that the contingent foundation exists) agree on the supplied feature k: both have it or both lack it. Whether they agree depends on k and on how each is posited: on the reason-status feature they agree when God is posited as unreasoned and differ when God is posited with a reason by its own nature (parity map)."
definitions = ["a17def9d-5354-4510-8a2e-34436ff486d4"]

[[statement]]
id = "The stance's demand for reasons why is uniform in the feature"
lean = "FeatureUniform"
paraphrase = "P3 of the parity argument, the consistency norm, analyst formulation, attribution deferred: any two facts agreeing on the feature k are alike required, or alike not required, to have a reason why they obtain. Relative to k: the same stance can be uniform in one feature and not in another, and nothing here says which feature is the right ground of a demand."
definitions = ["a17def9d-5354-4510-8a2e-34436ff486d4", "d0f8d6b9-8086-4bf7-95e1-46bb74d76398"]
disambiguations = ["DISAMB-REASON-EPISTEMIC-ONTIC"]

[[statement]]
id = "The stance cannot meet its demand for reasons why and accept the fact as a brute contingent truth"
lean = "ExcludesBruteRival"
paraphrase = "Conclusion of the parity argument: in any picture and at any world, the stance does not at once meet its demand for reasons why, accept the fact o, and have o a contingent truth with no reason there. For o the existence of the contingent foundation, the stance cannot hold the brute-contingency rival. It is a consistency verdict on the stance; it does not say o has a reason, and it does not establish B2. For a necessary o (God's existence, a necessary base) it holds vacuously, since BruteAt requires contingency; the stronger sibling without contingency is what binds acceptance of an unreasoned necessary existent."
definitions = ["d0f8d6b9-8086-4bf7-95e1-46bb74d76398", "DEF-PSR-RESTRICTED-SCOPE", "DEF-PSR-STRENGTH-ARENA", "DEF-PSR-STRENGTH-REASON"]
disambiguations = ["DISAMB-REASON-EPISTEMIC-ONTIC"]

[[statement]]
id = "The stance cannot meet its demand for reasons why and accept the fact with no reason"
lean = "ExcludesUnreasonedAcceptance"
paraphrase = "Stronger conclusion of the parity argument: in any picture and at any world, the stance does not at once meet its demand for reasons why, accept the fact o, and have o without a reason there, whether o is contingent or necessary. It binds both sides: a naturalist who requires a reason why God exists cannot accept an unreasoned contingent foundation, and a theist who requires a reason why contingent existents obtain cannot accept an unreasoned God, each under its own P1-P3 (parity map). A necessary fact with no reason is unreasoned, not brute (DISAMB-BRUTE-TERMINAL-UNREASONED). It is a consistency verdict on the stance; it does not say o has a reason, and it does not establish B2."
definitions = ["d0f8d6b9-8086-4bf7-95e1-46bb74d76398", "DEF-PSR-STRENGTH-ARENA", "DEF-PSR-STRENGTH-REASON"]
disambiguations = ["DISAMB-REASON-EPISTEMIC-ONTIC", "DISAMB-BRUTE-TERMINAL-UNREASONED"]

[[statement]]
id = "Brute-existence parity: symmetric demand, comparison of explanations, stances bound"
lean = "ParityMap"
paraphrase = "Premise-free laws and finite models (logical boundaries; no stance is attributed to anyone). Laws: a stance that requires a reason why for t, meets its demand and accepts a brute contingent truth o is not uniform on t and o, selective (#756) relative to every feature on which they agree and restricted relative to every feature on which they differ; no stance meets a necessitating demand for an accepted contingent fact all of whose reasons are true at every accessible world; and, for both sides alike, factive reasons that are well-founded at a world with some truth leave some truth there without a reason (#746 second core), so a picture with no unexplained existent needs reasons that are not well-founded there: a self-reason, a circle or an infinite chain; in the scene, a self-reason. Circles and an endless regress of contingents, each explained by its predecessor (#746 cofinite), are not scene pictures (named gap, with the whole-series question of the #755 collapse core and attempt a5958e25). Scene-relative tallies at the reading world, listing exactly the unexplained existents (they rank nothing by themselves: a bare preference for fewer unexplained facts favours copying reasons, the #746 count control; a ranking needs an open comparative principle such as the #750 adequacy norm): many diverse brute contingents (the atom and the star), one brute contingent initial state, one unreasoned necessary physical base and one unreasoned God (one each; a necessary fact with no reason is unreasoned, not brute, DISAMB-BRUTE-TERMINAL-UNREASONED), and none for a necessary physical base or God whose existence has a self-reason ('by its own nature'); counting only necessitating reasons, the last two each leave the contingent initial state (the free choice or indeterministic output), and the unreasoned-terminus pictures leave the terminus and the initial state. The four pictures with an unexplained existent have factive, well-founded reasons; the two with none are factive and contingent-irreflexive with a self-reason, so not well-founded, and their lists agree with God and the base exchanged. Evidence is not explanation: an observation supports that the initial state exists while it has no reason why it exists, and the evidential stance meets its epistemic demand and still holds it as a brute contingent truth. Readings: with God posited as unreasoned, God's existence and the initial state's agree on the reason-status feature; with God's existence self-explained, they differ. Symmetric binding, through the stronger sibling conclusion: a naturalist (target God) and a theist (target the initial state) each satisfy P1-P3 in the reason-status feature, and neither can accept an unreasoned existent, the initial state or God respectively; for the necessary God the weaker brute-rival conclusion holds only vacuously. The naturalist requiring reasons why for all it accepts meets its demand with the self-explained base and not with the unreasoned base. A stance requiring a reason why for God only holds the rival, is uniform in idleness and not in the reason-status feature, so it is bound exactly when its ground for rejecting God is the reason status. Deletions: without P1 (evidential and symmetric stances), without P2 (idleness), without P3, without meeting the demand, without bruteness. The theist meets its demand with some reason and fails it with necessitating reasons; its self-reason counts under contingent irreflexivity only while God is not contingent. Same witness: in the arena of the brute first-mover frame, the First Way's mover's existence is a brute contingent truth."
definitions = ["d0f8d6b9-8086-4bf7-95e1-46bb74d76398", "a17def9d-5354-4510-8a2e-34436ff486d4", "DEF-EXEMPTION-STANDING", "DEF-DEMAND-STANCE", "DEF-PSR-RESTRICTED-SCOPE", "DEF-PSR-STRENGTH-ARENA", "DEF-PSR-STRENGTH-REASON", "DEF-PSR-REASON-NECESSITATING", "DEF-STOP-TERMINAL", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["DISAMB-REASON-EPISTEMIC-ONTIC", "DISAMB-ESSENTIAL-VS-ACCESSIBLE-EXISTENCE", "DISAMB-BRUTE-TERMINAL-UNREASONED"]

[[argument]]
id = "B2 from a local existence PSR for contingents and two reason bridges"
theorem = "esseCauseFromExistenceReasons"
premises = ["Every being contingent at w has some reason for its existence", "No reason for the existence of a being contingent at w is about that being itself", "The other being a reason for a contingent being's existence is about is a CAUSE_2 of its esse"]
conclusion = "Every being contingent at w has a distinct CAUSE_2 of its esse"
rule = "Instantiate the existence PSR, then the two reason bridges at its reason"
meaning = "A being x contingent at w has some reason r for its existence at w (local existence PSR for contingents). By BX1 the being r is about is not x; by BX2 that other being causes x's esse. So x has a distinct CAUSE_2 of its esse. The #312 tokens sit on the frame's own existence, and BX2's cause is the frame's CausesIn at esse, so the conclusion is B2 on the same frame. It splits B2 into a reason-coverage half, which the brute-contingency rival denies, and a reason-to-cause half (BX1, BX2), which a rival with non-causal reasons for contingent existence would deny."
description = "Support option for B2 from the PSR family on the shared frame. Not a transcription: no premise mentions esse-causes of contingents as such; the conclusion composes coverage by reasons with two bridges about reasons. Each premise is needed (controls, models 1-3) and the bundle is satisfiable nonvacuously (model 4). B2 gives neither the existence PSR nor BX1 (models 5-6). Establishes no premise."

[[argument]]
id = "B2 from the selected-grounding closure and the ground-to-esse-cause bridge"
theorem = "esseCauseFromGroundingClosure"
premises = ["Every being contingent at w is CONCRETE_AND_ABSTRACT_6", "STMT-EVERY-CONTINGENT-GROUNDED-AT", "98efaa9e-1c91-4e52-8c0d-faf03d4f8372"]
conclusion = "Every being contingent at w has a distinct CAUSE_2 of its esse"
rule = "Closure at a concrete contingent being, then the ground-to-cause bridge"
meaning = "A being x contingent at w is concrete (interface), exists at w and is contingent, so the existing closure gives it an actual concrete ground y at w under the selected relation. The existing bridge 'an actual concrete ground of an actual concretum is a distinct CAUSE_2 of its esse' makes y distinct from x and a cause of its esse. So x has a distinct CAUSE_2 of its esse: B2, on the profile built from the same frame."
description = "Support option for B2 from the grounding family on the shared frame. Not a transcription: the closure gives a ground, the bridge converts it into a distinct esse-cause, and the interface supplies concreteness. Each premise is needed (controls, models 7-9) and the bundle is satisfiable nonvacuously (model 10). It shares the closure with the existing grounding route to the First Way's mover, so it adds a connection, not independent warrant. Establishes no premise."

[[argument]]
id = "Parity: a feature-uniform demand for a reason why excludes a brute contingent truth"
theorem = "parity"
premises = ["The stance's demand for reasons why is uniform in the feature", "The stance requires a reason why the target fact obtains", "The target fact and the stance's accepted fact agree on the feature"]
conclusion = "The stance cannot meet its demand for reasons why and accept the fact as a brute contingent truth"
rule = "Uniformity transfers the demand along the shared feature; the demand met excludes bruteness"
meaning = "The owner's parity argument, analyst formulation, attribution deferred. The stance requires a reason why the target exists (P1), its demand is uniform in a feature k (P3) on which the target and the accepted fact o agree (P2). So it requires a reason why o obtains. If it met its demand and accepted o, o would have a reason, so it is not a brute contingent truth. For the naturalist who rejects an unreasoned God, God's existence as a mere brute fact in the owner's wording (target God, o the contingent foundation), it excludes the brute-contingency rival. This form concerns contingent o only: for a necessary o it holds vacuously, so the symmetric form is the stronger sibling (no reason at all, contingent or not). It establishes neither B2 nor that anything has a reason, it does not answer whether there is evidence for God, and it binds only stances that hold P1, P2 and P3 for one feature."
description = "The parity argument, brute-contingent form: a stance-level consistency result. Valid by a short derivation (the demand is transferred by uniformity, then met); all its weight is on P1-P3. It lowers the standing of the brute-contingency rival only for stances holding all three; it is not support for B2. Each member of the bundle is deleted by a named stance in the parity map. Establishes no premise."

[[argument]]
id = "Parity, symmetric form: a feature-uniform demand excludes accepting an unreasoned fact"
theorem = "parityUnreasoned"
premises = ["The stance's demand for reasons why is uniform in the feature", "The stance requires a reason why the target fact obtains", "The target fact and the stance's accepted fact agree on the feature"]
conclusion = "The stance cannot meet its demand for reasons why and accept the fact with no reason"
rule = "Uniformity transfers the demand along the shared feature; the demand met excludes having no reason"
meaning = "The owner's parity argument in its symmetric form, analyst formulation, attribution deferred. Under the same P1-P3, the stance requires a reason why o obtains, so meeting its demand it cannot accept o with no reason, whether o is contingent or necessary. It binds a naturalist who rejects an unreasoned God (target God, o the contingent foundation) and a theist who rejects unreasoned contingents (target a contingent existent, o God's existence) alike (parity map, both instances). With unreasoned existence rejected on both sides, what remains is a comparison of explanations of existence, which this argument does not settle: it needs an open comparative principle (#750) and the open adequacy of a self-reason. It establishes neither B2 nor that anything has a reason, and it does not answer whether there is evidence for God."
description = "The parity argument, symmetric form: a stance-level consistency result binding both sides. Valid by a short derivation; all its weight is on P1-P3. It strengthens the brute-contingent form (separate argument). It is not support for B2 or for God's existence. Establishes no premise."

[[argument]]
id = "Excluding unreasoned acceptance excludes the brute contingent rival"
theorem = "excludesBruteOfExcludesUnreasoned"
premises = ["The stance cannot meet its demand for reasons why and accept the fact with no reason"]
conclusion = "The stance cannot meet its demand for reasons why and accept the fact as a brute contingent truth"
rule = "A brute contingent truth has no reason"
meaning = "If the stance cannot meet its demand while accepting o with no reason, it cannot meet it while accepting o as a brute contingent truth, since such a truth has no reason. Strength order between the two parity conclusions."
description = "Strength order: the symmetric parity conclusion strengthens the brute-contingent one. A one-step weakening; it establishes no premise."

