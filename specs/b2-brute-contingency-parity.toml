# B2 (every being contingent at w has a distinct CAUSE_2 of its esse), its
# strongest standing rival (brute contingency) and the owner's parity argument
# (owner direction 2026-11-23). Two further support options for B2 on the shared
# CausalityFrame (#1784): reasons for existence (#312 tokens) with two reason
# bridges, and the selected-grounding closure with the existing ground-to-cause
# bridge. The rival is stated at the scope of B2. The parity argument is a
# stance-level consistency argument over the #755 arena and #756 stances.
# Analyst formulations, attribution deferred; no source claim.

[batch]
vocab = "TruthCore.Explanation.BruteContingencyParity"
results = "TruthCore.Results.Explanation.BruteContingencyParity"

[[statement]]
id = "Every being contingent at w has some reason for its existence"
lean = "NoBruteContingentExistenceAt"
paraphrase = "OPEN, analyst formulation, attribution deferred: the local existence PSR for contingents. At the selected world w, every being that exists at w and is absent at some accessible world (MODAL_CONTINGENCY_1) has some #312 reason token explaining its existence fact at w. It is the contingent-only, single-world weakening of STMT-NO-BRUTE-EXISTENCE-AT (which also covers necessary existents); the restriction is a law of the B2 controls. No strengthens relation is registered: a new argument with STMT-NO-BRUTE-EXISTENCE-AT as premise fails the sense check, because that statement links both senses of BRUTE_EXISTENCE_FACT_VERSUS_GROUNDING_BRUTE (a pre-existing record, left unchanged). It says nothing about the kind of reason: a reason token need not be a cause, concrete, adequate or noncircular."
definitions = ["e7302a28-f9fc-4961-811f-bf58bd86c28d", "DEF-PSR-REASON", "DEF-PSR-EXISTENCE-FACT", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-KANT-CONTINGENCY", "DISAMB-BRUTE-EXISTENCE-AND-GROUNDING"]

[[statement]]
id = "No reason for the existence of a being contingent at w is about that being itself"
lean = "ContingentExistenceNotSelfExplained"
paraphrase = "OPEN bridge (BX1), analyst formulation, attribution deferred: for every being contingent at w, every #312 reason token explaining its existence at w is about some other being: neither its own nature (an intrinsic token, NECESSARY_EXISTENCE_BY_OWN_NATURE_4) nor itself as a circumstance. The being-level form of contingent irreflexivity. Under it, a being with an own-nature token at w is not contingent at w (controls). For the own-nature model read through essence-esse identity it is exactly B6 (contrapositive form) at w (controls)."
definitions = ["7cff4318-201a-430d-9680-10f5148a3b01", "DEF-PSR-REASON", "DEF-PSR-EXISTENCE-FACT", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-KANT-CONTINGENCY", "DISAMB-ESSENTIAL-VS-ACCESSIBLE-EXISTENCE"]

[[statement]]
id = "The other being a reason for a contingent being's existence is about is a CAUSE_2 of its esse"
lean = "ExistenceReasonSourceCausesEsse"
paraphrase = "OPEN bridge (BX2), analyst formulation, attribution deferred: if a #312 reason token explaining at w the existence of a being contingent at w is about another being, that other being causes its esse (the frame's CausesIn at esse, CAUSE_2, mode not fixed). The causal reading of existential reasons by another. It does not say every cause is a reason, that the cause exists at w, or that it is efficient."
definitions = ["7cff4318-201a-430d-9680-10f5148a3b01", "DEF-PSR-REASON", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CAUSE", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Every being contingent at w is CONCRETE_AND_ABSTRACT_6"
lean = "ContingentsConcrete"
paraphrase = "OPEN interface, analyst formulation, attribution deferred: every being contingent at w satisfies the concreteness predicate of the selected-grounding profile. It excludes contingent abstracta, for example a set of contingent individuals on criteria that count it abstract; the grounding support for B2 therefore covers contingent abstracta only through this interface, and leaves them otherwise untreated."
definitions = ["DEF-CONCRETE-ESSE-IN-RE", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Some being contingent at w has no distinct CAUSE_2 of its esse and no reason for its existence"
lean = "BruteContingentBeingAt"
paraphrase = "The brute-contingency rival to B2, at B2's scope, analyst formulation, attribution deferred: on the same causality frame and at the same world w, some being exists at w, is absent at some accessible world, has no other being causing its esse (CAUSE_2) and has no #312 reason token for its existence at w. Its positive replacement account is a contingent foundation (an initial state or foundational being) whose existence is a brute fact. It entails the denial of B2, of the local existence PSR for contingents, and of each recorded support bundle for B2 (controls); the brute first-mover model witnesses it with the First Way's own mover."
definitions = ["DEF-BRUTE-EXISTENCE-AT", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE", "DEF-PSR-REASON", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CAUSE", "DISAMB-KANT-CONTINGENCY", "DISAMB-BRUTE-EXISTENCE-AND-GROUNDING"]

[[statement]]
id = "B2 support options, the brute-contingency rival and their boundaries"
lean = "B2SupportControls"
paraphrase = "Premise-free laws and finite models (logical boundaries, not metaphysical possibility). Laws: each of the two support bundles (local existence PSR for contingents with BX1 and BX2; contingents concrete with the grounding closure and the ground-to-esse-cause bridge) gives B2; the local existence PSR for all existents gives its contingent-only form; the brute-contingency rival excludes B2, the contingent existence PSR and each support bundle; under BX1 a being with an own-nature reason token (NECESSARY_EXISTENCE_BY_OWN_NATURE_4) at w is not contingent at w; for the own-nature model read through essence-esse identity, BX1 at w is exactly B6 at w; and in the ofModel arena embedding a being's existence fact is a brute contingent truth exactly when the being is contingent and its existence has no reason. Models over the existing first-mover frames at the reading world: (1) the brute first mover with no reasons: BX1 and BX2 hold, the existence PSR and B2 fail, and the rival holds with the First Way's mover as witness; (2) own-nature reasons: the existence PSR and BX2 hold, BX1 and B2 fail, the mover contingent with an own-nature token; (3) the moved thing as a non-causing occasion: the existence PSR and BX1 hold, BX2 and B2 fail; (4) a conserved mover with that occasion causing its esse: all three hold and B2 holds; (5) B2 without the existence PSR; (6) B2 without BX1; (7)-(9) one omission model for each premise of the grounding support; (10) its nonvacuity model."
definitions = ["e7302a28-f9fc-4961-811f-bf58bd86c28d", "7cff4318-201a-430d-9680-10f5148a3b01", "8eea5215-bb68-4608-b6f8-5368d17617d4", "DEF-NO-BRUTE-EXISTENCE-AT", "DEF-PSR-REASON", "DEF-PSR-RESTRICTED-SCOPE", "DEF-PSR-STRENGTH-ARENA", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE", "DEF-ESSENCE-THOMISTIC-NATURE", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-CONCRETE-ESSE-IN-RE", "DEF-BRUTE-ROOT-RELATIVE-GROUNDING"]
disambiguations = ["DISAMB-CAUSE", "DISAMB-KANT-CONTINGENCY", "DISAMB-ESSENTIAL-VS-ACCESSIBLE-EXISTENCE", "DISAMB-BRUTE-EXISTENCE-AND-GROUNDING", "DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "The stance requires a reason why the target fact obtains"
lean = "RequiresWhyFor"
paraphrase = "P1 of the parity argument, analyst formulation, attribution deferred: the stance requires, as a condition of accepting the target fact (in the naturalist instance, that God exists; in the theist instance, that a contingent being exists), a reason why it obtains (ONTIC, the #755 explains), so that, meeting its demand, it rejects the target posited as a brute fact. It is not the epistemic demand for a reason to accept the target. No person or author is said to hold it."
definitions = ["d0f8d6b9-8086-4bf7-95e1-46bb74d76398", "DEF-PSR-STRENGTH-REASON"]
disambiguations = ["DISAMB-REASON-EPISTEMIC-ONTIC"]

[[statement]]
id = "The target fact and the stance's accepted fact agree on the feature"
lean = "ShareFeature"
paraphrase = "P2 of the parity argument, analyst formulation, attribution deferred: the target fact and the fact the stance accepts (in the naturalist instance, that God exists and that the contingent foundation exists) agree on the supplied feature k: both have it or both lack it. Whether they agree depends on k and on how each is posited: on the reason-status feature they agree when God is posited as brute and differ when God is posited with a reason by its own nature (parity map)."
definitions = ["a17def9d-5354-4510-8a2e-34436ff486d4"]

[[statement]]
id = "The stance's demand for reasons why is uniform in the feature"
lean = "FeatureUniform"
paraphrase = "P3 of the parity argument, the consistency norm, analyst formulation, attribution deferred: any two facts agreeing on the feature k are alike required, or alike not required, to have a reason why they obtain. Relative to k: the same stance can be uniform in one feature and not in another, and nothing here says which feature is the right ground of a demand."
definitions = ["a17def9d-5354-4510-8a2e-34436ff486d4", "d0f8d6b9-8086-4bf7-95e1-46bb74d76398"]
disambiguations = ["DISAMB-REASON-EPISTEMIC-ONTIC"]

[[statement]]
id = "The stance cannot meet its demand for reasons why and accept the fact as a brute contingent truth"
lean = "ExcludesBruteRival"
paraphrase = "Conclusion of the parity argument: in any picture and at any world, the stance does not at once meet its demand for reasons why, accept the fact o, and have o a contingent truth with no reason there. For o the existence of the contingent foundation, the stance cannot hold the brute-contingency rival. It is a consistency verdict on the stance; it does not say o has a reason, and it does not establish B2."
definitions = ["d0f8d6b9-8086-4bf7-95e1-46bb74d76398", "DEF-PSR-RESTRICTED-SCOPE", "DEF-PSR-STRENGTH-ARENA", "DEF-PSR-STRENGTH-REASON"]
disambiguations = ["DISAMB-REASON-EPISTEMIC-ONTIC"]

[[statement]]
id = "Brute-existence parity: symmetric demand, comparison of explanations, stances bound"
lean = "ParityMap"
paraphrase = "Premise-free laws and finite models (logical boundaries; no stance is attributed to anyone). Laws: a stance that requires a reason why for t, meets its demand and accepts a brute contingent truth o is not uniform on t and o, selective (#756) relative to every feature on which they agree and restricted relative to every feature on which they differ; no stance meets a necessitating demand for an accepted contingent fact all of whose reasons are true at every accessible world; and, for both sides alike, factive reasons that are well-founded at a world with some truth leave some truth there without a reason (#746 second core), so a picture with no unexplained existent needs reasons that are not well-founded there. Comparison at the reading world, listing exactly the unexplained existents: many diverse brute contingents (the atom and the star), one brute contingent initial state, one unreasoned necessary physical base and one unreasoned God (one each; a necessary fact with no reason is unreasoned, not brute, DISAMB-BRUTE-TERMINAL-UNREASONED), and none for a necessary physical base or God whose existence has a self-reason ('by its own nature'); counting only necessitating reasons, the last two each leave the contingent initial state (the free choice or indeterministic output), and the unreasoned-terminus pictures leave the terminus and the initial state. The four pictures with an unexplained existent have factive, well-founded reasons; the two with none are factive and contingent-irreflexive with a self-reason, so not well-founded, and their lists agree with God and the base exchanged. Evidence is not explanation: an observation supports that the initial state exists while it has no reason why it exists, and the evidential stance meets its epistemic demand and still holds it as a brute contingent truth. Readings: with God posited as unreasoned, God's existence and the initial state's agree on the reason-status feature; with God's existence self-explained, they differ. Symmetric binding: the naturalist requiring reasons why for all it accepts meets its demand with the self-explained base and not with the unreasoned base; the theist likewise with the self-explained and the unreasoned God. A stance requiring a reason why for God only holds the rival, is uniform in idleness and not in the reason-status feature, so it is bound exactly when its ground for rejecting God is the reason status. Deletions: without P1 (evidential and symmetric stances), without P2 (idleness), without P3, without meeting the demand, without bruteness. The theist meets its demand with some reason and fails it with necessitating reasons; its self-reason counts under contingent irreflexivity only while God is not contingent. Same witness: in the arena of the brute first-mover frame, the First Way's mover's existence is a brute contingent truth."
definitions = ["d0f8d6b9-8086-4bf7-95e1-46bb74d76398", "a17def9d-5354-4510-8a2e-34436ff486d4", "DEF-EXEMPTION-STANDING", "DEF-DEMAND-STANCE", "DEF-PSR-RESTRICTED-SCOPE", "DEF-PSR-STRENGTH-ARENA", "DEF-PSR-STRENGTH-REASON", "DEF-PSR-REASON-NECESSITATING", "DEF-STOP-TERMINAL", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["DISAMB-REASON-EPISTEMIC-ONTIC", "DISAMB-ESSENTIAL-VS-ACCESSIBLE-EXISTENCE", "DISAMB-BRUTE-TERMINAL-UNREASONED"]

[[argument]]
id = "B2 from a local existence PSR for contingents and two reason bridges"
theorem = "esseCauseFromExistenceReasons"
premises = ["Every being contingent at w has some reason for its existence", "No reason for the existence of a being contingent at w is about that being itself", "The other being a reason for a contingent being's existence is about is a CAUSE_2 of its esse"]
conclusion = "Every being contingent at w has a distinct CAUSE_2 of its esse"
rule = "Instantiate the existence PSR, then the two reason bridges at its reason"
meaning = "A being x contingent at w has some reason r for its existence at w (local existence PSR for contingents). By BX1 the being r is about is not x; by BX2 that other being causes x's esse. So x has a distinct CAUSE_2 of its esse. The #312 tokens sit on the frame's own existence, and BX2's cause is the frame's CausesIn at esse, so the conclusion is B2 on the same frame. It splits B2 into a reason-coverage half, which the brute-contingency rival denies, and a reason-to-cause half (BX1, BX2), which a rival with non-causal reasons for contingent existence would deny."
description = "Support option for B2 from the PSR family on the shared frame. Not a transcription: no premise mentions esse-causes of contingents as such; the conclusion composes coverage by reasons with two bridges about reasons. Each premise is needed (controls, models 1-3) and the bundle is satisfiable nonvacuously (model 4). B2 gives neither the existence PSR nor BX1 (models 5-6). Establishes no premise."

[[argument]]
id = "B2 from the selected-grounding closure and the ground-to-esse-cause bridge"
theorem = "esseCauseFromGroundingClosure"
premises = ["Every being contingent at w is CONCRETE_AND_ABSTRACT_6", "STMT-EVERY-CONTINGENT-GROUNDED-AT", "98efaa9e-1c91-4e52-8c0d-faf03d4f8372"]
conclusion = "Every being contingent at w has a distinct CAUSE_2 of its esse"
rule = "Closure at a concrete contingent being, then the ground-to-cause bridge"
meaning = "A being x contingent at w is concrete (interface), exists at w and is contingent, so the existing closure gives it an actual concrete ground y at w under the selected relation. The existing bridge 'an actual concrete ground of an actual concretum is a distinct CAUSE_2 of its esse' makes y distinct from x and a cause of its esse. So x has a distinct CAUSE_2 of its esse: B2, on the profile built from the same frame."
description = "Support option for B2 from the grounding family on the shared frame. Not a transcription: the closure gives a ground, the bridge converts it into a distinct esse-cause, and the interface supplies concreteness. Each premise is needed (controls, models 7-9) and the bundle is satisfiable nonvacuously (model 10). It shares the closure with the existing grounding route to the First Way's mover, so it adds a connection, not independent warrant. Establishes no premise."

[[argument]]
id = "Parity: a feature-uniform demand for a reason why excludes a brute contingent truth"
theorem = "parity"
premises = ["The stance's demand for reasons why is uniform in the feature", "The stance requires a reason why the target fact obtains", "The target fact and the stance's accepted fact agree on the feature"]
conclusion = "The stance cannot meet its demand for reasons why and accept the fact as a brute contingent truth"
rule = "Uniformity transfers the demand along the shared feature; the demand met excludes bruteness"
meaning = "The owner's parity argument, analyst formulation, attribution deferred. The stance requires a reason why the target exists (P1), its demand is uniform in a feature k (P3) on which the target and the accepted fact o agree (P2). So it requires a reason why o obtains. If it met its demand and accepted o, o would have a reason, so it is not a brute contingent truth. For the naturalist who rejects an unreasoned God, God's existence as a mere brute fact in the owner's wording (target God, o the contingent foundation) it excludes the brute-contingency rival; the same theorem binds a theist who rejects brute contingents and is uniform in the reason status (target a contingent existent, o God's existence), so the demand is symmetric and leaves the comparative question which side's explanation of existence leaves less unexplained (parity map). It establishes neither B2 nor that anything has a reason, it does not answer whether there is evidence for God, and it binds only stances that hold P1, P2 and P3 for one feature."
description = "The parity argument: a symmetric, stance-level consistency result. Valid by a short derivation (the demand is transferred by uniformity, then met); all its weight is on P1-P3. It lowers the standing of the brute-contingency rival only for stances holding all three, and binds the theist under the same premises; it is not support for B2. Each member of the bundle is deleted by a named stance in the parity map. Establishes no premise."

