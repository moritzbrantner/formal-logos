[[argument]]
id = "f3180780-599d-4596-9d7e-6d81a8c28874"
label = "Received esse has a distinct actual giver under source-coverage and presence"
theorem = "actualGiverFromReceivedCause"
premises = ["ae9d9473-34f1-4b51-8f13-41d340d64ad1","4bc853db-ec33-40ff-857e-6a67f17532fb","7ce040a2-7e9c-58e0-8ec1-ce99a60b587b"]
