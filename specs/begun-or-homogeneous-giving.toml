# ---------------------------------------------------------------- statements

[[statement]]
id = "Every present received-esse thing has a first moment of presence or is homogeneous"
lean = "BegunOrHomogeneous"
paraphrase = "OPEN analyst premise, attribution deferred (structural coverage of histories): in every history v of the model, every thing whose esse is received in some principle (DEF-ESSE-RECEIVED-IN) and that is present at some moment of v either has a first moment of presence in v (BeginsAt of the temporal history frame, as in f4850897 and onset fa3e228b: present then and at no strictly earlier moment) or is homogeneous in v relative to the supplied non-giving facts (HomogeneousIn, definition 6d0f77a2: any two moments of its presence are related by an order automorphism of the times preserving every being's presence and every supplied fact). It mentions no giving and no cause. What it excludes is a received-esse thing with no first moment of presence whose moments the presence pattern or the supplied facts distinguish: a beginningless changing thing, the case left open by the 'Next test' of docs/notes/ca-horizontal-support.md. It holds in every history whose times are the natural numbers, where every present thing has a first moment (by well-ordering; not formalized here). It fails in the eternal history of the controls once a supplied fact marks one moment (Control part 1), and weak concurrent actualization 40a97664 can hold there (part 4), so 40a97664 does not entail it. No warrant for its application to actual histories is recorded. Where a history's presence pattern or supplied facts rule out the automorphisms homogeneity needs, the premise requires each received-esse thing present at two or more moments there to have a first moment of presence."
definitions = ["DEF-ESSE-RECEIVED-IN", "6d0f77a2-0474-4cc0-9aac-71f7fba67b33", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-ESSE"]
disambiguations = ["DISAMB-ESSE-RECEPTION"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "Concurrent actualization from its begun and homogeneous restrictions and coverage"
theorem = "concurrentOfBegunOrHomogeneous"
comparator_theorems = ["controls", "nonvacuity"]
premises = ["f4850897-dfe3-4adb-80ab-1b404aab71cf", "eb928359-9871-4964-b274-3a82648b58a1", "Every present received-esse thing has a first moment of presence or is homogeneous"]
conclusion = "40a97664-e481-42d7-8458-78374a61aa26"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Split a present received-esse thing by the coverage premise and apply the matching restriction"
meaning = "Let x have its esse received in z and be present at t in history v. The coverage premise gives either a first moment b of x's presence in v, or homogeneity of x in v relative to the supplied facts. In the first case the begun restriction f4850897 gives something that gives x being at t. In the second case the homogeneous restriction eb928359, for the same giving relation and facts, gives the same. That is weak concurrent actualization 40a97664, on the STRICT esse-giving reading of GivesAt (definition 158301bc), in every history of the model. What is derived and what is supplied: both restrictions are supplied premises here; f4850897 is itself obtained from onset fa3e228b and parity 5b24ef26 by a transcription, and parity given onset is the begun restriction restated, so the begun half adds no warrant beyond parity's; eb928359 is derived from coverage, exercise and time symmetry, and its new content is for homogeneous things without a first moment. Both restrictions are also entailed by 40a97664 (registered strength orders); those supports run back through the conclusion and add no warrant here, so the route's non-circular support is onset and parity for f4850897 and coverage, exercise and time symmetry for eb928359. The coverage premise is a structural claim about histories, with no giving in it. Each premise is needed (controls, parts 1 to 3: the omitted premise fails, the other two hold, 40a97664 fails), and the three together are strictly stronger than 40a97664 (part 4). The companion nonvacuity populates the bundle: in the eternal history with no supplied facts and giving at every moment, the received-esse thing false is present at moment 0 and all three premises and 40a97664 hold. So the route does not discharge the crux: it fills the gap named in the strong_version_needed of 366a6ea3 (things with no first moment of presence) for homogeneous things only, and leaves as an explicit open premise that no received-esse thing is beginningless and changing. Where a history rules out the automorphisms homogeneity needs, that premise says each received-esse thing present at two or more moments there began. All premises stay open."

