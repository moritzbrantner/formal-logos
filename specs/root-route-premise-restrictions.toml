object_kind = "statement"
object_id = "2d9807a5-ebff-45fd-972f-e241f18713d4"
verification_result_id = "Esse calibration supplies its CONCRETE_6 direction"
note = "On the projected profile the biconditional also requires CONCRETE_6 to imply esse in re. The implication carries the same concrete predicate, InAct and esse. Grounding data are immaterial to this calibration."

