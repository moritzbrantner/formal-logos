[[argument]]
id = "A common first esse giver from one actual bearer and well-founded causes"
theorem = "commonSourceOfOne"
strong_version_needed = { "ee4ab504-c8fe-59bc-bc96-7cbeefed6410" = "The arbitrary initial actual bearer need not be a GOD_4 candidate. Its represented esse–essence identity is decided before any identity source is selected. ca432e24 only decides equality of actual bearers against a GOD_4 candidate and permits double-negation elimination for that candidate's esse–essence equality.", "fd12ad3d-6729-4fa0-bb87-0121260df684" = "This sibling specializes the original well-founded route's population input. Well-foundedness is used only to exclude nonempty returns at actual identity bearers. Result 7a970bf6-1168-4c45-bf3c-9a0a1e4a8615, commonSourceOfNoIdentityReturn, already uses that weaker sufficient condition." }
premises = ["3d01134d-0b03-4469-a81a-a18d6e179fa0","a576300f-4b01-45ae-902c-cfe3d0fbf2de","78cffb8e-da95-4459-8058-45e0953cdde8","fd12ad3d-6729-4fa0-bb87-0121260df684","ee4ab504-c8fe-59bc-bc96-7cbeefed6410"]
conclusion = "c35b1a5c-6405-449b-993b-8196b2457e08"
axioms = ["propext","Classical.choice","Quot.sound"]
definitions = ["8163859b-95b3-4dd2-8a69-541bd332f32f","211a6432-8b8f-53ed-85e3-75173bb15b24","5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72","183b48d2-1753-583d-aef9-4199cff86231","d8e2ed12-8089-5202-ae51-e807cf611c76","0ea9feb8-1f92-5b11-aa74-2f2e567c6106"]
rule = "Use well-foundedness to exclude an identity return and apply the existing one-bearer source theorem"
meaning = "Keep the ancestry principle, at-most-one identity bearer, well-foundedness and excluded middle of 5ab6cc2b. One actual bearer suffices: if it has represented esse–essence identity, use it directly, and if distinct, use its supplied identity ancestor. The inherited one-bearer argument identifies the selected identity bearer as the common source and excludes actual incoming supply by ruling out a nonempty return path. All premises are recorded explicitly. The conclusion supplies only the common source in the fixed esse profile."

