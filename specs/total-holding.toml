# Total holding: the repair of the MOTION_3 holding per se link against mutual
# holding, and the holding route's pure-act step (docs/notes/caused-mover-cstar.md,
# section 10). The holding per se link of specs/holding-motion.toml, with the
# holding regress, excludes two cards leaning on each other. Restricting the link
# to a total holder (sole and non-reciprocal) removes that inconsistency
# (Control part 1), reaches a relative first total holder that is not totally
# held, and does not reach one unheld in its operative act (part 2). Under the
# esse-side support bundle of C* in the holding sense, total holders of lackable
# acts give being. Unheldness in every respect does not give pure act even with
# that bundle (part 3); a potency clause does. Analyst formulations, attribution
# deferred; not a reading of ST I q.2 a.3.

[batch]
vocab = "TruthCore.Causality.TotalHolding"
results = "TruthCore.Results.Causality.TotalHolding"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Something is totally held: in act in a respect and held there by a sole non-reciprocal holder"
lean = "SomethingIsTotallyHeld"
paraphrase = "OPEN analyst observation premise, attribution deferred: some being x is in act in some respect r and some z totally holds x in r (TotallyHeld, definition acde39ee-8d60-4ea7-a821-de96c86e5b03): z, other than x, presently actualizes x in r, nothing else does, and x does not presently actualize z in r. Physical example: a lamp hanging from a single hook. Scope: ordinary statics establishes that the hook is the only physical holder of the lamp's position; it does not establish that no non-physical co-holder exists. Under the C* support bundle (the esse instance f834ee65-53eb-4aea-b07c-42b06dbd1dfd, accident-inclusive conservation 1a99cebe-3c0a-4e32-95bc-e2e458505322 and the lackable-being bridge 6e2176cd-eeb6-413c-8fd2-7b2df4a34ad4) whatever presently actualizes the lamp as to being co-holds its lackable position, so the hook is then not its total holder; the premise then holds of a lackable act only with a total holder that presently actualizes the held thing as to being (see the argument concluding that a total holder of a lackable act gives being)."
definitions = ["acde39ee-8d60-4ea7-a821-de96c86e5b03", "edca52e4-f224-491d-ac45-5816fac1a9fd", "6ab9a832-6b0f-47ac-9f08-144444bf1cb1", "DEF-ACT"]

[[statement]]
id = "A total holder totally held in the act by which it holds is a link of a total-holding series"
lean = "TotallyHeldTotalHolderIsPerSe"
paraphrase = "OPEN analyst premise, attribution deferred (total-holding per se link): if y totally holds x in r (definition edca52e4-f224-491d-ac45-5816fac1a9fd) and y is itself totally held in r (definition acde39ee-8d60-4ea7-a821-de96c86e5b03), then y is a link AsTotallyHeld y x of a total-holding series (definition 5462ce35-4970-434c-8f2a-0ccc2c1db805). It restricts the holding per se link 685933c7-f557-4cf4-80e2-cea2f2e88e2b on both sides: the lower holder must be a total holder and its own holding must be total. Co-holders and reciprocal holders are not links, so two cards leaning on each other on a floor satisfy it together with the regress (Control part 1). Respect-indexed: being totally held in another respect does not make y a link. Its warrant is the instrumental one of 685933c7, restricted: a sole holder that holds only as itself wholly held needs a present whole holder."
definitions = ["5462ce35-4970-434c-8f2a-0ccc2c1db805", "edca52e4-f224-491d-ac45-5816fac1a9fd", "acde39ee-8d60-4ea7-a821-de96c86e5b03"]

[[statement]]
id = "A total-holding series cannot go on to infinity"
lean = "NoInfiniteTotalHoldingSeries"
paraphrase = "OPEN analyst premise, attribution deferred: the total-holding per se relation AsTotallyHeld (definition 5462ce35-4970-434c-8f2a-0ccc2c1db805) is well founded, so there is no infinite ascending chain of total holders each totally held in the act by which it holds. The restriction of the holding regress 6f924bb0-beb4-4a7c-845e-ceb9b7aeb3c1 to the total-holding series; a well-founded holding per se relation restricts to a well-founded total one only if the total links are among the holding links, which is not assumed here."
definitions = ["5462ce35-4970-434c-8f2a-0ccc2c1db805"]

[[statement]]
id = "A total holder of another that is not totally held in the act by which it holds cannot be lacking"
lean = "TotalHolderNotTotallyHeldCannotBeLacking"
paraphrase = "Conclusion, relative first total holder: it is impossible that there be no f, x and r with f totally holding x in r and f not totally held in r. 'Not totally held' is the negation of TotallyHeld, so it covers three cases: f has several co-holders in r (Control part 2 witnesses this case), f is held in r only by things it holds back, or f is not in act in r (the actualizer premise 40fc38ad-2cfe-4da6-8632-137fc5ff9188, not a premise here, excludes the last). f may also be held in other respects. It is not the conclusion that some total holder is unheld in the act by which it holds."
definitions = ["edca52e4-f224-491d-ac45-5816fac1a9fd", "acde39ee-8d60-4ea7-a821-de96c86e5b03"]

[[statement]]
id = "A total holder of another that is MOTION_3 held in the act by which it holds is totally held in it"
lean = "HeldTotalHolderIsTotallyHeld"
paraphrase = "OPEN analyst bridge, attribution deferred: if f totally holds x in r and f is MOTION_3 held in r (definition ea1904bc-bdfa-4835-a4a7-8545c5221e2e), then f is totally held in r (definition acde39ee-8d60-4ea7-a821-de96c86e5b03). It says that a sole holder is never co-held, nor held only by something it holds back, in the act by which it holds. Substantive objection on the physical-holder reading of the holding relation (target: this bridge; mechanism: co-support; justification: ordinary statics): a beam carried at its two ends by two walls has each wall presently actualizing its position, so each wall is a co-holder and neither is its sole holder, while the beam is the only physical holder of a lamp hung from it and the lamp does not prop it; so on that reading the beam totally holds the lamp, is held, and is not totally held. Scope: statics fixes physical holders only. Under the C* support bundle whatever presently actualizes the lamp as to being co-holds its lackable position (the argument concluding that a total holder of a lackable act gives being), so the beam is not a total holder of it there, the case does not apply, and the bridge is untested on that reading. A reading on which the two walls together are one holder would need a mereological bridge that is not formalized. Control part 2 is a finite interpretation in which the bridge fails."
definitions = ["edca52e4-f224-491d-ac45-5816fac1a9fd", "acde39ee-8d60-4ea7-a821-de96c86e5b03", "ea1904bc-bdfa-4835-a4a7-8545c5221e2e"]
disambiguations = ["a59fd0ac-f276-528d-8dc3-c3eddd331ac7"]

[[statement]]
id = "A total holder of another that is not MOTION_3 held in the act by which it holds cannot be lacking"
lean = "UnheldTotalHolderCannotBeLacking"
paraphrase = "Conclusion: it is impossible that there be no f, x and r with f totally holding x in r and f not MOTION_3 held in r (definition ea1904bc-bdfa-4835-a4a7-8545c5221e2e). 'Not MOTION_3 held in r' also holds when f is not in act in r; the actualizer premise 40fc38ad-2cfe-4da6-8632-137fc5ff9188, not a premise here, excludes that case. Such an f may be held in other respects; MOTION_3 has no potency clause, so the conclusion is silent on whether f is in potency anywhere. Derived only with the open bridge that a held total holder is totally held; Control part 2 is an interpretation of the total-holding regress in which it fails."
definitions = ["edca52e4-f224-491d-ac45-5816fac1a9fd", "ea1904bc-bdfa-4835-a4a7-8545c5221e2e"]
disambiguations = ["a59fd0ac-f276-528d-8dc3-c3eddd331ac7"]

[[statement]]
id = "A total holder of an act the held thing could lack presently gives the held thing being"
lean = "TotalHolderOfLackableActGivesBeing"
paraphrase = "Conclusion: if z totally holds x in r (definition edca52e4-f224-491d-ac45-5816fac1a9fd), x is in act in r and x could lack that act (Lackability.CanLack, definition 56b438a0-7fcc-4dd5-916b-1d2e2162310b), then z presently actualizes x as to being (Holding.ActualizesNow z x esse, the holding relation read at esse). So under the C* support bundle a holder that does not presently actualize the held thing as to being, such as a hook holding a lamp, is not a total holder of the held thing's lackable act: whatever presently actualizes it as to being co-holds that act. It concerns lackable acts only. 'Gives being' here is the holding relation at esse; identifying such a z with a giver of being in the timed sense of the esse-root routes (BeingGiving.GivesAt) would need the converse of clause (c) of the present-moment reading dedc431f-4f04-40e9-b519-3243d1874c18, which is not formulated."
definitions = ["edca52e4-f224-491d-ac45-5816fac1a9fd", "56b438a0-7fcc-4dd5-916b-1d2e2162310b", "6ab9a832-6b0f-47ac-9f08-144444bf1cb1", "DEF-ESSE", "DEF-ACT"]

[[statement]]
id = "Whatever is in POTENCY_1 in some respect is in act as to being and could lack being"
lean = "PotencyBringsLackableBeing"
paraphrase = "OPEN analyst bridge, attribution deferred (potency clause): if x is in potency in some respect r in the adopted sense POTENCY_1 (it can be so in r and is not in act in r, DEF-POTENCY), then x is in act as to being and could lack being (Lackability.CanLack x esse, definition 56b438a0-7fcc-4dd5-916b-1d2e2162310b). It is the potency counterpart of the lackable-being bridge 6e2176cd-eeb6-413c-8fd2-7b2df4a34ad4 (which starts from an act x could lack). Nearest existing material: d8024a38-5d93-4c1d-8c21-fdbfa87a5cde (in act as to being and in potency in some respect implies composite, for the free POTENCY_2 parameter); passing from composite to 'could lack being' and from POTENCY_2 to POTENCY_1 is not formalized. It is about the beings in the domain: it also makes whatever is in potency in act as to being. Named rival, unassessed and recorded without a justification of its mechanism: a necessary being with unrealized potencies, as in dipolar theism (Hartshorne's distinction of necessary existence from contingent actuality; not read, navigation only), would deny it, most naturally at the unformalized step from composite to 'could lack being' rather than at composition. No substantive objection is recorded here."
definitions = ["DEF-POTENCY", "56b438a0-7fcc-4dd5-916b-1d2e2162310b", "DEF-ESSE", "DEF-ACT"]
disambiguations = ["508617ab-cf24-5f3b-a387-64b3991359ec"]

[[statement]]
id = "Whatever is not MOTION_3 held as to being is PURE_ACT_1"
lean = "UnheldInBeingIsPureAct"
paraphrase = "Conclusion: whatever is not MOTION_3 held as to being (definition ea1904bc-bdfa-4835-a4a7-8545c5221e2e at the respect esse: it is not the case both that it is in act as to being and that something other than it presently actualizes it as to being) is in POTENCY_1 in no respect (PureAct of adopted potency, DEF-PURE-ACT, DEF-POTENCY). The antecedent also holds of whatever in the domain is not in act as to being, so the claim covers those items too. A fortiori a holder unheld in every respect is PURE_ACT_1. It is a claim about every item of the domain, not only about holders."
definitions = ["ea1904bc-bdfa-4835-a4a7-8545c5221e2e", "DEF-PURE-ACT", "DEF-POTENCY", "DEF-ESSE"]
disambiguations = ["a59fd0ac-f276-528d-8dc3-c3eddd331ac7", "508617ab-cf24-5f3b-a387-64b3991359ec", "b1640e51-d7d4-5a80-9992-29fa1ded8048"]

[[statement]]
id = "Total-holding controls: cards on a floor, co-held holder, unheld giver with a POTENCY_1"
lean = "Control.Certificate"
paraphrase = "Closed controls; model statements concern these interpretations only. (1) Cards on a floor: two cards hold each other and are both held by a floor, which also holds a stone and is held by the earth; two beings hold each other, something is totally held, the total-holding per se link holds with a well-founded link relation, and a total holder unheld in its operative act exists (the earth); and every holding per se relation satisfying the unrestricted link 685933c7 there fails to be well founded. So the restricted bundle is consistent with mutual holding. (2) Co-held holder: 1 totally holds 0, while 2 and 3 both hold 1 and hold each other; something is totally held, the total-holding link and regress, the actualizer premise, respect-general concurrent actualization and C* in the holding sense hold, and no total holder is unheld in its operative act; the bridge that a held total holder is totally held fails, and no holder has an operative act it could not lack. (3) Giver: 0 holds 1 as to being and in respect 1, nothing holds 0, and 0 can be in respect 2 without being in act there; the esse instance of concurrent actualization, accident-inclusive conservation, the lackable-being bridge, the actualizer premise, respect-general concurrent actualization and C* in the holding sense hold, and 0 totally holds 1 in an act 1 could lack; yet 0, a holder of another held in no respect, is in POTENCY_1 in respect 2, so the potency clause fails and unheldness in every respect does not give pure act. (4) Held potency: with only 1 able to be in respect 2, the potency clause and the esse instance hold with something in POTENCY_1."
definitions = ["edca52e4-f224-491d-ac45-5816fac1a9fd", "acde39ee-8d60-4ea7-a821-de96c86e5b03", "5462ce35-4970-434c-8f2a-0ccc2c1db805", "ea1904bc-bdfa-4835-a4a7-8545c5221e2e", "56b438a0-7fcc-4dd5-916b-1d2e2162310b", "DEF-POTENCY", "DEF-PURE-ACT"]
disambiguations = ["a59fd0ac-f276-528d-8dc3-c3eddd331ac7", "508617ab-cf24-5f3b-a387-64b3991359ec", "b1640e51-d7d4-5a80-9992-29fa1ded8048"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "Total-holding First Way to a total holder not totally held in its operative act"
theorem = "totalHolderNotTotallyHeld"
premises = ["Something is totally held: in act in a respect and held there by a sole non-reciprocal holder", "A total holder totally held in the act by which it holds is a link of a total-holding series", "A total-holding series cannot go on to infinity"]
conclusion = "A total holder of another that is not totally held in the act by which it holds cannot be lacking"
axioms = []
rule = "Well-founded induction on the total-holding series"
meaning = "New non-transcription conditional derivation. Some x is totally held in r by some z. Suppose every total holder of another is totally held in the act by which it holds. Then z is totally held in r by some w, so z is a link of x, and the same holds of w; well-founded induction on the total-holding series refutes the supposition. Unlike the unrestricted holding regress (0b40c6e1), this bundle is consistent with two cards leaning on each other (Control part 1). The conclusion is weaker than the unrestricted route's: the first total holder may be MOTION_3 held by co-holders (Control part 2). All premises stay OPEN. No premise is established."

[[argument]]
id = "First total holder unheld in its operative act, if held total holders are totally held"
theorem = "unheldTotalHolder"
premises = ["A total holder of another that is not totally held in the act by which it holds cannot be lacking", "A total holder of another that is MOTION_3 held in the act by which it holds is totally held in it"]
conclusion = "A total holder of another that is not MOTION_3 held in the act by which it holds cannot be lacking"
senses = {MOTION = "MOTION_3"}
axioms = []
rule = "At the relative first total holder, the bridge turns being held into being totally held"
meaning = "New conditional derivation, a single application of the bridge at the relative first total holder. A total holder f not totally held in r is not MOTION_3 held in r, since by the bridge being held there would make it totally held. The bridge carries the load; on the physical-holder reading a beam carried by two walls is an ordinary statics case against it (under the C* support bundle that case does not apply and the bridge is untested), and Control part 2 shows the total-holding regress does not give the conclusion without it. Both premises stay OPEN. No premise is established."

[[argument]]
id = "A total holder of a lackable act gives being, from the esse-side support of C*-holding"
theorem = "totalHolderGivesBeing"
premises = ["f834ee65-53eb-4aea-b07c-42b06dbd1dfd", "1a99cebe-3c0a-4e32-95bc-e2e458505322", "6e2176cd-eeb6-413c-8fd2-7b2df4a34ad4"]
conclusion = "A total holder of an act the held thing could lack presently gives the held thing being"
senses = {MOTION = "MOTION_3"}
axioms = []
rule = "The giver of being holds every lackable act; the total holder is the only holder"
meaning = "New non-transcription conditional derivation. Let z totally hold x in r, with x in act in r and able to lack that act. By the lackable-being bridge x is in act as to being and could lack being; by the esse instance some g other than x presently actualizes x as to being; by accident-inclusive conservation g presently actualizes x in r; since z is the only holder of x in r, g is z. So on the bundle that supports C* in the holding sense (section 9.1), every total holder of a lackable act is a holding-sense giver of being (the holding relation at esse). Identifying it with a giver of being in the timed sense used by the esse-root routes (BeingGiving.GivesAt) would need the converse of clause (c) of the present-moment reading dedc431f, which is not formulated; and the total-holding regress c4e333da remains a separate premise. All premises stay OPEN. No premise is established."

[[argument]]
id = "Unheld in being is PURE_ACT_1, from the POTENCY_1 clause and the esse instance"
theorem = "pureActOfUnheldInBeing"
premises = ["Whatever is in POTENCY_1 in some respect is in act as to being and could lack being", "f834ee65-53eb-4aea-b07c-42b06dbd1dfd"]
conclusion = "Whatever is not MOTION_3 held as to being is PURE_ACT_1"
senses = {MOTION = "MOTION_3"}
axioms = []
rule = "Potency to lackable being; esse instance; contraposition"
meaning = "New non-transcription conditional derivation. Let f be in POTENCY_1 in some respect. By the potency clause f is in act as to being and could lack being; by the esse instance of concurrent actualization something other than f presently gives f being, so f is MOTION_3 held as to being. Hence what is not held as to being is in potency in no respect (including, trivially, whatever is not in act as to being). Unheldness in every respect is more than this needs: unheldness as to being suffices. The esse-side bundle without the potency clause does not give pure act (Control part 3). Compared with the PRIOR_4 step of the unmerged PR #1774 (pureActOfRespectMatchedBridge, branch agent/prima-via-priority-split), where act's simple priority (a4d3261a) supplies a prior being in act in the very respect of the potency and the respect-matched first-in-being bridge identifies it with the first mover, here the potency clause with the esse instance supplies another being that holds the potential thing, at esse rather than in the respect of the potency, and uses no priority relation; that shift to esse is why unheldness as to being suffices. Both premises stay OPEN. No premise is established."

[[argument]]
id = "Total-holding controls checked"
theorem = "controls"
premises = []
conclusion = "Total-holding controls: cards on a floor, co-held holder, unheld giver with a POTENCY_1"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit finite interpretations checked by decision after unfolding"
meaning = "The total-holding per se link and its regress are consistent with two cards leaning on each other on a floor, where the unrestricted holding link and regress are not (cards on a floor); with C* in the holding sense and concurrent actualization they do not give a total holder unheld in its operative act, nor an operative act that cannot be lacked (co-held holder); the whole esse-side bundle with C* gives a holder unheld in every respect that is still in potency in a respect, so the esse-side bundle and C* do not give pure act, and the potency clause, a sufficient extra premise, fails there (giver); and the potency clause is satisfiable with something in potency (held potency). A finite countermodel shows a premise is needed in that interpretation, not that it is false."

