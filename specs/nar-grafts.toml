# #1926 orphan grafts onto the NAR/WN route of #1947. (G1) #1737's optimal-
# creation certificate (an orphan of the Modal family) is composed with
# #1947's law 2 through an explicit adapter (givingProfile): the optimizing-
# creator rival to WN (a root that gives by total optimal output with a unique
# optimum, Rowe's "must create the unique best", being-level surrogate) is
# refuted by the premises of law 2, without WN or SS. (G2) Necessary roots
# (d164f730, NAR note gap 6) from the unique necessary actual root (91b085c4).
# (G3) Laws (stability is fixity; a unique optimum fixes every effect; the
# rival is a rival to WN given SS) and a tied-optimum model. Analyst
# formulations, attribution deferred. Note: docs/notes/orphan-graft-map.md.

