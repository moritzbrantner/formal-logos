[[argument]]
id = "0e335f77-4240-4a38-9d7a-7819c7a40778"
label = "Not every root gives only the unique optimum, from law-2 premises and two certificates"
theorem = "optimalRivalRefuted"
axioms = []
premises = ["2dd1f217-77bd-42cd-9410-174b939b0e45", "3ef41442-431a-4bed-83bd-4458ed623f5f", "0c27f65a-6a6b-438a-b96c-b2bab9f21ac3", "d164f730-95b4-4297-8978-9e5586f0b2ef", "c76b6e2c-1ca0-47fd-a9d0-2c2faa3d1174", "1822b59d-1040-57e4-8991-f7862db26355", "b8ee1a50-b1e2-435e-a082-4652a894438b"]
conclusion = "08e6b43a-17a9-4199-a087-5a62402dd88d"
sense_bridges = [{term = "BEST_OPTION_BEST_QUALITY_AND_PERFECT", from = "BEST_OPTION_BEST_QUALITY_AND_PERFECT_2", to = "BEST_OPTION_BEST_QUALITY_AND_PERFECT_1", statement_id = "1822b59d-1040-57e4-8991-f7862db26355", role = "premise"}, {term = "BEST_OPTION_BEST_QUALITY_AND_PERFECT", from = "BEST_OPTION_BEST_QUALITY_AND_PERFECT_3", to = "BEST_OPTION_BEST_QUALITY_AND_PERFECT_1", statement_id = "1822b59d-1040-57e4-8991-f7862db26355", role = "premise"}, {term = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY", from = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY_2", to = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY_1", statement_id = "1822b59d-1040-57e4-8991-f7862db26355", role = "premise"}, {term = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY", from = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY_3", to = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY_1", statement_id = "1822b59d-1040-57e4-8991-f7862db26355", role = "premise"}, {term = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY", from = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY_4", to = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY_1", statement_id = "1822b59d-1040-57e4-8991-f7862db26355", role = "premise"}, {term = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY", from = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY_5", to = "SAME_ACT_DETERMINISTIC_RESPONSE_AND_NECESSARY_1", statement_id = "1822b59d-1040-57e4-8991-f7862db26355", role = "premise"}]
rule = "A unique optimum fixes the root toward each effect, but the root is two-way toward a contingent one"
meaning = "Suppose every actual root gives by total optimal output with at most one optimal candidate (so each gives being to exactly one being per accessible world where it exists). The common GOD_4 root n of 0c27f65a (only its root and reach clauses are used) is an actual root. By #1947's law 2 (a conjunct of its premise-free certificate b8ee1a50), from (b1), factive giving, the common root, necessary roots and some concrete contingent being, n is two-way toward some concrete contingent c: it gives c being at w and not at some accessible world v where it exists. By the first conjunct of #1737's certificate (1822b59d), total optimal output with a unique optimum gives cross-world stable output on n's giving-output profile, which is being fixed toward every being given at w (law 1); so n gives c being at v: contradiction. Constructive."
description = "Argument G1, a conditional refutation of a narrow being-level one-best-effect rival to WN (b72a790a, recorded alternative_to 0266eac2 beside the standing selective-diffusion and world-level-optimizer rivals): it composes two orphaned premise-free certificates, #1737's optimal-choice certificate (1822b59d) and #1947's NAR laws and models (b8ee1a50, of which only law 2 is used), through the giving-output adapter. Not a transcription: no premise's consequent is the conclusion; the stability step is the certificate's, the two-way step is law 2's. It uses neither WN nor SS, so it is not question-begging against the rival's denial of WN. It does not count as a refutation for closure: its premises (b1), factive giving, the common root, necessary roots and some contingent concretum are open (#999). Scope: the rival makes each root give being to exactly one being per accessible world where it exists, and with (b1) and the common root's reach there is at most one actual concretum besides the root; G1 excludes it only through law 2. It does not touch the mediated creator (#1947's chainG satisfies the rival with candidates {g} when direct reach is denied, and historical Avicenna arguably denies direct reach), the world-level optimizer over complete outputs, Rowe's world-level argument, ties (G3's tied model keeps the root two-way toward a contingent while giving only optimal candidates), a no-best regime (where, by the certificate, no candidate is optimal, so the rival's total optimal output cannot hold at all), or selective necessary diffusion. Its price for the rival: deny one of law 2's premises, typically that the root is necessary and some concretum contingent (modal collapse of what the root gives), or the common root's direct reach, or the uniqueness of the optimum. Premise choice: 0c27f65a stands for the bare common root a6b46d2e, whose legacy definition links make new arguments an unbridged sense mixing (gap 5 of docs/notes/nar-derivation.md). Shared dependencies: the same law-2 bundle as N2 (c26874a7). Sense bridges: the certificate is the premise relating the optimality and output-profile senses it certifies together."

