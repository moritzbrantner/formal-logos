axioms = []
weakening = true
premises = ["91b085c4-f1c7-5ada-9848-8e7dc753313a"]
conclusion = "d164f730-95b4-4297-8978-9e5586f0b2ef"
rule = "Every actual root is the unique necessary one"
meaning = "Instantiate the selected profile at groundProfile F concrete G. There is an actual root n necessary at w with every actual root equal to n; so any actual root m is n and is NECESSARY_2 at w. Constructive."
description = "Argument G2, the connection asked by gap 6 of docs/notes/nar-derivation.md: the bare premise d164f730 of N2 and G1 now follows from the existing root-path statement 91b085c4, proved from the necessary-root routes. A one-premise weakening (registered strengthens 91b085c4 to d164f730): it drops the existence and uniqueness clauses. Not a transcription: the conclusion is a universal over actual roots obtained by rewriting through uniqueness. Establishes no premise. Orphan candidates for the same step (73f6b3c8, 593d7307, f2a65d16) would need the separate at-most-one premise 49fdec01 and are blocked here by their legacy definition links (NECESSARY_11 through WORLDS_9, and WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT_1 through ACTUAL_CONCRETE_GROUND_1), which make any new argument using them an unbridged sense mixing; see the graft map."

