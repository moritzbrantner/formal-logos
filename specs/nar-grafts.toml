[[statement]]
id = "ea1425c0-5f70-4f5b-a056-acc8fc462d74"
label = "Some actual root is fixed toward a being its end does not require, and two-way toward another"
lean = "SelectiveNecessaryDiffusionAtRoot"
paraphrase = "OPEN standing rival to WN (0266eac2), analyst formulation, unattributed: some actual root n of the selected grounding relation G at w exercises a rational power toward a being x other than itself, is fixed toward x (NECESSITATE_5: gives x being at w and at every accessible world where n exists), x is not required by n's own end (EndRequires, the means-to-end relation), and n is two-way toward some being. The selective necessary diffusion of the good toward a necessary intermediary with free giving of the contingents (Plotinus; Avicenna's First as standardly reported; Kretzmann's Dionysian argument; navigation, not attributed). #1947's mixed-mode model has this shape. Stated only: no argument here supports or refutes it."
definitions = ["02aa24f8-e6cc-4d47-8b34-d3b7149e7ee8", "8c945061-acb2-47e1-9865-d10f8f925757", "90719cb5-43c2-4677-8ad7-20e077e28ac9", "b8061228-9131-40f2-83bd-cb7d719bd0a0", "582f44c3-7778-4806-b385-e1eff852ac5e", "62dfa893-b633-4513-9790-8f9a0a3087e0", "c57e2682-08e6-527e-950f-0fa0a7ff11ef", "a1b2e330-388f-4120-bc5c-969642317792", "1b8baf77-84fa-5513-a138-7fa14840dd87"]
disambiguations = ["5836e1f6-ccce-4ce8-b9d6-c89afc7120bb", "e5417243-d6f3-4776-9694-40d85bb34ff4", "DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "78af5042-9b4e-41a4-bb76-ad4d1973e25a"
label = "Every actual root gives exactly an optimal complete output wherever it exists accessibly"
lean = "ActualRootsGiveOptimalCompleteOutputs"
paraphrase = "OPEN standing rival to WN (0266eac2), analyst formulation, unattributed (the world-level optimizer, ties allowed): for a fixed family of admissible complete outputs (sets of beings) and a fixed partially ordered quality on them, every actual root n of the selected grounding relation G at w, at w and at every accessible world where it exists, gives being to exactly the beings of some optimal complete output. Candidates are complete outputs, not single beings. If every optimal complete output contained a necessary intermediary, the root would be fixed toward it and could be free toward the rest; that consequence is not proved here. Closer to the best-world framing of Rowe's argument (navigation, not attributed) than the being-level variant b72a790a. Stated only: no argument here supports or refutes it."
definitions = ["4f503422-a3dc-51f3-8e1d-a1065ef6038e", "62dfa893-b633-4513-9790-8f9a0a3087e0", "c57e2682-08e6-527e-950f-0fa0a7ff11ef", "a1b2e330-388f-4120-bc5c-969642317792", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["2f096ab2-0d7d-5252-a361-4e601c64aeae", "DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

