[[statement]]
id = "4af88d02-602b-45d0-8144-82f01a7984e3"
label = "Optimizing-giving laws and a tied-optimum model on the root's giving"
lean = "Model.Controls"
paraphrase = "Premise-free laws and one finite model (a structural surrogate, not metaphysical possibility). Laws: (1) under the giving-output adapter, cross-world stable output is exactly being fixed (NECESSITATE_5) toward every being given at w; (2) a root that gives by total optimal output with a unique optimum is fixed toward every being it gives at w and two-way toward none, so it cannot be a mixed-mode root (it gives exactly one being per world); without direct reach it can still be a mediated creator; (3) with SS, such a root giving some other being at w by exercising a rational power makes WN fail. Model: on a frame where the GOD_4 root with intellect exists at both worlds and gives a different contingent at each, the premises of the refutation other than uniqueness hold, the root gives by total optimal output over two tied candidates, both are optimal, here the tied root is two-way toward the first, and the unique-optimum rival fails. Encoding disclosures: quality is constant; G and existence are fixed by construction; the Ontic causal field and other relations are empty; the second contingent exists only at the second world."
definitions = ["1ef0f844-1a0d-4ce8-8f54-87c29e96ef76", "2d069414-67f7-5bba-b750-830f06caf84d", "4f503422-a3dc-51f3-8e1d-a1065ef6038e", "c033d373-f381-504b-9674-c13fc9a96034", "02aa24f8-e6cc-4d47-8b34-d3b7149e7ee8", "8c945061-acb2-47e1-9865-d10f8f925757", "90719cb5-43c2-4677-8ad7-20e077e28ac9", "b8061228-9131-40f2-83bd-cb7d719bd0a0", "582f44c3-7778-4806-b385-e1eff852ac5e", "62dfa893-b633-4513-9790-8f9a0a3087e0", "c57e2682-08e6-527e-950f-0fa0a7ff11ef", "a1b2e330-388f-4120-bc5c-969642317792", "38b92bb6-33ae-5817-85c6-b5a1afa63bd1", "DEF-KANT-MODAL-CONTINGENCY", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-ONTOLOGICAL-MODEL"]
