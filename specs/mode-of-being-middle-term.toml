[[statement]]
id = "Thin and act readings of perfection of being on one subsistent source: controls"
label = "Thin and act readings of perfection of being on one subsistent source: controls"
lean = "Control.Controls"
paraphrase = "Closed finite profiles; statements about them only. A source that is its own being and a living effect; two stipulated pure determinations, one standing for being and one, a Boolean stand-in for life (not any recorded sense of LIVING). Thin profile: only being is a perfection of being and the source has only being; d164b1ff holds, c4fb87a6 fails at the stand-in for life, and the source lacks it. Act profile: every pure determination is a perfection of being and the source has every determination; both premises and their composite hold. It witnesses where a thin reading of 'perfection of being' leaves the pair: it can keep d164b1ff and must give up c4fb87a6. It is not evidence for either reading."
definitions = ["5dc08b95-ca15-52ab-b8cd-2b558e9a13f7", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72", "5f851204-5991-5e16-87f1-e8b3ed729708", "3aba5f19-f48d-50db-bc57-93ba2e99f845", "65e38ffa-5a1c-55d0-935c-6538d843b780"]
disambiguations = ["b1640e51-d7d4-5a80-9992-29fa1ded8048", "dc9c0a1b-1759-5b1c-9ab9-ee7bea8847b7", "1aef8986-ed29-564f-9803-d812d2ff63e1", "1795a62e-f78b-5f5b-94e7-9e7490824811"]

[[argument]]
id = "The mode-of-being premise pair is equivalent to its composite, checked"
label = "The mode-of-being premise pair is equivalent to its composite, checked"
theorem = "modesPairIffTotalTransfer"
premises = []
conclusion = "The mode-of-being pair is equivalent to: a total cause of being causes every actual perfection"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Compose the pair; conversely read mode of being as had in act"
meaning = "Forward: from a mode of being of an actual perfection and the total-cause premise, the total cause causes the perfection. Backward: take 'mode of being' to be 'had in act'; the mode premise is then trivial and the total-cause premise is the composite. Premise-free: it is the equivalence itself, a certificate that the decomposition shifts the load rather than lightening it."

[[argument]]
id = "The dependence reading moves the transfer load to the total-cause premise, checked"
label = "The dependence reading moves the transfer load to the total-cause premise, checked"
theorem = "dependenceReading"
premises = []
conclusion = "On the dependence reading of mode of being, the transfer load moves to the total-cause premise"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Unfold the dependence reading; use actuality only insofar as being"
meaning = "Assume nothing has actuality except insofar as it is. Every perfection had in act is then had together with being, so it is a mode of being in the dependence sense, and the total-cause premise at that reading demands causation of every perfection had in act. Premise-free: the implication itself."

