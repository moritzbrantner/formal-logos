[[statement]]
id = "The mode-of-being pair is equivalent to: a total cause of being causes every actual perfection"
label = "The mode-of-being pair is equivalent to: a total cause of being causes every actual perfection"
lean = "ModesPairIffTotalTransfer"
paraphrase = "Analyst formulation, attribution deferred. Over the shared frame and for any total-cause relation: the pair 791fa216 and 2f6b9eff, existentially closed over the primitive ModeOfBeing, is equivalent to the composite: a total cause of a thing's being causes each perfection that thing has in act. This is an instance of a general logical fact about any two-premise decomposition through a middle term, and it certifies nothing about warrant by itself. What it shows for this case is that, since in every registered consumer ModeOfBeing occurs only in its pair and no independent fixing of it beyond the act-of-being thesis is on file, the pair carries the composite's load; which member carries it depends on the reading of mode of being (on the constitutive reading 2f6b9eff is near-analytic). It asserts neither premise."
definitions = ["42f8b601-09d6-5ad0-af5f-27af30b95166", "09542185-eb41-5874-8fd3-fe40ea68aeb4", "211a6432-8b8f-53ed-85e3-75173bb15b24", "5cbd5a0a-9055-4b69-af39-bd0bff1279fd"]
disambiguations = ["00e0d443-eb39-56a3-9179-9c8852ca4a2b", "dba7b1de-f3a0-57af-9af9-b2a4da3136fa"]

[[statement]]
id = "On the dependence reading of mode of being, the transfer load moves to the total-cause premise"
label = "On the dependence reading of mode of being, the transfer load moves to the total-cause premise"
lean = "DependenceReadingShiftsLoad"
paraphrase = "Analyst formulation, attribution deferred. Read 'r is a mode of x's being' as 'x has r in act and has being' (MODE_OF_BEING_1, DependenceMode): the q.4 a.2 ground 'secundum hoc enim aliqua perfecta sunt, quod aliquo modo esse habent' read as a necessary condition. Aquinas himself uses that ground to support the constitutive reading ('secundum hoc ... quod' means 'in virtue of'; the second proof's 'unde sequitur' needs more than the necessary condition; q.4 a.1 ad 3 infers the act thesis from the parallel 'nihil habet actualitatem nisi inquantum est' with 'unde'). Given that nothing has actuality except insofar as it is (7067553d), every perfection had in act is a mode of being in the dependence sense (791fa216 at this reading), and the total-cause premise 2f6b9eff at this reading is equivalent to: a total cause of a thing's being causes each perfection it has in act. So on this reading 791fa216 is near-analytic and the whole load of universal transfer sits on 2f6b9eff (with 5e281daf). It asserts none of the premises."
definitions = ["064cf1e9-a682-4f65-bd31-e8a327d5c072", "09542185-eb41-5874-8fd3-fe40ea68aeb4", "211a6432-8b8f-53ed-85e3-75173bb15b24", "5cbd5a0a-9055-4b69-af39-bd0bff1279fd", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72"]
disambiguations = ["00e0d443-eb39-56a3-9179-9c8852ca4a2b", "dba7b1de-f3a0-57af-9af9-b2a4da3136fa"]

[[statement]]
id = "The subsistent-esse pair is equivalent to: what is its own being has every pure perfection"
label = "The subsistent-esse pair is equivalent to: what is its own being has every pure perfection"
lean = "OwnBeingPairIffEveryPure"
paraphrase = "Analyst formulation, attribution deferred. For any own-being predicate, real-determination relation and purity predicate: the pair d164b1ff and c4fb87a6, existentially closed over the primitive OfBeing, is equivalent to the composite: what is its own being has every pure perfection. This is an instance of a general logical fact about two-premise decompositions and certifies nothing about warrant by itself. In every registered consumer (7d8bbdcb, 95c04a6d, ff74a7ac) OfBeing occurs only in these two premises, and no fixing of it independent of the intensive reading is on file, so the pair carries the composite's load; which member carries it depends on the reading of perfection of being (thin or intensive). It asserts neither premise."
definitions = ["5dc08b95-ca15-52ab-b8cd-2b558e9a13f7", "5f851204-5991-5e16-87f1-e8b3ed729708", "3aba5f19-f48d-50db-bc57-93ba2e99f845", "65e38ffa-5a1c-55d0-935c-6538d843b780"]
