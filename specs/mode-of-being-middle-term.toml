label = "The dependence reading moves the transfer load to the total-cause premise, checked"
theorem = "dependenceReading"
premises = []
conclusion = "On the dependence reading of mode of being, the transfer load moves to the total-cause premise"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Unfold the dependence reading; use actuality only insofar as being"
meaning = "Assume nothing has actuality except insofar as it is. Every perfection had in act is then had together with being, so it is a mode of being in the dependence sense, and the total-cause premise at that reading demands causation of every perfection had in act. Premise-free: the implication itself."

