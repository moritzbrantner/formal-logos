[[statement]]
id = "The mode-of-being pair is equivalent to: a total cause of being causes every actual perfection"
label = "The mode-of-being pair is equivalent to: a total cause of being causes every actual perfection"
lean = "ModesPairIffTotalTransfer"
paraphrase = "Analyst formulation, attribution deferred. Over the shared frame and for any total-cause relation: there is a reading ModeOfBeing on which every perfection a thing has in act is a mode of its being (791fa216) and a total cause of a thing's being causes each of its modes of being (2f6b9eff), exactly when a total cause of a thing's being causes each perfection that thing has in act. Since 791fa216's ModeOfBeing is a primitive that, in every registered consumer, occurs only in 791fa216 and one other premise, the pair says no more than the composite; its warrant is whatever fixes the meaning of 'mode of being'. It asserts neither premise."
definitions = ["42f8b601-09d6-5ad0-af5f-27af30b95166", "09542185-eb41-5874-8fd3-fe40ea68aeb4", "211a6432-8b8f-53ed-85e3-75173bb15b24", "5cbd5a0a-9055-4b69-af39-bd0bff1279fd"]
disambiguations = ["00e0d443-eb39-56a3-9179-9c8852ca4a2b", "dba7b1de-f3a0-57af-9af9-b2a4da3136fa"]

[[statement]]
id = "On the dependence reading of mode of being, the transfer load moves to the total-cause premise"
label = "On the dependence reading of mode of being, the transfer load moves to the total-cause premise"
lean = "DependenceReadingShiftsLoad"
paraphrase = "Analyst formulation, attribution deferred. Read 'r is a mode of x's being' as 'x has r in act and has being', the reading supplied by the sentence's own ground ('secundum hoc enim aliqua perfecta sunt, quod aliquo modo esse habent'). Given that nothing has actuality except insofar as it is (7067553d, q.4 a.1 ad 3), every perfection had in act is a mode of being in this sense (791fa216 at this reading), and the total-cause premise 2f6b9eff at this reading is equivalent to: a total cause of a thing's being causes each perfection it has in act. So on this reading 791fa216 is near-analytic and the whole load of universal transfer sits on 2f6b9eff (with 5e281daf). It asserts none of the premises."
definitions = ["42f8b601-09d6-5ad0-af5f-27af30b95166", "09542185-eb41-5874-8fd3-fe40ea68aeb4", "211a6432-8b8f-53ed-85e3-75173bb15b24", "5cbd5a0a-9055-4b69-af39-bd0bff1279fd", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72"]
disambiguations = ["00e0d443-eb39-56a3-9179-9c8852ca4a2b", "dba7b1de-f3a0-57af-9af9-b2a4da3136fa"]

[[statement]]
id = "The subsistent-esse pair is equivalent to: what is its own being has every pure perfection"
label = "The subsistent-esse pair is equivalent to: what is its own being has every pure perfection"
lean = "OwnBeingPairIffEveryPure"
paraphrase = "Analyst formulation, attribution deferred. For any own-being predicate, real-determination relation and purity predicate: there is a reading OfBeing on which what is its own being has every perfection of being (d164b1ff) and every pure perfection is a perfection of being (c4fb87a6), exactly when what is its own being has every pure perfection. OfBeing is a primitive that, in every registered consumer (7d8bbdcb, 95c04a6d, ff74a7ac), occurs only in these two premises, so the pair says no more than the composite; which of the two carries the load depends on how 'perfection of being' is fixed. It asserts neither premise."
definitions = ["5dc08b95-ca15-52ab-b8cd-2b558e9a13f7", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72", "5f851204-5991-5e16-87f1-e8b3ed729708", "3aba5f19-f48d-50db-bc57-93ba2e99f845", "65e38ffa-5a1c-55d0-935c-6538d843b780"]
