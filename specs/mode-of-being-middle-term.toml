# "omnium autem perfectiones pertinent ad perfectionem essendi" (5c5281dd), on which two
# loci rest: universal transfer b26c10a0 through its reading 791fa216 with 2f6b9eff, and
# the subsistent-esse route through c4fb87a6 with d164b1ff (second proof and ad 3). Each
# pair meets only at a primitive middle term (ModeOfBeing, OfBeing). This batch certifies
# what each pair says, shows how the sentence's own ground moves the load, and records a
