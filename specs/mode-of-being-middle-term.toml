[[statement]]
id = "R-act1: the esse of whatever is not its own being is received in a principle and limited"
label = "R-act1: the esse of whatever is not its own being is received in a principle and limited"
lean = "FiniteEsseReceivedAndLimited"
paraphrase = "Analyst formulation, attribution deferred: the reception thesis of the act of being. For every x that is not its own being, x's esse is received in some principle, as act in receiving potency (EsseReceivedIn), and x's esse is limited (EsseLimited). It belongs to a shared-warrant cluster of logically distinct members: 7fcfcee8 (a receiver is in receptive potency, conditional on reception), 14325c83 (no principle is in receptive potency to itself, negative), 7338142d (own being is no recipient), 7de89edb (received esse is limited, conditional) and 1304b462 (limited esse is received, conditional). These hold vacuously where nothing is received; of the route premises, 29e71e43 (every CREATURE_1's esse is received) assumes the reception half for creatures, and with 7de89edb the limited half. It does not say that every pure perfection is a perfection of esse (R-act2): the thin profile of the mode-of-being controls satisfies it while R-act2 fails. Its source arguments (q.4 a.1 ad 3, q.3 a.4, De ente c.4) are to be assessed, not taken as a bare primitive. Open."
definitions = ["4433942e-aaf6-55a9-b777-66e55638103d", "6ced5205-e6a4-585e-950e-3b22e7c9ef01", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72"]
disambiguations = []

[[statement]]
id = "R-act2, intensive esse: every pure perfection is a perfection of esse itself"
label = "R-act2, intensive esse: every pure perfection is a perfection of esse itself"
lean = "IntensiveEsse"
paraphrase = "Analyst formulation, attribution deferred: every pure perfection is a perfection of esse itself (PERFECTION_OF_BEING_2, IntensiveEsseFrame.OfEsse), so that subsistent esse includes it. It is c4fb87a6 with 'perfection of being' read in the intensive sense. q.4 a.1 ad 3 states the act thesis in two steps ('comparatur enim ad omnia ut actus ... unde ipsum esse est actualitas omnium rerum, et etiam ipsarum formarum'), and q.4 a.2 ad 3 applies it to life and wisdom. On the stated interfaces, reception of esse (R-act1) does not give it: the controls show non-entailment from the vocabulary alone, since R-act1 and the reception and purity interfaces never mention OfEsse. The candidate bridge is the q.7 a.1 family (ReceptionLimitation): unreceived esse is unlimited, so it includes every pure perfection. Purity of life and wisdom is a stipulative classification (DEF-PURE-PERFECTION). Open."
definitions = ["0a2bf1a0-bfc5-45d7-966a-a28919b6e847", "65e38ffa-5a1c-55d0-935c-6538d843b780"]
disambiguations = ["62ca3d65-8dd4-4187-abe1-a928b3045f12"]
connection_plan = { target_statement_id = "c4fb87a6-047d-5f3d-b3e3-8dc0c4bbc946", missing_bridge = "A decision of DISAMB 62ca3d65 that c4fb87a6, as used on its root routes (7d8bbdcb, 95c04a6d, ff74a7ac), takes PERFECTION_OF_BEING_2, so that R-act2 supplies it (the identity is registered as logically_equivalent_to).", blocker = "DISAMB 62ca3d65 leaves the sense of c4fb87a6's primitive OfBeing undecided between the thin and intensive readings; the registered equivalence holds only on the intensive reading, which is the contested act-of-being thesis (docs/notes/mode-of-being-subsistent-esse.md)." }

