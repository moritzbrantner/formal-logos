[[argument]]
id = "f4df2153-a995-40f7-99d6-3f68ed2b5cbe"
label = "Maximal esse causality from common ancestry, composition and causal ascent"
theorem = "maximalCauses"
strong_version_needed = { "b4987085-f7b0-4031-a795-364873d3c216" = "Composition is applied by Q44SourceSupply.causeOfChain along an arbitrary finite chain of actual esse causes (TransGen ActualEsseCause), at every link. The weak version PerSeComposition (7648194d) composes only when the later link is per se (PerSeActualEsseCause … AsCaused). This theorem has no AsCaused relation and no premise makes the chain links per se.", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410" = "The proof applies excluded middle to `m = n` (in maximalCauses), an identity question about a maximum and the common esse source (m = n), where neither side is given as a GOD_4 candidate. LocalLogic (ca432e24) decides only whether an actual bearer is identical with a GOD_4 candidate, and gives double-negation elimination for that candidate's esse–essence identity." }
premises = ["c35b1a5c-6405-449b-993b-8196b2457e08", "b4987085-f7b0-4031-a795-364873d3c216", "cffad050-e86d-48b8-b04b-be47fcc1352d", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410"]
conclusion = "da09703b-0b1e-5dca-9dd7-6c0c8d1610d7"
axioms = []
rule = "Collapse existing actual esse-cause ancestry; causal ascent identifies each maximum with that same source"
meaning = "Analyst source-first alternative for the selected-esse genus premise. The existing common ancestor supplies one actual n and a finite nonempty actual esse-cause path to each other actual being. Reuse causeOfChain under the existing composition law to obtain CausesIn n x esse. The existing causal-ascent premise then places n above any distinct maximal m, contradicting m's maximality; explicit excluded middle gives m=n. Thus every merely maximal bearer has n's universal esse-causal scope. No order-to-cause converse, greatest-degree calibration, uniqueness of tied degrees, Fourth-Way genus causality or God naming is assumed. Common-source identity and uncausedness are retained parts of an existing reusable interface but unused by this proof. The source/composition/ascent premises remain open to independent warrant and actual application; the tenseless, mode-unspecified profile is not thereby a present productive support relation. This supports the existing fixed-esse premise, not the stronger all-respects d9fad785 premise. See docs/notes/maximum-definition-fork.md."

[[argument]]
id = "c98328f1-3c05-40ad-983f-1fee15873f12"
label = "Existence-only GOD_4 bundle with fixed esse maximal causality"
theorem = "godExistsAtBeing"
strong_version_needed = { "cb1cdea9-eb6c-578c-8008-84e0d4107fd3" = "The premise is applied to a cause whose actual concreteness is not otherwise available: a maximum in esse (maximumEqualsRoot, actualRootMaximum), the uniting or external cause of a supposed composite or distinct-esse root, or an arbitrary given cause or prior. The proof relies on the premise's output that this cause is concrete and exists at w (ActualConcreteGround c x), either to contradict rootness or as part of the conclusion. The weak version ActualEsseCauseIsActualGround (b17a8954) assumes ActualConcrete c and yields only grounds w c x.", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410" = "The proof applies excluded middle to propositions outside LocalLogic's scope, e.g. `∃ y, MoreIn esse y x` (in actualFork); `∃ m, TruthCore.Latin.Aquinas.SummaTheologiae.IsMaximumIn InAct MoreIn esse m` (in actualFork). LocalLogic (ca432e24) decides only whether an actual bearer is identical with a GOD_4 candidate, and gives double-negation elimination for that candidate's esse–essence identity." }
sense_bridges = [{term = "GOD", from = "GOD_1", to = "GOD_4", statement_id = "1ec205ed-b2a6-5384-bb5f-2565a9d325bf"}, {term = "MAXIMAL_IN_A_SELECTED_PERFECTION_GREATEST", from = "MAXIMAL_IN_A_SELECTED_PERFECTION_GREATEST_6", to = "MAXIMAL_IN_A_SELECTED_PERFECTION_GREATEST_1", statement_id = "6c27657f-a2bf-5c1d-963c-c154b66bfa85"}]
premises = ["56f68b40-9737-59a0-8cac-5610980a1547", "5c898d24-d1f7-5087-b09e-3287a723e787", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410", "86efed1a-f353-5b5d-9431-df7fc643ace1", "da09703b-0b1e-5dca-9dd7-6c0c8d1610d7", "0436de86-6579-53f2-9ff5-2111ba44ebae", "cb1cdea9-eb6c-578c-8008-84e0d4107fd3", "6c27657f-a2bf-5c1d-963c-c154b66bfa85", "7067553d-cad9-5d79-b6b2-912e35051530", "b26c10a0-983d-5a88-aa03-cc601bc1ddc6", "09c6d5f0-d412-5038-85f9-75fffb935727", "1ec205ed-b2a6-5384-bb5f-2565a9d325bf"]
conclusion = "8626f8a5-9531-5da7-9ebd-f901e74b1129"
axioms = []
rule = "Restrict only genus causality to esse within the existing twelve-input same-witness construction"
meaning = "Scoped consumer for the source-first support option. Compared with argument5e8e6054/result973582b8, replace only the all-respects d9fad785 genus premise by the existing fixed-esse da09703b premise and retain the other eleven inputs. The actual root n from whole-roster foundation is first through the priority bridge. Fixed-esse causality identifies each maximum with n; the existing maximum-existence helper and reduced-description naming theorem then name that same n. The helper retains rootness and firstness through naming. This derives GodExists only under the explicit nominal bridge and all other inputs; no modal necessity or later attributes are asserted, and neither this assembly nor the source-first argument independently warrants its premises. The grades premise supplies the existing IsMaximalIn/IsMaximumIn definitional bridge, not a greatest-degree identification; the nominal premise supplies the GOD_1/GOD_4 bridge. Global grades-to-maximum is retained here rather than duplicating the separate grades-at-being scope work."
