[batch]
vocab = "TruthCore.Causality.SelectedSourcePath"
results = "TruthCore.Results.Causality.SelectedSourcePath"

[[statement]]
id = "A finite path from the selected actual concrete bearer reaches a source of its grounding cone"
lean = "HasSelectedSourcePath"
definitions = ["9c6e4314-2e35-52ff-951e-db752a3c8ce2", "822c9912-2313-584b-b2b7-77031da20107", "52352824-6be9-53c6-83d4-82fed9a08cbb"]
paraphrase = "Starting at the specified actual concrete bearer, some finite upstream path of the selected world's immediate Profile.grounds edges in the complete actual concrete cone ends at a source. The endpoint has no incoming edge from any cone member, including itself. Closure of the cone under actual concrete grounds gives the same source test on the whole actual concrete grounding graph. The path can have length zero and says nothing about other branches on its own."

[[statement]]
id = "Distinct immediate suppliers in the selected cone always have a common immediate supplier"
lean = "SelectedForksJoinInOneStep"
definitions = ["9c6e4314-2e35-52ff-951e-db752a3c8ce2"]
paraphrase = "For every bearer in the complete selected actual concrete cone, any two distinct immediate suppliers of that bearer have one actual concrete supplier in the cone with an immediate Profile.grounds edge into both, at the same world. The joining supplier may vary by fork. The premise demands exactly one edge from the common supplier to each branch, and is vacuous at nodes with at most one immediate supplier."

[[argument]]
id = "Complete selected cone well-foundedness from one source path and one-step joining"
theorem = "coneWellFounded_of_sourcePath"
premises = ["A finite path from the selected actual concrete bearer reaches a source of its grounding cone", "Distinct immediate suppliers in the selected cone always have a common immediate supplier"]
conclusion = "1b1e3f09-f2e9-5949-9c3b-8f7fce26a403"
axioms = ["propext", "Classical.choice", "Quot.sound"]
comparator_theorems = ["accessibleOfSourcePath", "maximalPathsAgree", "necessaryRootAncestor_of_sourcePath", "oneStepForks_of_uniquePredecessor", "diamondAllowsBranching", "commonSourceAllowsRegress", "ancestralForkCriterion", "ancestralEdgeControl", "infiniteWidthControl"]
rule = "Transfer a finite source path across each strict fork and induct on its length"
meaning = "At each immediate upstream step every supplier has a path to the same source exactly one edge shorter. Induction gives accessibility of the selected bearer, and every actual concrete member of the complete cone inherits it. Any two finite maximal paths from the same bearer have equal length and reach the same source. Unique predecessor suffices, while the existing four-node diamond witnesses that immediate branching is compatible with the rule. The acyclic common-source ray witnesses that even global upstream confluence and a path to the same unique source from every node allow a regress when only finite joining is required. The ancestral-edge companions test what happens when every positive ancestral path becomes an edge. On a cone with a nonempty source path the new strict rule then permits only the source as a positive ancestor. A three-bearer chain preserves root access through closure but loses strict joining. The infinite-width control gives the tip infinitely many distinct actual immediate suppliers, each with the same source just one further step away. Every member belongs to this well-founded cone. The two application premises are open. To infer a necessary ancestor, retain the existing cone-local contingent grounding and excluded middle at the same actual selected bearer."
senses = { FULL_ANCESTRY_FOUNDATION_VERSUS_CONTINGENT_ONLY = "FULL_ANCESTRY_FOUNDATION_VERSUS_CONTINGENT_ONLY_1" }
