[[statement]]
id = "871a5f81-7c63-4511-81fc-8ca437587ccd"
label = "Actual reception of a bearer's esse entails its actuality in the same respect"
lean = "ReceiptImpliesActuality"
paraphrase = "Open analyst interpretation. For every bearer x and principle z, if x's act of being is received in z, then x is in act in the supplied respect of esse. The premise concerns actual receipt in a represented principle and requires the bearer to be in act in esse. An aptitude for reception can be assigned to a merely possible subject. No claim of external origin, modal contingency or a selected world's existence is included."
definitions = ["4433942e-aaf6-55a9-b777-66e55638103d", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168"]
disambiguations = ["5921354b-51e6-5da3-8d8c-e9041840fd9f", "dba7b1de-f3a0-57af-9af9-b2a4da3136fa"]

[[statement]]
id = "08178314-2ec9-459e-82b1-5ff10b49c383"
label = "Each limited actual concretum has a distinct giver of esse that actually grounds it"
lean = "LimitedEsseHasGroundingGiverAt"
paraphrase = "At one selected world w, each actual concrete bearer x whose act of being is limited has a distinct giver g. The same g causes x's esse in the fixed respect, is concrete and exists at w, and grounds x there. Limitation is a primitive of formal perfection of esse. It refers to neither quantitative size nor an observed restriction of some power. No independence, uniqueness or underivedness of g is asserted."
definitions = ["6ced5205-e6a4-585e-950e-3b22e7c9ef01", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72", "211a6432-8b8f-53ed-85e3-75173bb15b24", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "008cb21a-256c-5a90-822c-acd4591d699a", "a1b2e330-388f-4120-bc5c-969642317792"]
disambiguations = ["19190b6e-359f-590c-b434-4e6f5803da4f"]

[[argument]]
id = "8088f47d-529b-4386-9e38-3c5258a5bb5f"
label = "Actual receipt and the q.3 a.4 external-cause principle support a distinct giver"
theorem = "receivedEsseHasCause"
premises = ["871a5f81-7c63-4511-81fc-8ca437587ccd", "65f3d0c7-cc3d-4ce3-a4a9-6fa38bf722cb", "7fcfcee8-86ab-5a16-84ad-124cf5e8f9b2", "14325c83-1c3f-5afb-b63f-52b0c2b2a326", "33ad148b-ceab-5856-a4f8-c999a1dba644"]
sense_bridges = [{term = "CAUSING_AN_EFFECT", from = "CAUSING_AN_EFFECT_2", to = "CAUSING_AN_EFFECT_3", statement_id = "33ad148b-ceab-5856-a4f8-c999a1dba644"}, {term = "RECEPTION_OF_ESSE_VERSUS_EXTERNAL_CAUSE", from = "RECEPTION_OF_ESSE_VERSUS_EXTERNAL_CAUSE_1", to = "RECEPTION_OF_ESSE_VERSUS_EXTERNAL_CAUSE_2", statement_id = "4bc853db-ec33-40ff-857e-6a67f17532fb", role = "conclusion"}]
conclusion = "4bc853db-ec33-40ff-857e-6a67f17532fb"
rule = "Exclude identity by self-receptive potency, then apply the distinct-esse cause premise"
meaning = "A principle receiving the bearer's esse would stand in potency to its own act if the bearer's essence were identical to its esse. The identity-scoped location and irreflexivity premises exclude that consequence. Receipt also places the bearer in act, so the q.3 a.4 cause reading provides an external cause. Retain the same bearer and cause in the existing tenseless coverage conclusion for all recipients. The bare receipt predicate leaves external causation and world-indexed existence open."
description = "Conditional support for the existing all-bearer coverage premise, including beginningless recipients. In-act receipt supplies the guard of q.3 a.4. That reading remains a substantive dependence input for distinct-esse beings. The result assigns no time of exercise."

[[argument]]
id = "154517c6-ec70-4867-ba37-ace23f001a9d"
label = "A limitation of actual esse leads through reception to a distinct grounding giver"
theorem = "limitedEsseHasGroundingGiver"
strong_version_needed = { "cb1cdea9-eb6c-578c-8008-84e0d4107fd3" = "The premise is applied to a cause whose actual concreteness is not otherwise available: a maximum in esse (maximumEqualsRoot, actualRootMaximum), the uniting or external cause of a supposed composite or distinct-esse root, or an arbitrary given cause or prior. The proof relies on the premise's output that this cause is concrete and exists at w (ActualConcreteGround c x), either to contradict rootness or as part of the conclusion. The weak version ActualEsseCauseIsActualGround (b17a8954) assumes ActualConcrete c and yields only grounds w c x." }
premises = ["1304b462-4a10-5dd0-995a-db5feb21d98e", "4bc853db-ec33-40ff-857e-6a67f17532fb", "cb1cdea9-eb6c-578c-8008-84e0d4107fd3"]
conclusion = "08178314-2ec9-459e-82b1-5ff10b49c383"
rule = "Compose the recipient and giver witnesses with the actual concrete ground interface"
meaning = "The first input gives a principle receiving x's limited esse. The second gives a distinct bearer causing the esse received in that principle. The third makes that same giver an actual concrete ground at the selected world. The principles and beings can have different carriers. No temporal production or modal contingency premise occurs."
description = "Witness-preserving conditional dependence of formally limited actual concreta. The extent of limitation and its application to real beings remain open."

[[argument]]
id = "bc17c420-5276-461f-abdb-8fa1e76e73cc"
label = "Dependence of the finite supports every pure perfection at an actual root"
theorem = "rootPerfectionFromFiniteDependence"
premises = ["08178314-2ec9-459e-82b1-5ff10b49c383", "be1289df-3c43-5595-99b5-1fb8d38164be", "122b112e-3f19-5cd4-8cd0-a704ab1f2d87"]
conclusion = "fe67d766-3e9f-57b5-bbff-c3e2c50c56fd"
rule = "Exclude a concrete ground of the supplied root, then apply the infinity and perfection bridges"
meaning = "Suppose a particular actual root has limited esse. Its distinct actual giver would ground it, contrary to the root's lack of an incoming concrete ground. Unlimited esse supplies infinity through one explicit bridge. The infinite bearer's possession of each pure perfection uses another. The same root is retained throughout and no existence, necessity, uniqueness or God naming conclusion is included."
description = "Alternative support for the existing pure-perfection premise at actual roots. This route leaves the finitude-to-giver application and the two perfection judgments open. It does not presuppose essence–esse identity of every actual root."
