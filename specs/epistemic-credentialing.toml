[[statement]]
id = "ffb08b22-4304-472d-b9e7-a49d8d34fbd3"
label = "Every attributed belief reason has a justified credential"
lean = "UniversalCredential"
paraphrase = "OPEN analyst requirement. For each subject and attributed consideration for believing a content, some content certifies that very reason instance, is believed by the same subject, and meets the supplied warrant predicate. No independent priority, further reason, factivity or sufficiency for the original belief follows."
definitions = ["d13c0241-320a-5d56-8927-341e46063e05","15160f9d-a231-4a9f-834f-cc78a7523dc3","70ab36ea-a14c-413b-8f51-adfad1f01b3c"]
disambiguations = ["339c6bf8-37f1-5d5e-9f26-3258957443cc"]

[[statement]]
id = "4e30a1c1-0402-4155-8a57-a1df8af7daf6"
label = "Every justified credential of an active reason has a prior belief reason"
lean = "PriorCredentialReason"
paraphrase = "OPEN transfer and priority requirement. For each active attributed belief reason and each believed warranted credential certifying it, some consideration is an attributed reason of the same subject for believing that credential content and is related as prior to the original instance by the supplied epistemic priority. Well-foundedness is not assumed here; the intended independent-priority interpretation needs defense."
definitions = ["d13c0241-320a-5d56-8927-341e46063e05","15160f9d-a231-4a9f-834f-cc78a7523dc3","70ab36ea-a14c-413b-8f51-adfad1f01b3c"]
disambiguations = ["339c6bf8-37f1-5d5e-9f26-3258957443cc"]

[[statement]]
id = "89607c0b-af1e-4dbd-ad30-a32bf0303261"
label = "Credential priority is well-founded for each subject"
lean = "CredentialWellFounded"
paraphrase = "OPEN analyst order condition. For each subject, the supplied prior-to relation on consideration/content reason-instance pairs is WellFounded. This is epistemic priority, not temporal precedence, causal dependence, or a claim about the well-foundedness of actual metaphysical explanation."
definitions = ["d13c0241-320a-5d56-8927-341e46063e05","15160f9d-a231-4a9f-834f-cc78a7523dc3","70ab36ea-a14c-413b-8f51-adfad1f01b3c"]
disambiguations = ["339c6bf8-37f1-5d5e-9f26-3258957443cc"]

[[statement]]
id = "d008f164-5e50-480e-aa5c-888c5ca652ce"
label = "Universal justified credentialing of belief reasons fails"
lean = "UniversalCredentialFails"
paraphrase = "It is false that every active attributed belief reason has a believed warranted credential for that instance. The precise negation of the universal credential requirement in this same frame. Does not assert that every reason is basic or that any reason lacks all epistemic grounds."
definitions = ["d13c0241-320a-5d56-8927-341e46063e05","15160f9d-a231-4a9f-834f-cc78a7523dc3","70ab36ea-a14c-413b-8f51-adfad1f01b3c"]
disambiguations = ["339c6bf8-37f1-5d5e-9f26-3258957443cc"]

[[statement]]
id = "2d39f0cf-16c6-42b1-9552-0bd56dc2cabf"
label = "Thin reasons and universal well-founded prior credentialing are incompatible"
lean = "CredentialBundleInconsistent"
paraphrase = "For the same frame and credential data, thin reason existence, consideration presentation, universal justified credentialing, prior-reason transmission for each justified credential, and well-founded credential priority cannot all hold. Does not choose which member to reject."
definitions = ["d13c0241-320a-5d56-8927-341e46063e05","15160f9d-a231-4a9f-834f-cc78a7523dc3","70ab36ea-a14c-413b-8f51-adfad1f01b3c"]
disambiguations = ["339c6bf8-37f1-5d5e-9f26-3258957443cc"]

[[statement]]
id = "8f394797-785c-4494-aa49-3d493596b213"
label = "Credential bundle omission controls"
lean = "CredentialControls"
paraphrase = "Five structural interpretations of the same five-member bundle: with a reason and its presentation, an empty credential relation omits credentialing; a flat credential with empty priority omits prior transfer; a natural-number successor credential chain satisfies strict transitive prior transfer but omits well-foundedness; an unpresented thin reason omits presentation; and an empty reason frame omits thin reason existence. The well-foundedness omission is infinite, the others finite. These are not claims of actual epistemic adequacy or possible metaphysics."
definitions = ["d13c0241-320a-5d56-8927-341e46063e05","15160f9d-a231-4a9f-834f-cc78a7523dc3","70ab36ea-a14c-413b-8f51-adfad1f01b3c"]
disambiguations = ["339c6bf8-37f1-5d5e-9f26-3258957443cc"]

[[argument]]
id = "8542b5e2-e680-452a-84ee-531f5027a168"
label = "Universal well-founded prior credentialing excludes thin belief reasons"
theorem = "noReasonsFromCredentials"
premises = ["1b74e22c-3e2e-5328-b587-6dc2517f5e3f","ffb08b22-4304-472d-b9e7-a49d8d34fbd3","4e30a1c1-0402-4155-8a57-a1df8af7daf6","89607c0b-af1e-4dbd-ad30-a32bf0303261"]
conclusion = "38f44eff-5a6b-5e0d-a332-353af432ba1a"
rule = "Well-founded induction on same-subject reason instances"
meaning = "From an assumed thin reason, presentation supplies a particular attributed consideration for that belief. Each active reason has a justified credential, and prior transfer supplies another active reason for its credential at the same subject, prior to the original. Well-founded induction excludes every such active instance. This is a conditional derivation of the existing thin nihilism proposition, not a defense of nihilism or a premise that all epistemic dependence is well-founded."
definitions = ["d13c0241-320a-5d56-8927-341e46063e05","15160f9d-a231-4a9f-834f-cc78a7523dc3","70ab36ea-a14c-413b-8f51-adfad1f01b3c"]
disambiguations = ["339c6bf8-37f1-5d5e-9f26-3258957443cc"]

[[argument]]
id = "f7bd5674-105f-4af8-9f92-df930096f12e"
label = "Thin reasons exclude universal credentialing given prior transfer and well-foundedness"
theorem = "universalCredentialFails"
premises = ["f56b2ee7-c69e-5e3b-85b0-e671d907ba58","1b74e22c-3e2e-5328-b587-6dc2517f5e3f","4e30a1c1-0402-4155-8a57-a1df8af7daf6","89607c0b-af1e-4dbd-ad30-a32bf0303261"]
conclusion = "d008f164-5e50-480e-aa5c-888c5ca652ce"
rule = "Compose credential exclusion with the existing thin nihilism refutation"
meaning = "Assuming the universal credential requirement along with the supplied prior transfer, well-foundedness and presentation would produce thin global reasonlessness, contradicting the existing F6 witness in that very reason relation. The negation is conditional on all these premises; the result does not establish F6, well-foundedness, or refute a weaker credential requirement with no strictly prior reason."
definitions = ["d13c0241-320a-5d56-8927-341e46063e05","15160f9d-a231-4a9f-834f-cc78a7523dc3","70ab36ea-a14c-413b-8f51-adfad1f01b3c"]
disambiguations = ["339c6bf8-37f1-5d5e-9f26-3258957443cc"]

[[argument]]
id = "c5705aac-035f-4e2a-998a-db5794a903ea"
label = "Credentialing bundle incompatibility"
theorem = "credentialBundleInconsistent"
premises = []
conclusion = "2d39f0cf-16c6-42b1-9552-0bd56dc2cabf"
rule = "Discharge the exact conjunction using conditional credential exclusion"
meaning = "The full five-member conjunction in one frame is inconsistent. The certificate packages the preceding argument and preserves consideration presentation as an independent member; it does not select a member or assert any philosophical premise."
definitions = ["d13c0241-320a-5d56-8927-341e46063e05","15160f9d-a231-4a9f-834f-cc78a7523dc3","70ab36ea-a14c-413b-8f51-adfad1f01b3c"]
disambiguations = ["339c6bf8-37f1-5d5e-9f26-3258957443cc"]

[[argument]]
id = "06adb1ac-f53d-4aa8-9467-309354c2f38a"
label = "Thin nihilism excludes warranted acceptance under evidential calibration"
theorem = "noWarrantedAcceptanceFromNihilism"
premises = ["38f44eff-5a6b-5e0d-a332-353af432ba1a","0e2bbd59-2b4c-438d-b792-0ca401eaf862","6b4e3331-01ca-484b-bda1-460ebff1df35"]
conclusion = "cbe1661b-1b9e-4200-b97d-0b8464a323d8"
rule = "Compose existing warranted-acceptance-to-reason and F6-excludes-nihilism results"
meaning = "For the same ReliabilityFrame and Reason relation, if any actual acceptance is warranted, the existing requirement of an undefeated supporting basis and the surviving-basis reason calibration yield thin F6 (b3ddb7c4). This contradicts the supplied thin global nihilism by 146b502b. No conclusion about warranted acceptance follows from nihilism alone without both bridges. Composing with the credentialing exclusion requires the identical reason relation."
definitions = ["15160f9d-a231-4a9f-834f-cc78a7523dc3","dcbd9590-2c87-5550-a69c-b4af6e272fa4"]

[[argument]]
id = "8b92ca2d-638e-47c1-8903-b86a0fb5caeb"
label = "Credential bundle omission controls"
theorem = "controls"
premises = []
conclusion = "8f394797-785c-4494-aa49-3d493596b213"
rule = "Explicit finite interpretations and a strict infinite successor credential chain"
meaning = "The five omission profiles isolate each member of the bundle. In particular the W omission has irreflexive transitive prior relation and indefinitely many successor credential contents, while a nonempty finite acyclic serial graph could not supply the same omission. All belief, warrant, certification and reason assignments are structural surrogates; the profiles do not establish actual infinitist or holistic epistemology."
definitions = ["d13c0241-320a-5d56-8927-341e46063e05","15160f9d-a231-4a9f-834f-cc78a7523dc3","70ab36ea-a14c-413b-8f51-adfad1f01b3c"]
disambiguations = ["339c6bf8-37f1-5d5e-9f26-3258957443cc"]

