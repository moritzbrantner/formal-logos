[[argument]]
id = "Q44 essential-source supply from actual identity ancestry and reception"
theorem = "sourceSupply"
premises = ["cbb068e8-337d-5772-a3f9-10df457ba9fe", "3d01134d-0b03-4469-a81a-a18d6e179fa0", "Actual esse-cause responsibility composes along actual cause links", "6dfe01ab-e3f2-5a4c-b102-701c161f2cf7", "7fcfcee8-86ab-5a16-84ad-124cf5e8f9b2", "14325c83-1c3f-5afb-b63f-52b0c2b2a326", "bc1810e5-1070-5585-9b0f-e17ca3547ac7"]
conclusion = "de05072a-5db0-4a31-8e24-b18fedf01401"
axioms = []
rule = "Causal-chain induction, explicit reception argument and equality elimination"
meaning = "Each participant is actual with distinct represented esse. Its existing identity-bearing ancestor is therefore distinct from it and actual. The explicit composition law collapses the nonempty actual esse-cause chain. The four existing reception premises exclude a receiver for that identity bearer and pass from nonreception to primitive OwnBeing. This gives the existing existential source-supply statement. The ancestor may vary by participant; no global uniqueness, selected p, Fourth Way or GOD_4 identification is needed. No premise truth or historical derivation is established."

[[argument]]
id = "Q44 essential-source supply from the existing common ancestor and reception"
theorem = "sourceSupplyFromCommon"
premises = ["cbb068e8-337d-5772-a3f9-10df457ba9fe", "c35b1a5c-6405-449b-993b-8196b2457e08", "Actual esse-cause responsibility composes along actual cause links", "6dfe01ab-e3f2-5a4c-b102-701c161f2cf7", "7fcfcee8-86ab-5a16-84ad-124cf5e8f9b2", "14325c83-1c3f-5afb-b63f-52b0c2b2a326", "bc1810e5-1070-5585-9b0f-e17ca3547ac7"]
conclusion = "de05072a-5db0-4a31-8e24-b18fedf01401"
axioms = []
rule = "Causal-chain induction, explicit reception argument and equality elimination"
meaning = "Sibling retaining CommonEsseIsEssenceSource as a direct support option. A participant is actual and represented-distinct, hence other than the common identity source; its chain is supplied by that premise. The sourceSupply theorem uses the same explicit composition and four reception premises. Common uncausedness and advance numerical unity are not needed for this existential conclusion; per-participant ancestry is the weaker existing sufficient interface. No new causal or OwnBeing content is hidden in the common-source premise."

