[[argument]]
id = "df500d7b-4756-482d-96cf-35a56186d90f"
label = "The more-such package with an IN_ACT_1 bearer forces formal possession, checked"
theorem = "moreSuchPackageForcesFormalPossession"
premises = []
conclusion = "97a338be-a14a-4492-a2c7-c11f39cbcb33"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Compose moreSuchOfDistinctCauseGives at the shared act predicate with distinctCauseGivesOfMoreSuch at formal act"
meaning = "Assume the package. The registered derivation moreSuchOfDistinctCauseGives, applied at the shared act predicate InAct, gives 'more such': every distinct cause of r in x is more r than x. The registered derivation distinctCauseGivesOfMoreSuch, applied at formal act with the formal more-such bearer, turns that into formal possession. The result has no premises: it is the implication itself, valid for every InAct and every reception and limitation relation, and it asserts no member of the package. Its use is diagnostic: with an observed formal possession gap (25b67649), some member of the package fails under every single act reading; which member is not selected by this theorem."

[[argument]]
id = "ca5583c5-15e1-40b2-9685-e64e83486d65"
label = "More such package and mode of possession: induction-shaped controls, checked"
theorem = "controls"
premises = []
conclusion = "84ba508d-2ac6-429f-a210-fe9aeef9dd4c"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_mixing_control = true
rule = "Explicit finite interpretation over Bool, checked by decision"
meaning = "One finite interpretation shaped like induction heating, read twice: with an ordinary comparative and with an eminent comparative on the same causes, acts and reception. With the ordinary comparative, the formal possession gap, inclusive possession, the reception premises and the formal more-such bearer hold while the inclusive exceeding step, 'more such' and formal possession fail. With the eminent comparative the whole package holds at inclusive act and only the formal more-such bearer fails. The control shows that mixing eminent possession with a formal bearer fails in this interpretation. It is a structural surrogate: it shows which premise carries the failure in one interpretation, not that the premise is false of reality."

