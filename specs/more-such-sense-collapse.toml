# ---------------------------------------------------------------- statements

[[statement]]
id = "26632e48-b312-4011-a892-fe05510b1658"
label = "Whatever causes a perfection in another thing has it IN_ACT_1, formally"
lean = "FormalDistinctCausePossession"
paraphrase = "Analyst formulation, attribution deferred: the formal (IN_ACT_1) reading of distinct-cause possession 2c0b9bd7. Whatever, distinct from x, causes x's being r (CAUSE_2, G.CausesIn) has r formally, in the same form in which it produces it, as fire that is hot makes wood hot (A.InActFormally). It is one determination of 2c0b9bd7's act parameter, whose recorded reading is inclusive (formally or eminently); the eminent determinations are not this statement. Its exact negation 25b67649 is recorded as an alternative. Open."
definitions = ["211a6432-8b8f-53ed-85e3-75173bb15b24", "a5bda545-3e76-5240-808d-25f897a07be5", "00bd3c0c-010a-559c-a2a0-b4fbf49cbaf1"]
disambiguations = ["dba7b1de-f3a0-57af-9af9-b2a4da3136fa", "00e0d443-eb39-56a3-9179-9c8852ca4a2b"]

[[statement]]
id = "25b67649-87b9-49ee-a20c-398cc7cee655"
label = "Some distinct cause of a perfection in another does not have it IN_ACT_1, formally"
lean = "FormalPossessionGap"
paraphrase = "Analyst formulation, attribution deferred: the exact negation of 26632e48 with its original scope. Some c, distinct from x, causes x's being r (CAUSE_2) and does not have r formally (not A.InActFormally c r). It says nothing about virtual or eminent possession. Warrant, outside Lean: induction heating, in which a water-cooled copper coil carrying alternating current heats a steel workpiece far above the coil's own temperature; on DEF-CAUSE-OF-PERFECTION the coil is a cause of the workpiece's heat, and it is not formally hot to that degree. The case needs only that CAUSE_2 counts the coil; it does not need CAUSE_2 to count instruments in general, because the principal causes upstream in a hydroelectric supply (turbine, generator, falling water) are not formally hot either. The finite interpretation in the controls 'More such package and mode of possession: induction-shaped controls' is a structural surrogate of the case, not its evidence. Open."
definitions = ["211a6432-8b8f-53ed-85e3-75173bb15b24", "a5bda545-3e76-5240-808d-25f897a07be5", "00bd3c0c-010a-559c-a2a0-b4fbf49cbaf1"]
disambiguations = ["dba7b1de-f3a0-57af-9af9-b2a4da3136fa", "00e0d443-eb39-56a3-9179-9c8852ca4a2b"]

[[statement]]
id = "97a338be-a14a-4492-a2c7-c11f39cbcb33"
label = "The more-such package with an IN_ACT_1 bearer turns possession in any mode into formal possession"
lean = "MoreSuchPackageForcesFormalPossession"
paraphrase = "Analyst formulation, attribution deferred. For every single act predicate InAct shared by the possession premise and the exceeding step, and every reception and limitation relation: distinct-cause possession in InAct (2c0b9bd7), a caused perfection is received in its effect (a9036c3c), reception limits (cdb79aa6), limitation only through reception (39a4c28c), the cause's perfection is not received in the effect (d0b76fb9) and the exceeding step in InAct (7030af77), together with 'what is more such has the perfection' read with formal act (c11369aa at IN_ACT_1), imply formal distinct-cause possession 26632e48. It is an implication between those propositions, true in every interpretation; it asserts none of them. Consequence for the eminence clause: when the two registered steps (moreSuchOfDistinctCauseGives, distinctCauseGivesOfMoreSuch) are composed with eminent possession in the first and formal possession in the second, eminent possession comes back as formal possession."
definitions = ["211a6432-8b8f-53ed-85e3-75173bb15b24", "a5bda545-3e76-5240-808d-25f897a07be5", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168", "5766de66-8a37-5b04-aa65-9eec53319f50", "cf4875cb-6baf-5bf5-8590-84a21777c66c", "245797e9-e5e9-5296-8d34-2138cc6b7ae6", "00bd3c0c-010a-559c-a2a0-b4fbf49cbaf1"]
disambiguations = ["dba7b1de-f3a0-57af-9af9-b2a4da3136fa", "00e0d443-eb39-56a3-9179-9c8852ca4a2b"]

[[statement]]
id = "84ba508d-2ac6-429f-a210-fe9aeef9dd4c"
label = "More such package and mode of possession: induction-shaped controls"
lean = "Control.Controls"
paraphrase = "Closed finite interpretation; statements about it only. Two beings (a source, read as the coil, and a recipient, read as the workpiece) and two respects (being and heat); the source causes the recipient's heat and nothing else is caused; both have being formally, only the recipient is formally hot, the source has heat virtually (IN_ACT_2, as a power to produce it); the recipient's heat is received in and limited by the recipient. With the formal comparative (the recipient is hotter): the formal possession gap 25b67649, inclusive (IN_ACT_3) distinct-cause possession 2c0b9bd7, the four reception premises a9036c3c, cdb79aa6, 39a4c28c and d0b76fb9, and the formal more-such bearer c11369aa hold; the inclusive exceeding step 7030af77, 'more such' d5a94eb1 and formal possession 26632e48 fail. With the eminent comparative on the same causes, acts and reception (the source exceeds by eminence): inclusive possession, the reception premises checked, the inclusive exceeding step, 'more such' and the inclusive more-such bearer hold, and the formal more-such bearer fails. Encoding artifacts, disclosed: reception and limitation coincide; the respect of being is caused by nothing; the eminent comparative is stipulated as the source exceeding the recipient in heat, not derived from any measure. It witnesses which member of the package fails under each comparative in this one interpretation; it is not evidence that a premise is false of reality."
definitions = ["211a6432-8b8f-53ed-85e3-75173bb15b24", "a5bda545-3e76-5240-808d-25f897a07be5", "f7833666-c764-5624-a766-708949d9feee", "115f23e3-2a19-5dcb-bc7f-96408004f110", "5766de66-8a37-5b04-aa65-9eec53319f50", "cf4875cb-6baf-5bf5-8590-84a21777c66c", "245797e9-e5e9-5296-8d34-2138cc6b7ae6"]
disambiguations = ["dba7b1de-f3a0-57af-9af9-b2a4da3136fa", "00e0d443-eb39-56a3-9179-9c8852ca4a2b"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "df500d7b-4756-482d-96cf-35a56186d90f"
label = "The more-such package with an IN_ACT_1 bearer forces formal possession, checked"
theorem = "moreSuchPackageForcesFormalPossession"
premises = []
conclusion = "97a338be-a14a-4492-a2c7-c11f39cbcb33"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Compose moreSuchOfDistinctCauseGives at the shared act predicate with distinctCauseGivesOfMoreSuch at formal act"
meaning = "Assume the package. The registered derivation moreSuchOfDistinctCauseGives, applied at the shared act predicate InAct, gives 'more such': every distinct cause of r in x is more r than x. The registered derivation distinctCauseGivesOfMoreSuch, applied at formal act with the formal more-such bearer, turns that into formal possession. The result has no premises: it is the implication itself, valid for every InAct and every reception and limitation relation, and it asserts no member of the package. Its use is diagnostic: with an observed formal possession gap (25b67649), some member of the package fails under every single act reading; which member is not selected by this theorem."

[[argument]]
id = "ca5583c5-15e1-40b2-9685-e64e83486d65"
label = "More such package and mode of possession: induction-shaped controls, checked"
theorem = "controls"
premises = []
conclusion = "84ba508d-2ac6-429f-a210-fe9aeef9dd4c"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_mixing_control = true
rule = "Explicit finite interpretation over Bool, checked by decision"
meaning = "One finite interpretation shaped like induction heating, read twice: with a formal comparative and with an eminent comparative on the same causes, acts and reception. With the formal comparative, the formal possession gap, inclusive possession, the reception premises and the formal more-such bearer hold while the inclusive exceeding step, 'more such' and formal possession fail. With the eminent comparative the whole package holds at inclusive act and only the formal more-such bearer fails. The control shows that mixing eminent possession with a formal bearer fails in this interpretation. It is a structural surrogate: it shows which premise carries the failure in one interpretation, not that the premise is false of reality."

