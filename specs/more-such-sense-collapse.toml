[[statement]]
id = "25b67649-87b9-49ee-a20c-398cc7cee655"
label = "Some distinct cause of a perfection in another does not have it IN_ACT_1, formally"
lean = "FormalPossessionGap"
paraphrase = "Analyst formulation, attribution deferred: the exact negation of 26632e48 with its original scope. Some c, distinct from x, causes x's being r (CAUSE_2) and does not have r formally (not A.InActFormally c r). It says nothing about virtual or eminent possession. The respect matters, because formal possession is binary. Warrant, outside Lean, for a degree-indexed respect r (having heat at or above the workpiece's temperature) or for the threshold quality 'being hot' (DEF-RESPECT's example): in induction heating a water-cooled copper coil carrying alternating current heats a steel workpiece to roughly 800-1200 °C for hardening or forging while the coil, cooled by circulating water, stays at roughly the cooling water's temperature (typically below about 60 °C). This is stated as standard engineering practice, not read from a pinned source. On DEF-CAUSE-OF-PERFECTION the coil is a cause of the workpiece's heat, and it does not have heat at that degree formally. With r read as 'having some heat' the case does not witness this statement, since a coil at 30-60 °C has some heat formally; then the case reaches the possession family only through 'more such' d5a94eb1 on the ordinary comparative (MORE_3: the coil is not hotter). On a degree-indexed respect, formal possession by the cause amounts to the cause being at least as hot as the effect, the 'at least as such' claim of STMT-SYNONYMOUS-CAUSE-OF-QUALITY-IS-AT-LEAST-AS-SUCH without its synonymy condition. The same respect choice governs the upstream causes of a hydroelectric supply (turbine, generator, falling water): they lack heat at the workpiece's degree formally, though a generator's windings have some heat. The finite interpretations in the two induction-shaped controls are structural surrogates of the case, not its evidence. Open."
definitions = ["211a6432-8b8f-53ed-85e3-75173bb15b24", "a5bda545-3e76-5240-808d-25f897a07be5", "00bd3c0c-010a-559c-a2a0-b4fbf49cbaf1"]
disambiguations = ["dba7b1de-f3a0-57af-9af9-b2a4da3136fa", "00e0d443-eb39-56a3-9179-9c8852ca4a2b"]

[[statement]]
id = "97a338be-a14a-4492-a2c7-c11f39cbcb33"
label = "The more-such package with an IN_ACT_1 bearer turns possession in any mode into formal possession"
lean = "MoreSuchPackageForcesFormalPossession"
paraphrase = "Analyst formulation, attribution deferred. For every single act predicate InAct shared by the possession premise and the exceeding step, and every reception and limitation relation: distinct-cause possession in InAct (2c0b9bd7), a caused perfection is received in its effect (a9036c3c), reception limits (cdb79aa6), limitation only through reception (39a4c28c), the cause's perfection is not received in the effect (d0b76fb9) and the exceeding step in InAct (7030af77), together with 'what is more such has the perfection' read with formal act (c11369aa at IN_ACT_1), imply formal distinct-cause possession 26632e48. It is an implication between those propositions, true in every interpretation; it asserts none of them. Consequence for the eminence clause: when the two registered steps (moreSuchOfDistinctCauseGives, distinctCauseGivesOfMoreSuch) are composed with eminent possession in the first and formal possession in the second, eminent possession comes back as formal possession."
definitions = ["211a6432-8b8f-53ed-85e3-75173bb15b24", "a5bda545-3e76-5240-808d-25f897a07be5", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168", "5766de66-8a37-5b04-aa65-9eec53319f50", "cf4875cb-6baf-5bf5-8590-84a21777c66c", "245797e9-e5e9-5296-8d34-2138cc6b7ae6", "00bd3c0c-010a-559c-a2a0-b4fbf49cbaf1"]
