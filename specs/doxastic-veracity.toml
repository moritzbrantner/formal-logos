[[statement]]
id = "Divine DOXASTIC_BELIEF_1 is calibrated to DOXASTIC_BELIEF_2 by fixed contents"
lean = "FixedAssentCalibration"
paraphrase = "OPEN calibration. For each GOD_4 with classical attributes, each legacy actual assent has an independently assented content with the same fixed report and matching truth at actuality. Each independently assented content of the bearer is believed under the supplied Kripke box at actuality. The interpretation, report, and assent to individuated contents are fixed across the inference."
definitions = ["88f9f6e8-997b-5f7d-afa1-c501954c3807", "f2c09ae8-848d-5a3b-ab79-92c2b01d414c", "9851b8f8-9a75-4d46-b197-5c6d9b4f5f07", "eb1125b6-816b-4e58-bc27-e810399be48d"]
disambiguations = ["cb5875d9-bf4e-4584-bfea-04e50925fb20"]

[[statement]]
id = "A divine bearer's belief alternatives at actuality include the actual world"
lean = "TruthCore.Causality.DoxasticVeracity.DivineActualAccess"
paraphrase = "OPEN analyst access condition. For each GOD_4 with classical attributes, that same bearer's belief alternatives from actuality include actuality. A uniform sufficient frame condition for accuracy of calibrated assent; no global reflexivity or claim of necessity for a restricted family of contents."
definitions = ["88f9f6e8-997b-5f7d-afa1-c501954c3807", "f2c09ae8-848d-5a3b-ab79-92c2b01d414c"]

[[statement]]
id = "Fixed-content divine assent accuracy and its two KD45 controls"
lean = "Control.Certificate"
paraphrase = "Two worlds and one fixed interpretation. A classified bearer assents to an accurately reported contingent content when actuality is accessible. In a pointed KD45 profile for the same content and interpretation, omitting actual access permits false assent. The same nonreflexive pointed frame allows exact accuracy when the supplied assent only selects an everywhere-true content."
definitions = ["88f9f6e8-997b-5f7d-afa1-c501954c3807", "f2c09ae8-848d-5a3b-ab79-92c2b01d414c"]

[[argument]]
id = "Fixed-content calibration and actual access yield divine assent accuracy"
theorem = "accurateFromFixedContent"
premises = ["Divine DOXASTIC_BELIEF_1 is calibrated to DOXASTIC_BELIEF_2 by fixed contents", "A divine bearer's belief alternatives at actuality include the actual world"]
conclusion = "7dd8a624-b04d-4ea0-9ecf-2d9e5cab95ad"
axioms = []
sense_bridges = [{term = "DOXASTIC_BELIEF", from = "DOXASTIC_BELIEF_1", to = "DOXASTIC_BELIEF_2", statement_id = "Divine DOXASTIC_BELIEF_1 is calibrated to DOXASTIC_BELIEF_2 by fixed contents", role = "premise"}]
rule = "Compose assent calibration, actual-world specialization of the box, and disquotation"
meaning = "Keep the content, its supplied world interpretation, its report, and the bearer fixed. The calibration links the actual legacy assent to independently assented content and then to its box. The actual edge gives the content's truth at actuality. Disquotation and the matching report recover the original proposition."

[[argument]]
id = "Two-world tests of fixed-content divine assent and actual access"
theorem = "controls"
premises = []
conclusion = "Fixed-content divine assent accuracy and its two KD45 controls"
axioms = []
rule = "Evaluate a fixed content interpretation in pointed two-world models"
meaning = "The contingent content is true at the selected alternative in both profiles. Designating it as actual gives the nonvacuous positive application, while designating the other world keeps calibration and KD45 but gives false assent. With that same nonreflexive pointed frame and an everywhere-true content, accuracy holds."

[[relation]]
id = "Fixed-content models test use of actual access in divine assent accuracy"
subject_kind = "argument"
subject_id = "Two-world tests of fixed-content divine assent and actual access"
predicate = "tests"
object_kind = "argument"
object_id = "Fixed-content calibration and actual access yield divine assent accuracy"
note = "The contingent omission preserves fixed-content calibration and KD45 and falsifies the accuracy conclusion when actual access is dropped. The invariant-content profile gives accuracy without the self-edge, so the edge is a uniform sufficient condition and not necessary for accuracy on a restricted family."
