rule = "Literal excluded-middle fork and accessible induction over the restricted thinking ancestor relation"
meaning = "Select one actual concrete bearer via the existing Cogito result and the two separate actuality bridges. At every thinking ancestor x, excluded middle covers exactly P(x) or ¬P(x) under the *same* mediate G+ sense. Under P(x), a distinct earlier thinking G-ancestor c exists and accessibility of this restricted relation allows recursion while preserving the original bearer's finite ancestry. Under ¬P(x), no-fresh-thinker forces absence of any actual concrete G predecessor, so x is a thinking actual root. The separate contingent-thinker anti-brute premise excludes contingency of this SAME terminal witness, yielding accessibility-relative de re NecessityAt. The proof uses no all-ground accessibility, no grounding of nonthinking contingent ancestors, no necessary→underived principle and no uniqueness/esse/God naming. The original direct existential-sustenance reading requires a separate philosophical translation; no independence premise or its negation is silently imported. Analyst reconstruction; attribution deferred. #1743/#1791; named downstream bridge #1787, not connected yet."
