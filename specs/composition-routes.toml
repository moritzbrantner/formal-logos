[[argument]]
id = "b6c0c43b-51d0-4d12-a8d4-f6d553475b0c"
label = "The de re witness is CONCRETE_6 by selected-world calibration"
theorem = "necessaryConcreteOfCalibratedExistence"
premises = ["STMT-KANT-CONVERSION-NECESSARY-WITNESS", "0e02cd69-8fb0-4859-8287-937440c84b5b"]
conclusion = "STMT-NECESSARY-CONCRETE-AT"
rule = "Existential elimination and selected-world concreteness calibration"
meaning = "Keep the very individual that exists at the selected world and at all accessible worlds in this Profile. Apply the existing all-actual-existents concreteness premise at the selected world to that individual's actual existence. Both endpoints use NECESSARY_2, parameterized by the same accessibility frame. The only new fact about the witness is that it satisfies m.concrete. The calibration is itself supported conditionally by the existence-to-act and esse-in-re policies (978fc7b1), so this route inherits their scope. No claim about sourcehood or necessary causation follows. The mixed two-world control has actual concrete population and bare actual necessity with no necessary concretum."
disambiguations = ["623ddbf6-9683-5361-bae4-e348a00ec680", "6f1d1395-7c1d-5bd5-a45d-03380857aed6", "7507d645-874d-5434-add8-2f49c2801d36", "83264cf5-01fe-52fc-9a00-eeb024f6496e"]
axioms = []

[[argument]]
id = "3fced1d1-daf4-4f2a-9c5d-c5c6a137e201"
label = "An actual CONCRETE_6 object with no necessary parts witnesses CONTINGENCY_1"
theorem = "actualContingentOfNoNecessaryParts"
premises = ["STMT-SELECTED-ACTUAL-CONCRETE", "STMT-NO-NECESSARY-PARTS-AT"]
conclusion = "STMT-SOME-ACTUAL-CONTINGENT"
rule = "Reflexive parthood and classical duality of accessible universal existence"
meaning = "The specified actual concrete object is its own part under the fixed reflexive partial order, so no necessary parts entails that the same object fails de re necessity. Classically some accessible world omits it; selected-world actuality supplies the other conjunct of ContingentAt. In composition with the existing L3 result c3073ba5, select that theorem's very sum on the same Ontic, world and order and supply its actuality and concreteness separately. No actuality of a fusion follows from its Sum2 specification, and no account of a proper component, substantial composition or causation is assumed."
sense_bridges = [{ term = "NO_NECESSARY_PARTS_ORDINARY_CONTINGENCY_SELECTED", from = "NO_NECESSARY_PARTS_ORDINARY_CONTINGENCY_SELECTED_1", to = "NO_NECESSARY_PARTS_ORDINARY_CONTINGENCY_SELECTED_4", role = "conclusion", statement_id = "STMT-SOME-ACTUAL-CONTINGENT" }]
axioms = ["propext", "Classical.choice", "Quot.sound"]
