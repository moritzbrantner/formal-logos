disambiguations = ["91d5918a-a193-491d-806f-d32441ee41c5"]

[[statement]]
id = "799b9e92-e95e-40c7-a01f-30c1b70b317f"
label = "PROPER_PART_EXTENSIONALITY_2: composite-restricted identity on a fixed partial order"
lean = "TruthCore.Mereology.DependenceShapes.CompositeExtensionality"
paraphrase = "OPEN analyst principle on the SAME supplied Type B with the SAME supplied PartialOrder B: for all x and y in B, if both have a strict proper part and have equal strict proper-part profiles, then x=y. Only the two compared objects are restricted to composites; parts still range over all B. It asserts no composites exist. Weak sibling of unrestricted proper-part extensionality; it neither asserts nor requires the strong sibling."
definitions = ["fbfd68f0-5ebe-4a35-a047-c08fbf45b308", "f3379a14-41d3-48b6-a91e-4b694d136c0a"]
disambiguations = ["91d5918a-a193-491d-806f-d32441ee41c5"]
connection_plan = { target_statement_id = "d7741cdc-881b-5bda-85ce-d70223162f78", missing_bridge = "Interpret the same selected bearer and its constitutive principles in an explicit partial order. Show when its matter/form or real esse/essence distinction gives a proper subobject and when order-composition agrees with the q.3 a.7 Composite predicate.", blocker = "Strict lower cones contain individuals of the ordered carrier. The typed q.3 composition can compare principles in a separate sort without supplying proper subobjects. Extensional identity of order composites alone says nothing about what constitutes the bearer; simple priority and cause of esse would require separate premises even after calibration." }

[[statement]]
id = "At most one minimal object on a fixed partial order"
lean = "AtMostOneMinimal"
paraphrase = "On a supplied Type B and PartialOrder B, any two Mathlib IsMin objects are equal. It asserts at most one object with no strict proper part, not that any such object exists. This is the additional content of unrestricted proper-part extensionality over its composite restriction; it is not metaphysical simplicity or uniqueness of an ultimate ground."
definitions = ["105f1631-62c6-4f24-aec8-1fd12a760f10"]

[[statement]]
id = "Unrestricted extensionality is composite extensionality plus minimal uniqueness"
lean = "ExactDifference"
paraphrase = "For every Type B and PartialOrder B, unrestricted proper-part extensionality is equivalent to the conjunction of composite-restricted proper-part extensionality and at most one minimal object, all on that exact B/order. A premise-free comparison of encodings, not an assertion of either identity principle or of minimal-object existence."
definitions = ["39de6e29-e2e8-4f4f-8463-66a075f59d99", "105f1631-62c6-4f24-aec8-1fd12a760f10", "54281cc8-289e-47de-bfdb-bf52a624e572", "fbfd68f0-5ebe-4a35-a047-c08fbf45b308"]
