[[argument]]
id = "Exact difference of unrestricted and composite-restricted extensionality"
theorem = "exactDifference"
premises = []
conclusion = "Unrestricted extensionality is composite extensionality plus minimal uniqueness"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Separate equal proper-part profiles into the composite case and the minimal case"
meaning = "Forward: unrestricted identity implies its composite restriction and identifies minimal objects because both strict lower cones are empty. Reverse: if x has a proper part, equal profiles make y composite too, so restricted identity applies; otherwise both objects are minimal, so minimal uniqueness applies. This certifies the nondegenerate exact delta AtMostOneMinimal on every SAME B/order without background assumptions. No existence or actual-world premise is supplied."
