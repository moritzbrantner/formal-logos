disambiguations = ["DISAMB-EXISTENCE-ESSE-SUPPORT", "DISAMB-NECESSARY-EXISTENCE-VS-UNDERIVED"]
rule = "Finite case analysis on Bool"
meaning = "Strictness control: in the non-actual-edge model no contingent ground of the necessary holds and lifting fails, so no contingent ground does not entail lifting. A finite interpretation only."

