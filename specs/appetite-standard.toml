# #2145 lane H3: natural versus rational appetite under one standard of
# favouring. Lane P left the purity family at the crux "is a root's favouring a
# natural or a rational appetite?". The crux splits into two coordinates: what
# fixes the favouring (mode) and what measures it (formal object). Horn A's
# conclusion follows from the per-bearer standard plus an object premise that
# mentions no mode; the mode coordinate is the cognition criterion's. Analyst
# formulations, attribution deferred. See docs/notes/causal-perfection-transfer.md,
# section "Natural or rational appetite? The purity premises and the object of an
# original source's favouring".

[batch]
vocab = "TruthCore.Causality.AppetiteStandard"
results = "TruthCore.Results.Causality.AppetiteStandard"
definitions = ["177138ed-5cfd-4b94-ba05-771686976a24", "8cb01456-9be6-42fb-824a-65c64f53e706", "6b466d9f-9564-46e2-985e-4e7ec2901653", "e69e3826-1d88-4fdd-8db6-99c54625f985"]

[[statement]]
id = "2306492a-40c3-4550-b915-0ea43d93f432"
label = "A pure favouring determination makes exactly the verdicts of its formal object"
lean = "PureFavouringTracksItsObject"
definitions = ["65e38ffa-5a1c-55d0-935c-6538d843b780", "abd8cfa4-1887-47d5-86cc-e0f6092e4ded", "f58cd6bf-bcc0-4b47-97a1-a20e9933a086", "53634064-7959-4c9d-90c5-7dc88b741bea", "8e29c4fa-2f76-4158-a088-42cd7fcf6250"]
disambiguations = ["da16b898-110d-457b-81fb-b987f55f07c3"]
paraphrase = "OPEN analyst bridge, attribution deferred: for every favouring profile phi, if the real determination that a favouring of the bearer is phi is a pure perfection (DEF-PURE-PERFECTION, the same purity parameter as the #2153 premises), then in every variation scenario phi favours x over y exactly when phi's formal object ranks x over y. The formal object is the ranking that measures phi's kind of operation (for a will, the good; for a natural tendency, the end of its nature), not phi's particular content; the Lean parameter does not enforce that, and with phi as its own object the bridge would be trivial. It is lane P's per-bearer reading of the loss and arbitrariness bridges taken together: a pure favouring neither misses nor adds a verdict of its own standard. It does not fix which standard that is, and it says nothing about whether the favouring is a natural or a rational appetite. With every favouring measured by value it is equivalent to the two value-sense bridges 720bccc2 and a141e6a8 together (Lean-only: valueBridgesArePerBearerConstant, with excluded middle, and perBearerConstantGivesValueBridges). Lane 2b's D-directed nature, measured by its own end, satisfies it."

[[statement]]
id = "f2e8eb42-ed31-4760-ae92-ad9648fe3d23"
label = "Every favouring of an actual root has the value order as its formal object"
lean = "ActualRootFavouringObjectIsValue"
definitions = ["3aba5f19-f48d-50db-bc57-93ba2e99f845", "abd8cfa4-1887-47d5-86cc-e0f6092e4ded", "f58cd6bf-bcc0-4b47-97a1-a20e9933a086", "e14aa0f0-6271-42a2-9762-52a8285c3180"]
disambiguations = ["da16b898-110d-457b-81fb-b987f55f07c3"]
paraphrase = "OPEN analyst premise, attribution deferred: for every actual root r at w and every favouring profile phi such that the favouring determination of phi is a real determination of r, the formal object of phi (the ranking that measures its kind of operation) is the value order v's relation v.better (STANDARD_OF_FAVOURING_1, the type ValueStandardOrder). In words: an actual root's favouring is measured by the good, not by an end content. It says nothing about whether that favouring is a natural or a rational appetite. A rational appetite meets it under the kind rule that the object of willing is the good (rationalKindGivesObject, Lean-only); a natural appetite whose nature's end is the good meets it as well (formalObjectControls row 1 with no apprehension). Lane 2b's D-directed nature, whose formal object is D-realization, denies it."

[[argument]]
id = "d4a5623f-4ed2-4bd1-a2bc-68878fccdbd2"
label = "Actual-root favourings are good-general, from nonlimitation and the formal object"
theorem = "actualRootFavouringIsGoodGeneralFromFormalObject"
comparator_theorems = ["formalObjectControls", "appetiteGrid"]
premises = ["a30c5963-cb81-5366-aab0-2454363e18f7", "c78c77da-91b0-5928-bd5f-ba670a6f3660", "2306492a-40c3-4550-b915-0ea43d93f432", "f2e8eb42-ed31-4760-ae92-ad9648fe3d23", "ca3c311d-dab7-417d-8eb7-87c81fe82029"]
conclusion = "7fca65ec-8565-46fe-a5fe-bfdfcf0ed245"
axioms = ["propext", "Classical.choice", "Quot.sound"]
senses = {BECAUSE_OF_GOODNESS = "BECAUSE_OF_GOODNESS_2", STANDARD_OF_FAVOURING = "STANDARD_OF_FAVOURING_1"}
rule = "Actual roots have only pure determinations; a pure favouring makes exactly its formal object's verdicts; an actual root's favouring has the value order as formal object; value varies within an end-realization class, so the favouring is good-general"
meaning = "Fix an actual root r at w and a favouring determination favours phi of r. Actual roots have no represented limiting principle (its distinct simply prior being is the shared CausalityFrame's PriorSimply, PRIOR_1), so by the RootPurity bridge every real determination of r is pure, favours phi among them. By the per-bearer bridge, phi favours x over y exactly where its formal object ranks x over y, and by the object premise that object is the value order v's relation (STANDARD_OF_FAVOURING_1). Betterness varies within an end-realization class: some x is better than y at s, at least one of them not a present input, and not at a scenario t that agrees with s on end-realization. Then phi favours x over y at s and not at t, so phi depends on betterness with end-realization fixed (BECAUSE_OF_GOODNESS_2) and is good-general. The main theorem uses no axioms. Neither the per-bearer bridge nor the object premise mentions whether the favouring is a natural or a rational appetite, so the route is mode-neutral. It is a conditional alternative formulation inside the purity family that splits lane P's value-sense bridges (b86a2364) into a part the D-directed rival accepts (the per-bearer bridge) and the part it denies (the object premise); it adds no independent warrant to e2357adc's rationale. It does not use the #2153 admissible family, joint compossibility, the purity of good-generality e2357adc, one-favouring realization 3e6ae3e7, the E premise or the cognition criterion. Comparator companions (Mathlib axioms): formalObjectControls gives, on the #2153 two-being carrier with the Lane 2b profiles, a positive witness (also realized as a natural appetite with no apprehension, where the cognition criterion fails) and for each non-logical premise a row where it fails, the others hold and the conclusion fails; its fifth row is the D-directed nature measured by its own end, where only the object premise fails. appetiteGrid gives the four mode-by-object cells: the good-tracking profile as a natural appetite of a content state and as a rational appetite of a full apprehension state, both good-general; the D-directed profile as a natural appetite of a state determined to one end; the determined will as a rational appetite; per-bearer and common-value verdicts, which read only the profile and so are the same in both good-tracking cells; and the cognition criterion, which on the same good-tracking source holds when the source apprehends and fails when nothing is apprehended. The assignments say nothing about what favouring, purity, value, nature or apprehension are."
