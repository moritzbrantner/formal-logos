[[argument]]
id = "Existence in the selected extension from the asserter of an occurring thought"
theorem = "existenceFromAssertion"
premises = ["b45ca9db-0bf2-40d3-819c-44dc4e2cef5c", "1edfc1d1-34d4-4f3e-99e6-e07a6ba58ffc", "STMT-AGENT-OF-EPISODE-BEARS-IT", "STMT-BEARER-EXISTS-WHERE-EPISODE-OCCURS"]
conclusion = "43253cd8-62be-4528-85e4-54806bd3fac0"
rule = "Instantiate the bearing and world-existence rules at the asserter and realizing episode"
transcription = "assembly"
comparator_theorems = ["bearingHere", "assertionWitness", "populationFromAssertion"]
meaning = "Assembly transcription, attribution deferred. The frozen agency input quantifies over every asserter of the selected content in the supplied interpretation; OccursAt w localizes the required episodes but does not restrict that quantifier to this performance. Take an agent actually asserting the selected content and an episode realizing that assertion at the selected world. The realization premise uses the selected world's occurrence slice. Instantiate the agency premise with this asserter and their matching occurrence and realization. This explicitly requires that the matching asserter bears the episode. The world-indexed presence bridge puts that bearer into the selected existence extension. The exported conclusion is existence in that extension; the companion witness adds the in-re esse contract for concreteness of the same bearer."

[[argument]]
id = "Existence in the selected extension from the performer of a realized doubt"
theorem = "existenceFromDoubt"
premises = ["95c5138f-e3cc-552d-9846-ab8dc84502f4", "1722a80f-47a4-5605-8b66-b3534e457bcb", "STMT-AGENT-OF-EPISODE-BEARS-IT", "STMT-BEARER-EXISTS-WHERE-EPISODE-OCCURS"]
conclusion = "43253cd8-62be-4528-85e4-54806bd3fac0"
rule = "Instantiate the bearing and world-existence rules at the doubter and realizing episode"
transcription = "assembly"
comparator_theorems = ["doubtWitness", "populationFromDoubt", "calibrateDoubt", "sameBearerContingency", "bearerlessControl", "nonconcretePerformerControl", "elsewherePerformerControl", "presenceOmissionControl"]
meaning = "Assembly transcription, attribution deferred. The frozen agency input quantifies over every performed doubt of the specified kind in the supplied interpretation; OccursAt w localizes the required episodes but does not restrict that quantifier to this performance. Take a performed doubt whether thought occurs and an episode realizing that act at the selected world. The realization premise uses that world's occurrence slice. The agency premise expressly makes the assigned performer a bearer of the matching episode. The world-indexed presence bridge puts that same performer into the selected existence extension. The companion witness adds the in-re esse contract for concreteness. Contingency additionally requires an accessible world where this bearer is absent."
