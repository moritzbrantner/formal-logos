[batch]
vocab = "TruthCore.Causality.OccamRegress"
results = "TruthCore.Results.Causality.OccamRegress"

[[statement]]
id = "Occam’s razor and finite or infinite regress: equal likelihood preserves positive prior odds"
lean = "EqualLikelihoodOdds"
paraphrase = "At a fixed common positive likelihood for the same observation, positive prior weights on a finite hypothesis and an infinite regress hypothesis give positive comparison posteriors whose odds are exactly their prior odds. Every positive real odds ratio is realized by normalized positive priors, including odds favoring either rival."

[[statement]]
id = "Occam’s razor and infinite regress: preference beyond every finite factor requires zero rival weight"
lean = "UnboundedPreference"
paraphrase = "Fix a finite hypothesis with positive real weight and an infinite regress hypothesis with nonnegative real weight. The finite weight is at least every positive finite real multiple of the infinite weight exactly when the infinite hypothesis weight is zero."

[[statement]]
id = "ef01a8ff-f4a3-4297-9484-402f8f2270d6"
label = "Occam’s razor and infinite regress: uniform prefix discounts force zero hypothesis weight"
lean = "UniformPrefixDiscount"
paraphrase = "Suppose a nonnegative whole-hypothesis weight is bounded above by each of its prefix weights, the initial prefix weight is at most one, and each extension has weight at most a fixed fraction q of the previous prefix weight, with 0 ≤ q < 1. The whole-hypothesis weight is zero."

[[statement]]
id = "e9b5b688-7a85-4fff-861c-b717fad30074"
label = "Occam’s razor and infinite regress: one shared law allows positive hypothesis weight"
lean = "SharedLawCharge"
paraphrase = "For each one-time charge c in (0,1], a prefix-weight profile has weight one at the empty prefix, c at the first step, and stays at c through all further steps. A whole-hypothesis weight of c satisfies every prefix bound. No uniform factor below one bounds every extension."

[[argument]]
id = "Calculate finite and infinite regress odds at a common positive likelihood"
theorem = "equalLikelihoodOdds"
premises = []
conclusion = "Occam’s razor and finite or infinite regress: equal likelihood preserves positive prior odds"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Cancel the common likelihood and normalizer and normalize an arbitrary positive ratio"
meaning = "The hypotheses are compared at equal likelihood for the same observation. A defensible assignment of prior weights and a separate case for equal explanatory adequacy are application requirements. The likelihood calculation does not choose the priors or settle either hypothesis."

[[argument]]
id = "Characterize infinite multiplicative preference by zero rival hypothesis weight"
theorem = "unboundedPreference"
premises = []
conclusion = "Occam’s razor and infinite regress: preference beyond every finite factor requires zero rival weight"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "For positive rival weight, exhibit a factor exceeding the ratio"
meaning = "The comparison uses multiplication and remains defined when the infinite rival has zero weight. Both weights are fixed real numbers and the finite rival has strictly positive weight. The result supplies no premise that the infinite regress has zero weight."

[[argument]]
id = "Bound the whole regress hypothesis weight by geometrically decreasing prefix weights"
theorem = "uniformPrefixDiscount"
premises = []
conclusion = "ef01a8ff-f4a3-4297-9484-402f8f2270d6"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Induct on prefix length and apply a geometric limit to the upper bounds"
meaning = "Independent primitive commitments with a uniformly bounded cost can supply the displayed recurrence. The comparison needs an upper bound for the weight of the whole rival in every prefix event of the same prior model. A product for an individual sequence does not bound a union of alternative regresses. The application requires a reason that the rival's additional commitments incur the stipulated uniform cost."

[[argument]]
id = "Construct a positive regress prefix bound from one shared law charge"
theorem = "sharedLawCharge"
premises = []
conclusion = "e9b5b688-7a85-4fff-861c-b717fad30074"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Use a fixed positive charge for every nonempty prefix and test the second extension"
meaning = "The charge treats every nonempty prefix as the same law event, so the prior only charges its choice once. The control isolates a coherent numerical assignment for any number of generated links. It supplies no identifying evidence that an actual regress is generated by such a law or that one law provides adequate explanation of a whole regress."
