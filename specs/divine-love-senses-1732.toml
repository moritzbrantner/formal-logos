[[argument]]
id = "Strong exclusive ordered-love variant entails the ad 3 ordered-love reading"
theorem = "orderedStrongToWeak"
premises = ["1dd68893-7e41-4909-9f17-1dbb342a7d95"]
conclusion = "Ordered-love reading (q.20 a.2 ad 3): GOD_4 wills a non-rational effect's esse as ordered to others"
axioms = []
sense_bridges = [{term = "CREATURE_WILLING", from = "CREATURE_WILLING_1", to = "CREATURE_WILLING_2", statement_id = "1dd68893-7e41-4909-9f17-1dbb342a7d95"}]
rule = "Drop the denial conjunct of the strong variant"
meaning = "Strength order registration, analyst formulation. Same IsGod, HasWill, Rational, InAct, CausesIn, ordered-willing relation and esse: the strong variant's ordered conjunct is exactly the weak reading. The strong premise relates both CREATURE_WILLING senses (it denies recipient-directed willing); the conclusion uses only the ordered sense."

[[argument]]
id = "Strong ordered variant and recipient willing exclude non-rational caused effects"
theorem = "orderedStrongExcludesNonRationalEffects"
premises = ["1dd68893-7e41-4909-9f17-1dbb342a7d95", "a94c5dfc-c722-49fe-a242-dd39409b079d"]
conclusion = "No GOD_4 with will causes the esse of a distinct non-rational being in act"
axioms = []
sense_bridges = [{term = "CREATURE_WILLING", from = "CREATURE_WILLING_1", to = "CREATURE_WILLING_2", statement_id = "1dd68893-7e41-4909-9f17-1dbb342a7d95"}]
rule = "At one recipient-directed willing relation, the bridge's willing contradicts the strong variant's denial"
meaning = "Analyst formulation. At ONE RecipientGoodWilling W (the bridge instantiated at W.WillsGoodFor): for a distinct, non-rational, actual x whose esse a GOD_4 with will causes, a94c5dfc gives that g wills x's good to x, and the strong variant denies it. Hence such an x cannot exist if both hold. The two statements are therefore jointly incompatible with any GOD_4 with will causing the esse of a distinct non-rational being in act; this does not say which to reject. The weak ordered reading has no such conflict."

