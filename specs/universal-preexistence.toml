# ---------------------------------------------------------------- statements

[[statement]]
id = "Every perfection of another thing whose being a universal cause of being causes is in that cause"
label = "Every perfection of another thing whose being a universal cause of being causes is in that cause"
lean = "UniversalSourcePreexistence"
paraphrase = "Analyst formulation, attribution deferred: q.4 a.2 preexistence 64498e7e restricted to universal causes of being. If c causes the being of every other being that has being (CausesAllInGenus at esse, DEF-UNIVERSAL-ESSE-CAUSE-SCOPE), then for every x other than c whose being c causes, every perfection x has is in c (the frame's InAct, IN_ACT_4, one predicate on both sides as in 64498e7e). It says nothing about nonuniversal causes of being. It is the scope that the q.4 a.2 first proof applies explicitly ('cum ergo Deus sit prima causa effectiva rerum, oportet omnium rerum perfectiones praeexistere in Deo'), and the scope in which every God-route consumer of 64498e7e except perfectFromAncestry uses it. Open."
definitions = ["211a6432-8b8f-53ed-85e3-75173bb15b24", "c19faf56-0908-5e6e-8c39-ccba40dce5d1", "5cbd5a0a-9055-4b69-af39-bd0bff1279fd", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72"]
disambiguations = ["dba7b1de-f3a0-57af-9af9-b2a4da3136fa", "00e0d443-eb39-56a3-9179-9c8852ca4a2b"]

[[statement]]
id = "A universal cause of being has every perfection it causes in another thing whose being it causes"
label = "A universal cause of being has every perfection it causes in another thing whose being it causes"
lean = "UniversalSourceHasWhatItGives"
paraphrase = "Analyst formulation, attribution deferred: the cause-of-being possession d0fc96b7 restricted to universal causes of being and distinct effects. If c causes the being of every other being that has being, and c causes x's being and x's being r, with x other than c, then c is in act in r (the frame's InAct, IN_ACT_4). It is the scope of the possession principle (376d6a5a, 2c0b9bd7, d0fc96b7) at the universal source. Open."
definitions = ["211a6432-8b8f-53ed-85e3-75173bb15b24", "c19faf56-0908-5e6e-8c39-ccba40dce5d1", "5cbd5a0a-9055-4b69-af39-bd0bff1279fd", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72"]
disambiguations = ["dba7b1de-f3a0-57af-9af9-b2a4da3136fa", "00e0d443-eb39-56a3-9179-9c8852ca4a2b"]

[[statement]]
id = "Preexistence at the universal source: impersonal-source controls"
label = "Preexistence at the universal source: impersonal-source controls"
lean = "Control.Controls"
paraphrase = "Closed finite interpretation; statements about it only. Three beings (a source, a living effect, a nonliving effect) and two respects (being, life). The source causes the being and every formally had perfection of each other being; everything has being formally; only the living effect has life formally; the source has life virtually (IN_ACT_2). The frame's act is inclusive (formal or virtual). Checked: the source is a universal cause of being; universal-scope transfer b26c10a0, universal-source possession, universal-source preexistence, q.4 a.2 preexistence 64498e7e, unrestricted transfer f8ba2429 and 'nothing has actuality except insofar as it is' hold; the frame's act is the act frame's inclusive act (GradesActIsInclusive); the source has life inclusively and is perfect in the inclusive sense of GodIsPerfect when it alone is named; the source does not have life formally. A separate stipulated mode order satisfies the weak version of the q.4 a.2 mode step (an agent's power above material potency) and falsifies the strong version (above every other mode), witnessing that the strong version is strictly stronger. Encoding artifacts, disclosed: 'life' is a Boolean stand-in respect, not any recorded sense of LIVING; the virtual relation is stipulated, and whether it is read as a power to produce or as higher-mode containment is not encoded; no comparative of bearers is used. It shows that these premises, on the inclusive reading and for this stand-in respect, do not by themselves give the source formal or intrinsic possession; it is not evidence that an impersonal source exists or is possible."
definitions = ["211a6432-8b8f-53ed-85e3-75173bb15b24", "c19faf56-0908-5e6e-8c39-ccba40dce5d1", "a5bda545-3e76-5240-808d-25f897a07be5", "f7833666-c764-5624-a766-708949d9feee", "115f23e3-2a19-5dcb-bc7f-96408004f110", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72"]
