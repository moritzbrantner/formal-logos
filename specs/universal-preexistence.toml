[[argument]]
id = "Perfection of GOD_4 from its gift of esse, with universal-source preexistence"
label = "Perfection of GOD_4 from its gift of esse, with universal-source preexistence"
theorem = "perfectFromGodCauseOfUniversalPreexistence"
