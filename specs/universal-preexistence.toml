meaning = "Strength order registration: cause-of-being possession for every cause of being entails its restriction to universal causes and distinct effects. Application only; it establishes neither. Strictness is not certified here."

[[argument]]
id = "Perfection of GOD_4 from its gift of esse, with universal-source preexistence"
label = "Perfection of GOD_4 from its gift of esse, with universal-source preexistence"
theorem = "perfectFromGodCauseOfUniversalPreexistence"
premises = ["86d02b69-87eb-5594-9958-ccaa5fe6b685", "Every perfection of another thing whose being a universal cause of being causes is in that cause", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410"]
conclusion = "78b7c124-4419-4d55-8c2d-9cb8b37eb9b6"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Excluded middle on identity; GOD_4 causes all other being, so it is a universal source; universal-source preexistence"
meaning = "Sibling of ea6317cf (perfectFromGodCause) with universal-source preexistence in place of q.4 a.2 preexistence 64498e7e, which that proof applies only with GOD_4 as the cause. Let g be GOD_4 and x in act in r. If x is g, done. Otherwise GOD_4 causes the being of every other being (86d02b69), so g is a universal cause of being and causes x's being; universal-source preexistence gives that g is in act in r. The conclusion 78b7c124 is in the frame's mode-open act (IN_ACT_4). The route through this sibling needs no nonuniversal transfer. Conditional consequence only; no premise is established."

[[argument]]
id = "Preexistence at the universal source: impersonal-source controls, checked"
label = "Preexistence at the universal source: impersonal-source controls, checked"
theorem = "controls"
premises = []
conclusion = "Preexistence at the universal source: impersonal-source controls"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_mixing_control = true
rule = "Explicit finite interpretation over Fin 3 and Bool, checked by decision"
meaning = "One finite interpretation of an impersonal universal source. On the inclusive reading of act, universal transfer, universal-source possession and preexistence, q.4 a.2 preexistence, unrestricted transfer and the inclusive PERFECT_2 of the source all hold, while the source lacks life formally. A structural surrogate: it shows these premises do not by themselves give formal or intrinsic possession at the source; the virtual relation is stipulated, not a modelled power or containment."

