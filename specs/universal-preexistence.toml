# ---------------------------------------------------------------- 2026-11-27 review repair: the mode step as a strength fork

[[statement]]
id = "Having a perfection in an agent's power is a more perfect mode than having it in material potency"
label = "Having a perfection in an agent's power is a more perfect mode than having it in material potency"
lean = "AgentPowerAboveMaterialPotency"
paraphrase = "Analyst formulation of the weak comparand of the q.4 a.2 first proof's mode step: 'praeexistere autem in virtute causae agentis, non est praeexistere imperfectiori modo, sed perfectiori; licet praeexistere in potentia causae materialis, sit praeexistere imperfectiori modo'. For the primitive comparison of modes ModeAbove, the virtual mode (in an agent's power) is above the potential mode (in a material cause's potency). It compares modes, not bearers, and does not say that a bearer with a perfection virtually has it intrinsically. On the passage's own example, the sun, a nonliving equivocal agent, has the likeness of what it generates in this mode. Open."
definitions = ["41446d47-1c3e-4152-be4f-217d4d2eec1b", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168"]
disambiguations = ["dba7b1de-f3a0-57af-9af9-b2a4da3136fa"]

[statement.connection_plan]
target_statement_id = "fe67d766-3e9f-57b5-bbff-c3e2c50c56fd"
missing_bridge = "A bridge from a mode comparison of virtual possession to intrinsic possession of a pure perfection at an actual root: that having a perfection in a mode above the effect's formal possession is a way of really having it, which with universal-source preexistence would supply the intrinsic Has that fe67d766 states."
blocker = "No record specifies the comparison of modes beyond the passage's virtual-over-potential case, and the passage's own equivocal agent (the sun) is impersonal, so the mode step alone does not give intrinsic possession; the 2026-11-24 E and L obligations of causal-perfection-transfer remain open."

[[statement]]
id = "Having a perfection in an agent's power is a more perfect mode than every other way of having it"
label = "Having a perfection in an agent's power is a more perfect mode than every other way of having it"
lean = "AgentPowerAboveEveryOtherMode"
paraphrase = "Analyst formulation of the strong comparand of the q.4 a.2 first proof's mode step: for the primitive comparison of modes ModeAbove, the virtual mode (in an agent's power) is above every other way of having a perfection, the effect's formal possession ('secundum eandem rationem') included. It is the reading on which the equivocal agent has the effect's perfection 'eminentiori modo' than the effect has it. It compares modes, not bearers; it is not the eminent comparative of bearers MORE_4 and does not say that the agent has the perfection intrinsically. The passage applies 'eminentiori modo' to the sun. Open."
definitions = ["41446d47-1c3e-4152-be4f-217d4d2eec1b", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168"]
disambiguations = ["dba7b1de-f3a0-57af-9af9-b2a4da3136fa"]

[statement.connection_plan]
