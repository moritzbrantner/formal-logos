# Warrant phase, checkpoint 2 (2026-11-27, #2103, #143): q.4 a.2 preexistence
# 64498e7e. Every registered derivation of it uses the unrestricted transfer
# f8ba2429, whose nonuniversal part 10cd24ed has no positive warrant on file. Its
# God-route consumers apply it only with a universal source of being as the cause.
