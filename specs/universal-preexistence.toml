label = "Q.4 a.2 preexistence entails its universal-source restriction"
theorem = "universalPreexistenceOfPreexistence"
premises = ["64498e7e-7f10-54a0-9ec0-c65e6076de1f"]
conclusion = "Every perfection of another thing whose being a universal cause of being causes is in that cause"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Drop the universality and distinctness antecedents"
meaning = "Strength order registration: preexistence for every cause of being entails its restriction to universal causes and distinct effects. Application only; it establishes neither. Strictness is not certified here."

