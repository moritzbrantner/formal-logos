[[relation]]
id = "6cc0f63d-54ba-4b73-93a8-1dc174414377"
label = "The nuclear control attacks the bridge that every stipulated description is admissible"
subject_kind = "argument"
subject_id = "Nuclear characterization control, checked"
predicate = "attacks"
object_kind = "statement"
object_id = "Bridge: every stipulated description is a nuclear (admissible) description"
note = "Target: the bridge from stipulation to admissibility, which a defender of the definitional argument needs in order to use the consistent, nuclear-restricted P2 with P1's stipulated description. Mechanism: in the model of the nuclear control, P1's description is not a nuclear (admissible) description, so any stipulation practice satisfying the bridge leaves P1's description unstipulated (checked); since P1 is a free stipulation, the bridge fails for it. Side condition: in that model EXISTENCE_4 is not closed under adding nuclear properties; where it is, P1's description could coincide with a nuclear description. Independent justification: the nuclear restriction is motivated by the retorsion on unrestricted definitional truth and by Russell's existent-golden-mountain objection, not by the theistic conclusion. Scope: one reconstruction and one model; not a checked dilemma over every possible restriction."

[[statement]]
id = "Bridge: every stipulated description is a nuclear (admissible) description"
lean = "StipulationsAdmissible"
paraphrase = "Open bridge, analyst formulation: in a nuclear-property object theory, every description stipulated in a given practice of stipulation is a nuclear description, that is admissible as a characterization. It connects 'defined' as stipulated (P1) with 'defined' as admissible (the nuclear restriction of P2). Not asserted."
definitions = ["75d7aa56-615c-46a0-8c05-67f1624f6b36", "84831dae-67ff-4ac3-83c7-525fbdb505ab"]

[[statement]]
id = "P2 of the definitional argument (analytic): whatever satisfies a defined description satisfies it"
lean = "DefinitionsTrueAnalytic"
paraphrase = "The analytic reading of 'whatever is defined is true' (analyst formulation, attribution deferred): for every defined description, any object satisfying it satisfies it. True by stipulation in every frame, with no existential import; it is a sibling reading of the weak P2, not a version of it."
definitions = ["75d7aa56-615c-46a0-8c05-67f1624f6b36"]

[[statement]]
id = "Under the analytic reading of P2 the definitional argument is invalid"
lean = "AnalyticReadingCountermodel"
paraphrase = "Checked omission countermodel, analyst formulation: some definitional frame (one object, which does not exist, every description defined) satisfies P1 and the analytic reading of P2 while no being satisfies the God predicate (an arbitrary predicate here, not the root's GOD_4). So the definitional argument is invalid when P2 is read analytically; its validity needs the existential reading."
definitions = ["75d7aa56-615c-46a0-8c05-67f1624f6b36"]

[[argument]]
id = "Analytic-reading countermodel to the definitional argument, checked"
theorem = "analyticReadingCountermodel"
premises = []
conclusion = "Under the analytic reading of P2 the definitional argument is invalid"
axioms = []
rule = "One explicit one-object frame with no beings, checked by unfolding"
meaning = "Premise-free, zero-axiom omission countermodel: the frame has one object that does not exist and every description defined. P1 holds, the analytic P2 holds (trivially), and GodExists over the frame's beings fails because there are none. The definitional argument is therefore invalid under the analytic reading; only the existential reading of P2, whose retorsion is recorded in this batch, makes it valid."
