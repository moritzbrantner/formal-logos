# Classical converse of the registered strength order box K -> tertia via on the
# necessary-being node. Curation pass 2 of #2103: the tertia via node 32a2f51c
# and the per se node c639d164 (producers 43fdb2ed, 54feb72b, aa4797d1) had no
# consumer reaching the root. Analyst formulation, attribution deferred.

[batch]
vocab = "TruthCore.Causality.NecessarySenseFork"
results = "TruthCore.Results.Causality.NecessarySenseClassicalConverse"

[[argument]]
id = "NECESSARY_2 box K root node from the NECESSARY_3 tertia via node and excluded middle"
theorem = "tertiaViaToBoxK"
comparator_theorems = ["tertiaViaIffBoxK"]
premises = ["32a2f51c-a630-56a0-acc3-800637c18253", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410"]
conclusion = "cdf897a8-5490-561a-b9d2-507486a3f192"
axioms = []
disambiguations = ["83264cf5-01fe-52fc-9a00-eeb024f6496e"]
sense_bridges = [
  { term = "NECESSARY", from = "NECESSARY_3", to = "NECESSARY_11", statement_id = "32a2f51c-a630-56a0-acc3-800637c18253" },
  { term = "NECESSARY", from = "NECESSARY_3", to = "NECESSARY_2", statement_id = "cdf897a8-5490-561a-b9d2-507486a3f192", role = "conclusion" },
]
rule = "For each accessible world, excluded middle on the root's existence there; absence would contradict the tertia via's necessity"
meaning = "The premise 32a2f51c gives one n that is an actual root at w, satisfies the signature's IsGod, is the one God and has the classical attributes, and cannot not-be in the tertia via's sense (NECESSARY_3, IsNecessary), with its primitive possibility read as the frame's diamond at w (NECESSARY_11): no world accessible from w is one at which n does not exist. For an accessible world v, excluded middle on 'n exists at v' leaves either existence, or non-existence, which would give a possible world lacking n against the premise. So n exists at every world accessible from w (box-existence, NECESSARY_2), and the root facts are carried unchanged: the box K node cdf897a8. Excluded middle is needed for this direction; the converse box K to tertia via is the registered strength order 553d9d51 and is intuitionistic. The Comparator companion tertiaViaIffBoxK proves that under excluded middle the two nodes are equivalent for every signature, profile, world and causes-of-necessity relation. It is a classical-equivalence diagnostic, not a support option: the only producer of 32a2f51c other than the per se strength order is the registered box K to tertia via order 553d9d51 from cdf897a8 itself, so the route cdf897a8 to 32a2f51c to cdf897a8 is a loop and adds no warrant to cdf897a8. What it records is that the tertia via reading, and through 54feb72b the per se reading c639d164, are equivalent under excluded middle to the box K node on the root route; their producers 43fdb2ed and aa4797d1 are placed by that loop, not supported by it. Same signature, profile, world and relation on both sides; no world scope changes."
