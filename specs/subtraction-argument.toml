[[argument]]
id = "Unrestricted free absence with companions gives S2 at w"
theorem = "recombinationGivesContingency"
premises = ["Unrestricted free absence among distinct concrete candidates at w", "Every concrete candidate has a distinct concrete candidate that could exist at w"]
conclusion = "Each concrete object existing at w could fail to exist"
rule = "Witness selection: x without y is possible, so y's absence is"
meaning = "For a concrete object y existing at w, take a distinct concrete candidate x that could exist (companions); unrestricted free absence gives a world accessible from w where x exists and y does not, so y could fail to exist. Recombination supports S2 only in its unrestricted form: the restricted form says nothing about a candidate that exists at every accessible world, and the difference between the two is exactly the possible absence of every companioned concrete candidate (certified difference)."
description = "Support for subtraction premise S2 at w from unrestricted free absence (Hume's dictum, absence half) and companions at w. It concludes S2 at w only; the subtraction argument uses S2 throughout the accessible worlds, which the controls derive from the same two premises holding at every accessible world (law 5). Not a transcription: the conclusion's possible absence is extracted from a recombination witness for a chosen companion. Establishes neither premise."

[[argument]]
id = "Unrestricted free absence strengthens free absence for candidates that could be absent"
theorem = "unrestrictedToContingentRecombination"
premises = ["Unrestricted free absence among distinct concrete candidates at w"]
conclusion = "Free absence among distinct concrete candidates at w, for candidates that could be absent"
rule = "Weakening by an added antecedent"
meaning = "Unrestricted free absence gives free absence for candidates that could be absent: the restricted principle adds an antecedent. Strict: in the theist model the restricted principle holds and the unrestricted one fails (controls)."
description = "Exact strong-only-premise strength result: unrestricted free absence strictly strengthens free absence for candidates that could be absent. The proof is a weakening by an added antecedent, which the frontier lists as a single-application transcription; it carries the strength order only and closes nothing. Establishes neither."

[[argument]]
id = "Unrestricted free absence factors into contingent free absence and companioned absence"
theorem = "recombinationFactorsExact"
premises = []
conclusion = "Unrestricted free absence is exactly contingent free absence plus companioned possible absence"
rule = "Both directions by witness selection"
meaning = "Certified difference (#1598): forward, the restricted principle by weakening, and a companion's recombination witness makes each companioned candidate possibly absent; backward, the possible absence of the companioned candidate y supplies the restricted principle's extra antecedent. Premise-free and constructive."
description = "Premise-free certified difference of unrestricted over contingent free absence: exactly the possible absence of every companioned concrete candidate. That with companions this difference excludes any concrete candidate existing at every accessible world is a separate law (controls, law 9). Establishes no premise."

