# The subtraction argument for metaphysical nihilism (possibly no concrete
# object exists) and free recombination (Hume's dictum) as its support,
# compared with the necessary-being nodes of the root route (the stage-one
# node STMT-NECESSARY-CONCRETE-AT and the box K node STMT-NECESSARY-ROOT-BOX-K).
# Analyst formulations; Baldwin 1996, Rodriguez-Pereyra 1997/2002, Efird and
# Stoneham 2005, Lowe 1998/2002, Lewis 1986 and Armstrong 1989 are navigation
# only, attribution deferred, no source claim. Refs #1784.

[batch]
vocab = "TruthCore.Causality.SubtractionArgument"
results = "TruthCore.Results.Causality.SubtractionArgument"

[[statement]]
id = "Some world accessible from w has only finitely many concrete objects"
lean = "PossiblyFinitelyManyConcrete"
paraphrase = "Subtraction premise S1, analyst formulation, attribution deferred: on the route's profile m, some world accessible from w in m.ontic.frame has only finitely many concrete objects, read as: one finite list contains every candidate that is concrete and exists there. It bounds one world, not every accessible world (weaker than the population cover STMT-FINITE-POPULATION-COVER), and it says nothing about which objects they are."
definitions = ["cdbbae1a-5cce-4367-b6b4-d135135a2ecd", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "At every world accessible from w, each concrete object there could fail to exist"
lean = "EachConcreteCouldFailThroughout"
paraphrase = "Subtraction premise S2, analyst formulation, attribution deferred: for every world v accessible from w in the route's frame, every candidate that is concrete and exists at v is absent at some world accessible from v. Universal over every concrete object, including any candidate necessary being; this scope is what the necessary-being nodes deny."
definitions = ["cdbbae1a-5cce-4367-b6b4-d135135a2ecd", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "At every world accessible from w, a concrete object that could fail could fail with no newcomer"
lean = "SubtractableThroughout"
paraphrase = "Subtraction premise S3, conditional form, analyst formulation, attribution deferred: for every world v accessible from w and every concrete object x existing at v, if x is absent at some world accessible from v, then at some world accessible from v x is absent and every concrete object existing there exists at v (no newcomer). It realizes the absence jointly, at one world, not pairwise. The literal 'the non-existence of x does not necessitate the existence of any other concrete object' is this together with S2 (controls)."
definitions = ["cdbbae1a-5cce-4367-b6b4-d135135a2ecd", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Possibly no concrete object exists: some world accessible from w has no concrete object"
lean = "PossiblyNoConcrete"
paraphrase = "Conclusion of the subtraction argument (metaphysical nihilism about concreta), analyst formulation: some world accessible from w in the route's frame has no candidate that is concrete and exists there. It is the existing stage-one JointAbsence for the concrete-presence predicate. It does not say that nothing at all exists there: non-concrete candidates may exist."
definitions = ["cdbbae1a-5cce-4367-b6b4-d135135a2ecd", "baddf770-36bf-542f-bb3c-2297342d5452", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Not every concrete object existing at w could fail to exist"
lean = "NotEachConcreteCouldFailAt"
paraphrase = "Denial of subtraction premise S2 at the world w itself: it is not the case that every candidate that is concrete and exists at w is absent at some world accessible from w. It names no particular object and says nothing about uniqueness, God or any attribute."
definitions = ["cdbbae1a-5cce-4367-b6b4-d135135a2ecd", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Each concrete object existing at w could fail to exist"
lean = "EachConcreteCouldFailAt"
paraphrase = "Subtraction premise S2 at the world w itself, analyst formulation, attribution deferred: every candidate that is concrete and exists at w is absent at some world accessible from w. With excluded middle it is equivalent to the denial of STMT-NECESSARY-CONCRETE-AT at w (controls)."
definitions = ["cdbbae1a-5cce-4367-b6b4-d135135a2ecd", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Unrestricted free absence among distinct concrete candidates at w"
lean = "UnrestrictedRecombinationAt"
paraphrase = "Recombination, absence half of Hume's dictum, unrestricted, analyst formulation, attribution deferred: for any two distinct concrete candidates x and y, if x exists at some world accessible from w, then x exists without y at some world accessible from w. Pairwise only: it realizes no combination of more than two candidates at once. Applies to every concrete candidate, whatever its modal status."
definitions = ["13c0abe7-25f7-4921-b52e-9f732edd6f2c", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Free absence among distinct concrete candidates at w, for candidates that could be absent"
lean = "ContingentRecombinationAt"
paraphrase = "Recombination restricted to candidates that could be absent, analyst formulation: for any two distinct concrete candidates x and y, if x exists at some world accessible from w and y is absent at some world accessible from w, then x exists without y at some world accessible from w. Says nothing about a candidate that exists at every accessible world."
definitions = ["13c0abe7-25f7-4921-b52e-9f732edd6f2c", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Every concrete candidate with a distinct possible concrete companion could be absent at w"
lean = "CompanionedConcretaPossiblyAbsentAt"
paraphrase = "Difference statement: every concrete candidate y for which some distinct concrete candidate exists at some world accessible from w is itself absent at some world accessible from w. With companions it excludes any concrete candidate existing at every accessible world (controls, law 9)."
definitions = ["13c0abe7-25f7-4921-b52e-9f732edd6f2c", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Every concrete candidate has a distinct concrete candidate that could exist at w"
lean = "ConcreteCompanionsAt"
paraphrase = "Plurality premise, analyst formulation: for every concrete candidate y there is a distinct concrete candidate x that exists at some world accessible from w. No concrete candidate is the only possible concrete thing. It does not say that either exists actually."
definitions = ["13c0abe7-25f7-4921-b52e-9f732edd6f2c", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Unrestricted free absence is exactly contingent free absence plus companioned possible absence"
lean = "RecombinationFactorsExact"
paraphrase = "For every profile and world: unrestricted free absence among distinct concrete candidates holds iff free absence restricted to candidates that could be absent holds and every concrete candidate with a distinct possible concrete companion could be absent. A premise-free comparison; it asserts none of the three."
definitions = ["13c0abe7-25f7-4921-b52e-9f732edd6f2c", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Subtraction argument: laws, omission models and the theist model"
lean = "Model.Controls"
paraphrase = "Premise-free comparison. Laws, for all types: the stage-one node STMT-NECESSARY-CONCRETE-AT and the box K node each exclude 'possibly no concrete object' at their world with no frame condition; the literal non-necessitation premise is S2 plus conditional subtraction; elementary existence of all candidates gives 'possibly no concrete object'; unrestricted free absence with companions at every accessible world gives S2 throughout; the analyst formulation of Lowe's reply (a non-concrete candidate existing at every accessible world, co-existing there with some concrete object; co-existence only, not grounding) excludes 'possibly no concrete object', and with S1, transitivity and excluded middle it excludes S2 and S3 holding together throughout, without choosing which fails; with excluded middle, S2 at w is equivalent to the denial of the stage-one node at w; with companions, the difference of unrestricted over contingent free absence excludes any concrete candidate existing at every accessible world. Models: all subtraction premises and the conclusion together (nonvacuity); four omission models, one per premise S1, S3, transitivity, S2, each keeping the others and falsifying the conclusion (excluded middle is not omitted: Lean is consistent with it, so no model omits it and none is needed); in the S3 model unrestricted free absence, companions and the two premises of the analyst Lowe formulation also hold and no concrete candidate is necessary; the S2 model is a theist model on an S5, hence transitive, frame in which the box K and S5 necessary-being nodes, the stage-one node, S1, S3, free absence for candidates that could be absent and companions hold, while S2 at w and throughout, unrestricted free absence and the conclusion fail. The two-being signature's divine fields are stipulated, not evidence."
definitions = ["cdbbae1a-5cce-4367-b6b4-d135135a2ecd", "13c0abe7-25f7-4921-b52e-9f732edd6f2c", "baddf770-36bf-542f-bb3c-2297342d5452", "1b8baf77-84fa-5513-a138-7fa14840dd87", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "38b92bb6-33ae-5817-85c6-b5a1afa63bd1", "DEF-NECESSARY-IN-SENSE", "DEF-ACTUAL-ROOT", "DEF-GOD-OF-CLASSICAL-THEISM", "DEF-ONE-GOD", "DEF-CLASSICAL-ATTRIBUTES-BUNDLE", "547cac5c-7089-4bce-b5e7-bb8b6c8d12b9"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[argument]]
id = "Possibly no concrete object, by subtraction"
theorem = "subtraction"
premises = ["STMT-EXCLUDED-MIDDLE", "9a6ce384-5213-43bd-a65e-90dddc8574f3", "Some world accessible from w has only finitely many concrete objects", "At every world accessible from w, each concrete object there could fail to exist", "At every world accessible from w, a concrete object that could fail could fail with no newcomer"]
conclusion = "Possibly no concrete object exists: some world accessible from w has no concrete object"
rule = "Induction on the finite list, one subtraction per step, transitivity of access"
meaning = "Start at a world accessible from w whose concrete objects lie in a finite list. For the next listed object, excluded middle decides whether it is present. If it is, S2 gives a world where it is absent and S3 a world accessible from the current one where it is absent with no newcomer; transitivity makes that world accessible from w and its concrete objects lie in the rest of the list. If it is not, the rest of the list already covers the current world. When the list is exhausted the current world has no concrete object. Every non-logical premise is needed: each omission model keeps the others and falsifies the conclusion (controls)."
description = "The subtraction argument, analyst formulation: possibly no concrete object from S1, S2 and S3 throughout the accessible worlds, transitivity of the route frame and excluded middle. Not a transcription (invariant 16): the conclusion is reached by induction on the list, with a subtraction step per element; no premise mentions an empty world. Establishes no premise; S2 applied to a necessary being is the denial of the stage-one node (controls)."

[[argument]]
id = "The stage-one node excludes the subtraction contingency premise at its world"
theorem = "necessaryConcreteExcludesContingencyPremise"
premises = ["STMT-NECESSARY-CONCRETE-AT"]
sense_bridges = [{term = "NECESSARY", from = "NECESSARY_11", to = "NECESSARY_2", statement_id = "STMT-NECESSARY-CONCRETE-AT"}]
conclusion = "Not every concrete object existing at w could fail to exist"
rule = "Box elimination at the world witnessing possible absence"
meaning = "If some concrete individual exists at w and at every world accessible from w (the stage-one node), then not every concrete object existing at w is absent at some accessible world: that individual would be absent at an accessible world where it exists. A checked incompatibility between the node and subtraction premise S2 at the node's world. With excluded middle the converse holds too (controls, law 8): S2 at w is exactly the stage-one node's denial. The box K and S5 nodes entail no weaker exclusion of their own here; the controls show the box K node excludes the subtraction conclusion (law 2), and the theist model shows the nodes jointly satisfiable with every other subtraction premise, so rejecting the subtraction rival requires rejecting only S2. The node is its own NECESSARY_11 to NECESSARY_2 bridge statement, as in the existing arguments that consume it."
description = "Checked incompatibility: STMT-NECESSARY-CONCRETE-AT excludes subtraction premise S2 at its world. Not a transcription: the conclusion quantifies over every concrete object at w and its possible absence, which the premise does not mention. That it fails without the node is shown only on the universal frames of the nonvacuity and S1 omission models. Establishes no premise; the node stays as it was. Recorded at the weakest node that suffices; no registered argument derives this node from the box K node, so the box K node is connected only through the controls (laws 1-2, theist model)."

