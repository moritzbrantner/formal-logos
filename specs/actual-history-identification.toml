note = "The shared #468 structural premises and maximum entail the strongest immateriality antecedent in both route profiles. The impersonal profile has no intellect at that same maximum. Its complete represented Boolean trace matches the intellectual profile, so the trace cannot supply the missing attribute premise in this profile. The represented history reads only the schedule (Model is an unconstrained product of route and schedule), so this non-identification holds by construction; the substantive content is the augment criterion and the restriction result. The impersonal profile is a model where 180f5ad2 fails: it shows the premise is needed for the attribute here, not that it is false."
