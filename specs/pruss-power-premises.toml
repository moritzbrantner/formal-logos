# #1887, continued: the power premises of the route with Pruss's own premise
# (results 42da6b2d and ad42c376 of specs/modal-grounding-actual-absence.toml).
# Three questions: (1) the transfer from the collective power for the joint
# absence of the actual contingent concreta to POWER_OVER_ESSE_1 over each of
# them (collective/distributive split of disambiguation 197f0097, transposed
# from causes to powers); (2) whether the power is one-way or two-way, typed
# extensionally on the frame's world-relative giving field GivesAt; (3) Pruss's
# own direction (a power, held in a world lacking the actual contingents, for
# the actual world's obtaining). Analyst formulations, attribution deferred.
# Read for this slice (2026-11-23), navigation only, no claim record: ST I
# q.104 a.3 co., ad 1, ad 3 (newadvent.org/summa/1104.htm); Aristotle, Met.
# Theta 2 (1046b) and Theta 5 (1048a), Ross translation (classics.mit.edu);
# Pruss, "The Actual and the Possible", sections "An Aristotelian alternative"
# and "A combined account" (alexanderpruss.com, plain HTTP).

[batch]
vocab = "TruthCore.Modal.PrussPowerPremises"
results = "TruthCore.Results.Modal.PrussPowerPremises"

[[statement]]
id = "Whatever is given being in a world exists in that world"
lean = "GivenExists"
paraphrase = "OPEN bridge between two fields of the shared CausalityFrame (factivity of giving; analyst formulation): whenever, in a world v, y exercises causation of x's being at some moment (GivesTo, from the primitive GivesAt), x exists at v. The frame relates no fields, so this is stated, not assumed."
definitions = ["62dfa893-b633-4513-9790-8f9a0a3087e0", "158301bc-9585-4145-be60-34f08c9f922c", "DEF-KANT-ONTOLOGICAL-MODEL"]

[[statement]]
id = "A power for the actual contingent concreta's joint absence issues where its holder exists and gives otherwise"
label = "A power for the actual contingents' joint absence issues where its holder exists and gives otherwise"
lean = "ActualAbsenceExerciseDiffers"
paraphrase = "OPEN (P2-delta, analyst formulation): whatever has at w a power for the joint absence of the concrete beings contingent at w (one world lacking them all; PowerFor) can exercise it so that, at some world accessible from w, every such being is absent, the holder exists, and the holder gives being (GivesTo) to not exactly the same beings as at w. It strengthens P2-prime (906f5c39) by requiring the exercise of a power for an outcome about existence to show in what the holder gives. It does not say whether the difference is giving something new (replacement) or withholding. Its added clause (the holder exists at v and does not give being as at w) is the denial of fixed (one-way) giving restricted to one world: it carries exactly the anti-fixed-exercise content, and controls law 1 and the varying-giving conjunct of the route through it are its direct instantiation, not a test of it. Its warrant is either the creator reading (9f7b1778, from which law 5 derives it with factive giving; a dependency shared with the PGP link) or the prima facie principle that exercise over existence shows in giving, which excludes exercise mediated through other frame fields (prevention, motion) and preventive powers for an absence."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "62dfa893-b633-4513-9790-8f9a0a3087e0", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Whatever has a power for the actual contingent concreta's joint absence gives each of them being at w"
label = "Whatever has power for the actual contingent concreta's joint absence gives each of them being at w"
lean = "ActualAbsenceHoldersGiveEach"
paraphrase = "OPEN (the creator/conserver reading of the holder; analyst formulation, attribution deferred): whatever has at w a power for the joint absence of the concrete beings contingent at w gives being, in w (GivesTo: at some moment of w), to every concrete being contingent at w. Not sole giving, not immediacy, not freedom. Motivation, navigation only: ST I q.104 a.3 co., God preserves things 'by continually pouring out existence into them'."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "62dfa893-b633-4513-9790-8f9a0a3087e0", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "A power for the actual contingent concreta's joint absence is POWER_OVER_ESSE_1 over each of them"
lean = "ActualAbsencePowerIsPowerOverEsse"
paraphrase = "OPEN transfer bridge for Pruss's own premise (collective to distributive; analyst formulation): whatever has at w a power for the joint absence of the concrete beings contingent at w (one world lacking them all) has POWER_OVER_ESSE_1 over each concrete being contingent at w. The analogue, for powers, of premise B of C1 (disambiguation 197f0097: what accounts for a totality accounts for each member), and of the global variant's transfer bridge. Not derivable from the collective power as typed (controls: a replacement model has the collective power and none over any actual contingent member's esse; formally because PowerOver is unconstrained, the replacement structure on the thin reading of PowerFor only making that choice admissible; that model has one actual contingent, so collective and distributive coincide there, and the separation shown is PowerFor to POWER_OVER_ESSE_1, already for one member; a two-member model separates collective from distributive at the level of PowerFor). ST I q.104 a.3 ad 1 shows the absence is never the holder's direct effect, so the transfer needs a stated bridge; it does not support replacement as the Thomist reading, on which an absence is caused only indirectly, by withdrawing a giving."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "3fd6bddb-f10c-4df4-8694-3eb5e7c28617", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["f5dda05f-ba3c-4fdf-82a3-e4803c24ddb5", "197f0097-f2ae-4a47-8770-3d43758f737b", "DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "A being that gives x being at w and withholds it at an accessible world has POWER_OVER_ESSE_1 over x"
lean = "WithheldGivingIsPowerOverEsse"
paraphrase = "OPEN (withholdable giving is power over esse; analyst formulation, attribution deferred): if y gives x being in w (GivesTo) and, existing at some world accessible from w, does not give x being there, then y has POWER_OVER_ESSE_1 over x (it can unmake x's being by withholding). It covers only a giver with an actual withholding world, not a necessitated giver. Motivation, navigation only: ST I q.104 a.3 co., 'just as before things existed, God was free not to give them existence ..., so after they are made, He is free not to continue their existence', stated here without freedom."
definitions = ["62dfa893-b633-4513-9790-8f9a0a3087e0", "3fd6bddb-f10c-4df4-8694-3eb5e7c28617", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["f5dda05f-ba3c-4fdf-82a3-e4803c24ddb5"]

[[statement]]
id = "At each accessible world lacking the actual contingent concreta, some being has a power for w's obtaining"
label = "At each accessible world lacking the actual contingents, a being there has power for w obtaining"
lean = "ActualityGroundedAtAbsenceWorlds"
paraphrase = "OPEN (Aristotelian grounding at a non-actual world, Pruss's own direction; analyst formulation): at every world v accessible from w that lacks every concrete being contingent at w, if w is accessible from v and v is not w, then some being existing at v has, at v, a power (PowerFor) for the proposition that w obtains. Pruss ('A combined account', read 2026-11-23, navigation only): 'there is a substance x in w1 which could have initiated a causal chain that could lead to w0 being actual'."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "A power, at a world lacking the actual contingent concreta, for w's obtaining issues where its holder exists"
label = "At a world lacking the actual contingents, a power for w obtaining issues where its holder exists"
lean = "ActualityInitiatorPresentAtAbsenceWorlds"
paraphrase = "OPEN (initiator presence at the absence worlds; analyst formulation): for every world v accessible from w that lacks every concrete being contingent at w, whatever has at v a power for w's obtaining can exercise it so that, at some world accessible from v, w obtains and the holder exists; that is, the holder exists at w. Pruss (navigation only): 'x cannot start any chain of causes that can lead to actuality's not including x'."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
