[[argument]]
id = "The actual contingents' joint absence realized by withholding, from Pruss's premises and the creator reading"
label = "The actual contingents' joint absence by withholding, under the creator reading"
theorem = "actualAbsenceRealizedByWithholding"
premises = ["95bf8780-0e3c-49ba-b636-2274e2997a30", "906f5c39-2a63-4dc2-955d-a00cfd8a976b", "18e5bd4e-8178-468e-b867-fbaf9c5988ad", "c76b6e2c-1ca0-47fd-a9d0-2c2faa3d1174", "Whatever has a power for the actual contingent concreta's joint absence gives each of them being at w", "Whatever is given being in a world exists in that world"]
