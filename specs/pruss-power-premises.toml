rule = "Forget the power and the absence world"
meaning = "The witness of Pruss's direction is concrete, exists at w and at every accessible world: it witnesses the stage-one node on the frame's own profile."
description = "Projection of Pruss's direction onto STMT-NECESSARY-CONCRETE-AT. An assembly; establishes no premise."
transcription = "assembly"

[[argument]]
id = "The stage-one node, from POWER_OVER_ESSE_1 over each actual contingent and a concrete foundational being"
label = "The stage-one node, by the distributive powers at a concrete foundational being"
theorem = "powerOverEachGivesNecessaryConcrete"
premises = ["STMT-EXCLUDED-MIDDLE", "Some holder of a power for the actual contingent concreta's joint absence has POWER_OVER_ESSE_1 over each", "c5da5e62-a9cd-4142-8d3a-a96f86548e88"]
conclusion = "STMT-NECESSARY-CONCRETE-AT"
sense_bridges = [{term = "NECESSARY", from = "NECESSARY_11", to = "NECESSARY_2", statement_id = "STMT-NECESSARY-CONCRETE-AT", role = "conclusion"}]
rule = "The foundational being is under no power over its esse, so it is not an actual contingent concretum; excluded middle"
meaning = "A concrete foundational being f at w is under no being's POWER_OVER_ESSE_1. Were it absent at a world accessible from w, it would be a concrete being contingent at w, and the holder would have POWER_OVER_ESSE_1 over it. So, with excluded middle, f exists at every world accessible from w; being concrete and actual, it witnesses the stage-one node."
description = "The transfer's (or the withholding route's) conclusion reproduces PGP's verdict at the foundational case of the C2 batch (c5da5e62), without PGP and without a Euclidean premise: the exact formal link between Pruss's own route and the C2 crux, holding only under the transfer bridge or the creator reading with the withheld-giving bridge. Not a transcription: no premise mentions necessity. Establishes no premise."

[[argument]]
id = "Pruss power premises controls checked"
theorem = "prussPowerControls"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_mixing_control = true
premises = []
conclusion = "Pruss power premises: laws, nonvacuity, collective and distributive separations, omission and rival models"
rule = "General laws and explicit finite models"
meaning = "Premise-free: nine laws (one-way exclusion, collapse, necessary fixed-output (deterministic) sources, P2-delta from the creator reading, withholding as two-way giving, the relocated abstention in Pruss's direction, the joint one, PGP's verdict from the distributive powers) and finite models (theist nonvacuity, collective without distributive, distributive without collective, mutual annihilators, eight omissions, three rivals). Model-witnessed separations only; no premise is established and no reality claim is made."
description = "Premise-free laws and models for the power premises of the route with Pruss's own premise. Sense-mixing control: they relate MODAL_CONTINGENCY_1, NECESSARY_2, POWER_OVER_ESSE_1 and the frame (NECESSARY_11 carrier) without a bridge premise. Establishes no premise."

