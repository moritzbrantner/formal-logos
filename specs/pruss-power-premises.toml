[[argument]]
id = "A necessary concrete being with power for w's obtaining at a world lacking the actual contingents, by Pruss's direction"
label = "A necessary concrete holder of a power for w obtaining, by Pruss's own direction"
theorem = "prussDirectionNecessaryHolder"
premises = ["STMT-EXCLUDED-MIDDLE", "STMT-ACCESSIBILITY-SYMMETRIC", "18e5bd4e-8178-468e-b867-fbaf9c5988ad", "c76b6e2c-1ca0-47fd-a9d0-2c2faa3d1174", "At each accessible world lacking the actual contingent concreta, some being has a power for w's obtaining", "A power, at a world lacking the actual contingent concreta, for w's obtaining issues where its holder exists", "Holders, at a world lacking the actual contingent concreta, of a power for w's obtaining are concrete"]
sense_bridges = [{term = "NECESSARY", from = "NECESSARY_8", to = "NECESSARY_2", statement_id = "Some necessary concrete being at w has, at a world lacking the actual contingent concreta, power for w obtaining", role = "conclusion"}]
conclusion = "Some necessary concrete being at w has, at a world lacking the actual contingent concreta, power for w obtaining"
rule = "Ground w's obtaining at a world lacking the actual contingents, locate the holder at w, reductio on its contingency"
meaning = "P4-prime gives an accessible world v lacking every actual contingent concretum; P5's witness shows v is not w; symmetric access gives v's access to w; grounding at v gives a being y at v with a power for w's obtaining; initiator presence puts y at w; y is concrete. Were y absent at a world accessible from w, it would be an actual contingent concretum, hence absent at v, where it exists. Excluded middle gives y's existence at every world accessible from w."
description = "Pruss's own direction (#1887 gap 6, one-step powers): the holder sits in the non-actual world with a positive power for the actual world's obtaining. Only the symmetry (B) part of S5 is used. The declared NECESSARY_8 to NECESSARY_2 sense bridge records a definitional coincidence: NecessaryAt m w x is the box of ExistsAt over the same frame whose symmetry is assumed; symmetry is a frame property and no box occurs in the proof; none of the sourced KB-embedding commitments of 153fcebf (possibilist constant domain) is imported. STMT-NECESSARY-CONCRETE-AT does not presuppose symmetry, so this support holds only on symmetric frames. Not a transcription: no premise mentions a necessary being. Establishes no premise. It avoids a power for a negative state (under positive-outcome-only powers P1-prime fails while this route holds; controls, rival 3), but not the abstention fact: a holder that gives any actual contingent being at w is, with factive giving, a two-way giver (controls, law 7)."

[[argument]]
id = "The stage-one node, by Pruss's own direction"
theorem = "prussDirectionNecessaryConcrete"
premises = ["Some necessary concrete being at w has, at a world lacking the actual contingent concreta, power for w obtaining"]
