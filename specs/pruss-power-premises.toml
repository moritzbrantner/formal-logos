[[argument]]
id = "POWER_OVER_ESSE_1 over each actual contingent concretum, from Pruss's grounding and the transfer bridge"
label = "POWER_OVER_ESSE_1 over each actual contingent concretum, by the transfer bridge"
theorem = "transferGivesPowerOverEachActualContingent"
premises = ["95bf8780-0e3c-49ba-b636-2274e2997a30", "18e5bd4e-8178-468e-b867-fbaf9c5988ad", "c76b6e2c-1ca0-47fd-a9d0-2c2faa3d1174", "A power for the actual contingent concreta's joint absence is POWER_OVER_ESSE_1 over each of them"]
conclusion = "Some holder of a power for the actual contingent concreta's joint absence has POWER_OVER_ESSE_1 over each"
rule = "Ground the joint absence, then pass from the collective power to each member by the transfer bridge"
meaning = "A concrete being is contingent at w, so the joint absence fails at w, while P4-prime gives an accessible world where it holds; P1-prime gives a being y at w with a power for it; the transfer bridge gives y POWER_OVER_ESSE_1 over each concrete being contingent at w. Constructive."
description = "The transfer applied to the route with Pruss's own premise (#1887 gap 3), without a Euclidean premise. Not a transcription: the transfer premise is conditional on the collective power, which P1-prime supplies. Establishes no premise. With excluded middle its conclusion gives PGP's verdict at every concrete foundational being (controls, law 9). The transfer bridge is not derivable from the collective power as typed (controls, collective without distributive); its conclusion has a second support option from the creator reading (withholding route)."

[[argument]]
id = "A necessary concrete varying giver, from Pruss's grounding with initiator presence and a difference in giving"
label = "A necessary concrete varying giver, from Pruss's grounding and P2-delta"
theorem = "actualAbsenceHolderIsNecessaryVaryingGiver"
premises = ["STMT-EXCLUDED-MIDDLE", "95bf8780-0e3c-49ba-b636-2274e2997a30", "A power for the actual contingent concreta's joint absence issues where its holder exists and gives otherwise", "a6906cab-59c4-4938-b6d1-991369e8ffb0", "18e5bd4e-8178-468e-b867-fbaf9c5988ad", "c76b6e2c-1ca0-47fd-a9d0-2c2faa3d1174"]
conclusion = "Some necessary concrete holder of a power for the actual contingent concreta's joint absence varies its giving"
rule = "Weaken P2-delta to P2-prime, apply the route with Pruss's premise, then apply P2-delta to its holder"
meaning = "P2-delta gives P2-prime (forget the difference in giving), so the route with Pruss's own premise (42da6b2d, theorem prussActualAbsenceNecessaryPowerHolder, reused) gives a concrete holder y existing at w and at every accessible world, with a power for the joint absence; P2-delta applied to y gives an accessible world where y exists and gives being otherwise than at w."
description = "The holder of the route with Pruss's own premise, under P2-delta, is a necessary being whose giving of being varies across accessible worlds where it exists: not a one-way (fixed) giver. Composes 42da6b2d. Only the necessity is derived: the varying-giving conjunct is P2-delta's own clause applied to 42da6b2d's witness, so the result is as strong as P2-delta's warrant (the creator reading or the principle that exercise over existence shows in giving). Not a transcription. Establishes no premise. It does not say what decides the variation; Met. Theta 5's 'desire or will' is not typed (see the open bridge in docs/notes/pruss-power-premises.md)."

