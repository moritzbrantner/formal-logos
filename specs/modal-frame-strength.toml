[[argument]]
id = "KTB and S4 route frames together entail the S5 route frame"
theorem = "frameS5OfKTBAndS4"
premises = ["STMT-ONTIC-FRAME-KTB", "STMT-ONTIC-FRAME-S4"]
conclusion = "STMT-ONTIC-FRAME-S5"
axioms = []
rule = "Frame-condition algebra symmetric_transitive_implies_euclidean of the modal library (a symmetric transitive relation is Euclidean)"
meaning = "If the route's modal frame is reflexive and symmetric (KTB) and also reflexive and transitive (S4), it is reflexive and Euclidean (S5): reflexivity from the KTB premise, the Euclidean condition from symmetry and transitivity by the modal-library theorem TruthCore.Modal.symmetric_transitive_implies_euclidean. With the registrations S5 strengthens KTB and S5 strengthens S4, the S5 frame premise says exactly what the KTB and S4 frame premises say jointly. Establishes no frame premise."
description = "If the route's modal frame is reflexive and symmetric (KTB) and also reflexive and transitive (S4), it is reflexive and Euclidean (S5). Not a transcription (invariant 16): the conclusion's Euclidean conjunct appears in neither premise and is derived by the proved modal-library lemma TruthCore.Modal.symmetric_transitive_implies_euclidean (from w R l and w R r, symmetry gives l R w and transitivity gives l R r), which could fail for a frame lacking either condition. Establishes no frame premise."

[[argument]]
id = "S5 route frame is the S4 route frame plus symmetry"
theorem = "frameS5OverS4Exact"
premises = []
conclusion = "The route frame is S5 exactly when it is S4 and symmetric"
axioms = []
rule = "Frame-condition algebra: a reflexive Euclidean relation is transitive and symmetric; a symmetric transitive relation is Euclidean"
meaning = "Certified difference (#1598) of the registration S5 route frame strengthens S4 route frame: for every profile, the route frame is S5 iff it is S4 and symmetric. Premise-free; it compares the frame conditions and asserts none of them of the route."

[[argument]]
