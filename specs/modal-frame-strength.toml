id = "The route frame is S5 exactly when it is KTB and transitive"
lean = "FrameS5OverKTBExact"
paraphrase = "For every world type, being type and profile m: the route's modal frame is reflexive and Euclidean (S5) if and only if it is reflexive and symmetric (KTB) and transitive. A premise-free comparison of frame conditions; it asserts none of them of the route."
definitions = ["DEF-MODAL-FIXTURE-FRAME"]
disambiguations = ["DISAMB-NECESSARY"]

