subject_id = "STMT-ONTIC-FRAME-S5"
predicate = "strengthens"
object_kind = "statement"
object_id = "STMT-ONTIC-FRAME-S4"
verification_result_id = "S5 route frame entails S4 route frame"
strictness_result_id = "Frame-class strictness controls, checked"
note = "Same route Profile and frame. S5 adds symmetry (equivalently the Euclidean condition) to S4; the two-world order frame is S4 and not S5. The node-level counterpart is the registration S5 node strengthens S4 node, whose certified difference is the symmetric-frame delta."

