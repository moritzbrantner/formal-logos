[[statement]]
id = "The route's modal frame is symmetric (route frame premise delta)"
lean = "OnticFrameSymmetric"
paraphrase = "Difference statement: the accessibility relation of the route's modal frame m.ontic.frame is symmetric (if w accesses v, then v accesses w; frame condition B). A condition on the frame only; it is not asserted of the route."
definitions = ["DEF-MODAL-FIXTURE-FRAME"]

[[statement]]
id = "The route's modal frame is transitive (route frame premise delta)"
lean = "OnticFrameTransitive"
paraphrase = "Difference statement: the accessibility relation of the route's modal frame m.ontic.frame is transitive (if w accesses v and v accesses u, then w accesses u; frame condition 4). A condition on the frame only; it is not asserted of the route."
definitions = ["DEF-MODAL-FIXTURE-FRAME"]

[[statement]]
id = "The route frame is S5 exactly when it is S4 and symmetric"
lean = "FrameS5OverS4Exact"
paraphrase = "For every world type, being type and profile m: the route's modal frame is reflexive and Euclidean (S5) if and only if it is reflexive and transitive (S4) and symmetric. A premise-free comparison of frame conditions; it asserts none of them of the route."
definitions = ["DEF-MODAL-FIXTURE-FRAME"]
disambiguations = ["DISAMB-NECESSARY"]

