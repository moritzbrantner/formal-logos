[[statement]]
id = "Every matter-form bearer satisfies the selected composition predicate"
lean = "MatterFormIsComposite"
definitions = ["e0010549-b46d-4aaa-8ea2-a2aa203fad2c", "85f7f569-ab4d-514b-aa2c-cf75171ad105"]
paraphrase = "Open analyst premise. On the same carrier and predicates, every bearer satisfying MatterForm also satisfies Composite. The law is the matter-form half of the existing two-kind composition premise d7741cdc."

[[argument]]
id = "A root without represented limitation has intellect and will under the structural laws"
label = "A root without represented limitation HAS_INTELLECT_1 and HAS_WILL_1"
theorem = "rootIntellectWillOfNonlimitation"
premises = ["6c37be2d-578b-5248-93b3-80fa32585e62", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410", "Every matter-form bearer satisfies the selected composition predicate", "09c6d5f0-d412-5038-85f9-75fffb935727", "180f5ad2-a421-541a-85c9-9bca578b4a43", "090be689-b77f-51a1-9d5d-caf339169e4b"]
conclusion = "beede613-2c17-5fe1-829e-16829d781cfd"
axioms = []
rule = "Carry the same root through the three exclusions, matter-form inclusion, component exclusion and the two capacity laws"
meaning = "The supplied existential gives one actual root n at w, necessary from w, without the represented limitation horns. Noncomposition is the first exclusion. Excluded middle applied to represented esse and essence equality supplies their equality using the second exclusion. Excluded middle applied to each prior bearer's identity with n supplies firstness using the third exclusion. The matter-form inclusion and noncomposition give no matter-form composition. Component exclusion at a first being gives remoteness. The immaterial-to-intellect law gives capacity of n, and the intellect-to-will law gives n will. Each attribute is retained on that same witness. This is the structural tail of RootIntellectWill.ofNonlimitation, with just the half of the older composition-kinds premise that its proof applies."

[[argument]]
id = "The two composition kinds entail the matter-form inclusion"
theorem = "matterFormOfCompositionKinds"
comparator_theorems = ["compositionKindsIff", "matterFormWithoutEsseEssenceKind"]
premises = ["d7741cdc-881b-5bda-85ce-d70223162f78"]
conclusion = "Every matter-form bearer satisfies the selected composition predicate"
axioms = []
weakening = true
rule = "Take the matter-form implication at every bearer"
meaning = "The same MatterForm and Composite predicates appear on both sides. The full law additionally forces composition wherever the represented maps differ. The strictness companion interprets both predicates as true only of true on Bool, and the represented maps as constantly false and true. Matter-form inclusion holds at both candidates and applies at true. The full law would require composition of false because its maps differ."

[[relation]]
id = "Two composition kinds strictly strengthen the matter-form inclusion"
subject_kind = "statement"
subject_id = "d7741cdc-881b-5bda-85ce-d70223162f78"
predicate = "strengthens"
object_kind = "statement"
object_id = "Every matter-form bearer satisfies the selected composition predicate"
verification_result_id = "The two composition kinds entail the matter-form inclusion"
note = "Projection with the same matter-form and composite predicates. The Comparator companion checks the failure of the reverse entailment for fixed differing maps."

[[argument]]
id = "A root with intellect and finite reach give GOD_4 intellectual capacity"
theorem = "intellectOfReach"
comparator_theorems = ["reachOmission"]
premises = ["beede613-2c17-5fe1-829e-16829d781cfd", "75974d26-9483-4e1b-81a9-693a90ee9d0f"]
conclusion = "29818edd-9f5a-5414-baa2-9a7d0c8abf18"
axioms = []
rule = "Identify the named bearer with the actual root by finite grounding reach and transport intellectual capacity"
meaning = "The bundle supplies one actual root n at w and intellectual capacity of that same n. For each g satisfying IsGod, the open reach premise and n's roothood give g = n by namedRootOfReach on the same m and w. Transfer the same HasIntellect predicate by equality. This route uses the actual-root and intellectual-capacity conjuncts of the existing bundle. The Comparator companion omits the reach premise. In the existing plurality profile under explicit excluded middle, the bundle holds at left, while naming only the instrument fails the reach premise and both named capacity conclusions."

[[argument]]
