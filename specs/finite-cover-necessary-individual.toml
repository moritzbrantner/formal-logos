[batch]
vocab = "TruthCore.Case.Catholicism.StageOne.NecessaryIndividual"
results = "TruthCore.Results.Case.Catholicism.FiniteCoverNecessaryIndividual"

[[argument]]
id = "One individual persists across successors under finite population cover"
theorem = "necessaryIndividualOfFiniteCover"
strong_version_needed = { "ee4ab504-c8fe-59bc-bc96-7cbeefed6410" = "The proof applies excluded middle to propositions outside LocalLogic's scope, e.g. `present x v` (in finite_cover_deRe); `∃ v, F.access w v ∧ ¬present x v` (in finite_cover_deRe). LocalLogic (ca432e24) decides only whether an actual bearer is identical with a GOD_4 candidate, and gives double-negation elimination for that candidate's esse–essence identity." }
premises = ["STMT-EXCLUDED-MIDDLE", "STMT-ACCESSIBLE-SUCCESSOR", "STMT-ABSENCE-AMALGAMATION", "STMT-FINITE-POPULATION-COVER", "STMT-NECESSARY-INDIVIDUAL-DE-DICTO"]
conclusion = "STMT-NECESSARY-INDIVIDUAL-DE-RE"
rule = "Finite omission induction, followed by a contradiction with de dicto population"
meaning = "Registers the existing finite_cover_deRe derivation. On one frame, population predicate and base world, excluded middle, accessible-successor existence, absence amalgamation, finite population cover and de dicto population imply that one individual is present at every accessible world. Concrete divine witness identification requires further premises."
