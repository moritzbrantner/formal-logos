# #1926 phase 3, the next test of #1944's gap 1: can NAR (43651417, every
# NECESSARY_2 actual concretum is an actual root of the selected grounding G)
# be derived instead of assumed? N1 derives NAR from (a) the root withholds
# each being it grounds at some accessible world where it exists and (b) an
# explicit G-to-giving bridge (b2, rigidity at the root), with a common root. N2 derives (a) from a
# uniform mode of giving at the root; N3 derives (a) from the will route of
# ST I q.19 a.3 (willed giving, WN and SS). Controls show that one power, an
# invariant set-up and willed exercise do not force a uniform mode, and that
# under (b2) and its companions (a) is NAR in the giving register. Analyst
# formulations, attribution deferred. Note: docs/notes/nar-derivation.md.

[batch]
vocab = "TruthCore.Causality.NarDerivation"
results = "TruthCore.Results.Causality.NarDerivation"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Every actual root gives being at w to each existing being it grounds"
label = "Every actual root gives being at w to each being it grounds that exists at w"
lean = "ActualRootsGiveGroundedHere"
paraphrase = "OPEN bridge (b1), analyst formulation, unattributed: every actual root n of the selected grounding relation G at w gives being (GivesTo) at w to each being x that n grounds at w and that exists at w. The local G-to-giving bridge at the root (rigor contract 5 of #1926; #1626): grounding by the root read as productive dependence for being (the sustaining cause-of-being sense of 88a8fba7). Restricted to roots and to w, the weakest form arguments N2 and N3 use. Classical theism (conservation) and Avicenna's emanation both accept it; it fails if G is read as non-productive dependence (a singleton on its member)."
definitions = ["c57e2682-08e6-527e-950f-0fa0a7ff11ef", "a1b2e330-388f-4120-bc5c-969642317792", "62dfa893-b633-4513-9790-8f9a0a3087e0", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Every actual root gives each NECESSARY_2 being it grounds being wherever the root exists"
label = "Every actual root gives each NECESSARY_2 being it grounds being at accessible worlds where it exists"
lean = "ActualRootsGiveNecessaryGroundedWherever"
paraphrase = "OPEN bridge (b2), analyst formulation, unattributed: every actual root n of the selected grounding relation G at w gives being (GivesTo) to each NECESSARY_2 being x that n grounds at w, at every world accessible from w where n exists. Rigidity of the root's giving to a necessary grounded being, the weakest form argument N1 uses: only at roots, only for necessary grounded beings, only at worlds where the root exists. Classical theism and the emanationist necessary-through-another rival both accept it (the First gives the first intelligence being in every world). It says nothing about contingent grounded beings, so a contingent being sustained elsewhere by another source is no counterexample."
definitions = ["38b92bb6-33ae-5817-85c6-b5a1afa63bd1", "c57e2682-08e6-527e-950f-0fa0a7ff11ef", "a1b2e330-388f-4120-bc5c-969642317792", "62dfa893-b633-4513-9790-8f9a0a3087e0", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["83264cf5-01fe-52fc-9a00-eeb024f6496e", "DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "fbd0a6d3-5ca6-4f17-8651-ed0d6989c747"
label = "Every actual root withholds its giving of each grounded actual concretum at some accessible world"
lean = "ActualRootsWithholdEachGrounded"
paraphrase = "OPEN premise (a), analyst formulation, unattributed: for every actual root n of the selected grounding relation G at w and every actual concretum x that n grounds at w, there is a world accessible from w where n exists and does not give x being. #1897's two-way profile extended from the actual contingents to every being the root grounds, including any putatively NECESSARY_2 one; close to the theist-internal free-creation premise. Under (b2), factive giving, a common root, necessary roots and excluded middle it is equivalent to NAR (43651417): the same commitment in the giving register, not additional evidence."
definitions = ["c57e2682-08e6-527e-950f-0fa0a7ff11ef", "a1b2e330-388f-4120-bc5c-969642317792", "62dfa893-b633-4513-9790-8f9a0a3087e0", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "d164f730-95b4-4297-8978-9e5586f0b2ef"
lean = "ActualRootsNecessary"
paraphrase = "OPEN (analyst formulation, unattributed): every actual root of the selected grounding relation G at w exists at every world accessible from w (NECESSARY_2, NecessaryAt). Universal over actual roots; with a common root, the necessity of that one root. Its warrant is that of the necessary-root routes; not assessed in this batch."
definitions = ["38b92bb6-33ae-5817-85c6-b5a1afa63bd1", "c57e2682-08e6-527e-950f-0fa0a7ff11ef", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-ONTOLOGICAL-MODEL"]
