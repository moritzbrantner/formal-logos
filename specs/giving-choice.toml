[batch]
vocab = "TruthCore.Causality.GivingChoice"
results = "TruthCore.Results.Causality.GivingChoice"

[[statement]]
id = "46a468b2-8132-4ef4-bd31-6e8292013f3b"
label = "Actual root choice histories map to accessible worlds retaining the same root"
lean = "RootHistoriesAdmissible"
paraphrase = "OPEN, analyst formulation. For every actual root g of the selected grounding relation at w, each history through the selected decision moment maps to a world accessible from w where g exists. The map need not cover every accessible world or fix the setup. In argument 19a0417f it is the only passage from WITHHOLD_1 (cell control) to WITHHOLD_2 (accessible non-giving), used at the cell's representative. With the branching frame and map unconstrained and at most one actual root, it and 0dd78706 are jointly satisfiable by some representation exactly when fbd0a6d3 holds (Lean cellsRepresentationIff, #2103), so together they re-present fbd0a6d3 unless the partition and map are fixed independently."
definitions = ["c57e2682-08e6-527e-950f-0fa0a7ff11ef", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "419a65c2-f095-44c9-8459-06e72c77fbcd"]

[[statement]]
id = "0dd78706-e6f7-40a6-9232-eac3df1c0ae9"
label = "Each grounded actual concretum has a root choice cell that withholds (WITHHOLD_1) giving it being"
lean = "RootsHaveWithholdingCells"
paraphrase = "OPEN, analyst formulation. For each actual root g and actual concretum x it grounds at w, some cell of g's partition at the selected moment contains only histories that map to a world where g does not give x being. The cell may depend on x. The world map is shared with the accessibility premise. 'Withholds' is WITHHOLD_1, control over the whole cell (rootsHaveWithholdingCells_iff). With the branching frame and map unconstrained and at most one actual root, the discrete partition makes every witness of fbd0a6d3 a one-history cell, so this premise and 46a468b2 are jointly satisfiable exactly when fbd0a6d3 holds (cellsRepresentationIff, #2103). It adds a constraint beyond fbd0a6d3 only for an independently fixed partition and map."
definitions = ["c57e2682-08e6-527e-950f-0fa0a7ff11ef", "a1b2e330-388f-4120-bc5c-969642317792", "62dfa893-b633-4513-9790-8f9a0a3087e0", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-ONTOLOGICAL-MODEL", "c54f0922-eb5c-4abd-9bde-6586e4127424", "dba7c7df-b469-47e5-8130-1a6641e326b7"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "419a65c2-f095-44c9-8459-06e72c77fbcd"]

[[argument]]
id = "19a0417f-3e44-4500-83c2-4dac473922ac"
label = "Admissible root withholding (WITHHOLD_1) cells supply accessible per-effect withholding (WITHHOLD_2)"
theorem = "root_withholding_of_cells"
restates_conclusion = {lemma = "TruthCore.Results.Causality.GivingChoice.cellsRepresentationIff", note = "With the branching frame, moment and history-to-world map existentially closed, admissibility 46a468b2 and the withholding cells 0dd78706 hold exactly when fbd0a6d3 holds (discrete partition), provided the profile has at most one actual root at the world. Both premises are restated; the equivalence is conditional on that uniqueness side condition.", side_conditions = [{hypothesis = "unique", discharged_by = "TruthCore.Results.Causality.GivingChoice.uniqueRootOfCommonRoot", note = "At most one actual root at the world. uniqueRootOfCommonRoot derives it from a common actual root (ActualCommonRootAt), which is not a premise of this argument: off the common-root route the premise pair may be strictly stronger than fbd0a6d3."}]}
strong_version_needed = {"0dd78706-e6f7-40a6-9232-eac3df1c0ae9" = "Recipient scope: the conclusion quantifies over every grounded actual concretum, including contingent recipients, and necessary-recipient coverage alone supplies no cell for that case. Cell strength: the proof does not use control over the whole cell, only the representative's own nonproduction (cstit_actual), so a one-history premise would suffice here; none is registered. The cell form is kept because it is the same statement the NAR arguments fccc4968 and 4d047904 and the strength order 57f97264 use, and because WITHHOLD_1 is the STIT content of withholding (c54f0922). With an unconstrained partition the two forms coincide for this conclusion (cellsRepresentationIff uses the discrete partition)."}
premises = ["46a468b2-8132-4ef4-bd31-6e8292013f3b", "0dd78706-e6f7-40a6-9232-eac3df1c0ae9"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "419a65c2-f095-44c9-8459-06e72c77fbcd"]
sense_bridges = [{term = "WITHHOLD", from = "WITHHOLD_1", to = "WITHHOLD_2", statement_id = "46a468b2-8132-4ef4-bd31-6e8292013f3b", role = "premise"}]
conclusion = "fbd0a6d3-5ca6-4f17-8651-ed0d6989c747"
axioms = []
rule = "Apply setoid reflexivity and map the withholding representative to an admissible world"
meaning = "Re-presentation of premise (a) in the choice register, not independent support for it (#2103). For the same actual root and grounded actual concretum, the representative belongs to its own withholding cell (WITHHOLD_1) by reflexivity. The map sends it to an accessible world where the root exists and where it does not give that concretum being (WITHHOLD_2). The proof uses the cell only at its representative, and 46a468b2 is the only passage from sense 1 to sense 2; no agentive content of sense 1 is carried into fbd0a6d3. With the branching frame, moment and world map unconstrained and at most one actual root (which a common actual root secures: uniqueRootOfCommonRoot), some representation satisfies both premises exactly when fbd0a6d3 holds (Lean cellsRepresentationIff, discrete partition). The argument adds warrant for fbd0a6d3 only if an independently fixed decision partition and world map are supplied. Its restates_conclusion marker (#2190) makes the frontier close fbd0a6d3 through it only by rule (d), when every premise is closed. Neither uniformity across effects nor a fixed setup is a premise of this per-effect conclusion."
