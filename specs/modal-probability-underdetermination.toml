[[argument]]
id = "ba279e76-0344-4fcb-bcec-563a48fb9567"
label = "Fixed modal accessibility and truth admit every interior event probability"
theorem = "modalProbabilityFreedom"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = ["c3f76aea-ee54-471c-8a37-ef53eab821d6"]
conclusion = "7d4d86dd-97c0-43f0-882a-687af5d675e5"
rule = "Mathematical proof in Lean with Mathlib"
meaning = "Corollary of the shared interior-mass statement (c3f76aea): instantiate it at the accessible-world subtype of a fixed frame, with the formula truth event as the event. Frame, valuation, origin and formula are fixed before the measure is chosen; access does not select a probability."
description = "Corollary: a direct instance of the shared interior-mass statement at the accessible-world subtype, adding the Kripke typing and no new mathematics. Restated from the never-compiled draft: for a probability measure, p : ENNReal with 0 < p < 1 and measure s = p is equivalent to an InteriorRate p with real measure s = p, so the value form is unchanged; the hypotheses were weakened from infinite to nonempty truth classes, so the new statement implies the draft's."
