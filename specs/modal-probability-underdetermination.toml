[[statement]]
id = "796b415f-2de6-46b1-ae71-ee7fab6a5689"
label = "No normalized uniform point masses on a countably infinite carrier"
lean = "NoUniform"
paraphrase = "Every Mathlib probability on a countably infinite carrier with measurable singletons has unequal singleton weights somewhere; a constant zero weight sums to zero and a nonzero constant sums to infinity."
