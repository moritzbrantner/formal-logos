[[statement]]
id = "94393b5b-8950-4a52-aef1-50cd09232e64"
label = "If the absence of every contingent concretum is possible but not actual, a being has a power for it"
lean = "GlobalAbsenceGrounded"
paraphrase = "OPEN (P1, Aristotelian grounding of the global possibility; analyst variant, attribution deferred): if some world accessible from w has no contingent concrete being and w itself has one, then some being existing at w has, at w, a power whose exercise would initiate a causal chain issuing in there being no contingent concrete being (PowerFor). An instance of Aristotelian modality (a non-actual possibility is grounded in an actual being's power) for one global proposition only; it is not PGP and does not mention any individual's absence. Pruss's own argument grounds the weaker possibility that every actual contingent is absent (specs/modal-grounding-actual-absence.toml)."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "6ecf24d5-5001-4571-937c-2632ac8c2c66", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "A power for there being no contingent concretum issues in a world where its holder exists"
lean = "GlobalAbsenceInitiatorPresent"
paraphrase = "OPEN (P2, initiator presence; analyst reconstruction): whatever has at w a power for there being no contingent concrete being can exercise it so that, at some world accessible from w, there is no contingent concrete being and the holder exists there. With the frame's tenseless world-relative existence, the initiator of a chain exists in the world of that chain. Close to the premise of Pruss's sketch that x cannot start any chain of causes that can lead to actuality's not including x (navigation only, not attributed), with two differences: his principle is universal over chains while this is existential and builds in that the power's outcome is an accessible world; and his direction is mirrored (his holder is in the non-actual world, with a power for the actual world's being actual, and he uses S5 for that world to reach the actual one). Under a tensed reading (absence at the end of a history) a self-annihilating holder falsifies it (controls, Pruss omission 2)."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "6ecf24d5-5001-4571-937c-2632ac8c2c66", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Whatever has at w a power for there being no contingent concretum is concrete"
lean = "GlobalAbsencePowerHoldersConcrete"
paraphrase = "OPEN (P3; analyst reconstruction): every holder at w of a power for there being no contingent concrete being is concrete (in the selected world-independent concreteness predicate). Powers belong to concrete beings."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "6ecf24d5-5001-4571-937c-2632ac8c2c66", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "0dc833c1-3b2f-4769-a09e-531f0da12455"
label = "Possibly no concrete being is CONTINGENCY_1 (global variant, stronger than Pruss's premise)"
lean = "PossiblyNoContingentConcrete"
paraphrase = "OPEN (P4, the global possibility premise; a stronger analyst variant that Pruss declines, attribution deferred): some world v accessible from w has no concrete being that is contingent at v (exists at v and is absent at a world accessible from v). With tenseless world-relative existence: possibly no contingent concretum ever exists. Pruss (navigation only) calls this possibility controversial and uses instead the possibility that the actual contingents are absent, others perhaps in their stead (statement in specs/modal-grounding-actual-absence.toml); with Euclidean access this premise implies his, not conversely. The subtraction conclusion (possibly no concrete being) implies it (controls, law 8); the theist accepts it (theist model); a Lowe-style view on which some contingent being necessarily exists, if that being is concrete, denies it. It does not follow from the contingency of each actual concretum (actual-absence controls, Van Cleve model)."
definitions = ["6ecf24d5-5001-4571-937c-2632ac8c2c66", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

