premises = []
conclusion = "Modal grounding frameworks at the foundational case: laws, framework models and omission models"
rule = "General laws and explicit finite models"
meaning = "Premise-free laws comparing the accounts of de re possibility of absence at the foundational case (power-grounded, combinatorial, essentialist in two forms, hybrid) and the Pruss reconstruction, then finite models: a theist nonvacuity model, the Pruss-without-PGP separation, the brute foundational model, the existence-conditional model with four omission models, the primitivist pair, the hybrid First Way model, six Pruss omission models and two one-sided conceivability models. Model-witnessed separations only; no premise is established and no reality claim is made."
description = "Premise-free laws and models for the #1887 framework batch. Sense-mixing control: the laws relate MODAL_CONTINGENCY_1, NECESSARY_2, POSSIBLE_NOT_TO_BE_1 and _2, POWER_OVER_ESSE_1 and the new power-for-a-proposition primitive without a bridge premise. Establishes no premise."

