# #1887 tests 4 and 5: accounts of de re possibility of absence at the
# foundational case (a being actual at w, simple, unreceived, first, uncaused,
# incorruptible simply, under no power over its esse), stated on the shared
# CausalityFrame, and an analyst reconstruction of Pruss's Aristotelian-modality
# argument for a necessary concrete power-holder. PGP and B6 each give the
# "necessary" verdict; unconditional essentialism supports B6; existence-
# conditional essentialism gives "possibly absent"; combinatorial modality
# (existing recombination results) gives "possibly absent"; primitivism fixes
# neither (controls). Analyst formulations, attribution deferred; navigation only:
# Vetter 2015; Pruss 2011 and "The Actual and the Possible"; Armstrong 1989;
# Fine 1994; Lowe 2008; ST I q.45 a.2 ad 2.

[batch]
vocab = "TruthCore.Modal.ModalGrounding"
results = "TruthCore.Results.Modal.ModalGrounding"

[[statement]]
id = "Every being foundational at w exists at every world accessible from w"
lean = "FoundationalBeingsNecessaryAt"
paraphrase = "Verdict 'necessary' at the foundational case, analyst formulation: every being that is foundational at w (exists at w; represented esse equal to represented essence; not composed of matter and form; esse received in no principle; first in SIMPLY_PRIOR_1; no CAUSE_2 of its esse; incorruptible simply, that is, no in-subject potency to non-being; under no being's POWER_OVER_ESSE_1) exists at every world accessible from w (NECESSARY_2 de re, relative to the frame's accessibility). A universal conditional: it does not assert that any being is foundational."
definitions = ["7fcf846e-d0ef-400e-89c0-7c82b94edde7", "DEF-KANT-MODAL-NECESSITY", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-ESSE", "DEF-ESSE-RECEIVED-IN", "DEF-SIMPLE-PRIORITY", "DEF-CAUSE-OF-PERFECTION"]
disambiguations = ["DISAMB-ESSE-RECEPTION", "DISAMB-CAUSE", "DISAMB-PRIORITY-SIMPLE-OR-IN-TIME"]

[[statement]]
id = "Every being foundational at w is CONTINGENCY_1 at w"
lean = "FoundationalBeingsContingentAt"
paraphrase = "Verdict 'possibly absent' at the foundational case, analyst formulation: every being foundational at w (as in the necessity verdict's profile) exists at w and is absent at some world accessible from w (MODAL_CONTINGENCY_1). With some foundational being it contradicts the necessity verdict."
definitions = ["7fcf846e-d0ef-400e-89c0-7c82b94edde7", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-ESSE", "DEF-ESSE-RECEIVED-IN", "DEF-SIMPLE-PRIORITY", "DEF-CAUSE-OF-PERFECTION"]
disambiguations = ["DISAMB-KANT-CONTINGENCY", "DISAMB-ESSE-RECEPTION", "DISAMB-CAUSE", "DISAMB-PRIORITY-SIMPLE-OR-IN-TIME"]

[[statement]]
id = "Some concrete being is foundational at w"
lean = "SomeConcreteFoundationalAt"
paraphrase = "OPEN, analyst formulation: some concrete candidate is foundational at w: it exists at w, its represented esse equals its represented essence, it has no matter and form, its esse is received in no principle, it is first in SIMPLY_PRIOR_1, nothing is a CAUSE_2 of its esse, it is incorruptible simply and no being has POWER_OVER_ESSE_1 over it. Non-modal: it says nothing about the being at other worlds. Admissible on both classical theism and the brute-first rival (controls: theist; bruteFoundational, a contingent such being); the models show admissibility only; a pure Humean who rejects simplicity or act need not accept it."
definitions = ["7fcf846e-d0ef-400e-89c0-7c82b94edde7", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-ESSE", "DEF-ESSE-RECEIVED-IN", "DEF-SIMPLE-PRIORITY", "DEF-CAUSE-OF-PERFECTION"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-ESSE-RECEPTION", "DISAMB-CAUSE", "DISAMB-PRIORITY-SIMPLE-OR-IN-TIME"]

[[statement]]
id = "Whatever lies in a being's nature holds at every world accessible from w"
lean = "EssenceGroundsNecessity"
paraphrase = "OPEN (essence grounds necessity), analyst formulation: for every being x and world-proposition phi, if it lies in the nature of x that phi (the primitive Essential relation, Fine's box-sub-x), then phi holds at every world accessible from w. Accepted by existence-conditional and unconditional essentialists alike; the converse (necessity gives essence) is not asserted."
definitions = ["7cf63236-9c12-41bc-bf20-6fbce7a121db", "DEF-KANT-ONTOLOGICAL-MODEL"]

[[statement]]
id = "Whatever has represented esse equal to its essence has its own existence in its nature"
lean = "EsseEssenceIsEssentialExistence"
paraphrase = "OPEN (unconditional essentialism's reading of esse = essence), analyst formulation: for every being x whose represented esse equals its represented essence (the q.3 a.4 essenceOf/esseOf maps), it lies in the nature of x (Essential) that x exists, unconditionally: the proposition true exactly at the points where x exists. The bridge from the essence-esse identity to an essential truth; existence-conditional essentialism rejects it for any such being whose absence is representable (controls, law 3)."
definitions = ["7cf63236-9c12-41bc-bf20-6fbce7a121db", "DEF-ESSE", "183b48d2-1753-583d-aef9-4199cff86231", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-ESSENCE"]

[[statement]]
id = "Every essential truth about a being holds at every point where it is absent"
lean = "ExistenceConditionalEssences"
paraphrase = "OPEN (existence-conditional essentialism, Fine/Lowe reading; analyst formulation): for every being x and world-proposition phi, if it lies in the nature of x that phi, then phi holds at every point of the frame's world type at which x does not exist: x's essential truths have the form 'if x exists, ...'."
definitions = ["7cf63236-9c12-41bc-bf20-6fbce7a121db", "54bdb2f0-aa66-489f-ae06-174dd668d424", "DEF-KANT-ONTOLOGICAL-MODEL"]

[[statement]]
id = "A being at w whose existence no essential truth entails is absent at some accessible world"
lean = "EssentialExclusionAccount"
paraphrase = "OPEN (essentialist account of possibility of absence, the non-power ground of de re possibility, ACT-06; analyst formulation): every being x existing at w such that no essential truth of any being entails x's existence (holds only at points where x exists) is absent at some world accessible from w. Possibility of absence is the absence of an essential exclusion."
definitions = ["7cf63236-9c12-41bc-bf20-6fbce7a121db", "54bdb2f0-aa66-489f-ae06-174dd668d424", "DEF-KANT-ONTOLOGICAL-MODEL"]

[[statement]]
id = "No other being's essential truth entails the existence of a being foundational at w"
lean = "FoundationalExistenceUnrequiredByOthers"
paraphrase = "OPEN, analyst formulation: for every being f foundational at w and every other being y, no essential truth of y entails f's existence. The essentialist counterpart of firstness: SIMPLY_PRIOR_1 firstness alone says nothing about essences, so this is a separate premise."
definitions = ["7fcf846e-d0ef-400e-89c0-7c82b94edde7", "7cf63236-9c12-41bc-bf20-6fbce7a121db", "54bdb2f0-aa66-489f-ae06-174dd668d424", "DEF-ESSE", "DEF-ESSE-RECEIVED-IN", "DEF-SIMPLE-PRIORITY", "DEF-CAUSE-OF-PERFECTION"]
disambiguations = ["DISAMB-ESSE-RECEPTION", "DISAMB-CAUSE", "DISAMB-PRIORITY-SIMPLE-OR-IN-TIME"]

[[statement]]
id = "Some point of the world type lacks each being foundational at w"
lean = "FoundationalAbsenceRepresentable"
paraphrase = "OPEN, analyst formulation: for every being foundational at w some point of the frame's world type (accessible or not) lacks it: its absence is representable in the logical space. Says nothing about accessibility, so it does not by itself make the being contingent."
definitions = ["7fcf846e-d0ef-400e-89c0-7c82b94edde7", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-ESSE", "DEF-ESSE-RECEIVED-IN", "DEF-SIMPLE-PRIORITY", "DEF-CAUSE-OF-PERFECTION"]
