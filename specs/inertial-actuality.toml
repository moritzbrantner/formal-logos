rule = "Construct matched worldly histories and refute entailment with the omission history"
meaning = "Hold the background bearer fixed, vary the candidate's temporal profile and satisfy the global cessation law by time-independent presence. Omission refutes the claimed entailment of actuality."

[[argument]]
