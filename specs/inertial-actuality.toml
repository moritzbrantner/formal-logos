axioms = ["propext","Classical.choice","Quot.sound"]
rule = "Hold x's presence and earlier-date reason fixed while varying y"
meaning = "The reason at 0 for x at 1 is valid in both histories. Even the stronger global cessation law under no inducers leaves the distinct y's actuality open."

[[argument]]
id = "A protector can block a loss inducer without giving the receiver being"
theorem = "externalProtectionCompatible"
premises = []
conclusion = "5a4ba734-fea3-4e3c-afd1-50f086c32f41"
axioms = ["propext","Classical.choice","Quot.sound"]
rule = "Check the cessation law and apply the productive bridge to the protected survivor"
meaning = "Every loss in the exposed history crosses the inducer at 1. The protected history has no inducer against the receiver. The received and inertially explained survivor lacks any strict giver at 1, so it falsifies the productive bridge in this model."

[[argument]]
id = "Apply the stationary location proof under a substantial-actuality state premise"
theorem = "transferLocation"
premises = ["A substantial bearer's actuality persists through inducer-free unproduced adjacent steps"]
conclusion = "A reversible unproduced window with an actuality anchor stays populated"
axioms = ["propext","Classical.choice","Quot.sound"]
rule = "Build a presence-report trace and derive its stationarity"
meaning = "The open state premise gives the forward implication with inducers and giving excluded. The independent no-onset condition gives the reverse implication. Apply the anchored-location theorem to the resulting stationary report trace and project dated presence."

[[argument]]
id = "A moving-location control leaves the actuality transfer premise unproved"
theorem = "locationDoesNotSupplyStateLaw"
premises = []
conclusion = "The reported location contrast is compatible with failure of the existential state rule"
axioms = ["propext","Classical.choice","Quot.sound"]
rule = "Pair the worked location control with a countermodel to the state premise"
meaning = "Reuse the reported location contrast. In the exposed profile reinterpreted with no modeled inducer, the same bearer disappears between 0 and 1 despite absent production and no onset, so the state rule fails."

[[argument]]
id = "An inertial profile can also model a received act"
