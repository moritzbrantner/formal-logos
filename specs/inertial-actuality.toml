axioms = ["propext","Classical.choice","Quot.sound"]
rule = "Assign reception to the everlasting bearer and check the state rule"
meaning = "The same candidate is everlasting in the populated history, has no strict giver there and receives esse according to the supplied dictionary. The two open theses can coexist in this interpretation."

