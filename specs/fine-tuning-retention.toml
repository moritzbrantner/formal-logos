[[statement]]
id = "Teleonomy filter reproduces fine-report screening in the same sampling rows"
lean = "RetentionScreening"
paraphrase = "For any pair of normalized three-cell sampling rows with no other-observer mass in either row, applying the teleonomy fixture's retention filter to the fine indicator yields the same fine-report likelihood as conditioning on observers in each row. Both likelihoods are one. The observer-conditioned report has zero mutual information about the model label for every interior comparison prior."

[[argument]]
id = "Apply the fixed teleonomy retention rule to screened fine-tuning rows"
theorem = "retentionScreening"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = ["27379412-f94e-44b0-8e29-1b548bc142d1"]
conclusion = "Teleonomy filter reproduces fine-report screening in the same sampling rows"
rule = "Evaluate retained masses and apply the binary information criterion"
meaning = "Apply the exact Boolean retention rule to the fine indicator, using the fine-cell weight and its complementary weight. In rows with no other-observer mass, the retained ratio agrees with the observer-conditioned report, and the binary information criterion yields zero information."

[[relation]]
id = "Fine-report experiment tests the exact differential-retention fixture"
subject_kind = "result"
subject_id = "Apply the fixed teleonomy retention rule to screened fine-tuning rows"
predicate = "tests"
object_kind = "statement"
object_id = "5db5ee8f-8c16-5538-baa6-3b93cda2963d"
note = "Apply the registered filter itself to the supplied fine indicator. Its true and false retention outputs determine the two retained masses, so the experiment tests the statistical effect of this exact differential-retention rule. The input is a sampling indicator; its use here makes no claim about biological inheritance, nonchance tending, or any director."
