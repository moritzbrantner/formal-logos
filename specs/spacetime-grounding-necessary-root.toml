[[argument]]
id = "b6ec7983-6e7a-405c-9984-5e25ef45f221"
label = "Contingent spacetime and same-relation occupant grounding imply an unlocated necessary underived root"
theorem = "derive"
premises = ["0bdcf366-29c7-5d45-b603-5c929dcad976", "1dd2b809-a1d3-43ca-8dfc-b7c1c4fbfd58", "144a61c5-0abd-4759-bdcd-8ad59ed8be72", "8bfeb070-436d-4503-8282-4b7df72a4d93"]
conclusion = "bc2ee163-0ca6-48b2-84b2-0da27326cfcb"
axioms = ["propext", "Classical.choice", "Quot.sound"]
comparator_theorems = ["selectedUnlocated", "omission"]
rule = "same-witness necessary-root elimination plus explicit whole-grounding bridge"
meaning = "Conditional cross-family consequence from the existing necessary-concrete-underived root-route node to a selected non-spatiotemporal attribute: the SAME underived concrete candidate is unlocated (dimensive SPATIOTEMPORAL_2) if the SAME world contains a contingent, actual concrete spacetime whole, and that very whole grounds every distinct located actual concretum in the SAME Profile.grounds relation. The whole's existence, contingency, and occupant-to-whole existential dependence are explicitly open premises; the latter is not derived from Leibniz/Clarke translation symmetry, Lorentz geometry, temporal ordering or efficient causation. The omission control has actual distinct concreta and a real grounding edge but no occupant-to-whole bridge or nonlocated root. The result does not identify this witness with the GOD_4 attribute root, imply physical spacetime's contingency, or yield Boethian eternity; same-witness GOD_4 attribution is the next open consumer."
definitions = ["75c193e1-bab0-5ec2-890b-9ff608b05aa7", "e9e031af-665e-5888-9328-f7637b5a2677", "ddde7152-b698-5a85-8060-b8c6c9905758", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "ca052c37-98bc-4ef5-94fb-dcc4ab73f4d5"]
disambiguations = ["1ea8b036-7a66-540a-be38-301a8db9077c", "6f1d1395-7c1d-5bd5-a45d-03380857aed6", "5d15d8f2-1080-53c9-886f-cee2a4ff23a9"]
senses = { SPATIOTEMPORAL = "SPATIOTEMPORAL_2" }
