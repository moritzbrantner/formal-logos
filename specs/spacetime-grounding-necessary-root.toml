label = "Distinct actual concrete spatial occupants depend on the spacetime whole for their being"
lean = "OccupantsDependOnWholeAt"
paraphrase = "In the selected world and exact existential-grounding relation, every actual concrete occupant distinct from the spacetime whole is grounded for its being by that very whole. An explicitly open ontological bridge, not a consequence of geometric occupation or physical causation."
