lean = "NecessaryUnderivedUnlocatedAt"
paraphrase = "One and the same actual concrete candidate is necessary relative to the selected accessible worlds, underived in the selected existential-grounding relation across all admitted worlds, and not located in the dimensive occupation sense SPATIOTEMPORAL_2. No GOD_4 identity or divine eternity is inferred."
