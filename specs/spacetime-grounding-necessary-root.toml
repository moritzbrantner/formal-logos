label = "The actual spacetime whole is contingent in the selected modal frame"
lean = "ContingentWholeAt"
paraphrase = "The actual spacetime whole exists at the selected world but fails to exist at an accessible world, with the identical rigid candidate tracked across worlds. No cosmic beginning or physical modality is thereby assumed."
