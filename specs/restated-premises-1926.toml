predicate = "logically_equivalent_to"
object_kind = "statement"
object_id = "c94b5446-e7e7-5b36-9bed-288959725526"
note = "The same proposition on two carriers: SomeContingentConcreteAt F concrete w ('some x is concrete and ContingentAt F.history.ontic w x', exists at w and fails to exist at some world accessible from w) is SomeActualContingentAt on the ground profile of F with the same concreteness predicate (groundProfile F concrete grounds, whose ontic is F.history.ontic), for every grounding relation, which the proposition does not mention. Verified as someContingentConcreteIff (Iff.rfl), a Comparator-checked theorem of the restated-premise controls result. Same contingency sense (MODAL_CONTINGENCY_1, DEF-KANT-MODAL-CONTINGENCY) and model (DEF-KANT-ONTOLOGICAL-MODEL). Both take the concreteness predicate as a parameter; the c94b5446 record also reads it as CONCRETE_6 (DEF-CONCRETE-ESSE-IN-RE), while c76b6e2c leaves the selected predicate open, so the equivalence holds whenever the same predicate is supplied and does not fix the c76b6e2c routes to CONCRETE_6. The adapter runs from frames to profiles only: a profile that is not a frame's ground profile has no c76b6e2c counterpart. The records stay distinct (Pruss routes on the CausalityFrame, the contingent-being node on its route profile); no argument is registered in either direction."
