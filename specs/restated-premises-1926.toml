note = "Same proposition over the same parameters (a participation predicate, a cause relation CausesIn and the respect esse): both unfold to 'every x that has esse by participation has some c other than x that causes x's esse'. Verified as participatedCauseReadingsIff (Iff.rfl), a Comparator-checked theorem of the restated-premise controls result. Both records link ESSE_BY_PARTICIPATION_1 and esse; the ad 1 record also links the mode-unspecified external cause of esse (196be87e), the co. record the cause of a perfection (CAUSE_2), which at esse is the same mode-unspecified cause of being (the efficient sibling is a separate statement). The two stay distinct records because their source readings differ (ST I q.44 a.1 ad 1 and co.) and their routes bind different Lean declarations in frozen Challenges (ComponentFirstness and Round2Grounding); merged_legacy_ids is not used. No argument is registered in either direction, since each would be an identity transcription."

