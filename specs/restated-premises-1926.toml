subject_kind = "statement"
subject_id = "22954087-d5fb-4bd3-bcb7-5d5167016988"
predicate = "logically_equivalent_to"
object_kind = "statement"
object_id = "b0fd6cc1-8907-5ec6-b0b4-598848314bf2"
note = "The same proposition on the idea frame's carrier: MeditatorThinks I unfolds (through ThinkingRootFork.Thinks) to 'some episode e occurs and the meditator I.me bears e', which is SelectedBearsOccurringThought with Occurs := I.Occurs, Bears := I.Bears and the selected being := I.me. Verified for every idea frame as meditatorThinksIff (Iff.rfl), a Comparator-checked theorem of the restated-premise controls result. Same occurrence and bearer senses (DEF-THOUGHT-OCCURRENCE, DEF-THOUGHT-BEARER). The equivalence holds at that instantiation: the selected-bearer premise is stated for any occurrence and bearing relations and any selected being, the cogito premise for the meditator of an idea frame, so it is the selected-bearer premise with the selection fixed as the meditator, not a claim that every selected being is a meditator. The records stay distinct (Cartesian idea-of-the-infinite route and Round 3 cogito-base grounding route, different carriers, frozen Challenges); no argument is registered in either direction."

[[relation]]
id = "Some concrete contingent at w is the same on the frame and on its ground profile"
subject_kind = "statement"
subject_id = "c76b6e2c-1ca0-47fd-a9d0-2c2faa3d1174"
predicate = "logically_equivalent_to"
object_kind = "statement"
object_id = "c94b5446-e7e7-5b36-9bed-288959725526"
note = "The same proposition on two carriers: SomeContingentConcreteAt F concrete w ('some x is concrete and ContingentAt F.history.ontic w x', exists at w and fails to exist at some world accessible from w) is SomeActualContingentAt on the ground profile of F with the same concreteness predicate (groundProfile F concrete grounds, whose ontic is F.history.ontic), for every grounding relation, which the proposition does not mention. Verified as someContingentConcreteIff (Iff.rfl), a Comparator-checked theorem of the restated-premise controls result. Same contingency sense (MODAL_CONTINGENCY_1, DEF-KANT-MODAL-CONTINGENCY) and model (DEF-KANT-ONTOLOGICAL-MODEL). Both take the concreteness predicate as a parameter; the c94b5446 record also reads it as CONCRETE_6 (DEF-CONCRETE-ESSE-IN-RE), while c76b6e2c leaves the selected predicate open, so the equivalence holds whenever the same predicate is supplied and does not fix the c76b6e2c routes to CONCRETE_6. Every profile is the ground profile of some frame on its own ontic, so the equivalence needs only the same concreteness predicate. The records stay distinct (Pruss routes on the CausalityFrame, the contingent-being node on its route profile); no argument is registered in either direction."
