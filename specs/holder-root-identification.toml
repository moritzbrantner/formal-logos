# #1926 phase 3, bridge 5 (root uniqueness) applied to #1897 gap 2 / #1941
# gap 2: identify the holder of the power for the joint absence of the actual
# contingent concreta with the selected root that the intellect routes reach.
# Two explicit steps: (1) every holder is an actual root, from initiator
# presence (P2'), concreteness (P3'), existence at w and the denial of
# "necessary through another" (NAR); (2) the common-root reach of 0c27f65a or
# the at-most-one-root interface 49fdec01 makes every actual root that root.
# The holder's CausalityFrame and the root's Profile are joined only through
# FirstMoverNecessity.groundProfile (the profile on the frame's existence, with
# a selected grounding relation G as a parameter). Analyst formulations,
# attribution deferred. Note: docs/notes/holder-root-identification.md.

[batch]
vocab = "TruthCore.Causality.HolderRootIdentification"
results = "TruthCore.Results.Causality.HolderRootIdentification"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Whatever has power for the actual contingents' joint absence exists at w"
lean = "ActualAbsenceHoldersExistAt"
paraphrase = "OPEN (analyst formulation, unattributed): whatever has at w a power (PowerFor) for the joint absence of the concrete beings contingent at w exists at w. The actualist reading of powers (serious actualism: a being has properties, powers among them, only at worlds where it exists), restricted to this one power. Without it a holder can exist only at a non-actual world (controls)."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["e5417243-d6f3-4776-9694-40d85bb34ff4", "DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Every NECESSARY_2 actual concretum is an actual root of the selected grounding relation"
lean = "NecessaryActualConcretaAreRoots"
paraphrase = "OPEN (NAR, analyst formulation, unattributed): every concrete being that exists at w and at every world accessible from w (NECESSARY_2, NecessaryAt) has no actual concrete ground at w in the selected grounding relation, i.e. is an actual root. The denial of 'necessary through another' for modal necessity; it is not about the tertia via's NECESSARY_3/NECESSARY_4 (a being necessary in that sense may have its necessity from another). Constructively equivalent to: whatever actual concretum (concrete, existing at w) has an actual concrete ground at w is not NECESSARY_2 at w; with excluded middle, such a concretum is contingent at w. The unrestricted form over all beings is strictly stronger. Compatible with the sourced statement 8c3870b7 (ST I q.44 a.1 ad 2, some necessary things have causes of their necessity) only if that statement is read as NECESSARY_3/NECESSARY_4. Its rival is a NECESSARY_2 actual concretum with an actual concrete ground (Avicenna's necessary through another, whose causal version bears on NAR only through the esse-cause bridge cb1cdea9; note section 4)."
definitions = ["38b92bb6-33ae-5817-85c6-b5a1afa63bd1", "c57e2682-08e6-527e-950f-0fa0a7ff11ef", "a1b2e330-388f-4120-bc5c-969642317792", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["83264cf5-01fe-52fc-9a00-eeb024f6496e", "DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Whatever has power for the actual contingents' joint absence is an actual root"
label = "Whatever has power for the actual contingents' joint absence is an actual root of the grounding"
lean = "ActualAbsenceHoldersAreActualRoots"
paraphrase = "For every being y: if y has at w a power for the joint absence of the concrete beings contingent at w, then y is an actual root of the selected grounding relation G at w, in the profile on the frame's own world-relative existence (groundProfile F concrete G): concrete, existing at w, with no actual concrete G-ground at w. Universal over holders; asserts no holder's existence, no uniqueness, no God identification. G is a parameter, not identified with giving, causing, dependence for being or simple priority."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "c57e2682-08e6-527e-950f-0fa0a7ff11ef", "a1b2e330-388f-4120-bc5c-969642317792", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["e5417243-d6f3-4776-9694-40d85bb34ff4", "DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "At most one being has power for the actual contingents' joint absence"
lean = "AtMostOneActualAbsenceHolder"
paraphrase = "For any y and z: if each has at w a power for the joint absence of the concrete beings contingent at w, then y and z are the same. Only 'at most one': no holder is said to exist, and nothing is said about God."
definitions = ["bf7eddca-8291-4744-8470-379babcd7781", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["e5417243-d6f3-4776-9694-40d85bb34ff4", "DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Whatever has power for the actual contingents' joint absence is GOD_4"
lean = "ActualAbsenceHoldersAreGod"
paraphrase = "For every being y: if y has at w a power for the joint absence of the concrete beings contingent at w, then y is GOD_4. The converse direction of 0050b6ed (every GOD_4 is such a holder). No holder is said to exist."
definitions = ["88f9f6e8-997b-5f7d-afa1-c501954c3807", "bf7eddca-8291-4744-8470-379babcd7781", "1b8baf77-84fa-5513-a138-7fa14840dd87", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["e5417243-d6f3-4776-9694-40d85bb34ff4", "DISAMB-CONCRETE-ABSTRACT-CRITERIA", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Holder-root identification: laws, nonvacuity, necessary-through-another, omission and two-root models"
label = "Holder-root identification: laws, nonvacuity, necessary-through-another, omissions, two roots"
lean = "Model.Controls"
paraphrase = "Premise-free laws and finite models (structural surrogates, not metaphysical possibility). Laws: (1) with P2', P3' and holders at w, no holder is contingent at w, and with excluded middle every holder is concrete, exists at w and is NECESSARY_2 at w; (2) adding a common root of the selected relation, every holder is that root or a NECESSARY_2 actual concretum directly grounded by it; (3) with NAR, every holder is the common root. Models: theist nonvacuity of arguments 1-5; the necessary-through-another holder (a two-way giver satisfying the creator reading and factive giving; NAR fails; the common GOD_4 root with intellect and at most one root both hold; every holder conclusion fails); omissions of holders at w, P2' and P3'; two necessary underived holders (at most one root and the common root fail); a root holder beside a holder grounded by it (at most one root holds, at most one holder fails); omissions of at most one holder, the rational-power bridge, the GOD_4 bridge and the willed holder (the chance rival of #1941)."
definitions = ["38b92bb6-33ae-5817-85c6-b5a1afa63bd1", "DEF-KANT-MODAL-CONTINGENCY", "c57e2682-08e6-527e-950f-0fa0a7ff11ef", "a1b2e330-388f-4120-bc5c-969642317792", "1620ba7e-edb9-56c4-bd02-3ece55903b1c", "bf7eddca-8291-4744-8470-379babcd7781", "88f9f6e8-997b-5f7d-afa1-c501954c3807", "88bc0655-9dd0-5879-ba1b-3fca9f86c1f4", "7c64b499-6dba-5e03-bdf3-5acea95d8836", "de24ce2e-84e4-48d8-9cac-5f66ad532015", "b8061228-9131-40f2-83bd-cb7d719bd0a0"]
disambiguations = ["83264cf5-01fe-52fc-9a00-eeb024f6496e", "e5417243-d6f3-4776-9694-40d85bb34ff4", "8b3d47bc-7fee-4936-99ad-6561aedc657a", "DISAMB-KANT-CONTINGENCY"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "Holders of the joint-absence power are actual roots, from initiator presence and NAR"
label = "Holders of the joint-absence power are actual roots, from P2', P3', presence and NAR"
theorem = "holdersAreActualRoots"
axioms = []
premises = ["ee4ab504-c8fe-59bc-bc96-7cbeefed6410", "906f5c39-2a63-4dc2-955d-a00cfd8a976b", "a6906cab-59c4-4938-b6d1-991369e8ffb0", "Whatever has power for the actual contingents' joint absence exists at w", "Every NECESSARY_2 actual concretum is an actual root of the selected grounding relation"]
conclusion = "Whatever has power for the actual contingents' joint absence is an actual root"
rule = "A holder is never absent from an accessible world, else it would be contingent while present at a world lacking every actual contingent; a necessary actual concretum is a root"
meaning = "Let y hold the power. By P3' it is concrete; by the existence premise it exists at w. For an accessible v, by excluded middle y exists at v or not; if not, y is contingent at w, but P2' puts y at an accessible world where every concrete being contingent at w is absent, a contradiction. So y is NECESSARY_2 at w, and NAR makes it an actual root of G at w."
description = "Argument 1, the first half of the holder-root identification (#1897 gap 2). Not a transcription: the necessity of every holder is derived from P2' and P3' (law 1; #1897 derived it only for some holder). NAR carries exactly the step from necessity to underivedness: its omission model is a necessary holder grounded by the root (the shape of Avicenna's necessary through another). NAR is used in its general form over all actual concreta rather than restricted to holders: with law 1, the holder-restricted form would make this argument nearly a transcription. Establishes no premise. Omission models: without existence at w, without P2', without P3', without NAR."

[[argument]]
id = "Holders of the joint-absence power have intellect, from the common GOD_4 root with intellect"
label = "Holders of the joint-absence power HAS_INTELLECT_1, from the common GOD_4 root"
theorem = "holdersHaveIntellectFromCommonRoot"
axioms = []
premises = ["Whatever has power for the actual contingents' joint absence is an actual root", "0c27f65a-6a6b-438a-b96c-b2bab9f21ac3"]
conclusion = "813a9181-8cce-45a0-a3f1-ad8cd2b281c6"
rule = "A root that the common root does not ground is the common root"
meaning = "0c27f65a gives one actual root n of G at w that directly grounds every other actual concretum and has HAS_INTELLECT_1. A holder y is an actual root (argument 1's conclusion), so it is an actual concretum; the reach clause gives y = n or a G-ground from n to y, and a root has no actual concrete ground. So y = n and y has intellect. Constructive."
description = "Argument 2, the second half of the identification, with uniqueness from the common root's reach (uniqueness through a common upstream). It derives #1941's open premise 813a9181 from the existing governor route's endpoint 0c27f65a. Not a transcription. Establishes no premise. The holder's intellect is the root's: this adds no warrant for intellect at the root, and the chance rival must now deny 0c27f65a's intellect or reach, or argument 1's premises (note section 6). Omission models: without argument 1's conclusion (the necessary-through-another holder), without 0c27f65a (two roots)."

[[argument]]
id = "Holders of the joint-absence power are GOD_4, from the common GOD_4 root"
theorem = "holdersAreGodFromCommonRoot"
axioms = []
premises = ["Whatever has power for the actual contingents' joint absence is an actual root", "0c27f65a-6a6b-438a-b96c-b2bab9f21ac3"]
conclusion = "Whatever has power for the actual contingents' joint absence is GOD_4"
rule = "A root that the common root does not ground is the common root"
meaning = "As argument 2: every holder is the common root n of 0c27f65a, which is GOD_4 under its retained naming premise. Constructive."
description = "Argument 3: the converse of the GOD_4 bridge 0050b6ed (every GOD_4 holds the power), so that with 0050b6ed the holders at w are exactly the GOD_4s that exist at w. Not a transcription. Establishes no premise. Same omission models as argument 2."

[[argument]]
id = "At most one holder of the joint-absence power, from at most one actual root"
theorem = "atMostOneHolderFromAtMostOneRoot"
axioms = []
premises = ["Whatever has power for the actual contingents' joint absence is an actual root", "49fdec01-cb92-48cf-90c5-9de7761121f2"]
conclusion = "At most one being has power for the actual contingents' joint absence"
rule = "Two holders are two actual roots of one relation at one world"
meaning = "Two holders y and z are actual roots of G at w (argument 1's conclusion); at most one actual root (49fdec01) makes them the same. Constructive; a two-step composition of universally quantified premises."
description = "Argument 4: the holder-uniqueness interface fed by the De ente at-most-one-root route (c056ad5c), whose only uniqueness-bearing premise is a576300f (at most one actual being has esse identical with essence; De ente's no-multiplication inventory). A different uniqueness source from argument 2's common-root reach. Not a transcription in the sense of invariant 16: neither premise's consequent is the conclusion with its antecedent supplied; it is a composition. It instantiates 49fdec01's profile concrete predicate (its label reads CONCRETE_6, esse in re) with the holder premises' concrete predicate (P3' a6906cab, a selected world-independent concreteness predicate); that sense identification is owed, not established (note, gap 3). Establishes no premise. Omission models: without argument 1's conclusion (a root holder beside a necessary holder grounded by it), without 49fdec01 (two roots)."

[[argument]]
id = "GOD_4 HAS_WILL_1, from the willed holder and at most one holder"
label = "GOD_4 HAS_WILL_1, from the willed joint-absence holder and at most one holder"
theorem = "godHasWillFromWilledHolder"
axioms = []
sense_bridges = [{term = "WILL_CAPACITY_VERSUS_WILLED_GIVING", from = "WILL_CAPACITY_VERSUS_WILLED_GIVING_2", to = "WILL_CAPACITY_VERSUS_WILLED_GIVING_1", statement_id = "65e0179f-55d4-4b77-98ba-4b5b26f2d404", role = "premise"}, {term = "POWER_FOR_VERSUS_ACTIVE_POWER", from = "POWER_FOR_VERSUS_ACTIVE_POWER_1", to = "POWER_FOR_VERSUS_ACTIVE_POWER_2", statement_id = "fdd2b1cf-503b-4241-aaa1-2e4a06db5723", role = "premise"}]
premises = ["fdd2b1cf-503b-4241-aaa1-2e4a06db5723", "0050b6ed-3c7d-4d6a-b97a-417837d76184", "At most one being has power for the actual contingents' joint absence", "65e0179f-55d4-4b77-98ba-4b5b26f2d404"]
conclusion = "66aecdd7-ea4e-55c6-9377-10db08893854"
rule = "Each GOD_4 holds the power; the one holder gives by a rational power; a rational power is will"
meaning = "Let g be GOD_4. By 0050b6ed g holds the power. fdd2b1cf gives a holder y that gives some x being at w by a rational power p; by 65e0179f y has will (HAS_WILL_1). At most one holder makes g = y. Constructive."
description = "Argument 5: a root consumer for #1941's argument B (conclusion fdd2b1cf), through STMT-GOD-HAS-WILL. Not a transcription. Establishes no premise. It shares the will-specific premise 090be689 (will follows intellect, through argument A) with 571e36f0 and 13338e9c, so it adds no independent support for the will-follows-intellect step. Its intellect input is the governor endpoint 0c27f65a (through argument 2 and 813a9181), not 29818edd: 0c27f65a is a one-witness endpoint, and with 0050b6ed and at most one holder, its premises jointly imply that every GOD_4 has that witness's intellect. It is an alternative intellect bundle, not a re-presentation of 571e36f0. It also says that the GOD_4 whose will 66aecdd7 asserts is the being whose giving of the actual contingents is willed rather than CHANCE_3 (one power). Sense bridges: fdd2b1cf's exercise-level willed giving (WILL_CAPACITY_VERSUS_WILLED_GIVING_2) passes to HAS_WILL_1 only through 65e0179f; the holder's PowerFor (POWER_FOR_VERSUS_ACTIVE_POWER_1) is joined to the active rational power (POWER_FOR_VERSUS_ACTIVE_POWER_2) only by fdd2b1cf itself, which asserts that one being has both. Omission models: without at most one holder (a willed non-GOD_4 holder beside a will-less GOD_4 holder), without 65e0179f, without 0050b6ed, without fdd2b1cf (#1941's chance rival)."

