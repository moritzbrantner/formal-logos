[[argument]]
id = "c6539b44-f844-4c50-ac42-9dcf7ecc4960"
label = "The fixed recipient’s unlocated root is a NECESSARY_2 CONCRETE_6 witness"
theorem = "necessaryConcreteOfUnlocatedFork"
strong_version_needed = { "ee4ab504-c8fe-59bc-bc96-7cbeefed6410" = "The proof applies excluded middle to propositions outside LocalLogic's scope, e.g. `m.ontic.ExistsAt v x` (in contingentRootOfNonnecessary); `∃ v, m.ontic.frame.access w v ∧ ¬m.ontic.ExistsAt v x` (in contingentRootOfNonnecessary). LocalLogic (ca432e24) decides only whether an actual bearer is identical with a GOD_4 candidate, and gives double-negation elimination for that candidate's esse–essence identity." }
premises = ["STMT-SELECTED-ACTUAL-CONCRETE", "d4b138f2-d5c9-4b35-bc5a-dbf3aa7617e8", "018456e8-cd2e-46e1-9c13-fa06e6f4dde9", "STMT-EVERY-CONTINGENT-GROUNDED-AT", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410"]
conclusion = "STMT-NECESSARY-CONCRETE-AT"
rule = "Select a root at the fixed recipient, then exclude contingency by the selected-world grounding premise"
meaning = "The selected bearer x is actual and CONCRETE_6 by an explicit premise. The fork and recipient-local denial of an injective regress use that same x and give an actual concrete root upstream of x. Excluded middle and the existing nonnecessity-to-contingency result turn any failure of the root's de re necessity into an actual contingent root. Such a root contradicts the existing contingent-grounding premise on the same Profile and world. The root itself witnesses concrete necessity at w and its accessible worlds. Unlocatedness is a property of the recovered witness in the supplied spacetime frame and is unused in the modal step. Regress denial is local to the selected recipient. The proof requires neither global well-foundedness nor an identification of grounding with causal or spatial relations."
disambiguations = ["83264cf5-01fe-52fc-9a00-eeb024f6496e"]
sense_bridges = [
  { term = "NECESSARY", from = "NECESSARY_11", to = "NECESSARY_2", role = "conclusion", statement_id = "STMT-NECESSARY-CONCRETE-AT" },
]
axioms = []

[[statement]]
id = "Recipient-local fork conditions can hold with no CONCRETE_6 existent"
lean = "EmptyPopulationOmission"
paraphrase = "There is a one-world, one-candidate profile and a spatial frame in which the sole candidate fails selected-world actual concreteness. The local fork and local regress denial hold vacuously for every actual concrete recipient, and every actual contingent concretum has an actual concrete ground vacuously. The profile has no necessary concrete witness. This checks the population omission for universally quantified recipient-local predicates. It supplies no actual recipient and requires no principle of excluded middle."
definitions = ["beb654a7-e204-5f4c-a7b4-45e886ba7109", "a1b2e330-388f-4120-bc5c-969642317792", "e9e031af-665e-5888-9328-f7637b5a2677", "38b92bb6-33ae-5817-85c6-b5a1afa63bd1"]

