[[statement]]
id = "Every world violating no ESSENCE_5 truth is possible"
lean = "EssenceGroundedWorldPossibility"
definitions = ["7cf63236-9c12-41bc-bf20-6fbce7a121db", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["DISAMB-ESSENCE", "DISAMB-NECESSARY"]
paraphrase = "OPEN, analyst formulation, attribution deferred: world-level essence-grounded possibility. Every world v of the frame at which every ESSENCE_5 truth of every being holds (every φ such that it lies in the nature of some being that φ) is accessible from w. Whatever no nature excludes is possible. It is the world-level counterpart of the existing EssentialExclusionAccount (for the absence of one being) and an instance of the Finean view that essences are the source of necessity (navigation only). Lane E's EM (f6f956a1, #2174) is a different-grain counterpart over ESSENCE_6 profile conditions; no ESSENCE_5/ESSENCE_6 bridge is asserted. Powers-based accounts deny it (possibility needs a power, so a world no nature excludes can still be impossible). Humean recombination does not deny it (it gives at least as many possibilities). Modal primitivism denies only that possibility is grounded in essences, not necessarily this extension."

[[statement]]
id = "Every ESSENCE_5 truth holds at the actual world"
lean = "EssentialTruthsHoldAt"
definitions = ["7cf63236-9c12-41bc-bf20-6fbce7a121db"]
disambiguations = ["DISAMB-ESSENCE"]
paraphrase = "OPEN, analyst formulation, attribution deferred: factivity of ESSENCE_5 at the actual world. For every being x and world-proposition φ, if it lies in the nature of x that φ, then φ holds at w. What lies in a nature is true. It follows from 'essence grounds necessity' (EssenceGroundsNecessity) on a frame reflexive at w."

[[statement]]
id = "6a3db88a-98b9-4103-9d66-25ca03e34570"
label = "The MIRROR_2 image of the actual world satisfies every ESSENCE_5 truth the actual world does"
lean = "EssentialTruthsPreservedByCPTAt"
definitions = ["7cf63236-9c12-41bc-bf20-6fbce7a121db", "7147bcb5-56be-414e-8079-46db23329fd9"]
disambiguations = ["DISAMB-ESSENCE", "dec35f6f-156a-489e-a542-7681a8ab2530"]
paraphrase = "OPEN, analyst formulation, attribution deferred: orientation-free natures under CPT conjugation (MIRROR_2), at w only. For every being x and world-proposition φ, if it lies in the nature of x that φ and φ holds at w, then φ holds at the CPT image τ.image w. No nature contains a condition that the actual arrangement meets and its CPT image violates. Under essence grounding necessity at w, world-level essence-grounded possibility and factivity it is equivalent to the accessibility of the CPT image (Lean-only pres_iff_mirrorPossible at τ.image, certificate clause 9), so its warrant is exactly the warrant for 'the CPT-mirror world is possible'. Local Lorentz-invariant quantum field theory is invariant under CPT (physics background, navigation only), so creaturely law-natures give no violation. The MIRROR_1 counterpart (spatial reflection P) is not recorded as a statement and no argument uses it: on dispositional essentialism it is doubtful, since the weak interaction is not reflection-invariant and the P-image violates law-grounding natures of creaturely kinds (option 1 at a creature). A nature containing a primitive orientation, or an essential truth about which of two incongruent counterparts is realized, denies it. It says nothing about natures at other worlds."

[[statement]]
id = "314f6b15-5743-4894-8b4f-b8fe3e692022"
label = "The MIRROR_2 image of the actual world has the opposite handedness"
lean = "HandednessReversedByCPTAt"
definitions = ["3fc924f3-6226-41ae-8032-f63ea44f27a9", "7147bcb5-56be-414e-8079-46db23329fd9"]
disambiguations = ["dec35f6f-156a-489e-a542-7681a8ab2530"]
paraphrase = "OPEN, analyst formulation, attribution deferred: the feature H (global spatial handedness) holds at the CPT image τ.image w (MIRROR_2) exactly when it fails at w. The CPT image is a different arrangement. CPT conjugation reverses spatial handedness (as spatial reflection P also does). A relationalist about orientation who identifies a world with its CPT image (τ.image w = w) denies it; so does anyone for whom global handedness is no feature of a world."

[[statement]]
id = "The relation-of-reason account: cost, real decrees under N, and a joint model"
lean = "RelationOfReasonCertificate"
definitions = ["5e66f74d-c34f-4aee-ae29-2a5b698294fd", "3aba5f19-f48d-50db-bc57-93ba2e99f845", "65e38ffa-5a1c-55d0-935c-6538d843b780", "88f7c656-f484-4737-a872-b2d78c604322"]
disambiguations = ["DISAMB-NECESSARY"]
paraphrase = "Analyst certificate, attribution deferred. (1) On the relation-of-reason account (an invariant intrinsic profile, a real determination carrying the act, the act's actual terminus the effect, every terminus existing, the effect CONTINGENT_1), the act is performed at every accessible world and does not strictly suffice for the effect; no fact intrinsic to the source discriminates the effect's presence from its absence; the act's terminus discriminates it and is not intrinsic to the source. Facts that are neither intrinsic nor the terminus are not ranged over. (2) For a real, exclusive decree family under N at one bearer (no accessible world gives it a determination it lacks), every decree of that family it has at an accessible world is its actual decree; if that decree suffices for a contingent effect, some accessible world lacks the effect and has no decree of the family. A different decree of the family is excluded; extra effects under the same decree are not. (3) On one finite carrier the account holds together with RootPurity, a30c5963, N at the root, 0c8631bd, both directions of member grounding (by definition of the carrier's admissibility), the existential PSR for contingents (through the stipulated reason relation only), some actual contingent concrete being, the failure of actual collapse and #555's IX.6/IsImmutable/ModalCapacity readings at the actual world, with creature potency restored: the effect is in potency to the impure limiter. A structural surrogate only; nothing in the account mentions intellect."

[[statement]]
id = "The mirror fork for a necessitarian and the contrast gap of every invariant source"
lean = "MirrorForkCertificate"
definitions = ["3fc924f3-6226-41ae-8032-f63ea44f27a9", "7cf63236-9c12-41bc-bf20-6fbce7a121db", "f9a77a01-4dcf-5a1d-9bf7-a45a466ce504", "3aba5f19-f48d-50db-bc57-93ba2e99f845", "65e38ffa-5a1c-55d0-935c-6538d843b780"]
disambiguations = ["DISAMB-ESSENCE", "DISAMB-NECESSARY"]
paraphrase = "Analyst certificate, attribution deferred. (1) Collapse with essence-grounded possibility, restated: under actual modal collapse and world-level essence-grounded possibility every world violating no ESSENCE_5 truth is the actual world; a necessitarian holding both already asserts this. (2) Under collapse, that possibility principle, factivity and reversed handedness, some essential truth holds at the actual world and fails at its mirror image. (3) Under collapse, factivity, preservation by the mirror and reversed handedness, the mirror image violates no essential truth and is not accessible. (4) Under collapse, the possibility principle, factivity and preservation, the mirror image is the actual world, so the mirror reverses no feature. (5) A rule that singles out the actual world among the worlds violating no essential truth, where the mirror image violates none and handedness is reversed, holds at the actual world and fails at its mirror image. (6) If a source's real determinations are invariant over accessible worlds and the mirror image is accessible, no fact intrinsic to the source discriminates any explanandum true at the actual world and false at its mirror image (clause 1 of the relation-of-reason certificate with a general explanandum). (7) Under a30c5963, RootPurity, the sufficiency direction of member grounding and 0c8631bd, two exclusive orientation tokens (real determinations) on a par in purity are had by no actual root. (8) If every actual concrete being is NECESSARY_2 and some actual concrete being exists at the mirror image only if that image has the actual handedness, then with factivity, preservation and reversed handedness, world-level essence-grounded possibility fails. (9) Under essence grounding necessity at w, essence-grounded possibility and factivity, preservation holds exactly when the mirror image is accessible. (10) With clause 7's premises and the open bridge that an orientation in the ESSENCE_5 nature of any being (roots included) is carried by an orientation token it really has, no ESSENCE_5 truth of an actual root holds at the actual world and fails at its mirror image."

[[statement]]
id = "Some actual concrete being is at the MIRROR_2 image only if that image has the actual handedness"
lean = "ChiralAtCPTImageAt"
definitions = ["3fc924f3-6226-41ae-8032-f63ea44f27a9", "7147bcb5-56be-414e-8079-46db23329fd9", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
disambiguations = ["dec35f6f-156a-489e-a542-7681a8ab2530"]
paraphrase = "OPEN, analyst formulation, attribution deferred: an individual excluded from the CPT image, stated in chiral form and local to that image (MIRROR_2). Some concrete being x exists at w, and if x exists at the CPT image τ.image w then H (global handedness) has the same value there as at w. It says nothing about any other world. Given reversed handedness at the CPT image it is equivalent to x's absence from that image, and that absence implies it. Example: an actual molecule, if being of its chemical kind is essential to it and its only candidate at the CPT image is its CPT counterpart, which is made of antimatter. Under sortal essentialism charge conjugation alone already changes the kind (an antimatter molecule is not of the actual molecule's chemical kind), so the example supports the absence, hence this premise, for achiral material beings as well; for a chiral molecule the reversed handedness of the counterpart is a second, unneeded kind change. So the warrant for this premise does not lie in chirality or in the reversal premise 314f6b15, though the premise is stated in the chiral form the proof uses. The example does not support the global form 'x exists only at worlds with the actual handedness', which is not used. A haecceitist who holds that the same molecule exists at the CPT image, mirrored and as antimatter, denies it; that is a higher price than identity across a mere reflection."

[[argument]]
id = "Some actual concrete being is contingent, from essence-grounded possibility and a chiral individual"
label = "A CONTINGENT_1 CONCRETE_AND_ABSTRACT_6 being, from the MIRROR_2 mirror image"
theorem = "contingentFromChiralMirror"
comparator_theorems = ["mirrorControls"]
premises = ["Every world violating no ESSENCE_5 truth is possible", "Every ESSENCE_5 truth holds at the actual world", "6a3db88a-98b9-4103-9d66-25ca03e34570", "314f6b15-5743-4894-8b4f-b8fe3e692022", "Some actual concrete being is at the MIRROR_2 image only if that image has the actual handedness"]
senses = {MIRROR = "MIRROR_2"}
conclusion = "c94b5446-e7e7-5b36-9bed-288959725526"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Factivity and preservation put the CPT image among the worlds no essence excludes; essence-grounded possibility makes it accessible; reversed handedness there excludes the chiral individual from it, which is therefore absent at an accessible world"
meaning = "The mirror is taken in sense MIRROR_2 (CPT conjugation, Lean type CPTConjugation; term_senses MIRROR = MIRROR_2); MIRROR_1 (spatial reflection P) is a distinct type no premise uses. The CPT image τ.image w satisfies every essential truth (the actual world does, and the CPT map preserves those it satisfies), so it is accessible from w. Handedness at τ.image w is the opposite of handedness at w. The individual x exists at w and exists at τ.image w only if handedness there is w's, so x is absent at τ.image w: some actual concrete being is CONTINGENT_1 at w. The chirality premise is local to the CPT image; the earlier global form (x exists only at worlds sharing w's handedness) was stronger than the molecular example supports and is not used. The main theorem uses no axioms. The load is a possibility premise: under essence grounding necessity at w (the source of factivity), essence-grounded possibility and factivity, preservation is equivalent to the accessibility of the mirror image (Lean-only pres_iff_mirrorPossible), so the warrant for preservation is exactly the warrant for 'the mirror world is possible'. A concrete necessitarian who grounds possibility in essences must deny one of the five premises: a nature containing orientation, no distinct mirror image, a brute impossibility not excluded by any nature, an actual world violating an essential truth, or that any actual concrete being is excluded from the CPT image (haecceitism about mirrored individuals, here identity across reflection and charge conjugation, so existence as antimatter). The warrant for that exclusion, under sortal essentialism, is the kind change by charge conjugation, which applies to achiral material beings too; chirality is the premise's formal shape, not its warrant. The Comparator companion mirrorControls (propext only) gives a positive row and, for each premise, a row where it alone fails, the other four hold and the conclusion fails. Rows 6-10 drop one premise and keep the conclusion; rows 6 and 9 do so only on frames where essence does not ground necessity, so they do not show that preservation carries less than the mirror's possibility. In the MIRROR_1 sense (plain reflection P), preservation would be doubtful on dispositional essentialism (the weak interaction is not reflection-invariant: option 1 at creaturely natures); this is why the argument is registered for MIRROR_2 only. The generic Lean-only contingentFromMirrorImage holds for any world map. The argument applies equally to a personal necessitarian and an impersonal one. Structural assignments only; the Lean-only notCollapsedFromMirror gives the full-collapse form (185ce448) from the first four premises alone."
description = "Conditional support option for c94b5446. Not a transcription. Establishes no premise. Its warrant is the same kind as the direct modal-intuition support for c94b5446 (a judgment that a world is possible), here for the CPT-mirror world, plus the symmetry consideration that the mirror image violates no nature the actual world satisfies; it is not independent of modal intuition. The contested load sits on world-level essence-grounded possibility (which powers theorists reject), on orientation-free natures under CPT (equivalently, under essence grounding necessity, the CPT-mirror world's possibility) and on the absence of an actual concrete being from the CPT image (warranted, under sortal essentialism, by the kind change charge conjugation makes)."

[[argument]]
id = "Relation-of-reason certificate"
label = "Relation-of-reason account: cost, decrees under N, joint model"
theorem = "relationOfReason"
premises = []
conclusion = "The relation-of-reason account: cost, real decrees under N, and a joint model"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Invariance makes every intrinsic fact constant over accessible worlds; N and exclusivity return any decree at an accessible world to the actual one; finite check"
meaning = "Clause 1 is proved from the account alone: invariance and the carrier determination give the act at every accessible world; #555's rigid core then excludes strict efficacy; an intrinsic fact is constant over the accessible worlds, so it cannot fail at the world lacking the effect; terminus soundness makes the terminus discriminate the effect, and the same world shows it is not intrinsic. So the account keeps contingency and foundation and pays #555's price at the intrinsic level (no strictly sufficient, contrast-relevant intrinsic reason); no intrinsic fact carries the contrast and the terminus, an extrinsic fact, does; on this lane's interpretation (certified by no type) the terminus's variation has no discriminating intrinsic reason, #555's 'relocated' pattern. Clause 2: N at the bearer sends a decree of the family had at an accessible world to w, where exclusivity identifies it with the actual decree; so a real decree excludes a different decree of the family at any alternative (not extra effects under the same decree), the effect's absence needs a world with no decree of the family, and with such a decree at every accessible world the effect is not contingent. Clause 3 is a finite check on one carrier (rr…): the relation-of-reason account with the classical profile premises and a contingent effect. At the root the IX.6 reading with IsImmutable forces ability to be act (Lean-only rootAbilityForced), so that reading is intended; creature potency is restored (the effect is in potency to the impure limiter). The existential PSR holds only through the stipulated reason relation rrExplains, with none of the BX bridges. Nothing in clauses 1-2 mentions intellect, so at the level of the formal account the same price falls on an impersonal permissive propensity whose chance outcome is the terminus; lane P (#2177, causal-perfection-transfer.md, 'The burden is not symmetric') holds that the personal side bears an extra commitment the propensity does not, that its selection is its own free willing and yet not a real determination of it ('That extra commitment falls on the personal side only'); this lane's assessment, not lane P's, is that the commitment is descriptive and that no warrant has been given for counting it as a defect. Structural surrogates only."
description = "Certificate, placed diagnostic. Establishes no premise. It answers whether the personal case's own profile premises force modal collapse: on the stated carrier they do not, given the relation-of-reason account; collapse needs a further premise (strict sufficiency of the intrinsic act, a real decree at every accessible world under N, or a necessitating PSR)."

[[argument]]
id = "Mirror fork certificate"
label = "Mirror fork for necessitarians; contrast gap of invariant sources"
theorem = "mirrorFork"
premises = []
conclusion = "The mirror fork for a necessitarian and the contrast gap of every invariant source"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Collapse with essence-grounded possibility identifies every unexcluded world with the actual one; case analysis on which premise of the mirror argument fails"
meaning = "Clause 1 restates collapse with essence-grounded possibility (one term from the two; it records no further cost). Clauses 2-4 locate the necessitarian's exit: with reversal and the possibility principle, some essential truth separates w from σ w (a nature containing orientation, option 1); with preservation but without the possibility principle, σ w is unexcluded and impossible (brute, option 3); with the possibility principle and preservation, σ w = w and no feature is reversed (no distinct mirror image, option 2). Clause 5: a necessitating rule that singles out w is itself not mirror-invariant at w. Clause 6 is the relation-of-reason certificate's clause 1 with a general explanandum: for every source whose real determinations are invariant over accessible worlds no intrinsic fact discriminates this handedness from the other. Clause 7: an orientation token (a real determination) with an equally pure alternative is excluded at an actual root by the requirement-form purity premises (the handedness instance of lane P's mechanism, proved from the declarations on main); parity in purity is assumed. Clause 9: under essence grounding necessity, possibility and factivity, preservation is the mirror image's accessibility. Clause 10: option 1 at a root (an orientation in the root's ESSENCE_5 nature) is excluded only through the open carriage bridge from ESSENCE_5 truths to orientation tokens; without it clause 7 says nothing about a root's nature. With σ the plain reflection P, option 1 is available at creaturely natures on dispositional essentialism (the weak interaction is not reflection-invariant); with σ read as CPT conjugation it is not. The certificate does not favour personal over impersonal accounts; it presses necessitarian accounts of either kind and any claim that an invariant source's intrinsic profile explains the contrast."
description = "Certificate, placed diagnostic for c94b5446. Establishes no premise."

