[[statement]]
id = "Relative limitation ascent forces cross reception of self limited possessors"
label = "Relative limitation ascent forces reception between self-limited possessors"
lean = "RelativeStepAudit"
paraphrase = "Closed conditional audit: for any same actuality, received-in, limited-by and comparative dictionary, the old recipient-relative unlimited-possession principle, limitation-implies-reception bridge, comparison asymmetry and explicit excluded middle force ReceivedIn a r b or ReceivedIn b r a whenever a and b are actual and each self-limited in r. A second conjunct applies the same inference to the explicit esse recipient dictionary ReceivedIn a () b := Received a (essenceOf b), with own-essence reception: every two actual self-limited bearers then have equal represented essences. Neither conjunct asserts those premises or an actual nonreceiving pair, does not refute the premises, and is not a new reception or causal relation. It identifies a concrete coverage consequence to test for the intended role-based reception interpretation."
definitions = ["245797e9-e5e9-5296-8d34-2138cc6b7ae6", "cf4875cb-6baf-5bf5-8590-84a21777c66c", "5766de66-8a37-5b04-aa65-9eec53319f50", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168", "183b48d2-1753-583d-aef9-4199cff86231", "4433942e-aaf6-55a9-b777-66e55638103d"]

[[argument]]
id = "Test the cross-reception consequence of recipient-relative ascent"
theorem = "crossReception"
premises = []
conclusion = "Relative limitation ascent forces cross reception of self limited possessors"
axioms = []
rule = "If neither possession were received in the other, the relative step would make each strictly exceed the other"
meaning = "The old relative principle and limitation-to-reception bridge, with asymmetric MoreIn and explicit excluded middle, rule out two actual self-limited possessors neither received in the other. If neither receipt held, each possessor would be free from the other's limit, producing opposite MoreIn comparisons. This theorem is not another arbitrary countermodel and provides no empirical or metaphysical counterexample. It isolates the cross-reception burden of combining role-based reception with the old comparative law. The second conjunct instantiates recipient roles by the recipient essence, and own-essence reception turns the forced cross receipt into equality of receiving essences. This identifies the exact application burden for plural received natures; no new receiver dictionary is silently imposed on the old principle. The source-scoped alternative derives absolute nonlimitation instead and does not require either coverage consequence. All four background principles are explicit internal hypotheses; no root premise is discharged."
