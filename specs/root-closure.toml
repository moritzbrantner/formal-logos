[[statement]]
id = "No actual root could have a determination it lacks"
lean = "RootAbsencesNecessary"
definitions = ["52352824-6be9-53c6-83d4-82fed9a08cbb", "3aba5f19-f48d-50db-bc57-93ba2e99f845"]
paraphrase = "OPEN, analyst formulation, attribution deferred: for every actual concrete root r of the selected grounding relation at w, every world v accessible from w and every determination d, if r really has d at v then r really has d at w. The root's absences are necessary: it could not have had a determination it actually lacks. It says nothing about why they are necessary. A root whose profile is contingent (as on a Humean recombination account) denies it."

[[statement]]
id = "Whatever no ESSENCE_6 condition excludes is possible for an actual root"
lean = "EssenceGroundedRootProfileModality"
definitions = ["52352824-6be9-53c6-83d4-82fed9a08cbb", "3aba5f19-f48d-50db-bc57-93ba2e99f845", "8e1ba83c-04e3-4bd3-8e25-e0c532a703a6"]
disambiguations = ["DISAMB-ESSENCE"]
paraphrase = "OPEN, analyst formulation, attribution deferred: essence-grounded modality for root profiles. For every actual concrete root r at w and every set q of determinations, if q satisfies every ESSENCE_6 condition on r's profile (every condition C such that it lies in the nature of some being that r's profile satisfies C), then at some world accessible from w r really has every member of q. Whatever no nature excludes is possible for the root, so a necessary profile fact needs an essential condition excluding its contrary. It is the profile counterpart of the essentialist account of possibility (EssentialExclusionAccount) and an instance of the Finean 'necessitarian actualist' view that essences are the source of necessity (navigation only). Powers-based accounts (possibility needs a power), Humean recombination and modal primitivism deny it in different ways."

[[statement]]
id = "Every ESSENCE_6 condition on a root's profile holds at its admissible extensions"
lean = "RootEssentialConditionsPositive"
definitions = ["52352824-6be9-53c6-83d4-82fed9a08cbb", "3aba5f19-f48d-50db-bc57-93ba2e99f845", "3f8e5e3c-e85a-4388-af9c-4da1c8a02069", "8e1ba83c-04e3-4bd3-8e25-e0c532a703a6"]
disambiguations = ["DISAMB-ESSENCE"]
paraphrase = "OPEN, analyst formulation, attribution deferred: for every actual concrete root r at w, every ESSENCE_6 condition on r's profile holds of every admissible intrinsic profile that contains all of r's real determinations at w. Natures constrain a root's profile only through the admissibility constraints and the presence of its determinations; no essential condition is a negative clause that cuts off an admissible extension. Under N, EM and factivity of essential conditions it is equivalent to 'no actual root has an unexplained absence' (positivityOfNoUnexplainedAbsence), so it relocates that premise into essence form."

[[statement]]
id = "682e6436-a44f-40d6-bc02-7cb5f4a2b754"
label = "ESSENCE_6 exclusions at a root are carried by what its determinations require"
lean = "RootEssentialConditionsCarried"
definitions = ["52352824-6be9-53c6-83d4-82fed9a08cbb", "3aba5f19-f48d-50db-bc57-93ba2e99f845", "3f8e5e3c-e85a-4388-af9c-4da1c8a02069", "8e1ba83c-04e3-4bd3-8e25-e0c532a703a6", "88f7c656-f484-4737-a872-b2d78c604322"]
disambiguations = ["DISAMB-ESSENCE"]
paraphrase = "OPEN, analyst formulation, attribution deferred: essential exclusions at a root are carried by its determinations. For every actual concrete root r at w, every ESSENCE_6 condition on r's profile holds of every admissible intrinsic profile q that contains all of r's real determinations and in which no real determination of r requires the lack of some members of q. Equivalently (classically), such a condition can fail at an admissible extension only where some determination of r requires a lack within it. A closure determination ('being such as to have nothing beyond these') counts as a carrier; a negative clause in a nature that no determination carries does not. It is weaker than positivity of root essences, which drops the requirement hypothesis."

[[argument]]
id = "No unexplained absence at roots, from essence-grounded modality and positive root essences"
label = "No unexplained absence at roots, from essence-grounded modality and positive ESSENCE_6"
theorem = "noUnexplainedAbsenceFromPositiveEssence"
strong_version_needed = { "Every ESSENCE_6 condition on a root's profile holds at its admissible extensions" = "The weaker carriage premise gives an essential condition only at extensions in which no root determination requires a lack; with N and EM alone it does not exclude an unexplained absence (row 3 of carriageControls has a carried clause cutting off an admissible extension). It suffices together with the necessity direction of member grounding, which is the separate registered route positiveEssenceFromCarriage." }
comparator_theorems = ["essenceControls"]
premises = ["No actual root could have a determination it lacks", "Whatever no ESSENCE_6 condition excludes is possible for an actual root", "Every ESSENCE_6 condition on a root's profile holds at its admissible extensions"]
conclusion = "9281317d-1f0a-4522-b91c-58cc07652e92"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Positivity puts every essential condition at the admissible extension; essence-grounded modality realizes it at an accessible world; necessity of the root's absences returns the missing determination to the actual world"
meaning = "Fix an actual root r at w and a determination d that r lacks while some admissible profile q contains all of r's determinations and d (an unexplained absence). Positivity makes every ESSENCE_6 condition on r's profile hold of q. Essence-grounded modality then gives a world v accessible from w at which r has every member of q, in particular d. Necessity of the root's absences gives r the determination d at w, a contradiction. So no actual root has an unexplained absence. The derivation is a relocation: under N, EM and factivity of essential conditions, positivity is equivalent to the conclusion (Lean-only positivityOfNoUnexplainedAbsence), so the argument adds the warrant of N and EM, which have support outside this dispute, and moves the contested load to positivity. The main theorem uses no axioms. The Comparator companion essenceControls (three Mathlib axioms; the #2153 carrier with the open family, the source the only actual root) gives a positive witness and, for each premise, a row where it fails, the other two hold and the conclusion fails: a contingent lack of noesis (N fails), a necessary lack that no nature grounds (EM fails), and a nature with the negative clause 'lacks noesis' (positivity fails). The rows are assignments of the stated relations, not models of essence."

[[argument]]
id = "Positive root essences, from carriage and the necessity direction of member grounding"
label = "Positive ESSENCE_6 at roots, from carriage and member grounding's necessity direction"
theorem = "positiveEssenceFromCarriage"
comparator_theorems = ["carriageControls"]
premises = ["682e6436-a44f-40d6-bc02-7cb5f4a2b754", "89c988d9-34b2-4aee-9e1a-bf4a304c032b"]
conclusion = "Every ESSENCE_6 condition on a root's profile holds at its admissible extensions"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "An admissible extension is exclusion-free, so no root determination requires a lack within it; carriage then gives every essential condition there"
meaning = "Fix an actual root r at w, an ESSENCE_6 condition C on its profile and an admissible profile q containing r's determinations. The necessity direction of member grounding makes q exclusion-free: no member of q, and so no determination of r, requires the lack of a subset of q. Carriage then gives C at q. The necessity direction is the part of member grounding (6bba8431) not used by the #2162 derivations, so this argument makes the shared rationale of E and member grounding explicit as a shared premise: both say that a root's negative facts are fixed by what its determinations require. The main theorem uses no axioms. The Comparator companion carriageControls (three Mathlib axioms; same carrier) gives a positive witness, a row where the negative clause 'lacks noesis' is carried by no determination (carriage fails, the necessity direction holds, positivity fails) and a row where the clause is carried by the pure a requiring the lack of noesis while the family still admits every pure profile (carriage holds, the necessity direction fails, positivity fails). In that row the purity of requirements (0c8631bd) also fails."

[[argument]]
id = "Carriage of root essential exclusions, from positive root essences"
label = "Carriage of ESSENCE_6 exclusions at roots, from positive ESSENCE_6 at roots"
theorem = "carriedOfPositive"
comparator_theorems = ["carriageControls"]
premises = ["Every ESSENCE_6 condition on a root's profile holds at its admissible extensions"]
conclusion = "682e6436-a44f-40d6-bc02-7cb5f4a2b754"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Drop the requirement hypothesis"
meaning = "Positivity gives every ESSENCE_6 condition on an actual root's profile at every admissible extension of that profile, so in particular at every such extension in which no root determination requires a lack. It certifies the strength order of the two premises. The main theorem uses no axioms. In the Comparator companion carriageControls, row 3 (the closure carried by the pure a, every pure profile admissible) satisfies carriage and fails positivity, so the order is strict on that assignment."
description = "Strength-order certificate: positivity of root essences implies carriage. Establishes no premise."

[[relation]]
id = "Positive root essences strengthen carriage of root essential exclusions"
label = "Positive ESSENCE_6 at roots strengthens carriage of ESSENCE_6 exclusions at roots"
subject_kind = "statement"
subject_id = "Every ESSENCE_6 condition on a root's profile holds at its admissible extensions"
predicate = "strengthens"
object_kind = "statement"
object_id = "682e6436-a44f-40d6-bc02-7cb5f4a2b754"
verification_result_id = "Carriage of root essential exclusions, from positive root essences"
