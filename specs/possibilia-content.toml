# #2145 lane H1 (horizontal, three-angles rule): do possibilities need a mind?
# At a constitutively simple root whose candidates are all non-present, a
# good-general favouring needs a stand-in that is in the root without being a real
# constituent of it (the shared demand, derived for both sides). The conceptualist
# premise about non-real being, with a content premise, then gives a root
# cognition criterion and a route to 3a32d91c that uses neither the cognition
# criterion 3b40009e nor the containment-recognition bridge d1fb6414. Analyst
# formulations, attribution deferred. See docs/notes/causal-perfection-transfer.md,
# section "Do possibilities need a mind? Conceptualism and non-real plurality at a
# simple root".

[batch]
vocab = "TruthCore.Causality.PossibiliaContent"
results = "TruthCore.Results.Causality.PossibiliaContent"

[[statement]]
id = "f4180d0c-1759-4cc5-a4ab-5e7b36c408b0"
label = "Every actual root is constitutively simple: at most one real constituent"
lean = "RootsConstitutivelySimple"
definitions = ["d6912ecb-aed2-411a-913e-0dab9106d910"]
paraphrase = "OPEN analyst reading of commitment (a) of #2145, attribution deferred: for every actual concrete root r at w, any two real constituents of r are identical, so r has at most one real constituent. A real constituent is something in r with being in reality as a part, principle, property or aspect of r, not merely an object of apprehension or a term of a relation of reason. Non-real items (objects of understanding, modes, distinctions of reason) are not counted, so the premise does not by itself deny a plurality of such items in r. The personal account and the noncognitive imitability-exemplar rival (A4) both grant it; it is the simplicity both describe as a simple nature. This sense of simple is not linked by a disambiguation to SIMPLE_4 (DEF 85f7f569, no composition of any kind) or to the #2153 encoded simplicity (no represented limiting principle); that gap is recorded for #216."

[[statement]]
id = "fce9e0a3-f0c1-43d1-b97f-495d4a7e92a0"
label = "No candidate of the favourings considered is a present input in any scenario"
lean = "NoPresentCandidates"
definitions = ["b28d7e04-694b-442b-a42b-65f39190956f"]
paraphrase = "OPEN analyst premise about the carrier, attribution deferred: for every scenario s and every candidate x, x is not a present input at s. Intended application: the candidates are a root's possible products before production, none of which exists yet (the cognition criterion's own paraphrase records that at a root before production nothing is a present input). The present-input relation of the shared signature is not indexed by the bearer, so the premise is a global property of the candidate carrier: it is appropriate where the candidates are possible effects of the root and false on a carrier that includes present inputs. It is stronger than the derivation needs (only the witnessed pair must be non-present) and makes the non-present clause of good-generality idle on this route; it is kept global because the shared signature has no bearer-indexed or pair-restricted present-input relation, and before production every candidate of a root is non-present."

[[statement]]
id = "cde7f1dd-542c-4147-ab5b-381fefccbcf6"
label = "Whatever is CONTAINED_IN_1 a bearer without being a real constituent of it is apprehended by it"
lean = "NonRealContainmentIsApprehension"
definitions = ["45d04b45-4396-4f95-87ad-a8e762bce91a", "d6912ecb-aed2-411a-913e-0dab9106d910", "c917dda9-f382-48fa-8cc1-a0b9e609c164", "07f3fb85-6036-4e42-8eb8-a18db846719f"]
disambiguations = ["4c3751a6-6b32-47f2-89c4-d094dabe5613"]
paraphrase = "OPEN conceptualist premise about non-real being, analyst formulation, attribution deferred (related to the classical dictum that beings of reason have being only in an intellect; Augustine, Leibniz and Plantinga are navigation only): for every bearer b and item e, if e is contained in b (CONTAINED_IN_1) and is not a real constituent of b, then b itself apprehends e. It is general: it mentions no favouring, value or root. It entails that a bearer that apprehends nothing contains no non-real item. It is not a consequence of the dictum: it drops the dependence modality (weaker) but indexes apprehension to the bearer that contains the item (stronger, since the dictum allows apprehension by some other intellect), and it ranges over every non-real contained item rather than over beings of reason, so the dictum reaches A4's modes only if every non-real item is a being of reason, which A4 denies. Warrant for the dictum bears at most on apprehension by some apprehender; a dictum-faithful sibling would need a root bridge that nothing other than the root can apprehend an item contained in it before production, which is not registered. Its negation says only that some bearer contains a non-real item that it does not apprehend; the item may still be apprehended by, or depend for its being on, another intellect (an intermediate denier). Mind-independence is an additional commitment of the noncognitive imitability-exemplar rival (A4: the modes of imitability of a simple nature) and of a Scotist reading (formalities distinguished a parte rei but not really). At a root before production an intermediate denier needs another intellect beside the root to apprehend or ground items in it, which in the analyst's judgment is the independent locus priced at 65805e5a (not typed; see the dictum-faithful sibling in the note). It is strictly stronger than the root cognition criterion given the other premises of its derivation, even restricted to the root route (Comparator companion rootCriterionWithoutConceptualism: a non-real contained stand-in of a non-present candidate at an actual root with a good-general favouring is unapprehended while the root criterion holds). Given those premises, the root criterion is equivalent only to a weakened existential form (Lean-only NonRealStandInYieldsApprehension: some apprehended content about some candidate, not the stand-in itself)."

[[statement]]
id = "5a3a1432-38f7-44b9-bdc6-01acc066b622"
label = "A non-real CONTAINED_IN_1 stand-in of a non-present candidate is about that candidate"
lean = "NonRealStandInIsAbout"
definitions = ["45d04b45-4396-4f95-87ad-a8e762bce91a", "fae7bbb8-931c-4a95-9f44-1d59921d1c83", "3ece6dfe-c033-4546-b7d4-94ef48a235df", "b28d7e04-694b-442b-a42b-65f39190956f", "abd8cfa4-1887-47d5-86cc-e0f6092e4ded", "c917dda9-f382-48fa-8cc1-a0b9e609c164"]
disambiguations = ["4c3751a6-6b32-47f2-89c4-d094dabe5613"]
paraphrase = "OPEN content premise, analyst formulation, attribution deferred: for every bearer b with a favouring determination of profile phi, every scenario s and candidate x not a present input at s, if b's stand-in for x is contained in b (CONTAINED_IN_1) without being a real constituent of b, then that stand-in is about x (it represents x, DEF 3ece6dfe). It is a restricted form: it concerns only non-real contained stand-ins of non-present candidates, but it ranges over every bearer and every favouring the bearer has, not only actual roots, good-general favourings or the witnessed pair, so it is not the weakest form the route needs. A template reading denies it: a mode individuates its candidate only as whatever would match it, without representing it."

[[statement]]
id = "b371638a-dd5a-4fe0-a5cd-d9b4545e0df8"
label = "Every actual root that has a good-general favouring apprehends some content"
lean = "RootGoodGeneralFavouringIsApprehension"
definitions = ["abd8cfa4-1887-47d5-86cc-e0f6092e4ded", "071b24f0-ef72-4012-8c7d-ab3be3335961", "07f3fb85-6036-4e42-8eb8-a18db846719f", "b28d7e04-694b-442b-a42b-65f39190956f", "3ece6dfe-c033-4546-b7d4-94ef48a235df"]
disambiguations = ["8430c7dc-2972-4f47-87a9-ce4676533cdf"]
paraphrase = "OPEN root cognition criterion, analyst formulation, attribution deferred: every actual concrete root r at w that has the real determination that a favouring of r is a good-general profile phi (for at least one scenario and pair of candidates, at least one not a present input, the favouring depends on betterness, read as value, with end-realization held fixed; BECAUSE_OF_GOODNESS_2) itself apprehends some content about some candidate. It is the cognition criterion 3b40009e restricted to actual roots, so the criterion strengthens it. It does not say that the apprehension governs the favouring (BECAUSE_OF_GOODNESS_3), nor that the apprehended content is a stand-in."

[[argument]]
id = "5b16ebe7-15f0-4982-9d90-1fb69893e9d7"
label = "Root cognition criterion, from simplicity and conceptualism about non-real being"
theorem = "simpleRootGoodGeneralFavouringIsApprehension"
strong_version_needed = { "ee4ab504-c8fe-59bc-bc96-7cbeefed6410" = "The proof applies excluded middle to propositions outside LocalLogic's scope, e.g. `Produces r (stand r y)` (in containedOfLoci); `Produces r (stand r x)` (in containedOfLoci). LocalLogic (ca432e24) decides only whether an actual bearer is identical with a GOD_4 candidate, and gives double-negation elimination for that candidate's esse–essence identity." }
comparator_theorems = ["possibiliaControls", "rootCriterionWithoutConceptualism"]
premises = ["ee4ab504-c8fe-59bc-bc96-7cbeefed6410", "633d5c29-a594-4c1a-b3f6-2b899a0e65ed", "3ca01752-0d5d-4140-be03-68150a17aefb", "65805e5a-818a-49a0-ae3c-eba95724500f", "69b9f887-582a-479c-924b-e7328f3930b4", "f4180d0c-1759-4cc5-a4ab-5e7b36c408b0", "fce9e0a3-f0c1-43d1-b97f-495d4a7e92a0", "cde7f1dd-542c-4147-ab5b-381fefccbcf6", "5a3a1432-38f7-44b9-bdc6-01acc066b622"]
conclusion = "b371638a-dd5a-4fe0-a5cd-d9b4545e0df8"
axioms = ["propext", "Classical.choice", "Quot.sound"]
senses = {BECAUSE_OF_GOODNESS = "BECAUSE_OF_GOODNESS_2", CONTAINED_IN = "CONTAINED_IN_1"}
disambiguations = ["8430c7dc-2972-4f47-87a9-ce4676533cdf", "4c3751a6-6b32-47f2-89c4-d094dabe5613"]
rule = "Realization and irreflexivity give two distinct stand-ins; excluded middle and the two locus bridges put both in the root, since neither candidate is present; simplicity forbids both being real constituents; the conceptualist premise makes the non-real one apprehended and the content premise makes it about its candidate"
meaning = "Let r be an actual root at w with a good-general favouring phi: at some scenario s and pair x, y, phi depends on value with end content fixed, so phi favours x over y at s. By item realization and irreflexivity the stand-ins of x and y differ (favouredIndividuated). No candidate is a present input, so by excluded middle, the own-favouring bridge and the source-of-differences bridge both stand-ins are contained in r (CONTAINED_IN_1). Roots are constitutively simple, so two distinct items are not both real constituents of r; by excluded middle one of the stand-ins is contained in r without being a real constituent (Lean-only simpleBearerHasNonRealStandIn: the shared demand, which binds the personal source and the noncognitive rival alike). The conceptualist premise makes r apprehend that stand-in, and the content premise makes it about its candidate, so r apprehends some content about some candidate. Neither the cognition criterion 3b40009e nor the containment-recognition bridge d1fb6414 is used. Against the noncognitive imitability-exemplar rival, which grants the other premises and denies every apprehension at the root, so that on the route's instances it denies both the conceptualist premise and the conclusion, the dispute is relocated to the conceptualist premise (or the content premise). Given the rest, the conclusion is equivalent to a weakened existential form, not to a restriction of the conceptualist premise (Lean-only rootCriterionGivesExistentialStandInApprehension, existentialStandInApprehensionGivesRootCriterion: NonRealStandInYieldsApprehension yields some apprehended content about some candidate, not the stand-in itself); the conceptualist premise, even restricted to the route, is strictly stronger (Comparator companion rootCriterionWithoutConceptualism). What the derivation adds is that the shared demand is derived rather than assumed, and that the remaining premise is a general thesis about non-real being whose warrant is assessed outside the favouring framework. The main theorem uses no axioms. The Comparator companion possibiliaControls (propext, Classical.choice and Quot.sound, on lane C's carrier) gives the personal row with every premise and the conclusion, and rows where exactly one new premise fails and the conclusion fails: mind-independent non-real modes (the conceptualist premise), real plurality in a composite source (simplicity), a template reading (the content premise) and present inputs. In rows 3 and 5 the conceptualist and content premises hold only vacuously (nothing non-real is contained). In rows 2, 3 and 5 the conclusion fails because the row assigns no apprehension; row 5 shows that the no-present-candidates premise is needed for the derivation, not that present inputs exclude apprehension. Lane C's axiarchicControls already gives single failures of its five premises. These are structural surrogates, not metaphysical possibilities; which account a row represents is an interpretive assignment."

[[argument]]
id = "2a8fd3b0-0cb9-4aae-9ca9-29e24a570df7"
label = "Root cognition criterion, from the unrestricted cognition criterion"
theorem = "rootCriterionOfCriterion"
premises = ["3b40009e-1c56-4cce-86ba-1980fd2cb9a7"]
conclusion = "b371638a-dd5a-4fe0-a5cd-d9b4545e0df8"
axioms = ["propext", "Classical.choice", "Quot.sound"]
senses = {BECAUSE_OF_GOODNESS = "BECAUSE_OF_GOODNESS_2"}
rule = "Restrict the universal criterion to actual roots"
meaning = "The cognition criterion says that every bearer with a good-general favouring apprehends some content about some candidate; an actual root is such a bearer when it has a good-general favouring. This verifies the strength order from the criterion to its restriction to actual roots. The main theorem uses no axioms."

[[argument]]
id = "588e1dfb-6a46-4550-bcf2-d463bd2eac4a"
label = "Actual roots apprehend, from finality and the root criterion"
theorem = "actualRootsApprehendFromRootCriterion"
premises = ["7fca65ec-8565-46fe-a5fe-bfdfcf0ed245", "980e6482-054d-4765-8487-c27ee77cd0ce", "b371638a-dd5a-4fe0-a5cd-d9b4545e0df8"]
conclusion = "3a32d91c-23f3-403f-a0dd-a34a362f7b8e"
axioms = ["propext", "Classical.choice", "Quot.sound"]
senses = {BECAUSE_OF_GOODNESS = "BECAUSE_OF_GOODNESS_2"}
rule = "Commitment (e) gives the root a favouring, good-generality of root favouring makes it good-general, and the root criterion gives an apprehended content"
meaning = "Fix an actual root r at w. Commitment (e) in its weakest favouring form gives r a favouring determination phi; every favouring of an actual root is good-general, so phi is; the root cognition criterion then gives r an apprehended content about some candidate. The same composition as the existing route through the cognition criterion 3b40009e, with that criterion replaced by its restriction to actual roots, so the route from the conceptualist derivation reaches 3a32d91c without 3b40009e or d1fb6414. That route is a re-presentation of the same dispute, not additional evidence: the noncognitive imitability-exemplar rival (control row 2) holds every premise of the conceptualist derivation except the conceptualist premise and denies every apprehension at the root, so on the route's instances it denies both that premise and the root criterion; given the rest the root criterion is equivalent only to a weakened existential form, and the conceptualist premise, even restricted to the route, is strictly stronger; the instances the route uses (a non-real stand-in contained in a simple root, for a non-present candidate of a value-dependent pair with distinct stand-ins) are also instances of d1fb6414, and A4 denies apprehension of them under either premise; and the route shares lane C's five individuation premises with the route through d1fb6414. The main theorem uses no axioms."

