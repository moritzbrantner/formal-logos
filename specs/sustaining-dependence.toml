theorem = "esseDependenceOfSustaining"
premises = ["ce55210c-d3b5-4720-bd83-a3f63c5dc884", "A distinct cause of a thing's esse giving it being whenever it is present is depended on for being"]
conclusion = "2068f91c-1eeb-5dbb-a71a-f7b6a12bb495"
