  { term = "CAUSING_AN_EFFECT", from = "CAUSING_AN_EFFECT_3", to = "CAUSING_AN_EFFECT_5", statement_id = "ce55210c-d3b5-4720-bd83-a3f63c5dc884" },
]
transcription = "single_application"
axioms = []
rule = "The weak sustaining reading supplies the giving antecedent of the sibling in every history"
meaning = "Transcription (single application, invariant 16): the sibling's consequent is the conclusion, and the weak sustaining reading ce55210c only supplies the sibling's antecedent. Let c, distinct from x, cause x's esse; by ce55210c, in every history in which x is present at some moment, c gives x being at every moment at which x is present, so the sibling gives that x depends for its being on c. Its point is to connect: together with the non-transcription derivation of the sibling from contact and the co-presence bridge, 2068f91c rests on ce55210c, contact c4661518 and the bridge. The weak sustaining reading is needed: the parent-child interpretation (Control part 1, an originating cause that gives being at its effect's first moment only, the effect persisting after the cause is gone) satisfies contact, the bridge and the sibling, and falsifies 2068f91c with dependence read as co-presence. On this route the existential-inertia dispute over 2068f91c sits in ce55210c, and through it in weak concurrent actualization 40a97664. 2068f91c stays open until every premise here is closed. No premise is established."

