# Sustaining causes of esse and dependence for being; onset and parity.
# Formal next tests of the sustaining-versus-existential-inertia comparison
# (docs/notes/sustaining-vs-existential-inertia.md). (1) The sustaining sibling
# of 2068f91c: the esse-dependence premise restricted to CAUSE_OF_BEING_2
# sustaining causes, derived from the contact principle c4661518 and a
# co-presence bridge, and composed with the weak sustaining reading ce55210c
# into 2068f91c. (2) The onset/parity objection to existential inertia typed:
# onset and parity give concurrent actualization for begun things; the inertial
# history satisfies onset and fails parity. Analyst formulations, attribution
# deferred.

[batch]
vocab = "TruthCore.Causality.SustainingDependence"
results = "TruthCore.Results.Causality.SustainingDependence"

# ---------------------------------------------------------------- statements

[[statement]]
id = "A distinct CAUSE_OF_BEING_2 sustaining cause of a thing's esse is one it depends on for its being"
lean = "SustainingEsseCauseIsDependedOn"
paraphrase = "OPEN analyst premise, attribution deferred (sustaining sibling of 2068f91c): in the given model, if c, distinct from x, causes x's esse (CausesIn c x esse, DEF-CAUSE-OF-PERFECTION at esse) and, in every history in which x is present at some moment, c gives x being at every moment at which x is present (CAUSE_OF_BEING_2, SustainsBeing; GivesAt on the STRICT esse-giving reading of definition 158301bc), then x depends for its being on c (DependsForBeing x c, DEF-DEPENDS-FOR-BEING: x would not be if c were not; a primitive parameter, not time-indexed). It is 2068f91c with the added sustaining antecedent, so 2068f91c entails it (registered strength order); strictly weaker (Control part 1: in a parent-child interpretation the originating parent sustains nothing, so the sibling holds vacuously while 2068f91c fails with dependence read as co-presence). Derived from the contact principle c4661518 and the co-presence bridge; with the weak sustaining reading ce55210c it gives 2068f91c back. It removes the origin-without-sustaining counterexample (a parent and a child) from the dependence step: that case does not satisfy its antecedent."
definitions = ["DEF-DEPENDS-FOR-BEING", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE", "ed47a5a7-fa84-43cb-950b-2552b33b99ff", "158301bc-9585-4145-be60-34f08c9f922c", "DEF-TEMPORAL-HISTORY-NOW-SLICE"]
disambiguations = ["00e0d443-eb39-56a3-9179-9c8852ca4a2b", "88a8fba7-f1a1-4340-8a7f-41dd39bbbe7d"]

[[statement]]
id = "A distinct esse cause present whenever its effect is, in every history, is depended on for being"
lean = "CoPresentEsseCauseIsDependedOn"
paraphrase = "OPEN analyst bridge, attribution deferred (co-presence to dependence): in the given model, if c, distinct from x, causes x's esse (CausesIn c x esse) and, in every history of the model, c is present at every moment at which x is present (History.IsAt), then x depends for its being on c (DependsForBeing x c, DEF-DEPENDS-FOR-BEING: x would not be if c were not, including impossible antecedents). Meaning: a strict conditional over the model's histories (no history has x at a moment without c then) yields the counterfactual. Warrant: in the standard counterfactual logics (Lewis, Stalnaker) a strict conditional entails the counterfactual, vacuously when the antecedent is impossible; the application needs the model's histories to represent the alternatives relevant to the counterfactual (history coverage), and on a one-history model it would be a much stronger co-presence-plus-causation principle, open to a case of redundant givers of esse (none on file). The CausesIn antecedent blocks the overgeneration of purely modal dependence (dependence on whatever is present at every moment of every history without a causal role). Its antecedent is pointwise and over all histories, so it suffices for both readings of 'would not be' (would never have been; would not be at that moment). Not a definition of DependsForBeing and not an equivalence: only this direction is asserted."
definitions = ["DEF-DEPENDS-FOR-BEING", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE", "DEF-TEMPORAL-HISTORY-NOW-SLICE"]
disambiguations = ["00e0d443-eb39-56a3-9179-9c8852ca4a2b"]

[[statement]]
id = "Whatever has received esse is given being by something at its first moment"
lean = "ReceivedOnsetIsGiven"
paraphrase = "OPEN analyst premise, attribution deferred (onset is given): in every history of the model, whatever has its esse received in some principle (DEF-ESSE-RECEIVED-IN) is given being by something (GivesAt, definition 158301bc, STRICT reading) at a first moment of its presence (BeginsAt: present then and at no strictly earlier moment). The existential-inertia rival accepts it: its causal requirement on change (Schmid 2021, read) covers coming to be, and the inertial interpretation satisfies it (Control part 5). Silent on things with no first moment of presence."
definitions = ["DEF-ESSE-RECEIVED-IN", "158301bc-9585-4145-be60-34f08c9f922c", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-ESSE"]
disambiguations = ["DISAMB-ESSE-RECEPTION"]

[[statement]]
id = "A received-esse thing given being at its first moment is given being whenever it is present"
lean = "PersistenceParity"
paraphrase = "OPEN analyst premise, attribution deferred (parity of persistence with onset): in every history of the model, if a thing whose esse is received in some principle (DEF-ESSE-RECEIVED-IN) is given being by something at a first moment of its presence (BeginsAt; GivesAt, definition 158301bc, STRICT reading), then at every moment at which it is present something gives it being. Meaning: the thing's being at a later moment is the same kind of fact as its being at its first moment, so whatever kind of explanation the first requires, the later does too. Not independent of weak concurrent actualization 40a97664: given onset it is concurrent actualization for begun things restated, and existential inertia (Schmid 2021, read) rejects it on the ground recorded against 40a97664, that onset is a change and persistence is not (Control part 5). No independent warrant for it beyond that of 40a97664 is on file."
definitions = ["DEF-ESSE-RECEIVED-IN", "158301bc-9585-4145-be60-34f08c9f922c", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-ESSE"]
disambiguations = ["DISAMB-ESSE-RECEPTION"]

[[statement]]
id = "Whatever has received esse and began is given being by something whenever it is present"
lean = "ConcurrentlyActualizedOnceBegun"
paraphrase = "Concurrent actualization for begun things, attribution deferred: in every history of the model, whatever has its esse received in some principle (DEF-ESSE-RECEIVED-IN) and has a first moment of presence (BeginsAt) is given being by something (GivesAt, definition 158301bc, STRICT reading) at every moment at which it is present. The restriction of weak concurrent actualization 40a97664 to things with a first moment, entailed by it (registered strength order). In a model whose times are the natural numbers every thing present at some moment has a first moment, so there the two coincide; with times without a least element they can differ. Derived from onset and parity."
definitions = ["DEF-ESSE-RECEIVED-IN", "158301bc-9585-4145-be60-34f08c9f922c", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-ESSE"]
disambiguations = ["DISAMB-ESSE-RECEPTION"]

[[statement]]
id = "Sustaining-dependence and onset-parity controls: parent and child, omissions and nonvacuity"
lean = "Control.Certificate"
paraphrase = "Closed controls on interpretations with one world, natural-number times and two individuals; statements about these interpretations only. (1) Parent and child: true is present at times 0 and 1 and gives false being at time 1 only; false persists from time 1 on; dependence read as co-presence in every history. The contact principle, the co-presence bridge and the sustaining sibling hold; the weak sustaining reading ce55210c and the esse-dependence premise 2068f91c fail. (2) true present always, giving false being from time 1 on, no dependence: the weak sustaining reading and contact hold; the bridge, the sibling and 2068f91c fail. (3) An absent giver giving at every time, dependence as co-presence: the weak sustaining reading and the bridge hold; contact, the sibling and 2068f91c fail. (4) As (2) with dependence as co-presence: every premise, the sibling and 2068f91c hold, and false depends on true. (5) The inertial history of (1), false alone with received esse: onset is given; parity and concurrent actualization for begun things fail. (6) The same history with no giving: parity holds vacuously; onset and concurrent actualization for begun things fail. (7) The history of (2): onset, parity and concurrent actualization for begun things hold."
definitions = ["DEF-DEPENDS-FOR-BEING", "DEF-ESSE-RECEIVED-IN", "158301bc-9585-4145-be60-34f08c9f922c", "ed47a5a7-fa84-43cb-950b-2552b33b99ff", "DEF-TEMPORAL-HISTORY-NOW-SLICE"]
disambiguations = ["00e0d443-eb39-56a3-9179-9c8852ca4a2b", "88a8fba7-f1a1-4340-8a7f-41dd39bbbe7d"]

