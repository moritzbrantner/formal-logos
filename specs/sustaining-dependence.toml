[[argument]]
id = "The sustaining sibling of esse dependence, from contact and co-presence"
theorem = "sustainingSiblingOfCoPresence"
premises = ["c4661518-33cc-4a53-ae55-cb986be9c2b5", "A distinct esse cause present whenever its effect is, in every history, is depended on for being"]
conclusion = "A distinct CAUSE_OF_BEING_2 sustaining cause of a thing's esse is one it depends on for its being"
senses = {CAUSE_OF_BEING = "CAUSE_OF_BEING_2", CAUSING_AN_EFFECT = "CAUSING_AN_EFFECT_5"}
sense_bridges = [
  { term = "CAUSING_AN_EFFECT", from = "CAUSING_AN_EFFECT_3", to = "CAUSING_AN_EFFECT_5", statement_id = "A distinct CAUSE_OF_BEING_2 sustaining cause of a thing's esse is one it depends on for its being", role = "conclusion" },
]
axioms = []
rule = "Sustaining gives giving at each moment of presence; contact gives presence of the giver then; the co-presence bridge gives dependence"
meaning = "New non-transcription conditional derivation. Let c, distinct from x, cause x's esse and sustain x in every history in which x is present. For any history v and moment t with x present, c gives x being at t (SustainsBeing), so c is present at t (contact c4661518). Hence c is present whenever x is, in every history, and the co-presence bridge gives that x depends for its being on c. Each premise is needed in a checked interpretation: the bridge (Control part 2, dependence empty) and contact (part 3, an absent giver); both hold with the conclusion nonvacuously (part 4). Both premises stay OPEN. No premise is established."

