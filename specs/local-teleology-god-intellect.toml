[[statement]]
id = "Local Fifth Way GOD_4 intellect attachment controls"
lean = "Control.Controls"
paraphrase = "Fixed two-being formal interpretations: false is a noncognitive natural body, true alone is its intellectual unmoved director/mover. One populated interpretation satisfies local teleology, first-mover/maximum identity, God-to-maximality and GOD_4 intellect. Three omissions respectively lack identity, God-to-maximality and local intellectual direction while retaining the other inputs and failing GOD_4 intellect. In the identity omission, the intellectual first mover and nonintellectual GOD_4 maximum are distinct. No actual-world or metaphysical possibility claim."
