[[argument]]
id = "GOD_4 HAS_INTELLECT_1 from local teleology and first-mover maximum identity"
theorem = "godHasIntellect"
premises = ["65c409cc-eb7f-4d66-8e2d-60c8e5138ed6", "46326b43-ec14-551a-8eaf-3230f57572c6", "4c79298d-ee09-5e99-9ced-1be92c19b4cc"]
