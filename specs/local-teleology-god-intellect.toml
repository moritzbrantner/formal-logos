axioms = []
rule = "Retain intellect at the witness-local Fifth Way's unmoved director, then transport along the existing first-mover/maximum identity"
meaning = "Analyst cross-family support option, attribution deferred. Instantiate the existing Fifth Way Intelligent parameter with the SAME HasIntellect predicate as HAS_INTELLECT_1. This application commits the directing intelligence to intellectual cognition, rather than sensory or merely functional success; no equivalence of arbitrary dictionaries is proved. One body/end's complete local bundle gives a knowing intellectual director, reduces its direction to an intellectual unmoved director, and uses directing-as-moving to make that same director a first unmoved mover. For any GOD_4 g, the existing naming-converse premise makes g a maximum; the existing first-mover/maximum identity equates the intelligent first mover to g. Transport intellect to this SAME g. No universal observations, common governor, independent director uniqueness premise, immateriality-to-intellect bridge, modal actuality transfer or God-existence conclusion. The identity premise retains its substantial causal/agent-application provenance. Existing direct and immateriality routes remain available. See docs/notes/teleology-first-mover.md for the complete proposed outcome and revision conditions."

[[argument]]
