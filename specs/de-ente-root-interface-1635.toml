id = "De ente root-interface controls"
theorem = "rootInterfaceControls"
premises = []
conclusion = "De ente root-interface controls: per accidens, non-causal ground, absent, self-ground, nonvacuity"
axioms = []
rule = "Explicit finite and infinite interpretations, checked by case analysis and accessibility proofs"
meaning = "Closed controls for the #1635 root interface and per se regress: the per se bridge (per accidens regress), the ground bridge (non-causal ground), the concreteness bridge (absent source), no self-causation (self-ground), and one interpretation satisfying every input and conclusion. They witness logical underdetermination under the encoded predicates only."

