[[argument]]
id = "Experience-machine comparison of experientialism and q.5 desirability checked"
theorem = "experienceMachineComparison"
premises = []
conclusion = "Experientialism and q.5's desirability biconditional conflict where perfection outruns experience"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Function.factorsThrough_iff, extensionality and case analysis"
meaning = "Premise-free comparison. The exact price of holding q.5's desirability biconditional together with experientialism is that perfection supervenes on experience; so the coherence of the machine case (same profile, a perfection one life has and the other lacks), not its verdict, already makes the two contraries. Given the case, the biconditional with respect dominance predicts the stay-out verdict and experientialism with the transfer bridge forbids it. Experientialism conflicts with each half of the biconditional only together with the case: with the forward half it makes the machine life desirable in the respect it lacks, with the backward half it makes the real life not desirable in the respect it has. Conjunct 8 is the re-presentation probe for the refutation result. Nothing here establishes any premise or the verdict."

[[argument]]
id = "Experience-machine joint models and controls checked"
theorem = "experienceMachineControls"
premises = []
conclusion = "Experience-machine joint models for the perfectionist, hedonist and mixed accounts"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit finite interpretations, checked by decide"
meaning = "Joint models on one finite carrier for each side: q.5's biconditional with the stay-out verdict (row 1), and experientialism with the case facts and indifference between the two lives (rows 2 and 3). Rows 4 and 5 show that the stay-out verdict is also satisfied by a model that denies the backward half (partial experientialism) and by one that denies the forward half (restricted), so the verdict discriminates experientialism from both halves' common core but certifies neither half universally. Row 2 also shows that hedonism proper is compatible with the backward half. Omission controls for the refutation: row 2 (no verdict), row 6 (no bridge), row 2's real/drab pair (different profiles). The betterness relation is set to strict respect dominance, so the transfer statements hold by construction there; models witness satisfiability of these finite interpretations only and refute no position."

