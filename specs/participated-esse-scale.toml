[[statement]]
id = "Efficient total giving of participated esse preserves each admitted pure determination in the giver"
lean = "GivingPreservesDeterminations"
paraphrase = "Open analyst premise, confined to giving esse to actual participants. For each pure determination in a selected inventory, if the recipient really has it, so does each efficient total giver of its esse. Has expresses the same real content in both bearers. It requires no identity of their act-tokens or modes. An application admitting eminent realization must identify that content in the source. Productive power and the aggregate degree of either bearer do not occur in the test."
definitions = ["14d30c53-51c2-502d-b009-247dac0421e0", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72", "8934912c-7997-4af7-9520-ec94ff221043", "33ebf451-eb02-48f5-b420-24a34da9b865", "65e38ffa-5a1c-55d0-935c-6538d843b780", "3aba5f19-f48d-50db-bc57-93ba2e99f845"]

[[statement]]
id = "An actual bearer's degree of esse is the least upper bound of its realized pure levels"
lean = "OwnDegreeFromRealizedLevels"
paraphrase = "Open calibration. In one preorder, each pure determination in the chosen inventory has a bearer-independent level. Each actual bearer's own represented degree of esse bounds the levels of the determinations it really has and lies below every bound on those levels. The inventory and its levels must have a rationale independent of giver and recipient rank. Neither the source's possible outputs nor a count of kinds defines its degree."
definitions = ["ff1ba8f4-ab6e-5bdd-9e17-02b08a025168", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72", "8323604a-2e7a-554c-9b32-d82e5201271d", "65e38ffa-5a1c-55d0-935c-6538d843b780", "3aba5f19-f48d-50db-bc57-93ba2e99f845"]

[[argument]]
id = "The selected giver bounds participated esse from preserved pure levels"
theorem = "boundFromRealizedLevels"
premises = ["eeb89ffe-5b61-4572-8b35-87adf541bcab", "50da2b49-c914-4c44-a956-1cb134a399f8", "Efficient total giving of participated esse preserves each admitted pure determination in the giver", "An actual bearer's degree of esse is the least upper bound of its realized pure levels"]
conclusion = "aba6f4e1-bbf1-4aaa-ac1c-dead4efbef09"
rule = "Lift recipient-specific inclusion of realized levels to their least upper bounds"
meaning = "The populated supply premise establishes actuality of the selected giver. At each actual participant the efficient-total bridge and the preservation premise transport every witnessed pure level to that very giver. The calibrated least upper bounds are therefore ordered in the same preorder, without total comparability, attainment of a greatest level, strict causal superiority or the unrestricted adequacy principle. This supplies exactly the represented participant bound used in the greatest-degree argument."

[[statement]]
id = "Conserving the complete supply allows tied or increased local intensity under different routing"
lean = "ChannelControl"
paraphrase = "Closed mechanism control. Two ports each supply n positive units. Passing both counts through separately preserves every local threshold. Combining both into one output preserves the same total while passing a local threshold of twice n that neither input port passes. In both layouts the local peak is the least upper bound of the independently checked threshold levels. The interpretation concerns routed counts and imposes no degree of esse on any actual being."
definitions = []

[[argument]]
id = "Compare local intensity under pass-through and concentration of the same whole supply"
theorem = "channelControl"
premises = []
conclusion = "Conserving the complete supply allows tied or increased local intensity under different routing"
rule = "Compute the same per-port threshold test before and after routing"
meaning = "For every positive n, both outputs account for all 2n units. Separate routing gives the input and output the same least upper bound n; pooled routing yields least upper bound 2n, and the 2n probe distinguishes the output from the input. This controls the inference from no additional supplied quantity to preservation of local grade. The ports are an analogy for that inference and carry no causal or metaphysical classification."
