id = "Own-nature carriage, from carriage"
label = "Own-nature carriage REQUIRES_LACK_1 at roots, from carriage LE"
theorem = "ownCarriageOfCarriage"
premises = ["682e6436-a44f-40d6-bc02-7cb5f4a2b754"]
conclusion = "Own-nature ESSENCE_6 exclusions at a root are carried by what its determinations REQUIRES_LACK_1"
