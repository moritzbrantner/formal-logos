# Necessary existence of the First Way's own first mover (owner lead
# 2026-11-22, pure actuality -> necessary existence). Same-witness
# conditional routes over one shared CausalityFrame (#1784): causal (B2 + B3 +
# B1), potency (B4), potency-or-cause (B2 v B4, with pure act and firstness),
# essence-esse (B6) and grounding; B2 from B6 and the q.3 a.4 reading; the
# grounding endpoint feeds the existing necessary-first-being endpoint.
# Analyst formulations, attribution deferred; no source claim.

[batch]
vocab = "TruthCore.Causality.FirstMoverNecessity"
results = "TruthCore.Results.Causality.FirstMoverNecessity"

[[statement]]
id = "Whatever moves something exists at the reading world w"
lean = "MoversExistAt"
paraphrase = "OPEN interface (B0), analyst formulation, attribution deferred: on the shared causality frame, whatever moves something in some respect (MovesIn, CAUSE_1, read at the reading world w, since the case's motion vocabulary is not world-indexed) exists at w. A mover exercising its moving there exists there. Nothing is said about any other world, about concreteness or about necessity. Scope: B0 is warranted only at the world at which MovesIn is read; at any other world it would itself assert that the movers exist there, and at every accessible world it would make every mover necessary. 'Moves' is the frame's MovesIn, meaning DEF-MOTION-AS-REDUCTION (CAUSE_1); that definition is deliberately not linked here, because the arguments using B0 also use CAUSE_2 (causing esse) as a different relation and the sense check cannot tell two relations from an equivocation. The missing link is a known definition-coverage gap, recorded in this statement and its batch."
definitions = ["DEF-FIRST-UNMOVED-MOVER", "DEF-KANT-ONTOLOGICAL-MODEL"]

[[statement]]
id = "Whatever moves something is CONCRETE_6"
lean = "MoversConcrete"
paraphrase = "OPEN interface (B0'), analyst formulation, attribution deferred: whatever moves something in some respect (MovesIn, CAUSE_1) satisfies the concreteness predicate of the selected-grounding profile. Used only by the grounding route and the projection of the pure-act endpoint to the stage-one node; the causal, potency and essence-esse routes do not need it. 'Moves' is the frame's MovesIn (DEF-MOTION-AS-REDUCTION, CAUSE_1), not linked for the reason given at B0 (a known definition-coverage gap, recorded in these records)."
definitions = ["DEF-FIRST-UNMOVED-MOVER", "DEF-CONCRETE-ESSE-IN-RE"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Every being contingent at w has a distinct CAUSE_2 of its esse"
lean = "ContingentHasDistinctEsseCause"
paraphrase = "OPEN bridge (B2), analyst formulation, attribution deferred: every candidate that exists at w and is absent at some world accessible from w (MODAL_CONTINGENCY_1) has some other being that causes its esse (CausesIn at esse, CAUSE_2, mode not fixed). The cause is not required to exist at w, to be concrete or to be an efficient cause; it is the weakest form the causal route uses. It says nothing about beings that exist at every accessible world."
definitions = ["DEF-KANT-MODAL-CONTINGENCY", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CAUSE", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Every being contingent at w has esse distinct from its essence"
lean = "ContingentHasDistinctEsse"
paraphrase = "OPEN modal bridge (B6, contrapositive form), analyst formulation, attribution deferred: every candidate contingent at w (existing at w, absent at some accessible world) has a represented esse distinct from its represented essence. With excluded middle it is equivalent to: whatever exists at w with esse not distinct from essence exists at every world accessible from w (controls, law 1). Essence-esse identity alone carries no modal force: in the brute-first model a being with esse not distinct from essence is contingent (controls, model 1)."
definitions = ["DEF-KANT-MODAL-CONTINGENCY", "DEF-ESSENCE-THOMISTIC-NATURE", "DEF-ESSE", "DEF-Q3A4-ACTUAL-DISTINCT-ESSE", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-ESSENCE", "DISAMB-ESSENTIAL-VS-ACCESSIBLE-EXISTENCE", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Every being contingent at w is in POTENCY_1 in some respect"
lean = "PossibleNonexistenceIsPotency"
paraphrase = "OPEN bridge (B4), analyst formulation, attribution deferred: every candidate contingent at w is in POTENCY_1 (the adopted potency in the subject) in at least one respect, any respect. It states no grounding or explanatory relation and does not tie the respect to esse or to non-being: a contingent thing that can merely become hot satisfies it. The esse-tied version is the conjunction of the converses of the two existing bridges relating potency and possible non-being (contingent beings can fail to be in substance; what can fail to be in substance is in POTENCY_1 as to esse), which implies it (controls, law 2); the existing bridges themselves do not give it (controls, model 1). With excluded middle it is equivalent to 'every pure-act being existing at w exists at every accessible world' (controls, law 3), so the potency route relocates the lead's question into B4."
definitions = ["DEF-KANT-MODAL-CONTINGENCY", "DEF-POTENCY", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-POTENCY", "DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "Every being contingent at w is in POTENCY_1 or has a distinct CAUSE_2 of its esse"
lean = "ContingentHasPotencyOrEsseCause"
paraphrase = "OPEN bridge (B2 or B4), analyst formulation, attribution deferred: every candidate contingent at w is either in POTENCY_1 in at least one (any) respect or has some other being that causes its esse (CAUSE_2 at esse). Each of B2 and B4 implies it (controls, laws 4-5), so it is the weakest of the three as typed. It is not the q.9 a.2 pair of channels (mutable in the subject, MUTABLE_1; mutable through another's power, MUTABLE_2): reading it as exhausting those channels would need two unrecorded OPEN bridges, contingency at w gives mutability in some way (MUTABLE_3), and another's power over a thing's esse gives a distinct cause of its esse. A brute contingent being, neither in potency nor caused, falsifies it (controls, model 1)."
definitions = ["DEF-KANT-MODAL-CONTINGENCY", "DEF-POTENCY", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-POTENCY", "DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER", "DISAMB-CAUSE", "DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "No actual concretum grounds itself under the selected grounding at w"
lean = "TruthCore.Causality.ReflexiveDependenceScope.ActualGroundingIrreflexive"
paraphrase = "OPEN analyst premise: under the selected grounding relation of the profile at w, no candidate that is concrete and exists at w grounds itself. Irreflexivity only: it says nothing about cycles of length two or more. Acyclicity including self-loops, and well-foundedness of grounding on actual concreta, each imply it. It must be read on the same strict sense of grounds as the closure premise STMT-EVERY-CONTINGENT-GROUNDED-AT, which permits self-grounding: under the reflexive existence-requirement reading of #1593 (ReflexiveDependenceScope) the closure holds trivially and irreflexivity fails."
definitions = ["DEF-BRUTE-ROOT-RELATIVE-GROUNDING", "a1b2e330-388f-4120-bc5c-969642317792", "DEF-CONCRETE-ESSE-IN-RE", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
