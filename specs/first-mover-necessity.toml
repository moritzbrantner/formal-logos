[[statement]]
id = "First mover necessity: laws, omission models and a two-root model"
lean = "Model.Controls"
paraphrase = "Premise-free comparison over finite Bool frames (logical boundaries, not metaphysical possibility). Laws: with excluded middle, the contrapositive B6 is equivalent to 'existence at w with esse not distinct from essence gives existence at every accessible world'; B4 follows from its two converse-direction halves (contingent can fail to be in substance; what can fail to be in substance is in POTENCY_1 as to esse); with excluded middle B4 is equivalent to 'every pure-act being existing at w is necessary at w', the lead's target at w; B2 and B4 each imply B2 or B4. Models (two respects, esse and a respect of motion; in every model the moved thing is in POTENCY_1 in the respect in which it is moved): (1) a brute first mover that is first in being, pure act, simple with esse not distinct from essence, satisfies every other premise of the five necessity routes and both existing potency/modality bridges nonvacuously (the moved thing is in potency to heat and can fail to be hot; the mover can fail to be in substance and possibly is not), yet is contingent: B2, B4, the esse-tied half 'what can fail to be in substance is in POTENCY_1 as to esse', B2 or B4, B6 and the grounding closure fail; (2) a conserved pure-act mover caused in esse by a prior being: everything of the causal routes but firstness; (3) the same without priority: everything but B3; (4) an absent mover: everything but B0; (5) no moving: everything of the causal, potency and essence-esse routes but the prima via conclusion; (6) a necessary mover in potency: everything but pure act; (7) a mover with distinct esse and essence: everything of the essence-esse route but simplicity; (8) self-grounding: everything of the grounding route but irreflexivity; (9) an unprioritized ground: everything but grounding-priority; (10) nothing concrete: everything but B0'; (11) a nonvacuity model in which every premise of every route and both endpoints hold, with B2, B3, B4 and B6 applied to the contingent moved thing (caused and preceded by the mover, in potency to heat, esse distinct from essence); (12) three beings: the mover, the moved thing (in potency, so not pure act) and an idle being; the mover and the idle being are two distinct necessary actual first pure-act roots, only one of them a first mover."
definitions = ["DEF-FIRST-UNMOVED-MOVER", "DEF-PURE-ACT", "DEF-KANT-MODAL-NECESSITY", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-BRUTE-ROOT-RELATIVE-GROUNDING", "DEF-FIRST-BEING", "DEF-SIMPLE-PRIORITY", "a1b2e330-388f-4120-bc5c-969642317792", "DEF-CONCRETE-ESSE-IN-RE", "DEF-POTENCY", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE", "DEF-ESSENCE-THOMISTIC-NATURE", "DEF-NECESSARY-FIRST-BEING-PURE-ACT"]
disambiguations = ["DISAMB-NECESSARY", "DISAMB-PURE-ACT-STRICTNESS", "DISAMB-POTENCY", "DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER", "DISAMB-ESSENTIAL-VS-ACCESSIBLE-EXISTENCE"]

[[argument]]
id = "First Way mover is necessary, from PURE_ACT_5, firstness and POTENCY_1-or-cause"
theorem = "firstMoverNecessaryByPotencyOrCause"
premises = ["STMT-EXCLUDED-MIDDLE", "STMT-THERE-IS-A-FIRST-UNMOVED-MOVER", "Whatever moves something exists at the reading world w", "STMT-FIRST-UNMOVED-MOVER-IS-FIRST-BEING", "STMT-FIRST-UNMOVED-MOVER-IS-PURE-ACT", "Every being contingent at w is in POTENCY_1 or has a distinct CAUSE_2 of its esse", "ee74c678-0a06-47d3-9c76-27ff798e9a01"]
conclusion = "Some first mover moved by none is PURE_ACT_5, exists at w and at every accessible world"
rule = "Reductio on contingency by cases, then excluded middle at each accessible world"
meaning = "Take the prima via's first mover f. It moves something, so it exists at w (B0). Suppose f is absent at some accessible world: then f is contingent at w, so by the disjunctive bridge it is either in POTENCY_1 in some respect or some other being causes its esse. The first is excluded by pure act (the existing derived statement that every first mover moved by none is pure act). In the second, the cause is SIMPLY_PRIOR_1 to f (a distinct esse-cause is simply prior), and since f is the first being (every first mover moved by none is the first being) it is f, against distinctness. So f is not absent at any accessible world, and excluded middle gives presence there. Pure act and firstness each exclude one disjunct of the bridge as typed; necessity of the same f is derived, not assumed. Each non-logical premise is needed: the controls give an omission model for each (models 1-6)."
description = "Same-witness conditional result: the First Way's own first mover is pure act and exists at every world accessible from w, from the prima via conclusion, B0, firstness, pure act, the disjunctive bridge B2 or B4 and B3, with excluded middle. Not a transcription: no premise mentions necessity; the modal conclusion is reached by a reductio over the two disjuncts. Establishes no premise. Its bridge is the weakest of B2, B4 and B2 or B4 as typed (B2 and B4 each imply it), and its bundle is entailed by the causal route's bundle; logical weakness is not by itself greater warrant."

[[argument]]
id = "First Way mover is necessary, from firstness and a distinct esse-cause"
theorem = "firstMoverNecessaryByEsseCause"
premises = ["STMT-EXCLUDED-MIDDLE", "STMT-THERE-IS-A-FIRST-UNMOVED-MOVER", "Whatever moves something exists at the reading world w", "STMT-FIRST-UNMOVED-MOVER-IS-FIRST-BEING", "STMT-FIRST-UNMOVED-MOVER-IS-PURE-ACT", "Every being contingent at w has a distinct CAUSE_2 of its esse", "ee74c678-0a06-47d3-9c76-27ff798e9a01"]
conclusion = "Some first mover moved by none is PURE_ACT_5, exists at w and at every accessible world"
rule = "Reductio on contingency, then excluded middle at each accessible world"
meaning = "Route A of the lead. The first mover f exists at w (B0). Were it contingent, B2 would give another being causing its esse, simply prior to it by B3, hence identical with it by firstness, against distinctness. So f is present at every accessible world (excluded middle). Pure act is carried for the same witness and does no work toward necessity here: the necessity comes from firstness and existential causation (cross-family convergence on one witness, not 'pure act alone entails necessity'). Omission models in the controls (models 1-6)."
description = "Same-witness conditional result, causal route: the First Way's first mover is necessary at w from firstness, B2 and B3, with pure act carried. Not a transcription. Establishes no premise. B2 is supported either directly or through B6 and the q.3 a.4 reading (separate argument), in which case it shares B6 with the essence-esse route."

[[argument]]
id = "A distinct esse-cause for contingents, from distinct esse and the q.3 a.4 reading"
theorem = "contingentEsseCauseFromDistinctEsse"
premises = ["Every being contingent at w has esse distinct from its essence", "STMT-EXISTING-IN-ACT-AT", "STMT-DISTINCT-ESSE-REQUIRES-EXTERNAL-CAUSE"]
sense_bridges = [{term = "CAUSING_AN_EFFECT", from = "CAUSING_AN_EFFECT_2", to = "CAUSING_AN_EFFECT_3", statement_id = "STMT-DISTINCT-ESSE-REQUIRES-EXTERNAL-CAUSE"}]
conclusion = "Every being contingent at w has a distinct CAUSE_2 of its esse"
rule = "Instantiate the q.3 a.4 reading at each contingent being"
meaning = "A being contingent at w exists at w, so it is in act of esse (each individual existing at w is in act as to esse); by B6 its esse is distinct from its essence; the ST I q.3 a.4 reading ('that whose esse is other than its essence has its esse caused by another') then gives another being, in act of esse, that causes its esse. The q.3 a.4 profile is built on the frame's own CausesIn and esse, so the cause is CAUSE_2 at the same esse respect as B2. The passage from the q.3 a.4 reading's external esse-cause (CAUSING_AN_EFFECT_2) to B2's CausesIn at esse (CAUSING_AN_EFFECT_3) is by the definition of the former, which is the latter together with the cause's being in act; the q.3 a.4 statement is therefore listed as the sense bridge, and no contested step passes between the senses."
description = "Support for B2 from the modal bridge B6, the existing selected-world existence-to-act contract and the existing q.3 a.4 reading. Not a transcription: the conclusion's causal claim about contingents is reached by composing a modal-to-essence bridge with a causal reading about distinct esse. Establishes no premise. Routes A (with this support) and C then share B6."

[[argument]]
