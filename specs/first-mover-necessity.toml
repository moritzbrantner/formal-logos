[[argument]]
id = "First Way mover is necessary, from PURE_ACT_5 and POTENCY_1 for possible nonexistence"
theorem = "firstMoverNecessaryByPotency"
premises = ["STMT-EXCLUDED-MIDDLE", "STMT-THERE-IS-A-FIRST-UNMOVED-MOVER", "Whatever moves something exists at the reading world w", "STMT-FIRST-UNMOVED-MOVER-IS-PURE-ACT", "Every being contingent at w is in POTENCY_1 in some respect"]
conclusion = "Some first mover moved by none is PURE_ACT_5, exists at w and at every accessible world"
rule = "Reductio on contingency against pure act, then excluded middle"
meaning = "Route B of the lead. The first mover f exists at w (B0) and is pure act. Were it absent at some accessible world, B4 would put it in POTENCY_1 in some respect, against pure act. So it is present at every accessible world. This is the only route on which pure act alone, with one bridge, yields necessity, and B4 carries the whole modal weight: with excluded middle B4 is equivalent to 'every pure-act being existing at w is necessary at w' (controls, law 3), the lead's target at w. The route therefore relocates the question into B4 rather than answering it; it composes the existing pure-act statement with that relocated target."
description = "Same-witness conditional result, potency route: pure act and B4 give necessity of the first mover. Not a transcription (B4's consequent is potency, not necessity), but B4 is classically equivalent to the target restricted to w, so the route relocates the open question. Establishes no premise. A counterexample to B4 as typed would be a contingent being in POTENCY_1 in no respect; whether such a being is possible is the open B5/receptive-potency question (DISAMB-RECEPTIVE-POTENCY, DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER)."

