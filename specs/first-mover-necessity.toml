lean = "FirstMoverNecessaryPureActAt"
paraphrase = "Same-witness endpoint: one and the same first mover moved by none (moves something, moved in no respect, read at w) is in POTENCY_1 in no respect, exists at w and exists at every world accessible from w (NECESSARY_2 box-existence on the frame). No firstness, uniqueness, root status, own-nature necessity or God is asserted."
