target_statement_id = "79ba9d77-257e-4abd-bd20-e164d17c64f6"
missing_bridge = "From goodness identical with the divine nature and approval following that nature to the named assessor approving exactly the due actualities in the form/end frame: creaturely due actuality as participated likeness of the divine goodness, read as God's approval."
blocker = "No participation or likeness vocabulary links the dependence frame to the form/end profile frame."

[[statement]]
id = "9612248a-221a-416e-81c5-bd0411c446e9"
label = "EUTHYPHRO_HORN_1 and EUTHYPHRO_HORN_2 dilemma coverage finite controls"
lean = "TruthCore.Ethics.EuthyphroDilemma.DilemmaControls"
paraphrase = "General facts: identity with a necessary divine nature leaves goodness fixed across nature profiles; goodness identical with the divine nature and approval following nature give literal horn 1 (EUTHYPHRO_HORN_1, approved because good); property collapse needs the identification of God's goodness with the shared universal. Finite models: identity (literal horn 1 holds, consequence horn 1 fails), dependent-nature, distinct exemplar, non-simple, voluntarist, contingent-nature and property models. Formal interpretations only."
definitions = ["68fff412-65a9-45ad-941d-665703c64d1c", "0b5ad0e7-35af-43a3-b824-c98a6b46c501", "0dca022a-c561-4510-9c72-cf25b68bb593"]
disambiguations = ["5ceda5e1-be48-42a1-b2e5-04a52e64bcb8"]
[statement.connection_plan]
target_statement_id = "79ba9d77-257e-4abd-bd20-e164d17c64f6"
missing_bridge = "The same participation bridge as for the identity conclusion: the controls test the identity reply that would support approval of exactly the due actualities."
blocker = "No participation or likeness vocabulary links the dependence frame to the form/end profile frame."

[[argument]]
id = "8f102bd2-a54f-47cc-9fe3-8bc1269088d7"
label = "EUTHYPHRO_HORN_2 coverage, from excluded middle, distinctness and approval-only dependence"
theorem = "hornsCoverFromDistinctness"
premises = ["STMT-EXCLUDED-MIDDLE", "Goodness is distinct from God and from God's nature", "Other things that depend on God for what they are depend on his approval"]
conclusion = "5bb03e95-b971-445a-beb9-c6ba1ccf706a"
rule = "case split on goodness being the approving and on its dependence on God"
meaning = "Checked coverage of the dilemma under explicit background: if goodness is the approving, horn 2; otherwise if it depends on God, distinctness and approval-only dependence make it depend on the approving, horn 2; otherwise horn 1. Exclusivity of the horns is not claimed. Given distinctness, the instance of approval-only dependence at goodness is equivalent to coverage, so the result rests on applying that generalization (creatures depend on God through his will) to a distinct standard."
definitions = ["68fff412-65a9-45ad-941d-665703c64d1c", "0dca022a-c561-4510-9c72-cf25b68bb593"]
senses = {EUTHYPHRO_HORN = "EUTHYPHRO_HORN_2"}
disambiguations = ["5ceda5e1-be48-42a1-b2e5-04a52e64bcb8"]

[[argument]]
id = "09c5f27c-4735-491f-a34d-fac4e3041672"
label = "Neither EUTHYPHRO_HORN_2 horn holds, from identity, simplicity and approval after nature"
theorem = "neitherHornFromIdentity"
premises = ["The standard of goodness is God's nature", "God is his own nature", "God's approving depends for what it is on God's nature", "Constitutive dependence is asymmetric"]
conclusion = "8bc29667-ecdd-4255-b8df-06ad3973dc43"
rule = "identity defeats distinctness; asymmetry with approval following nature defeats constitution by approval"
meaning = "The identity reply, checked: goodness identical with God's nature and God identical with his nature exclude horn 1; approval depending on that nature, with asymmetric dependence, excludes horn 2. Simplicity is used only against horn 1. On the literal reading the same premises give horn 1 (approved because good): the reply takes literal horn 1 and denies its alleged consequence. None of the four premises is established."
definitions = ["68fff412-65a9-45ad-941d-665703c64d1c", "0dca022a-c561-4510-9c72-cf25b68bb593"]
senses = {EUTHYPHRO_HORN = "EUTHYPHRO_HORN_2"}
disambiguations = ["5ceda5e1-be48-42a1-b2e5-04a52e64bcb8"]

[[argument]]
id = "0ccb4deb-2976-4fbd-a952-2275958bb8a1"
label = "Euthyphro dilemma coverage has identity, exemplar and omission models"
theorem = "dilemmaControls"
premises = []
conclusion = "9612248a-221a-416e-81c5-bd0411c446e9"
rule = "explicit finite interpretations and general structural lemmas"
meaning = "Premise-free mixing control for EUTHYPHRO_HORN. Identity model: all identity premises and approval-only dependence hold, distinctness fails and neither consequence horn holds, while literal horn 1 (approved because good) holds and literal horn 2 fails; generally identity with approval following nature gives literal horn 1. Dependent-nature model: goodness is God's nature, which is not God but depends on him, and neither consequence horn holds, so either simplicity or the nature's dependence on God excludes horn 1. Exemplar model: distinctness holds, approval-only dependence fails, neither horn holds. Non-simple model: goodness is God's nature, which is not God and does not depend on him, so horn 1 holds. Voluntarist model: distinctness and approval-only dependence hold and horn 2 holds. Contingent-nature model: identity in each profile without a necessary nature lets goodness vary; generally identity with a necessary nature fixes it. Property model: God is his goodness, which is not the shared universal property; generally collapse into a property needs that identification."
definitions = ["68fff412-65a9-45ad-941d-665703c64d1c", "0b5ad0e7-35af-43a3-b824-c98a6b46c501", "0dca022a-c561-4510-9c72-cf25b68bb593"]
disambiguations = ["5ceda5e1-be48-42a1-b2e5-04a52e64bcb8"]
sense_mixing_control = true

