rule = "identity defeats distinctness; asymmetry with approval following nature defeats constitution by approval"
meaning = "The identity reply, checked: goodness identical with God's nature and God identical with his nature exclude horn 1; approval depending on that nature, with asymmetric dependence, excludes horn 2. Simplicity is used only against horn 1. None of the four premises is established."
