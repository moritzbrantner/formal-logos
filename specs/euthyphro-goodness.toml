lean = "TruthCore.Ethics.EuthyphroDilemma.HornsCover"
paraphrase = "The dilemma's coverage claim: either the standard of goodness is distinct from God and does not depend on him for what it is, or it depends for what it is on God's approving or is that approving."
definitions = ["68fff412-65a9-45ad-941d-665703c64d1c"]
