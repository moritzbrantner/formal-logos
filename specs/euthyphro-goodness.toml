[[statement]]
id = "Goodness supervenes on the natural base across the approval profile family"
lean = "GoodnessSupervenes"
paraphrase = "Open strong invariance premise: in the supplied profile family, which shares forms, ends and due standards, any two profiles that agree on every bearer's actual perfections agree on goodness in every respect, whatever the named assessor approves in them."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "decf0fdd-1b81-4d8f-930a-55a0537d32d6"]
disambiguations = ["f5b1a1e9-1ba8-58ed-976c-9f228d8a8d14"]

[[statement]]
id = "Base goodness is invariant under nature-fixed approval variation"
lean = "GoodnessInvariantUnderApprovalVariation"
paraphrase = "Open weak invariance premise: every profile of the supplied family that keeps the base profile's actual perfections has exactly the base profile's goodness relation, whatever the named assessor approves there."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "decf0fdd-1b81-4d8f-930a-55a0537d32d6"]
disambiguations = ["f5b1a1e9-1ba8-58ed-976c-9f228d8a8d14"]

[[statement]]
id = "The named assessor's approvals differ in some nature-fixed profile"
lean = "ApprovalVariesWithNaturesFixed"
paraphrase = "Open variation premise: some profile of the supplied family keeps the base profile's actual perfections while the named assessor's approval differs from its base approval at some bearer and perfection. Instance-neutral in the named assessor: its warrant differs by assessor (human, voluntarist, nature-fixed divine) and is recorded per instance in the goodness note."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "decf0fdd-1b81-4d8f-930a-55a0537d32d6"]
disambiguations = ["f5b1a1e9-1ba8-58ed-976c-9f228d8a8d14"]

[[statement]]
id = "Approval does not coextend with goodness in every nature-fixed profile"
lean = "ApprovalDoesNotGround"
paraphrase = "It is not the case that, in every profile of the supplied family keeping the base actual perfections, goodness coextends with the named assessor's approval. This is the modal (covariation) failure of approval; it does not say in which profile the coextension fails and it is the finding of the Euthyphro core."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "decf0fdd-1b81-4d8f-930a-55a0537d32d6"]
disambiguations = ["f5b1a1e9-1ba8-58ed-976c-9f228d8a8d14"]

[[statement]]
id = "Approval coextensive with goodness at the base stays so in every nature-fixed profile"
lean = "ApprovalCorrectnessTransfers"
paraphrase = "Open rigidity bridge: if goodness coextends with the named assessor's approval in the base profile, it coextends with that assessor's approval in every profile of the supplied family keeping the base actual perfections. The encoded antecedent is base coextension, not identity of goodness with approval; an identity reading would motivate the bridge but is not encoded. Given weak invariance and variation this bridge is equivalent to the extensional approval failure 50d8be94 (Controls), so it carries that premise's content rather than supporting it. Instance-neutral in the named assessor: its warrant differs by assessor (human, voluntarist, nature-fixed divine) and is recorded per instance in the goodness note."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "decf0fdd-1b81-4d8f-930a-55a0537d32d6"]
disambiguations = ["f5b1a1e9-1ba8-58ed-976c-9f228d8a8d14"]

[[statement]]
id = "Approval coextends with goodness in every nature-fixed profile"
lean = "ApprovalGroundsAcrossNatureFixed"
paraphrase = "Divine-command rival: in every profile of the supplied family keeping the base actual perfections, goodness coextends with the named assessor's approval. It is the exact negation of the modal approval failure."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "decf0fdd-1b81-4d8f-930a-55a0537d32d6"]
disambiguations = ["f5b1a1e9-1ba8-58ed-976c-9f228d8a8d14"]

[[statement]]
id = "The named assessor's approvals are fixed by the natures"
lean = "ApprovalsFixedByNatures"
paraphrase = "Every profile of the supplied family that keeps the base profile's actual perfections also keeps the named assessor's base approval at every bearer and perfection. This is the positive replacement account of a command theory that accepts invariance. Instance-neutral in the named assessor: its warrant differs by assessor (human, voluntarist, nature-fixed divine) and is recorded per instance in the goodness note."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "decf0fdd-1b81-4d8f-930a-55a0537d32d6"]
disambiguations = ["f5b1a1e9-1ba8-58ed-976c-9f228d8a8d14"]

[[statement]]
id = "The named approval account fails or coextends with the due-actuality account"
lean = "ApprovalFailsOrCoincidesWithDue"
paraphrase = "Open weak approval premise: in the fixed profile the named fixed-assessor approval account either does not correctly describe goodness, or has pointwise the same extension as the named due-actuality account. Given the other three correct-support inputs and excluded middle it is equivalent to the due-actuality thesis, so it has no warrant of its own beyond its disjuncts; replacing 50d8be94 by it shows that 50d8be94 was stronger than needed, not that the thesis gained support."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "ea819c3e-09bb-5000-85f8-e4b28e34aead"]
disambiguations = ["f5b1a1e9-1ba8-58ed-976c-9f228d8a8d14"]

[[statement]]
id = "The named approval account coextends with the due-actuality account"
lean = "ApprovalCoincidesWithDue"
paraphrase = "In the fixed profile the named fixed-assessor approval account and the named due-actuality account have pointwise the same extension: the assessor approves a bearer's perfection exactly when it is a due actuality. Correctness of either account is not asserted."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "ea819c3e-09bb-5000-85f8-e4b28e34aead"]
disambiguations = ["f5b1a1e9-1ba8-58ed-976c-9f228d8a8d14"]

[[statement]]
id = "a6e4cd4b-4a88-4ce3-90e5-6a8877228dc2"
label = "Goodness is the assessor's actual approval while its approvals vary"
lean = "RigidifiedApprovalAccount"
paraphrase = "Rigidified actual-approval rival, with its test scenario: in the base profile goodness coextends with the named assessor's approval, every profile keeping the base actual perfections keeps the base goodness, and in some such profile the assessor's approvals differ. The variation conjunct is the scenario in which the theory is tested, not part of the theory."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "decf0fdd-1b81-4d8f-930a-55a0537d32d6"]
disambiguations = ["f5b1a1e9-1ba8-58ed-976c-9f228d8a8d14"]

[[statement]]
id = "Euthyphro modal approval test finite controls"
lean = "Controls"
paraphrase = "General facts: robust due actuality gives supervenience; weak invariance is stable truth of every aspect over the nature-fixed profiles; under approval as ground, invariance is equivalent to approvals fixed by natures; the rigidified account excludes the transfer bridge; command-constituted obligation with nature-fixed command variation is not invariant. The premise bundle of the extensional step is equivalent to the extensional approval failure, and given invariance and variation the transfer bridge alone is; with excluded middle the due thesis gives the weak approval premise. Fixed artifact models: a divine joint model (whose only nature-fixed profile is the base, so its modal conjuncts are degenerate), a human-assessor model, a rigidified model, a voluntarist model and a modified command model (a non-degenerate divine instance with a nature-fixed variant and a non-vacuous goodness constraint on commands). These are formal interpretations, not metaphysical possibility claims."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "decf0fdd-1b81-4d8f-930a-55a0537d32d6", "f6e1dde9-2228-4a54-8eb7-1135e7bc0218", "68191121-85f6-5bce-b32e-1900c8b52f57", "3fb2bd92-d135-5db1-8fe3-a3caa18a12ca"]
disambiguations = ["f5b1a1e9-1ba8-58ed-976c-9f228d8a8d14"]

[[argument]]
id = "Base goodness invariance from supervenience on the natural base"
theorem = "invarianceFromSupervenience"
premises = ["Goodness supervenes on the natural base across the approval profile family"]
conclusion = "Base goodness is invariant under nature-fixed approval variation"
rule = "instantiate supervenience at the base profile"
meaning = "Strength order: supervenience over every pair of profiles gives invariance of base goodness over the profiles that keep the base natures. The weak version is the one the Euthyphro argument uses."

[[argument]]
id = "Modal approval failure, from invariance and nature-fixed approval variation"
theorem = "approvalNotGroundFromInvariance"
premises = ["Base goodness is invariant under nature-fixed approval variation", "The named assessor's approvals differ in some nature-fixed profile"]
conclusion = "Approval does not coextend with goodness in every nature-fixed profile"
rule = "chain base approval, base goodness, varied goodness and varied approval; contradict the variation"
meaning = "Euthyphro core, analyst formulation: if goodness stays fixed while the natures stay fixed, and the assessor's approvals change in such a profile, approval cannot coextend with goodness in every such profile. The theorem is assessor-generic: it applies to a human assessor and to a divine assessor alike, and the instances differ only in whether the variation premise holds."

[[argument]]
id = "Named approval account fails, from modal approval failure and the rigidity bridge"
theorem = "approvalFailsFromNotGround"
premises = ["Approval does not coextend with goodness in every nature-fixed profile", "Approval coextensive with goodness at the base stays so in every nature-fixed profile"]
conclusion = "STMT-GOODNESS-APPROVAL-ACCOUNT-FAILS"
rule = "calibrate the base profile with the frame and space; modus tollens through the rigidity bridge"
meaning = "Modus tollens through the rigidity bridge: correctness of the named approval account is base coextension, the bridge would spread it to every nature-fixed profile, and the modal failure excludes that. In every family the premise bundle is equivalent to the conclusion, and given the core premises the bridge alone is (Controls). The modal finding is the premise b93773ca; this step adds no warrant to 50d8be94."
description = "Transcription by single application (AGENTS.md invariant 16): the premise bundle (modal approval failure plus the rigidity bridge) is equivalent to the extensional approval failure for every family, as the controls prove, so the step re-presents 50d8be94 rather than supporting it. It closes its conclusion only if both premises are closed. The Euthyphro finding is the modal failure b93773ca."
transcription = "single_application"

[[argument]]
id = "Approvals fixed by natures, from approval as ground and invariance"
theorem = "dctGroundPrice"
premises = ["Approval coextends with goodness in every nature-fixed profile", "Base goodness is invariant under nature-fixed approval variation"]
conclusion = "The named assessor's approvals are fixed by the natures"
rule = "transport base approval to base goodness, invariant goodness, and varied approval"
meaning = "Price of the divine-command rival: if approval coextends with goodness in every nature-fixed profile and base goodness is invariant there, the assessor's approvals are fixed by the natures, so the variation premise fails. A command theory that keeps invariance must deny nature-fixed approval variation, giving up a voluntarist command theory. It does not show which of approval and nature is explanatorily prior."

[[argument]]
id = "Weak approval premise from extensional approval failure"
theorem = "approvalFailsWeakens"
premises = ["STMT-GOODNESS-APPROVAL-ACCOUNT-FAILS"]
conclusion = "The named approval account fails or coextends with the due-actuality account"
rule = "disjunction introduction"
meaning = "Strength order: extensional failure of the named approval account gives the disjunction that it fails or coextends with the due-actuality account."

[[argument]]
id = "Weak approval premise from approval and due-actuality coextension"
theorem = "approvalCoincidesWeakens"
premises = ["The named approval account coextends with the due-actuality account"]
conclusion = "The named approval account fails or coextends with the due-actuality account"
rule = "disjunction introduction"
meaning = "Strength order: coextension of the named approval and due-actuality accounts gives the weak approval premise. This is the support option for an assessor whose approvals track due actuality, such as the nature-fixed divine assessor of the joint model."

[[argument]]
id = "Due actuality from correct support with the weak approval premise"
theorem = "dueFromWeakApprovalPremise"
premises = ["9108832f-0ef5-5036-8550-f405c7203ff4", "40420659-5692-5b9c-ab26-36941f0a1a97", "4c22019a-12c3-5cf6-adff-7288a3741e1a", "The named approval account fails or coextends with the due-actuality account"]
conclusion = "STMT-GOODNESS-DUE-TO-FORM-AND-END"
rule = "case split on the named extension of a supported correct account; an approval-correct case coextends with due actuality"
meaning = "Weaker sufficient premise set for the correct-support elimination: the approval account need not fail, provided that if it is correct it coextends with due actuality. In the divine joint model the extensional approval-failure premise is false and this weak premise is true. Given the other three premises, the weak premise is equivalent to the conclusion (with excluded middle the due thesis gives it, as the Euthyphro controls prove). The result shows that 50d8be94 was stronger than needed; it adds no support to the due thesis. No premise is established."
definitions = ["2b760306-fed0-583e-b7b8-53a8a1d85676", "b9df0e5b-7d1e-5259-a5d5-910e85328aab", "68191121-85f6-5bce-b32e-1900c8b52f57", "ea819c3e-09bb-5000-85f8-e4b28e34aead", "3fb2bd92-d135-5db1-8fe3-a3caa18a12ca"]

[[argument]]
id = "Euthyphro modal approval test has joint and omission models"
theorem = "controls"
premises = []
conclusion = "Euthyphro modal approval test finite controls"
rule = "explicit finite artifact interpretations and general structural lemmas"
meaning = "On the existing knife and counterweight profile: a divine joint model has goodness as due actuality in every profile, supervenience, approval exactly of the good, approvals fixed by natures and no variation; there the extensional approval-failure premise is false while the weak approval premise and the due thesis hold. A human-assessor model satisfies invariance, variation and (vacuously, since its base approval is incorrect) transfer, and the approval account fails without coextending with due actuality (the varied approvals are of aspects, not acts). A rigidified model omits transfer: invariance and variation hold, approval does not ground, yet base approval is correct. A voluntarist model omits invariance: approval varies and grounds goodness. The divine joint model's second profile changes the natures, so its only nature-fixed profile is the base and its modal conjuncts hold trivially; its non-trivial content is extensional. A modified command model is the non-degenerate divine instance: a nature-fixed variant with fixed approvals, goodness fixed, cruelty never commanded (so the goodness constraint on commands is not vacuous), and the promise-keeping command and obligation varying. The premise bundle of the extensional step is equivalent to its conclusion, and given invariance and variation the bridge alone is. General conjuncts: robust due actuality gives supervenience; weak invariance equals stable truth of every aspect over the nature-fixed profiles; the rigidified account excludes transfer; command-constituted obligation with command variation is not invariant."

