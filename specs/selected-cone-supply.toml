rule = "Locate the unmatched sender and lift its transfer path to the selected grounding cone"
meaning = "A matching deficit excludes every actual concrete ground of the upstream sender by the stated coverage rule. Each transfer on its path to the fixed recipient follows a grounding edge, so the same sender is a source reached in the recipient's complete grounding cone. The finite event ancestry concerns selected transfers. Other grounding branches can continue without end."
