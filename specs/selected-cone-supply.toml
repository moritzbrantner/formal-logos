definitions = ["a1b2e330-388f-4120-bc5c-969642317792", "9c6e4314-2e35-52ff-951e-db752a3c8ce2", "c57e2682-08e6-527e-950f-0fa0a7ff11ef", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
paraphrase = "Every positive entry of the fixed ledger follows a Profile.grounds edge among actual concreta at this world. The sum over all ordered pairs of those bearers is finite. A positive entry into the specified recipient has no return path of positive entries."

