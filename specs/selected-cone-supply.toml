label = "Receipt exit links WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT_2 and WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT_3"
lean = "SelectedReceiptExit"
definitions = ["a1b2e330-388f-4120-bc5c-969642317792", "9c6e4314-2e35-52ff-951e-db752a3c8ce2", "c57e2682-08e6-527e-950f-0fa0a7ff11ef", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]
paraphrase = "Every event in the fixed selected class follows a Profile.grounds edge among actual concreta at this world. A marked event enters the specified recipient. There is no selected transfer path back from that recipient to the sender, and the events whose senders can reach the marked sender by selected transfers form a finite type, including the marked event itself."

[[statement]]
id = "973317de-b22b-4954-8e9b-9341f3ce2b8a"
label = "Flow exit links WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT_2 and WELL_FOUNDEDNESS_AND_ANTI_BRUTE_ROOT_3"
