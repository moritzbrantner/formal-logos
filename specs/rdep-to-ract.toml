[[statement]]
id = "94036513-8146-4137-8cce-daf40577369d"
label = "Second unde, real-otherness form: a nature actual through a really other esse receives it"
lean = "ActualizedRealOtherQuiddityReceivesEsse"
paraphrase = "OPEN, analyst formulation, attribution deferred: the weaker sibling of 89d82643, reading q.3 a.4's 'ad essentiam quae est aliud ab ipso' as real otherness. For every x: if x's nature is actual in x through esse, is other in content than being itself, and x's esse is not really identical with its essence (OWN_BEING_2 fails), then x's esse is received in its nature (RECEPTION_OF_ESSE_1). With real otherness of whatever is not esse tantum it gives back 89d82643 (compositionStepUnbundled). Suárez's profile satisfies it vacuously."
definitions = ["82ab06d0-5328-4d85-b3a2-4a13532d9524", "97c4f504-4792-43c6-9f61-ae23df732d5f", "4433942e-aaf6-55a9-b777-66e55638103d", "87f9e331-d75e-41c5-994f-125c4969deb5", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72"]
disambiguations = ["a409105e-8389-46ce-b14b-bebbc2864198", "5921354b-51e6-5da3-8d8c-e9041840fd9f", "1bff3cb4-f73b-42d4-ba2c-ff782e9df39b"]
connection_plan = { target_statement_id = "29e71e43-1d34-5008-8811-897fbddda209", missing_bridge = "Real otherness of whatever is not esse tantum (NonOwnBeingsHaveRealOtherness), so that this sibling with the first unde and the nature in act gives CREATURE_1 reception. Its registered route is De ente stage (b): 860eae63 to a576300f (at most one actual being whose esse is its essence), plus a real-identity being that is esse tantum.", blocker = "Real otherness via stage (b) rests on stage (b)'s premises read on OWN_BEING_2, 75b5b027 (two real-identity beings share one nature), f13d1cdd (no added difference) and 38ed105c (no matter), which together amount to the bridge OWN_BEING_2 => OWN_BEING_1 (RealIdentityIsEsseTantum). The source states f13d1cdd and 38ed105c of esse tantum (OWN_BEING_1). On a real-identity account of creatures such as Suárez's, material creatures falsify 38ed105c on OWN_BEING_2 and plausibly f13d1cdd, while 75b5b027 holds for two humans and fails only across species. Support through stage (b)'s existential form would also presuppose a real-identity being that is esse tantum, close to the GOD_4 conclusion. Stage (b) shares 7fcfcee8 and 14325c83 with the reception cluster." }

[[statement]]
id = "f2871bf1-63f2-4045-bee5-af0a35e56b29"
label = "The composition step is real otherness plus reception, and stage (b) supplies real otherness"
lean = "CompositionStepUnbundled"
paraphrase = "Premise-free, over every grades frame and principle sort. (1) The content form of the second unde (89d82643) gives its real-otherness form. (2) Real otherness of whatever is not esse tantum, with the real-otherness form, gives back the content form. (3) If at most one being has its esse really identical with its essence, and some such being is esse tantum, then whatever is not esse tantum has real otherness. (4) The non-existential bridge OWN_BEING_2 => OWN_BEING_1 (whatever has its esse really identical with its essence is esse tantum) gives real otherness by itself. Caution on (3): its existential premise, a real-identity being that is esse tantum, is close to the GOD_4 conclusion that 29e71e43 serves on the esse-root routes, so support for real otherness through (3) would beg the question there; (4) is the form that does not. Formally immediate; it locates the load, it does not supply warrant."
