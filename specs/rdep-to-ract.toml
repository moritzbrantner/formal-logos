paraphrase = "OPEN, analyst formulation, attribution deferred: every being in the domain is actually what it is, its nature (the respect in which it is what it is) being in act in it. The domain is actual beings; for a merely possible being it would fail."
definitions = ["97c4f504-4792-43c6-9f61-ae23df732d5f", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168"]
