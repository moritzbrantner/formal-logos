# q.4 a.1 ad 3 from the dependence of every actuality on being (R-dep, 7067553d) to the
# act-of-being theses R-act1 (8c64b036) and R-act2 (254ee26f), with q.3 a.4's second
# proof and De ente capp.3-4. Each bridge is located, shown sufficient, shown needed on
