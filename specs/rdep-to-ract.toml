[[statement]]
id = "8d7e24dc-20b9-44b8-8c5f-7bac55774f34"
label = "First unde: what a thing has in act, given that it has being, is actual in it through esse"
lean = "DependenceIsActualization"
paraphrase = "OPEN, analyst formulation of the first 'unde' of ST I q.4 a.1 ad 3 ('Nihil enim habet actualitatem, nisi inquantum est: unde ipsum esse est actualitas omnium rerum, et etiam ipsarum formarum'), attribution deferred. For every x and respect r: if x has r in act and x has being, then r is actual in x through esse, stated with the frame field ActualizedBy, intended as the act reading (ACTUALIZED_THROUGH_2); the field has the same type as the dependence relation (ACTUALIZED_THROUGH_1), and the derivations using this bridge are generic in the frame, so they also hold on the dependence reading, where this bridge is analytic. The route is sense-neutral in 'actualized through'. With R-dep (7067553d) it is equivalent to 'esse is the actuality of every form had in act'. On the dependence reading (ACTUALIZED_THROUGH_1) it holds in every frame. It does not say that esse is received or limited."
definitions = ["82ab06d0-5328-4d85-b3a2-4a13532d9524", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168"]
disambiguations = ["a409105e-8389-46ce-b14b-bebbc2864198"]

[[statement]]
id = "89d82643-cf45-4933-90b3-83a89f6210f2"
label = "Second unde: a nature actual through an esse other than itself receives that esse"
lean = "ActualizedQuiddityReceivesEsse"
paraphrase = "OPEN, analyst formulation of the second 'unde' of ST I q.4 a.1 ad 3 ('Unde non comparatur ad alia sicut recipiens ad receptum: sed magis sicut receptum ad recipiens') and of q.3 a.4 co.'s 'Oportet igitur quod ipsum esse comparetur ad essentiam quae est aliud ab ipso, sicut actus ad potentiam', in its content form at the nature, attribution deferred. This is the STRONG version: its antecedent asks only distinctness of content between the nature and being. Its weaker sibling reads q.3 a.4's 'aliud' as real otherness (registered as strengthens). It bundles (i) real otherness with (ii) reception in the nature. For every x: if x's nature is actual in x through esse (ACTUALIZED_THROUGH_2) and the nature is not being itself, then x's esse is received in that nature as act in receiving potency (RECEPTION_OF_ESSE_1). 'Not being itself' is distinctness of content, which every view considered grants. RECEPTION_OF_ESSE_1 leaves the constitution of the receiving principle open; on the real-composition sense (RECEPTION_OF_ESSE_VERSUS_EXTERNAL_CAUSE_5) Suárez denies it."
definitions = ["82ab06d0-5328-4d85-b3a2-4a13532d9524", "97c4f504-4792-43c6-9f61-ae23df732d5f", "4433942e-aaf6-55a9-b777-66e55638103d", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72"]
disambiguations = ["a409105e-8389-46ce-b14b-bebbc2864198", "5921354b-51e6-5da3-8d8c-e9041840fd9f"]

[[statement]]
