[[statement]]
id = "d61f1fa7-53a8-45ee-bb8f-6d6f85de4818"
label = "Given dependence, each unde bridge is equivalent to what it delivers"
lean = "UndeLoadMap"
paraphrase = "Premise-free, over every grades frame. (1) Given R-dep, the first 'unde' bridge is equivalent to 'esse is the actuality of every form had in act'. (2) Given R-dep, the first bridge and the nature in act, the second bridge is equivalent to 'whatever is not its own being has its esse received in its nature'. (3) Given R-dep, the first bridge and the witness premise, inclusion is equivalent to R-act2. (4) On the dependence reading (ACTUALIZED_THROUGH_1) the first bridge holds in every frame. Each equivalence is formally immediate ((3) holds by construction), so the certificate fixes where the load sits; that the inference is therefore explicative, making the act-of-being commitment explicit rather than deriving it from dependence, is the analyst's judgment. Since every result is generic in the frame, (4) also shows that the act reading does no work on this route."
definitions = ["799e0ff7-9705-4b50-89a9-a8463c1b4f22", "82ab06d0-5328-4d85-b3a2-4a13532d9524", "97c4f504-4792-43c6-9f61-ae23df732d5f", "ad76481a-f038-4652-9c6e-0e0441eee7e5", "4433942e-aaf6-55a9-b777-66e55638103d", "0a2bf1a0-bfc5-45d7-966a-a28919b6e847", "65e38ffa-5a1c-55d0-935c-6538d843b780", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72"]
disambiguations = ["a409105e-8389-46ce-b14b-bebbc2864198", "62ca3d65-8dd4-4187-abe1-a928b3045f12", "5921354b-51e6-5da3-8d8c-e9041840fd9f"]

[[statement]]
id = "2817ceab-e913-4512-9bbb-ff4acb5d68de"
label = "Received esse adds nothing to the essence-only derivation of finitude in perfection"
lean = "LimitationComparison"
paraphrase = "Premise-free, over every grades frame. Explanandum: whatever is not its own being lacks some pure perfection. (1) Essence-only: if each being has in act only what its nature admits, and a nature other than being itself excludes some pure perfection, the explanandum follows. (2) Reception: if whatever is not its own being has its esse received in its nature, and received esse gives only what the nature admits ('limitatum ... ad capacitatem naturae recipientis', De ente cap.4), and the same nature premise holds, the explanandum follows. (3) The reception premises imply the essence-only premise on every being that is not its own being. Both derivations need the nature premise. The implications are formally immediate; that reception is therefore not needed for this explanandum is the analyst's judgment, and not a claim that reception is false."
definitions = ["97c4f504-4792-43c6-9f61-ae23df732d5f", "dbae9538-e7f2-47ef-9fdd-f8b6c98efaf5", "ad76481a-f038-4652-9c6e-0e0441eee7e5", "4433942e-aaf6-55a9-b777-66e55638103d", "65e38ffa-5a1c-55d0-935c-6538d843b780"]
disambiguations = ["5921354b-51e6-5da3-8d8c-e9041840fd9f"]

[[statement]]
id = "f2013d4f-0d00-4a2c-89df-33e4db9fb335"
label = "Act, non-reception and thin profiles of the unde inference: controls"
lean = "Control.Controls"
paraphrase = "Closed finite profiles over two beings and three stand-in respects (being, a nature, wisdom); statements about them only. Act profile: R-dep, both unde bridges, the nature in act and 7de89edb hold, and so does R-act1. Non-reception profile, read with the act relation (esse actualizes the nature but is not received in it) and with the dependence relation: R-dep, the first bridge, the nature in act and 7de89edb hold; the second bridge and R-act1 fail; the essence-only account and finitude in perfection hold. Omitting the first bridge: R-act1 fails though the rest holds. Reception without the nature premise: R-act1, 7de89edb and the capacity bridge hold and finitude fails. For R-act2: with intensive inclusion it holds; with thin inclusion, or with no actualization recorded, it fails while R-dep, the first bridge where present and the witness premise hold. Neither the extensions nor the Lean types tell the act relation from the dependence relation: both senses have type B → R → R → Prop, so bind-check does not enforce the distinction; only the definition records state it."
definitions = ["799e0ff7-9705-4b50-89a9-a8463c1b4f22", "82ab06d0-5328-4d85-b3a2-4a13532d9524", "97c4f504-4792-43c6-9f61-ae23df732d5f", "ad76481a-f038-4652-9c6e-0e0441eee7e5", "dbae9538-e7f2-47ef-9fdd-f8b6c98efaf5", "4433942e-aaf6-55a9-b777-66e55638103d", "6ced5205-e6a4-585e-950e-3b22e7c9ef01", "0a2bf1a0-bfc5-45d7-966a-a28919b6e847", "84147eb5-88ef-46e7-9a0d-9c18d5137f16", "65e38ffa-5a1c-55d0-935c-6538d843b780"]
disambiguations = ["a409105e-8389-46ce-b14b-bebbc2864198", "62ca3d65-8dd4-4187-abe1-a928b3045f12", "5921354b-51e6-5da3-8d8c-e9041840fd9f"]

[[argument]]
id = "a811f5a3-09ba-4648-ae0c-8e0e66c07649"
label = "R-act1 from dependence through the two unde bridges, checked"
theorem = "ractOneFromDependence"
definitions = ["82ab06d0-5328-4d85-b3a2-4a13532d9524", "97c4f504-4792-43c6-9f61-ae23df732d5f", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72", "6ced5205-e6a4-585e-950e-3b22e7c9ef01", "4433942e-aaf6-55a9-b777-66e55638103d", "ad76481a-f038-4652-9c6e-0e0441eee7e5"]
description = "Near-transcription (single application): given R-dep, the first unde and the nature in act, the second unde is equivalent to the reception half of R-act1 (undeLoadMap, conjunct 2), so the proof applies that bridge to deliver its own content; the limited half comes from 7de89edb. Own being is read as esse tantum (OWN_BEING_1, DEF ad76481a). Generic in the frame, so it holds on the dependence reading of 'actualized through' as well. It makes the commitment explicit and closes nothing by itself."
transcription = "single_application"
premises = ["7067553d-cad9-5d79-b6b2-912e35051530", "8d7e24dc-20b9-44b8-8c5f-7bac55774f34", "89d82643-cf45-4933-90b3-83a89f6210f2", "073e1411-ad82-4b6c-af8d-58829b2afa01", "7de89edb-e3a8-59ee-9740-8d0ce7c8ea24"]
conclusion = "8c64b036-3db9-4143-9a8d-d7814cc84c79"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Chain dependence, actualization, reception and limitation at the nature"
meaning = "Take x whose nature is not being itself. Its nature is in act, so by R-dep x has being; by the first unde its nature is actual through esse; by the second, since the nature is not being itself, x's esse is received in its nature; received esse is limited. Own being is read as esse tantum (the nature is being itself). Given R-dep, the first bridge and the nature in act, the second bridge is equivalent to the reception half of the conclusion (undeLoadMap), so this derivation makes the commitment explicit."

