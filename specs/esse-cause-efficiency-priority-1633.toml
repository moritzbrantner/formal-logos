# #1633, remaining item 1: the no-component-first-being arguments e7b4c683 and
# 358d8c6e apply "an efficient cause is prior to what it causes" (e078f07b)
# with the mode-unspecified CausesIn as its cause relation. The sibling below
# carries the efficiency in a type: the participated component has an efficient
# cause of its esse other than itself (fed by the efficient q.3 a.4 reading
# 1ff08418), and the priority of tenseless efficient causes of esse is its own
# OPEN premise, derivable from e078f07b only through an OPEN tense bridge
# (Codex review on #1640). Existing routes are unchanged.

[batch]
vocab = "TruthCore.Causality.EsseCauseEfficiencyPriority"
results = "TruthCore.Results.Causality.EsseCauseEfficiencyPriority"

[[statement]]
id = "Whatever has being by participation has an efficient cause of its esse other than itself"
lean = "ParticipatedHasOtherEfficientEsseCause"
paraphrase = "Analyst formulation, attribution deferred: for every x that has its being by participation, some c other than x (numerical distinctness only) is an efficient cause of x's esse (EfficientlyCausesEsse c x, the tenseless agent-cause primitive of the q.3 a.4 efficiency profile). The efficient sibling of STMT-PARTICIPATED-HAS-OTHER-CAUSE (2b25a78c), whose cause of being has no fixed mode; neither entails the other by definition, since an efficient cause of esse is not defined to stand in CausesIn. It does not say that c is in act, that c is the only cause, or anything about present sustaining or time."
definitions = ["14d30c53-51c2-502d-b009-247dac0421e0", "8934912c-7997-4af7-9520-ec94ff221043", "DEF-ESSE"]

[[statement]]
id = "An efficient cause of a thing's esse is SIMPLY_PRIOR_1 to that thing"
lean = "EfficientEsseCauseIsPrior"
paraphrase = "OPEN analyst premise, attribution deferred: for all c and x, if c is an efficient cause of x's esse (EfficientlyCausesEsse, tenseless: originating or sustaining), then c is simply prior to x (PriorSimply, DEF-SIMPLE-PRIORITY). It is the tenseless counterpart of STMT-EFFICIENT-CAUSE-IS-PRIOR-TO-EFFECT (e078f07b), not that statement: e078f07b's claim and derivation concern the secunda via's here-and-now efficient causes, whose per se causes act together. A merely originating agent of x's esse that no longer acts is covered here and not there; whether such an agent is simply prior to x is part of what this premise asserts."
definitions = ["8934912c-7997-4af7-9520-ec94ff221043", "DEF-SIMPLE-PRIORITY", "DEF-ESSE"]

[[statement]]
id = "Every efficient cause of a thing's esse causes it here and now"
lean = "EfficientEsseCauseActsHereAndNow"
paraphrase = "OPEN analyst tense bridge, attribution deferred: for all c and x, if c is an efficient cause of x's esse (EfficientlyCausesEsse, tenseless), then c is, here and now, an efficient cause of x at the esse respect in the secunda via's sense (EfficientlyCausesIn, DEF-EFFICIENT-CAUSING). It says that every agent cause of esse is a present, conserving cause; a merely originating agent of esse falsifies it (TenseGapControl). It bears on the conservation question of #1604/#1616 and is not derived here."
definitions = ["8934912c-7997-4af7-9520-ec94ff221043", "DEF-EFFICIENT-CAUSING", "DEF-ESSE"]

[[statement]]
id = "Efficient-priority controls: non-efficient participation, nonvacuity, tense gap"
lean = "EfficientPriorityControls"
paraphrase = "Closed finite controls: there are interpretations over Bool such that (1) participated beings have distinct esse, the mode-unspecified q.3 a.4 conclusion STMT-DISTINCT-ESSE-REQUIRES-EXTERNAL-CAUSE and the mode-unspecified participation premise STMT-PARTICIPATED-HAS-OTHER-CAUSE hold, the component-kinds premise, both act-priority premises (simple and at a first being) and non-overlap hold, and efficient causes of esse are prior, while priority read over the mode-unspecified CausesIn fails, the efficient q.3 a.4 reading and the efficient participation premise fail, and some component is a first being; (2) some component exists, every input of the efficient sibling route holds, the secunda via priority holds for a here-and-now relation together with the tense bridge, and no component is a first being; (3) the secunda via priority holds for a here-and-now relation while the tense bridge and the priority of efficient causes of esse fail. Only these conjuncts are certified. The witnesses built in the proof (not part of the type) are: in (1), false a participated component of true whose esse true causes non-efficiently, nothing prior to anything; in (2), the same with true an efficient (and here-and-now) cause of false's esse and prior to it; in (3), true an efficient cause of false's esse, nothing causing here and now, nothing prior. 'Non-efficient' and 'here and now' are labels for unconstrained primitives: (1) shows that the efficient participation premise is not supplied by the mode-unspecified route and that priority over CausesIn is not implied by priority of efficient causes of esse; (3) shows that the tense bridge is needed to obtain that priority from the secunda via statement."
definitions = ["14d30c53-51c2-502d-b009-247dac0421e0", "8934912c-7997-4af7-9520-ec94ff221043", "d8963cdd-0283-4b03-b006-6fb946a8c9e4", "98ac7aa1-54cb-553c-826b-2a69257f6cbe", "DEF-Q3A4-ACTUAL-DISTINCT-ESSE", "DEF-CAUSE-OF-PERFECTION", "DEF-SIMPLE-PRIORITY", "DEF-EFFICIENT-CAUSING", "DEF-ESSE"]

[[argument]]
id = "Participated beings have an efficient esse-cause, from the efficient q.3 a.4 reading"
theorem = "participatedEfficientCauseFromQ3A4"
premises = [
  "cbb068e8-337d-5772-a3f9-10df457ba9fe",
  "1ff08418-e7a8-473f-9348-f2fe83b4d00e",
]
conclusion = "Whatever has being by participation has an efficient cause of its esse other than itself"
axioms = []
strong_version_needed = { "1ff08418-e7a8-473f-9348-f2fe83b4d00e" = "The conclusion is the efficiency of the participated being's cause; the weak version 33ad148b leaves the mode unspecified, and NonEfficientParticipationControl satisfies it while the conclusion fails." }
rule = "Universal instantiation, modus ponens and conjunction elimination"
meaning = "Efficient sibling of 4876dc46 and d3c6a6f7: whatever has being by participation actually exists with distinct esse (OPEN bridge cbb068e8), every actual distinct esse has an external efficient cause (1ff08418, itself resting on the OPEN efficiency bridge 58e6ec63), so whatever has being by participation has an efficient cause of its esse other than itself. Efficiency comes only from 1ff08418: in NonEfficientParticipationControl the mode-unspecified premises 33ad148b and 2b25a78c hold and the conclusion fails."

