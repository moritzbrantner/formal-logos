[[statement]]
id = "Each actual bearer whose esse is its essence has no actual cause of its esse"
lean = "ActualIdentityEsseHasNoSupplier"
paraphrase = "Analyst formulation, attribution deferred. On the fixed q3a4 profile, if x is in act as to esse and its represented esse equals its represented essence, then no c is an ActualEsseCause of x. This excludes all distinct actual bearers as causes of its actual esse in the profile's tenseless, mode-unspecified sense. The implication asserts no identity witness, common source, or modal necessity."
definitions = [
  "8163859b-95b3-4dd2-8a69-541bd332f32f",
  "183b48d2-1753-583d-aef9-4199cff86231",
  "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72",
]

[[argument]]
id = "Internal reception excludes incoming actual esse supply at identity"
theorem = "identityEsseUnderivedOfReception"
premises = [
  "da72ae93-5c8d-4717-8c17-97eeb8037317",
  "65f3d0c7-cc3d-4ce3-a4a9-6fa38bf722cb",
  "7fcfcee8-86ab-5a16-84ad-124cf5e8f9b2",
  "14325c83-1c3f-5afb-b63f-52b0c2b2a326",
]
conclusion = "Each actual bearer whose esse is its essence has no actual cause of its esse"
axioms = []
rule = "An incoming actual cause implies a receiver that would be in receptive potency to itself"
meaning = "For a bearer whose represented esse is its essence, the cause-to-reception bridge would make its esse received in some principle. Identity-scoped reception fixes that principle as the bearer's essence, here identical to its esse. The receiver-potency law then contradicts the irreflexivity of receptive potency. The cause-to-reception bridge retains its act-of-being individuation scope. The derivation uses the same self-potency inference as contingentDistinctEsseFromReception with a causal antecedent in place of contingency."

[[argument]]
id = "Underived identity ancestry gives each actual esse bearer a finite root audit"
theorem = "auditsOfIdentityAncestry"
strong_version_needed = { "ee4ab504-c8fe-59bc-bc96-7cbeefed6410" = "The proof applies excluded middle (not just double-negation elimination) to `p.esseOf x = p.essenceOf x` (in auditsOfIdentityAncestry), the esse–essence identity of an arbitrary actual bearer, which is not given as a GOD_4 candidate. LocalLogic (ca432e24) decides only whether an actual bearer is identical with a GOD_4 candidate, and gives double-negation elimination for that candidate's esse–essence identity." }
comparator_theorems = ["externalSupplyWithoutIdentityReceipt"]
premises = [
  "Each actual bearer whose esse is its essence has no actual cause of its esse",
  "3d01134d-0b03-4469-a81a-a18d6e179fa0",
  "ee4ab504-c8fe-59bc-bc96-7cbeefed6410",
]
conclusion = "3008c7db-0236-4b03-9da7-f41ea8d8cac1"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Select the identity bearer or its named actual identity ancestor and certify its roothood and finite path"
meaning = "Use explicit excluded middle for represented esse–essence identity of each actual bearer. For identity, use the bearer itself with the empty path. For distinct esse, use the actual identity bearer and finite path specified by 3d01134d. In either case there is no incoming cause at that root. Apply the existing positive certificate criterion to the fixed actual esse relation. The resulting per-bearer certificate implies 20babef7 through the existing finite-audit conversion. Using the existing 3d01134d derivation from 20babef7 here is circular support for 20babef7; its other existing producer invokes well-foundedness, which already implies 20babef7. The two-bearer control retains finite identity ancestry, actual causation in both directions, internal receipt of the distinct bearer's esse, and the other reception laws. It omits causal-to-internal receipt precisely at the identity bearer, which still receives actual supply. Both rootedness and finite root audits then fail. This is a separation in the interpreted predicates."

[[statement]]
id = "Each actual esse bearer has finitely many actual identity ancestors"
lean = "ActualIdentityAncestorSetsFinite"
paraphrase = "Analyst formulation, attribution deferred. For each actual x in the fixed q3a4 profile, the set of actual r with represented esse equal to represented essence and a finite ActualEsseCause path from r to x is finite. An empty path includes x itself when x is an identity bearer."
definitions = [
  "8163859b-95b3-4dd2-8a69-541bd332f32f",
  "183b48d2-1753-583d-aef9-4199cff86231",
  "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72",
]

[[statement]]
id = "No actual esse identity bearer lies on a nonempty actual esse-cause loop"
lean = "ActualIdentityAncestryAcyclic"
paraphrase = "Analyst formulation, attribution deferred. On the fixed q3a4 profile no actual r with represented esse equal to represented essence has a nonempty finite ActualEsseCause path from r back to r. Any intermediate bearers may have esse distinct from essence."
definitions = [
  "8163859b-95b3-4dd2-8a69-541bd332f32f",
  "183b48d2-1753-583d-aef9-4199cff86231",
  "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72",
]

[[argument]]
id = "Finite acyclic identity ancestry gives each actual esse bearer a finite root audit"
theorem = "auditsOfFiniteAcyclicIdentityAncestry"
strong_version_needed = { "ee4ab504-c8fe-59bc-bc96-7cbeefed6410" = "The proof applies excluded middle (not just double-negation elimination) to `p.esseOf y = p.essenceOf y` (in auditsOfFiniteAcyclicIdentityAncestry), the esse–essence identity of an arbitrary actual bearer, which is not given as a GOD_4 candidate. LocalLogic (ca432e24) decides only whether an actual bearer is identical with a GOD_4 candidate, and gives double-negation elimination for that candidate's esse–essence identity." }
comparator_theorems = ["closedOfFiniteAcyclicIdentityAncestry", "finiteAcyclicIdentityAncestryAllowsSupply"]
premises = [
  "Each actual esse bearer has finitely many actual identity ancestors",
  "No actual esse identity bearer lies on a nonempty actual esse-cause loop",
  "3d01134d-0b03-4469-a81a-a18d6e179fa0",
  "ee4ab504-c8fe-59bc-bc96-7cbeefed6410",
]
conclusion = "3008c7db-0236-4b03-9da7-f41ea8d8cac1"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Choose a minimal actual identity ancestor and certify its globally supplierless status and finite path"
meaning = "An actual target is its own identity ancestor or has one by the distinct-esse premise. The nonempty finite set of such ancestors has a minimal member under nonempty actual esse-cause reachability. An incoming supplier would itself be an actual identity or have an actual identity ancestor. Either yields another identity ancestor of the target strictly upstream of the chosen member. The existing positive certificate criterion yields an audit, and the existing audit consumer gives closed-collection rootedness on the same profile. The ancestry premise requires independent warrant to avoid circular support through rootedness. The three-bearer chain preserves all inputs while a directly supplied identity bearer directly supplies a distinct-esse recipient."
