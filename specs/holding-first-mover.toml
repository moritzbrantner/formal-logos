# total-holding repair feeding the relative first holder, and the MOTION_3 to
# MOTION_1 sense bridges (3) named in docs/notes/caused-mover-cstar.md 9.4 and
# 10.5. Curation pass 2 of #2103 (lane E batch 7). Analyst formulations,
