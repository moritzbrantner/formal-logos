# C* for caused movers on the absolute First Way: registration of the
# formal next tests of docs/notes/caused-mover-cstar.md, section 8. The unified
# operation derivation of C* for caused movers (631e014f, d791628f, 0628359b,
# 7bf380c6 |- e3afc8a3), its classical extension to the scope bridge b3573a61,
# and the reciprocity exclusion of the strong per se premise with the regress
# (control 3 of section 4). The CAUSE_1/CAUSE_2 preflight failure of the domain
# guard is resolved by declaring 631e014f, the premise that passes from a
# caused (CAUSE_2) being to its moving (CAUSE_1), as the sense bridge.
# Analyst formulations, attribution deferred.

[batch]
vocab = "TruthCore.Causality.CausedMoverCStar"
