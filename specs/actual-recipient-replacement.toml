[[statement]]
id = "Actual recipient withholding can preserve contingent giving in every world"
lean = "Boundary"
paraphrase = "In a two-world frame with universal access, the same necessary giver gives being factively to a contingent recipient in every world. It gives the actual contingent recipient being in the actual world, and withholds being from that recipient in a world where the recipient is absent and a replacement receives being. The model assigns the giver power for the actual contingents' joint absence using the existing positive-outcome power assignment. Neither world lacks contingent concreta. This is a control on the supplied frame."
definitions = ["6ecf24d5-5001-4571-937c-2632ac8c2c66", "62dfa893-b633-4513-9790-8f9a0a3087e0", "97f37f5c-7f82-5077-9bb9-6cfc8673631d"]

[[argument]]
id = "Test actual recipient absence with contingent replacement giving"
theorem = "boundary"
premises = []
conclusion = "Actual recipient withholding can preserve contingent giving in every world"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Witness both recipient roles on the shared frame and restrict the absence quantifier"
meaning = "Uses the Pruss-power roster with factive giving in both worlds. Every actual contingent is the first recipient, so the alternative supports the fixed-population withholding condition while still supplying a contingent recipient. The assigned power and universally accessible worlds are structural inputs. The control supplies no purpose, rational appetite, intrinsic invariance, simplicity or real-world modal admissibility."

