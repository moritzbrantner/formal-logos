[[statement]]
id = "060df804-10d5-445c-ac1f-0549ac7c8c02"
label = "All single primary relay cuts can leave a specified feed's intrinsic sourcehood unresolved"
lean = "PrimaryCutSourceComparison"
definitions = ["f0bdc622-1770-455d-9c83-0b57bf0af456", "e1b95906-8d38-59c3-abee-0ccc1c9d333b", "febac82d-1ca3-5773-89ec-0401f1bac7a0", "822c9912-2313-584b-b2b7-77031da20107", "a6e1ef95-8138-5cfc-8fe2-1202ba3b9a5c"]
disambiguations = ["ba851630-7eec-5851-8ad2-d8eff7430e41", "4b02d34a-9226-5009-9ac2-3b52f4222b21"]
paraphrase = "At every depth d, the same specified token actually supplies primary zero by a finite path in two uncut worlds on the same carrier. The token is intrinsic in one world and receives from auxiliary zero in the other. The complete incoming inventory at the token is empty in the sourced world and contains exactly auxiliary zero in the borrowed world. Every selected profile satisfies the local rule with intrinsic supply or an active linked supplier. The borrowed profiles have no intrinsic stages and obey the existing source-free transmission rule. Primary zero is finitely grounded in the sourced baseline and lacks finite grounding in the borrowed baseline. Both recipients are active in the baseline, and both selected response families report activity exactly for cuts i at or above d. No exact classifier from the full primary response record recovers the specified token's intrinsic status. Cutting the auxiliary entrance alone distinguishes the selected profiles. If the primary incoming link at d is cut, activity at primary zero agrees with activity at the feed for every profile satisfying the local law. Cutting the auxiliary entrance as well makes recipient activity equivalent to intrinsic power at the feed in every such profile."

[[argument]]
id = "Compare intrinsic and auxiliary-borrowed feeds by primary and auxiliary interventions"
theorem = "primaryCutSourceComparison"
premises = []
conclusion = "060df804-10d5-445c-ac1f-0549ac7c8c02"
rule = "Construct two same-carrier local profiles, compare their full primary records, and isolate the complete input to the feed"
meaning = "In the borrowed profiles every active auxiliary stage receives from its active successor. Auxiliary stage zero can therefore transmit to the same feed token that is intrinsic in the sourced world. The active feed maintains the same primary segment in each selected profile, fixing equal baseline and single-primary-cut records with opposite intrinsic labels. The borrowed world has no intrinsic source and cannot furnish a finite inductive derivation, even though the same feed actually supplies the recipient. When the primary incoming edge at d is cut, the primary segment reads the feed itself in every compatible profile. Removing the auxiliary entrance now tests the token in isolation under the complete incoming inventory. This identifies intrinsic status only in the specified model with the modeled intervention and full link coverage."
senses = {CRITERION_OF_CORRECTNESS = "CRITERION_OF_CORRECTNESS_1"}
sense_mixing_control = true
axioms = []
