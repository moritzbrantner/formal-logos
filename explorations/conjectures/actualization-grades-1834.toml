# Target-free cross-family conjecture pilot (#1834; scripts/discover_conjecture.py,
# docs/discover.md "Target-free conjecture pilot").
#
# Families. `actualization`: the prima via's first mover moved by none and the
# act/potency results about a first being (ST I q.2 a.3 first way, q.3 a.1,
# Metaphysics Theta.8 reconstructions). `grades`: the quarta via's maximum in
# being (IsMaximumIn InAct MoreIn esse) and its stage-2 link to GOD_4. `bridge`:
# the one registered cross-family identity, STMT-FIRST-UNMOVED-MOVER-IS-MAXIME-ENS;
# it does not count as a family of its own. `contingency`: the tertia via's
# necessary being, used only as a sense control.
#
# Candidates were proposed by an agent from four templates applied to the
# families' typed declarations, before any proof search, and are fixed here so
# that the run is reproducible:
#   T1 transport along the registered identity bridge (with and without the
#      existence premise that fixes the witness);
#   T2 transport of a first-being property to the quarta via's maximum through
#      STMT-MAXIMUM-IN-BEING-IS-FIRST-BEING (PRIOR_1 tagged on both sides);
#   T3 the same transport one step further, to GOD_4 through
#      STMT-GOD-IS-MAXIMAL-IN-BEING (a divine-attribute bridge);
#   T4 incompatibility of a recorded rival with a cross-family bundle.
# Controls: name-only identification of the two God predicates (GOD_2, GOD_4),
# a tautology, a single-family incompatibility and the tertia via's
# "necessary" (NECESSARY_1) against Theta.8 incorruptibility.
#
# Certification is deterministic: Duper over delta-unfolded project definitions,
# single-deletion minimization, vacuity, the prove-sweep transcription probe,
# literal negation, and decide-checked models. The candidate text is never
# evidence; only the Lean checks and the corpus filters are.

[run]
issue = 1834
imports = ["TruthCore", "Duper"]
namespace = "TruthCore.ConjecturePilot1834"
heartbeats = 200000
opens = [
  "TruthCore.Case.Catholicism",
  "TruthCore.Latin.Aquinas.SummaTheologiae",
  "TruthCore.Latin.Aquinas.InMetaphysicam",
]

[families.actualization]
label = "prima via and act/potency at a first being"
statements = [
  "STMT-THERE-IS-A-FIRST-UNMOVED-MOVER",
  "STMT-AT-MOST-ONE-FIRST-UNMOVED-MOVER",
  "STMT-FIRST-UNMOVED-MOVER-IS-FIRST-BEING",
  "STMT-FIRST-UNMOVED-MOVER-IS-PURE-ACT",
  "STMT-UNIQUE-PURE-ACT-FIRST-MOVER-IS-GOD",
  "ca55ed3a-8f7d-4e7c-8799-c61fdb4cce60",
  "STMT-FIRST-BEING-IS-IN-NO-WAY-IN-POTENCY",
  "61ad11f3-476f-411d-9720-d9f05cbc22fc",
  "8288ff1e-d534-4516-ac2d-8d010cb863ac",
  "STMT-NOTHING-IN-ACT-AND-POTENCY-IN-SAME-RESPECT",
  "c1acdf6c",
]

[families.grades]
label = "quarta via maximum in being and its stage-2 link"
statements = [
  "STMT-MAXIMUM-IN-BEING-IS-FIRST-BEING",
  "STMT-MAXIME-ENS-CAUSES-BEING-OF-ALL",
  "STMT-MAXIME-ENS-IS-GOD",
  "STMT-AT-MOST-ONE-MAXIMUM-IN-BEING",
  "STMT-GOD-IS-MAXIMAL-IN-BEING",
  "2f9fb010",
]

[families.bridge]
label = "registered identity of the first mover with the maximum (not counted as a family)"
cross_family = false
statements = ["STMT-FIRST-UNMOVED-MOVER-IS-MAXIME-ENS"]

[families.contingency]
label = "tertia via necessary being (sense control)"
statements = ["STMT-NECESSARY-PER-SE-IS-MAXIME-ENS"]

